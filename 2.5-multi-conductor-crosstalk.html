.vec{position:relative;font-style:italic;font-weight:700;white-space:nowrap;}

'use strict';
/* ============================== 向量工具 ============================== */
const pt=(x,y,z)=>({x,y,z});
const vadd=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z});

const D2R=Math.PI/180, R2D=180/Math.PI;

/* ============================== 富文本引擎（同源） ============================== */
function parseRich(s){
  const items=[], groups=[]; const st={g:-1};
  (function walk(str){
    let buf='';
    const flush=()=>{ if(buf){ items.push({t:'n',s:buf,g:st.g}); buf=''; } };

      const c=str[i];

      }

      if(c==='<'){ const j=str.indexOf('>',i);
        if(j>=0){ buf+=str.slice(i,j+1); i=j+1; continue; } }
      buf+=c; i++;
    }
    flush();
  })(String(s));
  return {items, groups};
}
const RICHFONT='"PingFang SC","Microsoft YaHei",sans-serif';

    const i = iy * nx + ix, e = eps[i];
    if (ix > 0) ex[i] = epsf(e, eps[i - 1]);
    if (ix < nx - 1) exm[i] = epsf(eps[i + 1], e);
    if (iy > 0) ey[i] = epsf(e, eps[i - nx]);
    if (iy < ny - 1) eym[i] = epsf(eps[i + nx], e);
    den[i] = ex[i] + exm[i] + ey[i] + eym[i];
  }
  const gnd = new Uint8Array(N);
  for (let iy = 0; iy < ny; iy++) if (Ys[iy] <= t) {
    const base = iy * nx;
    for (let ix = 0; ix < nx; ix++) gnd[base + ix] = 1;

function pcbMasks(g, gap) {
  const nx = g.nx, ny = g.ny, W = g.W, h = g.h, t = g.t;
  const drv = new Uint8Array(g.N), vic = new Uint8Array(g.N);
  for (let iy = 0; iy < ny; iy++) {
    const Y = g.Ys[iy];
    if (!(Y >= h && Y <= h + t)) continue;
    const base = iy * nx;
    for (let ix = 0; ix < nx; ix++) {
      const X = g.Xs[ix];

function pcbSolveField(g, fixed, init, sweeps, omega, tol) {
  sweeps = sweeps || 900; omega = omega || 1.9; tol = tol || 1e-4;
  const nx = g.nx, ny = g.ny, N = g.N;
  const V = (init && init.length === N) ? init : new Float64Array(N);
  const free = new Uint8Array(N).fill(1);
  for (let k = 0; k < fixed.length; k++) {
    const m = fixed[k][0], val = fixed[k][1];
    for (let i = 0; i < N; i++) if (m[i]) { V[i] = val; free[i] = 0; }
  }
  const ex = g.ex, exm = g.exm, ey = g.ey, eym = g.eym, den = g.den;
  let s = 0;
  for (s = 0; s < sweeps; s++) {
    let dmax = 0;
    for (let par = 0; par < 2; par++) {
      for (let iy = 0; iy < ny; iy++) {
        let ix = ((iy & 1) === par) ? 0 : 1;
        for (; ix < nx; ix += 2) {
          const i = iy * nx + ix;
          if (!free[i] || den[i] <= 0) continue;
          const ir = (ix < nx - 1) ? i + 1 : iy * nx;
          const il = (ix > 0) ? i - 1 : iy * nx + nx - 1;
          const idn = (iy < ny - 1) ? i + nx : ix;
          const iup = (iy > 0) ? i - nx : (ny - 1) * nx + ix;
          const nv = (ex[i] * V[ir] + exm[i] * V[il] + ey[i] * V[idn] + eym[i] * V[iup]) / den[i];
          const diff = nv > V[i] ? nv - V[i] : V[i] - nv;
          if (diff > dmax) dmax = diff;

function pcbCharge(V, g, mask) {

  let tot = 0;
  for (let iy = 0; iy < ny; iy++) for (let ix = 0; ix < nx; ix++) {
    const i = iy * nx + ix;
    if (!mask[i]) continue;
    const e = eps[i];
    if (ix < nx - 1 && !mask[i + 1]) tot += 0.5 * (e + eps[i + 1]) * (Vc - V[i + 1]);
    if (ix > 0 && !mask[i - 1]) tot += 0.5 * (e + eps[i - 1]) * (Vc - V[i - 1]);
    if (iy < ny - 1 && !mask[i + nx]) tot += 0.5 * (e + eps[i + nx]) * (Vc - V[i + nx]);
    if (iy > 0 && !mask[i - nx]) tot += 0.5 * (e + eps[i - nx]) * (Vc - V[i - nx]);
  }
  return tot;

/* ---- 场：双线性插值取电位与 E ---- */
function fieldAt(g, V, x, z) {
  const fx = (x - g.x0) / g.dx - 0.5, fz = z / g.dx - 0.5;
  const ix = Math.floor(fx), iz = Math.floor(fz);
  if (ix < 0 || iz < 0 || ix >= g.nx - 1 || iz >= g.ny - 1) return null;
  const tx = fx - ix, tz = fz - iz;
  const i00 = iz * g.nx + ix, i10 = i00 + 1, i01 = i00 + g.nx, i11 = i01 + 1;
  const v00 = V[i00], v10 = V[i10], v01 = V[i01], v11 = V[i11];
  const v = (v00 * (1 - tx) + v10 * tx) * (1 - tz) + (v01 * (1 - tx) + v11 * tx) * tz;
  const gx = ((v10 - v00) * (1 - tz) + (v11 - v01) * tz) / g.dx;
  const gz = ((v01 - v00) * (1 - tx) + (v11 - v10) * tx) / g.dx;
  return { v, ex: -gx, ez: -gz };
}
/* 从 (x,z) 逆着电位梯度（顺着 E）追一条电力线 */
function traceFieldLine(g, V, x, z, maxSteps) {
  const out = [];
  const step = g.dx * 0.85;
  let bad = 0;
  for (let k = 0; k < (maxSteps || 420); k++) {
    const e1 = fieldAt(g, V, x, z);
    if (!e1) break;
    let mx = e1.ex, mz = e1.ez;
    let m = Math.hypot(mx, mz);
    if (m < 1e-7) break;
    mx /= m; mz /= m;
    const xm = x + mx * step * 0.5, zm = z + mz * step * 0.5;
    const e2 = fieldAt(g, V, xm, zm);
    if (e2) {
      let ax = e2.ex, az = e2.ez;
      const m2 = Math.hypot(ax, az);
      if (m2 > 1e-7) { mx = ax / m2; mz = az / m2; }
    }
    out.push(pt(x, 0, z));
    x += mx * step; z += mz * step;
    if (x < g.x0 || x > g.x1 || z < 0.02 || z > g.ytop - 0.05) break;
  }
  out.push(pt(x, 0, z));
  return out;
}
/* marching squares：输出等值线段（世界坐标） */
function isoLines(g, V, level) {
  const nx = g.nx, ny = g.ny, segs = [];
  V_LOOP:
  for (let iz = 0; iz < ny - 1; iz++) {
    const b0 = iz * nx;
    for (let ix = 0; ix < nx - 1; ix++) {
      const i = b0 + ix;
      const v00 = V[i], v10 = V[i + 1], v01 = V[i + nx], v11 = V[i + nx + 1];
      const mn = Math.min(v00, v10, v01, v11), mx = Math.max(v00, v10, v01, v11);
      if (level < mn || level > mx) continue;
      const x0 = g.Xs[ix], x1 = g.Xs[ix + 1], z0 = g.Ys[iz], z1 = g.Ys[iz + 1];
      const ip = (a, b, xa, xb) => xa + (xb - xa) * ((level - a) / (b - a || 1e-12));
      const pts = [];
      if ((v00 - level) * (v10 - level) < 0) pts.push([ip(v00, v10, x0, x1), z0]);
      if ((v10 - level) * (v11 - level) < 0) pts.push([x1, ip(v10, v11, z0, z1)]);
      if ((v11 - level) * (v01 - level) < 0) pts.push([ip(v01, v11, x0, x1), z1]);
      if ((v01 - level) * (v00 - level) < 0) pts.push([x0, ip(v00, v01, z0, z1)]);
      if (pts.length >= 2) segs.push([pts[0][0], pts[0][1], pts[1][0], pts[1][1]]);
      if (segs.length > 6000) break V_LOOP;
    }
  }
  return segs;
}


/* ═════════════════════════════ 状态与派生量 ═════════════════════════════ */
const state = {
  mode: 'mutual',                 /* mutual | edge | rescue */
  gap: 1.0,                       /* 两线间隙（单位 W） */
  tr: 0.1,                        /* 边沿时间 ns */
  L: 10,                          /* 平行长度 cm */
  Vdd: 3.3, Z0: 50, limit: 0.350, /* V / Ω / 噪声容限 V */
  show: { pot: true, field: true, net: true, scope: true },
  cardTab: '1',
  autoRotate: false,
};

/* 动态噪声：i = C_m·dV/dt，注入受害线后向两端分流入地，每端看到 Z₀/2
   ⇒ V_noise = i·Z₀/2（逐字稿原话「注入电流兵分两路，每路各遇约 50Ω」） */
function noiseOf() {
  const Cmu = CmUnit(state.gap);                  /* pF/m */
  const Cmt = Cmu * 1e-12 * (state.L / 100);      /* F */
  const trs = state.tr * 1e-9;
  const i = Cmt * state.Vdd / trs;                /* A */
  const Vn = i * (state.Z0 / 2);                  /* V */
  return { Cmu, Cmt, trs, i, Vn };
}
const vvNow = () => state.Vdd * VvRatio(state.gap);   /* 悬空受害线的静态电位 V */

/* 确定性伪随机（纤维纹理、触点等，保证同一参数每次渲染一致） */
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ═════════════════════════ 写实的 PCB 横截面 ═════════════════════════ */
const BH = PCB_GEO.h, BT = PCB_GEO.t;          /* 走线底面 1.0、铜厚 0.175（物理值，供 FD 用） */
/* ⚠️ 渲染用的「视觉铜厚」比物理值大：真实 PCB 铜厚只有 0.175W，按真实比例画出来是一条
   看不见的细线，学生读不出"铜走线"。教学图把厚度夸大是通行做法，尺寸线仍标注 t。 */
const TV = 0.285;
/* ⚠️ BX0 / BX1（介质板横向范围）由 setupCamera() 随取景一起算，见 app 段① */

function drawBoard() {
  const ySubT = SY(BH), ySubB = SY(BT), yGndB = SY(0);
  const xa = SX(BX0), xb = SX(BX1), wpx = xb - xa;
  /* 回流平面（板底整层铜） */
  P_(Z.gnd, () => {
    const g = ctx.createLinearGradient(0, yGndB, 0, ySubB);
    g.addColorStop(0, '#8B5320'); g.addColorStop(0.55, '#B87333'); g.addColorStop(1, '#DCA467');
    ctx.fillStyle = g; ctx.fillRect(xa, ySubB, wpx, yGndB - ySubB);
    ctx.strokeStyle = 'rgba(120,72,26,.85)'; ctx.lineWidth = 1;
    ctx.strokeRect(xa + .5, ySubB + .5, wpx - 1, yGndB - ySubB - 1);
  });
  /* FR4 介质基板 */
  P_(Z.sub, () => {
    const g = ctx.createLinearGradient(0, ySubT, 0, ySubB);
    g.addColorStop(0, '#E7EFD6'); g.addColorStop(0.42, '#D9E5C0');
    g.addColorStop(1, '#C4D3A4');
    ctx.fillStyle = g; ctx.fillRect(xa, ySubT, wpx, ySubB - ySubT);
    ctx.save(); ctx.beginPath(); ctx.rect(xa, ySubT, wpx, ySubB - ySubT); ctx.clip();
    /* 玻璃纤维纹理：两族斜向短纤维 */
    for (let k = 0; k < 150; k++) {
      const px = xa + rnd(k * 3 + 1) * wpx, py = ySubT + rnd(k * 3 + 2) * (ySubB - ySubT);
      const a = (rnd(k * 3 + 3) - 0.5) * 0.5, len = 10 + rnd(k * 5 + 7) * 16;
      ctx.beginPath(); ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len);
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 0.9; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py + 2);
      ctx.lineTo(px + Math.cos(a) * len * 0.7, py + 2 + Math.sin(a) * len * 0.7);
      ctx.strokeStyle = 'rgba(163,182,132,.35)'; ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(150,170,120,.75)'; ctx.lineWidth = 1;
    ctx.strokeRect(xa + .5, ySubT + .5, wpx - 1, ySubB - ySubT - 1);
  });
}
/* 走线：蚀刻后是**梯形**截面（顶面略窄），加铜的金属渐变与顶面高光 */
function drawTrace(x0, w, strong) {
  const yB = SY(BH), yT = SY(BH + TV);

    const xa = SX(x0), xb = SX(x0 + w);

    g.addColorStop(0, '#EFC08A'); g.addColorStop(0.30, '#CE8F4A');
    g.addColorStop(0.72, '#A86228'); g.addColorStop(1, '#7E4517');
    ctx.beginPath();
    ctx.moveTo(SX(x0 + bev), yT); ctx.lineTo(SX(x0 + w - bev), yT);

    ctx.beginPath();

/* 阻焊（绿油）：整板覆盖，随走线起伏 ⇒ 画成「基板顶面薄层 + 走线顶面薄层」 */

/* ═════════════════════════ 场：电力线 + 等势线 ═════════════════════════ */
function drawPotential(g, V) {
  if (!state.show.pot) return;
  const lv = [0.08, 0.16, 0.24, 0.34, 0.44, 0.54, 0.64, 0.74, 0.84, 0.92];
  for (let k = 0; k < lv.length; k++) {
    const segs = isoLines(g, V, lv[k]);
    if (!segs.length) continue;
    const t = k / (lv.length - 1);
    const a = 0.30 + 0.24 * Math.sin(Math.PI * (0.2 + 0.6 * t));
    P_(Z.pot + k * 0.01, () => {
      ctx.save();
      ctx.strokeStyle = 'rgba(' + Math.round(28 + 46 * t) + ',' + Math.round(124 + 32 * t)
                      + ',' + Math.round(176 + 22 * t) + ',' + a.toFixed(3) + ')';
      ctx.lineWidth = 1.15;
      ctx.beginPath();
      for (const s of segs) { ctx.moveTo(SX(s[0]), SY(s[1])); ctx.lineTo(SX(s[2]), SY(s[3])); }

/* 追一条场线并判定终点落在哪个导体上 */
function traceOne(g, V, sx, sz, gap) {
  const pts = traceFieldLine(g, V, sx, sz, 420);
  if (pts.length < 2) return { pts, kind: 'open' };
  const e = pts[pts.length - 1];
  let kind = 'open';
  if (e.z <= BT + 0.06) kind = 'gnd';
  else if (e.z < BH + 0.50) {
    if (e.x >= 1 + gap - 0.12 && e.x <= 2 + gap + 0.12) kind = 'vic';
    else if (e.x >= -0.12 && e.x <= 1.12) kind = 'drv';
  }
  return { pts, kind };
}
function drawField(g, V, gap) {
  if (!state.show.field) return;
  const off = g.dx * 0.62;
  const seeds = [];
  for (let k = 1; k <= 13; k++) seeds.push([k / 14, BH + TV + off]);       /* 顶面 */
  for (let k = 1; k <= 5; k++) seeds.push([-off, BH + TV * (k / 6)]);      /* 左侧面 */
  for (let k = 1; k <= 5; k++) seeds.push([1 + off, BH + TV * (k / 6)]);   /* 右侧面 */
  for (let k = 1; k <= 5; k++) seeds.push([k / 6, BH - off]);             /* 底面朝着回流平面 */
  const toVic = [], toGnd = [], other = [];
  for (const s of seeds) {
    const r = traceOne(g, V, s[0], s[1], gap);
    if (r.pts.length < 5) continue;
    (r.kind === 'vic' ? toVic : r.kind === 'gnd' ? toGnd : other).push(r.pts);
  }
  const stroke = (paths, col, w, alpha) => {
    if (!paths.length) return;
    P_(Z.field, () => {
      ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = col; ctx.lineWidth = w;
      ctx.lineCap = 'round'; ctx.beginPath();
      for (const p of paths) {
        ctx.moveTo(SX(p[0].x), SY(p[0].z));
        for (let i = 1; i < p.length; i++) ctx.lineTo(SX(p[i].x), SY(p[i].z));
      }
      ctx.stroke(); ctx.restore();
    });
  };
  stroke(other, '#C44232', 1.1, 0.38);
  stroke(toGnd, '#C44232', 1.25, 0.60);
  /* ★ 漏到受害线的那一簇场线 = 互容的直接证据：间隙拉大，它肉眼可见地变稀 */
  stroke(toVic, '#7048C8', 1.95, 0.92);
  const arrow = (paths, col, al) => {
    for (const p of paths) {
      const n = p.length; if (n < 12) continue;
      const k = Math.max(5, Math.floor(n * 0.40));
      const A = pr(p[k]), B = pr(p[k + 1]);
      const L = Math.hypot(B.x - A.x, B.y - A.y);
      if (L < 1.2) continue;
      const ang = Math.atan2(B.y - A.y, B.x - A.x), hs = 7.0;
      P_(Z.field + 0.02, () => {
        ctx.save(); ctx.globalAlpha = al; ctx.beginPath(); ctx.moveTo(B.x, B.y);
        ctx.lineTo(B.x - hs * Math.cos(ang - .42), B.y - hs * Math.sin(ang - .42));
        ctx.lineTo(B.x - hs * Math.cos(ang + .42), B.y - hs * Math.sin(ang + .42));
        ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.restore();
      });
    }
  };
  arrow(toGnd, '#C44232', 0.68);
  arrow(toVic, '#7048C8', 0.95);
  FAR.nToVic = toVic.length;
}

/* ═════════════════════════ 画布上的叠加小图 ═════════════════════════ */

    ctx.beginPath(); ctx.moveTo(xV - 20, yM); ctx.lineTo(xV, yM); ctx.stroke();

    /* 接地轨 */

    ctx.beginPath(); ctx.moveTo(xD - 12, yG); ctx.lineTo(xV + 12, yG); ctx.stroke();
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      ctx.moveTo(xD + (xV - xD) / 2 - 9 + k * 9, yG);
      ctx.lineTo(xD + (xV - xD) / 2 - 13 + k * 9, yG + 5); ctx.stroke();

    ctx.fillStyle = C.teal; ctx.fillText('驱动线', xD - 17, y0 + 30);

    ctx.fillStyle = C.crimson; ctx.font = '600 11.5px "PingFang SC",sans-serif';
    ctx.fillText('C_m', (xD + xV) / 2 - 11, yM - 13);
    ctx.font = '11px "PingFang SC",sans-serif'; ctx.fillStyle = '#5F7482';
    ctx.fillText('C₁', xD - 20, yA + 30); ctx.fillText('C₂', xV + 15, yA + 30);

    /* ⚠️ 必须居中画在接地轨正下方：靠 xV+20 起画会顶出画布右边缘（实测 r=W+27，末几字被裁） */

}
/* 底部中间：时域波形（驱动沿 + 受害线噪声 + 噪声容限） */
function drawScope() {
  if (!state.show.scope) return;
  const nz = noiseOf();
  const W2 = 240, H2 = 126, x0 = Math.round((W - W2) / 2), y0 = H - H2 - 14;
  const padL = 42, padR = 12, padT = 24, padB = 20;
  const gx0 = x0 + padL, gx1 = x0 + W2 - padR, gy0 = y0 + padT, gy1 = y0 + H2 - padB;
  const span = Math.max(1.6, state.tr * 12);           /* 显示的 ns 跨度 */
  /* ⚠️ 纵轴必须"容得下容限线 + 噪声峰 + 读数标签"。老写法 vMax=min(Vdd*1.06, Vn*2.6)：
     gap 一拉大 Vn 变小 ⇒ vMax 被压到 0.45 ⇒ 3.3 V 驱动沿被画到 ~600px 之外，
     一条长竖线直接飞出卡片（颜色 #B9C9D2，实测抓到）。驱动沿改走独立归一化。 */
  const vMax = Math.max(0.45, state.limit * 1.55, nz.Vn * 1.45);
  const tx = t => gx0 + (t / span) * (gx1 - gx0);
  const vy = v => gy1 - (v / vMax) * (gy1 - gy0);
  const vyD = v => gy1 - (v / state.Vdd) * (gy1 - gy0 - 8);   /* 驱动沿：只讲边沿快慢 */
  P_(Z.ui + 1, () => {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.strokeStyle = '#DCE6EB'; ctx.lineWidth = 1;
    roundRect(x0, y0, W2, H2, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#22414F'; ctx.font = '600 11px "PingFang SC",sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('受害线噪声 · 灰 = 驱动沿 3.3 V', x0 + 11, y0 + 16);
    /* 网格 */
    ctx.strokeStyle = '#EFF4F7'; ctx.lineWidth = 1;
    for (let k = 0; k <= 4; k++) {
      const yy = gy0 + (gy1 - gy0) * k / 4;
      ctx.beginPath(); ctx.moveTo(gx0, yy); ctx.lineTo(gx1, yy); ctx.stroke();
    }
    /* 容限线 */
    const yLim = vy(state.limit);
    ctx.setLineDash([4, 3]); ctx.strokeStyle = C.crimson; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(gx0, yLim); ctx.lineTo(gx1, yLim); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = C.crimson; ctx.font = '10px "PingFang SC",sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText((state.limit * 1e3).toFixed(0) + ' mV', gx0 - 4, yLim + 3.4);
    ctx.textAlign = 'left';
    /* ★ 波形一律裁在绘图区内：任何越界都必须在框内被切掉，不能飞出去 */
    ctx.save();
    ctx.beginPath(); ctx.rect(gx0, gy0, gx1 - gx0, gy1 - gy0); ctx.clip();
    /* 驱动沿（灰，独立归一化 ⇒ 永远画在框内） */
    const t0 = span * 0.14, trs = state.tr;
    ctx.strokeStyle = '#B9C9D2'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(gx0, vyD(0));
    ctx.lineTo(tx(t0), vyD(0));
    ctx.lineTo(tx(t0 + trs), vyD(state.Vdd));
    ctx.lineTo(gx1, vyD(state.Vdd));
    ctx.stroke();
    /* 受害线噪声：耦合尖峰（上升随 t_r，随后指数衰减） */
    const yN = vy(nz.Vn);
    ctx.strokeStyle = C.blue; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(gx0, vy(0));
    for (let k = 0; k <= 120; k++) {
      const t = gx0 + (gx1 - gx0) * k / 120;
      const tt = (t - gx0) / (gx1 - gx0) * span;
      let v = 0;
      if (tt > t0) {
        const dt = tt - t0;
        v = dt < trs ? nz.Vn * (dt / trs) : nz.Vn * Math.exp(-(dt - trs) / Math.max(span * 0.20, trs * 2.2));
      }
      ctx.lineTo(t, vy(v));
    }
    ctx.stroke();
    ctx.fillStyle = C.blue; ctx.font = '600 11px "PingFang SC",sans-serif';
    ctx.fillText((nz.Vn * 1e3).toFixed(0) + ' mV', tx(t0 + trs) + 5, yN - 4);
    ctx.restore();
    ctx.restore();
  });
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* 左下角：耦合场线统计（与画布上那簇紫色曲线直接呼应） */
function drawStats() {

    ctx.fillStyle = '#22414F'; ctx.font = '600 11px "PingFang SC",sans-serif';

let FAR = { V: null, g: null, VA: null, VB: null, gap: -1, sweeps: 0, nToVic: 0 };

function buildScene() {
  prims = [];                                     /* ★ 首句必须清空 */
  const gap = state.gap;

  if (!g) return;

  drawBoard();
  if (g) {
    /* 走线（铜）→ 阻焊 → 场 → 标注 */
    drawTrace(0, 1, true);
    drawTrace(1 + gap, 1, false);

    if (FAR.V) {
      drawPotential(g, FAR.V);
      drawField(g, FAR.V, gap);
    }
  }
  /* 走线标签 */
  text(pt(0.5, -2, BH + TV + 0.62), '驱动线', { color: C.crimson, size: 12, bold: true, align: 'center' });
  text(pt(1.5 + gap, -2, BH + TV + 0.62), '受害线', { color: C.blue, size: 12, bold: true, align: 'center' });
  drawDims(gap);

  /* 受害线静电位（页签 ①/③ 的重点读数）：marker 落在走线顶面，读数抬到走线名之下 */
  const vv = vvNow();

       { color: C.blue, size: 13, bold: true, align: 'center', z: Z.net + 1 });

  /* 介质界面注记（贴着左边写，避免被右边缘裁掉） */
  text(pt(-VIEW.padL + 0.22, -2, BT + 0.26), '回流平面', { color: '#8B5320', size: 11, align: 'left', alpha: .95 });

  if (state.show.net) drawNet(gap);
  if (state.show.scope) drawScope();

/* ═════════════════════════════ 面板基础 ═════════════════════════════ */
const panelEl = document.getElementById('panel');
function h(html) { const d = document.createElement('div'); d.innerHTML = html; return d; }
function kchip(k, v, cls) {
  return '<span class="coord-chip ' + (cls || '') + '">' + richHTML(k) + '<b>' + v + '</b></span>';
}
function secEl(title) {
  const s = h('<div class="panel-sec"><div class="sec-title">' + richHTML(title) + '</div></div>').firstChild;
  panelEl.appendChild(s); return s;
}
function cardBody(html, cls) {
  return '<div class="card-body' + (cls || '') + '"><div class="ex-body">' + richHTML(html) + '</div></div>';
}
/* 滑块：d = {label,min,max,step,val,fmt,set,wide} —— ★ label 与 fmt 结果都要过 richHTML */
function mkRange(host, d) {
  const row = h('<div class="slider-row' + (d.wide ? ' w' : '') + '">'
    + '<label>' + richHTML(d.label) + '</label>'
    + '<input type="range" min="' + d.min + '" max="' + d.max + '" step="' + d.step + '" value="' + d.val + '">'
    + '<span class="val">' + richHTML(d.fmt(d.val)) + '</span></div>').firstChild;
  const inp = row.querySelector('input'), vEl = row.querySelector('.val');
  inp.oninput = () => { const v = parseFloat(inp.value); d.set(v); vEl.innerHTML = richHTML(d.fmt(v)); };
  d.el = inp; d.valEl = vEl; d.isRange = true;
  host.appendChild(row); return row;
}
function chipRow(host, items, onPick) {
  const box = h('<div class="sub-chips"></div>').firstChild;
  items.forEach(it => {
    const c = h('<button class="chip ' + (it.cls || '') + '">' + richHTML(it.t) + '</button>').firstChild;
    c.onclick = () => { onPick(it); box.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); };
    box.appendChild(c);
  });
  host.appendChild(box); return box;
}
const sliders = [];
function addRange(host, d) { const r = mkRange(host, d); sliders.push(d); return r; }
function syncSliders() {
  for (const d of sliders) {
    if (!d.el) continue;
    const v = d.get();
    if (Math.abs(parseFloat(d.el.value) - v) > 1e-9) d.el.value = v;
    d.valEl.innerHTML = richHTML(d.fmt(v));
  }
}

  addRange(s, { label: '边沿 t_r', wide: true, min: 0, max: 40, step: 0.5, val: sliderFromTr(state.tr),
    fmt: k => trFromSlider(k) >= 1 ? trFromSlider(k).toFixed(2) + ' ns' : (trFromSlider(k) * 1e3).toFixed(0) + ' ps',
    get: () => sliderFromTr(state.tr), set: k => { state.tr = trFromSlider(k); updateAll(); } });
  addRange(s, { label: '平行长度', wide: true, min: 2, max: 20, step: 0.5, val: state.L,
    fmt: v => v.toFixed(1) + ' cm', get: () => state.L, set: v => { state.L = v; updateAll(); } });

  const s2 = secEl('一键试招（课件示意值 vs 本页严格场解）');
  const box = h('<div class="sub-chips" style="margin-bottom:8px"></div>').firstChild;
  TRAILS.forEach(tr => {
    const b = h('<button class="chip c on">' + richHTML(tr.t) + '</button>').firstChild;
    b.onclick = () => { tr.apply(); syncSliders(); invalidateField(); updateAll(); renderPanel(); toast(tr.t + '：' + tr.why); };
    box.appendChild(b);
  });
  s2.appendChild(box);
  s2.appendChild(h('<div id="liveRead"></div>').firstChild);
  s2.appendChild(h('<div id="trailTable"></div>').firstChild);

  const s3 = secEl('教学卡');
  s3.appendChild(h('<div id="liveCards">' + cardsHTML('rescue') + '</div>').firstChild);
  bindCards();
}

/* ═════════════════════════════ 读数与状态 ═════════════════════════════ */
function vvRow() {
  const vv = vvNow();
  const ratio = VvRatio(state.gap);
  return '<div class="kv"><span>受害线电位</span><b style="color:' + C.blue + '">' + vv.toFixed(3) + ' V</b></div>'
       + '<div class="kv"><span>耦合比 C_m / C_v</span><b>' + ratio.toFixed(4) + '</b></div>'
       + '<div class="kv"><span>互容 C_m</span><b>' + CmUnit(state.gap).toFixed(2) + ' pF/m</b></div>'
       + '<div class="kv"><span>受害线对地电容 C_v</span><b>' + CddUnit(state.gap).toFixed(1) + ' pF/m</b></div>';
}
function noiseHTML() {
  const nz = noiseOf();
  const over = nz.Vn > state.limit;
  const bad = over ? C.crimson : C.green;
  return '<div class="kv"><span>总互容 C_m·L</span><b>' + (nz.Cmt * 1e12).toFixed(3) + ' pF</b></div>'
       + '<div class="kv"><span>耦合电流 i = C·du/dt</span><b>' + (nz.i * 1e3).toFixed(2) + ' mA</b></div>'
       + '<div class="kv"><span>受害线噪声 V = i·Z₀/2</span><b style="color:' + bad + '">' + (nz.Vn * 1e3).toFixed(0) + ' mV</b></div>'
       + '<div class="kv"><span>噪声容限</span><b>' + (state.limit * 1e3).toFixed(0) + ' mV</b></div>'
       + '<div class="verdict ' + (over ? 'bad' : 'ok') + '">'
       + (over ? '⚠ 超容限 ' + ((nz.Vn - state.limit) * 1e3).toFixed(0) + ' mV —— 会误码'
               : '✓ 低于容限 ' + ((state.limit - nz.Vn) * 1e3).toFixed(0) + ' mV —— 安全') + '</div>';
}
function trailTableHTML() {
  const rows = [
    ['间隙 → 3W', '67 mV', v => { const o = state.gap; state.gap = 3.0; const r = noiseOf().Vn; state.gap = o; return r; }],
    ['边沿 → 1 ns', '50 mV', v => { const o = state.tr; state.tr = 1.0; const r = noiseOf().Vn; state.tr = o; return r; }],
    ['长度 → 5 cm', '165 mV', v => { const o = state.L; state.L = 5; const r = noiseOf().Vn; state.L = o; return r; }],
  ];
  let s = '<table class="trail"><tr><th>活路</th><th>课件示意</th><th>本页（其余不变）</th></tr>';
  for (const r of rows) s += '<tr><td>' + r[0] + '</td><td class="dim">' + r[1] + '</td><td class="me">' + (r[2]() * 1e3).toFixed(0) + ' mV</td></tr>';
  s += '</table><div class="ex-note">课件给的是教学示意值。本页每一格都是同一套场解当场算出来的：<b>边沿那一路精确吻合（50 mV）</b>；间隙与长度两路的绝对值和课件略有出入，因为互容随间隙是幂律下降（≈ gap<sup>-1.2</sup>）而不是线性的。</div>';
  return s;
}
function updateLivePanels() {
  const lr = document.getElementById('liveRead');
  if (lr) lr.innerHTML = state.mode === 'mutual' ? vvRow() : noiseHTML();
  const tt = document.getElementById('trailTable');
  if (tt) tt.innerHTML = trailTableHTML();
}
function updateReadout() {
  const strip = document.getElementById('coordStrip');
  if (!strip) return;
  const nz = noiseOf();
  const over = nz.Vn > state.limit;
  const chips = [
    kchip('间隙 gap', state.gap.toFixed(2) + ' W'),
    kchip('互容 C_m', CmUnit(state.gap).toFixed(2) + ' pF/m'),
    kchip('受害线电位', vvNow().toFixed(3) + ' V', 'acc'),
    kchip('边沿 t_r', state.tr >= 1 ? state.tr.toFixed(2) + ' ns' : (state.tr * 1e3).toFixed(0) + ' ps'),
    kchip('平行长度 L', state.L.toFixed(1) + ' cm'),
    kchip('耦合电流', (nz.i * 1e3).toFixed(2) + ' mA'),
    kchip('噪声电压', (nz.Vn * 1e3).toFixed(0) + ' mV', over ? 'warn' : 'acc'),
    kchip('容限', (state.limit * 1e3).toFixed(0) + ' mV'),
    kchip('状态', over ? '⚠ 超限' : '✓ 安全', over ? 'warn' : 'acc'),
  ];
  strip.innerHTML = chips.join('');
}
function updateModeTag() {
  const el = document.getElementById('modeTag'); if (!el) return;
  const nz = noiseOf();
  let s;
  if (state.mode === 'mutual') s = '受害线悬空 ⇒ 净电荷为零 ⇒ 电位被抬到 ' + vvNow().toFixed(2) + ' V';
  else if (state.mode === 'edge') s = '边沿 ' + (state.tr >= 1 ? state.tr.toFixed(2) + ' ns' : (state.tr * 1e3).toFixed(0) + ' ps')
    + ' ⇒ 噪声 ' + (nz.Vn * 1e3).toFixed(0) + ' mV（容限 ' + (state.limit * 1e3).toFixed(0) + ' mV）';
  else s = (nz.Vn > state.limit ? '⚠ 噪声 ' + (nz.Vn * 1e3).toFixed(0) + ' mV 超容限 '
                                : '✓ 噪声 ' + (nz.Vn * 1e3).toFixed(0) + ' mV 已降到容限下 ') + '· 动旋钮前先想清楚场的道理';
  el.innerHTML = richHTML(s);
  const lg = document.getElementById('lgTitle'), ln = document.getElementById('lgNote');
  if (lg) lg.textContent = state.mode === 'mutual' ? '互容 C_m' : '耦合噪声';
  if (ln) ln.innerHTML = richHTML(state.mode === 'mutual'
    ? '受害线悬空 · 净电荷为零 · V_v/V_dd = C_m/C_v'
    : 'i = C·du/dt · V_noise = i·Z₀/2 · 3.3 V 逻辑容限 ≈ 350 mV');
}
function toast(msg) {
  const t = document.getElementById('toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ═════════════════════════════ 场景/场解刷新 ═════════════════════════════ */
let solveDirty = true;
function invalidateField() { solveDirty = true; needsRender = true; }
function solveFieldNow() {
  const g = FAR.g; if (!g) return;
  const gap = state.gap;
  const m = pcbMasks(g, gap);
  const A = pcbSolveField(g, [[m.drv, 1.0], [m.vic, 0.0], [g.gnd, 0.0]], FAR.VA, 900, 1.9, 1e-4);
  FAR.VA = A.V; FAR.sweeps = A.sweeps;
  const B = pcbSolveField(g, [[m.drv, 0.0], [m.vic, 1.0], [g.gnd, 0.0]], FAR.VB, 900, 1.9, 1e-4);
  FAR.VB = B.V;
  const vv = VvRatio(gap);
  const V = new Float64Array(g.N);
  for (let i = 0; i < g.N; i++) V[i] = FAR.VA[i] + vv * (FAR.VB[i] - FAR.VA[i]);
  FAR.V = V; FAR.gap = gap;
  needsRender = true;
}

/* ═════════════════════════════ 渲染循环 ═════════════════════════════ */
let needsRender = true;
function draw() {
  setupCamera(); ctx.clearRect(0, 0, W, H);
  buildScene();
  prims.sort((a, b) => a.z - b.z);
  for (const p of prims) p.draw(ctx);
  drawOverlays();
  needsRender = false;
}
function tick() {
  try {
    if (solveDirty) { solveDirty = false; solveFieldNow(); updateLivePanels(); updateReadout(); }
    if (state.autoRotate) { cam.px += 0.35; needsRender = true; }
    if (needsRender) draw();
  } catch (err) { needsRender = false; console.error('draw/tick error:', err); }
  requestAnimationFrame(tick);
}
function updateAll() { needsRender = true; syncSliders(); updateLivePanels(); updateReadout(); updateModeTag(); }

/* ═════════════════════════════ 交互 ═════════════════════════════ */
const canvasEl = document.getElementById('cv');
ctx = canvasEl.getContext('2d');
let drag = null;
const localPos = ev => { const r = canvasEl.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
canvasEl.addEventListener('pointerdown', ev => {
  canvasEl.setPointerCapture(ev.pointerId);
  const m = localPos(ev); drag = { x: m.x, y: m.y }; ev.preventDefault();
});
canvasEl.addEventListener('pointermove', ev => {
  if (!drag) return;
  const m = localPos(ev), dx = m.x - drag.x, dy = m.y - drag.y;
  drag.x = m.x; drag.y = m.y;
  cam.px += dx; cam.py += dy; needsRender = true;
});
canvasEl.addEventListener('pointerup', () => { drag = null; });
canvasEl.addEventListener('pointercancel', () => { drag = null; });
canvasEl.addEventListener('contextmenu', e => e.preventDefault());
canvasEl.addEventListener('wheel', e => {
  e.preventDefault();
  cam.zoom = Math.max(0.5, Math.min(3.0, cam.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)));
  needsRender = true;
}, { passive: false });
document.getElementById('btnReset').onclick = () => {
  cam.zoom = 1; cam.px = 0; cam.py = 0; state.autoRotate = false; needsRender = true;
};
document.getElementById('btnRotate').onclick = e => {
  state.autoRotate = !state.autoRotate; e.target.classList.toggle('on', state.autoRotate);
};
document.getElementById('btnPanReset').onclick = () => { cam.px = 0; cam.py = 0; needsRender = true; };
function bindFold(bid, cls) {
  document.getElementById(bid).onclick = () => {
    document.body.classList.toggle(cls); setTimeout(resize, 60); setTimeout(resize, 260);
  };
}
bindFold('foldNav', 'nav-off'); bindFold('foldPanel', 'panel-off');
document.getElementById('tglNav').onclick = () => { document.body.classList.toggle('nav-off'); setTimeout(resize, 260); };
document.getElementById('tglPanel').onclick = () => { document.body.classList.toggle('panel-off'); setTimeout(resize, 260); };
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '[') { document.body.classList.toggle('nav-off'); setTimeout(resize, 260); }
  if (e.key === ']') { document.body.classList.toggle('panel-off'); setTimeout(resize, 260); }
});
const modeTabsEl = document.getElementById('modeTabs');
MT.forEach(m => {
  const b = document.createElement('button'); b.textContent = m.t; b.dataset.k = m.k;
  b.onclick = () => {
    state.mode = m.k; state.cardTab = '1';
    state.show.scope = (m.k !== 'mutual');
    syncModeTabs(); cam.px = 0; cam.py = 0; cam.zoom = 1;
    renderPanel(); invalidateField(); updateAll();
  };
  modeTabsEl.appendChild(b);
});
function syncModeTabs() {
  Array.from(modeTabsEl.children).forEach(b => b.classList.toggle('on', b.dataset.k === state.mode));
}
function resize() {
  const r = canvasEl.getBoundingClientRect();
  const nw = Math.max(60, Math.round(r.width)), nh = Math.max(60, Math.round(r.height));
  DPR = Math.min(2, window.devicePixelRatio || 1);
  if (nw === W && nh === H && canvasEl.width === Math.round(nw * DPR)) return;
  W = nw; H = nh; canvasEl.width = Math.round(W * DPR); canvasEl.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); needsRender = true;
}
new ResizeObserver(() => resize()).observe(canvasEl);

/* ═════════════════════════════ 启动 ═════════════════════════════ */
const navEl = document.getElementById('nav');
NAV.forEach(gp => {
  navEl.appendChild(h('<div class="nav-ch">' + gp.ch + '</div>'));
  gp.items.forEach(it => {
    const cls = 'nav-item' + (it.active ? ' active' : '') + (it.ready ? '' : ' soon');
    navEl.appendChild(h('<a class="' + cls + '" ' + (it.href ? 'href="' + it.href + '"' : '') + '><span class="dot"></span>' + it.t + '</a>'));
  });
});

function renderPanel() {
  if (!panelEl) return;
  sliders.length = 0;
  panelEl.innerHTML = '';
  if (state.mode === 'mutual') panelMutual();
  else if (state.mode === 'edge') panelEdge();
  else panelRescue();
  updateLivePanels();
  syncSliders();
}
FAR.g = pcbGrid(PCB_GEO);
syncModeTabs();
resize();
renderPanel();
solveFieldNow();
updateAll();
tick();

</script>
</body>
</html>
