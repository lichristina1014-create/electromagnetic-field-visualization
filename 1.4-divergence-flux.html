<script>
'use strict';
/* =====================================================================
 * 1.4 通量与散度 · 散度定理
 *   三个 mode：① 通量（开/闭面 / 矢量线穿过） ② 散度（定义/极限）
 *              ③ 散度定理（立方体网格剖分演示："无数小体积元的散度拼出总通量"）
 *   引擎与 1.1/1.2/1.3 同源（配色 / 相机 / 图元 / 富文本矢量记号）
 * ===================================================================== */

/* ---------------- 导航 ---------------- */
const NAV = [
  { ch:'第 1 章 · 矢量分析', items:[
    { id:'coord',  t:'1.1 三种常见坐标系', ready:true, href:'index.html' },
    { id:'ch1-2',  t:'1.2 矢量的代数运算', ready:true, href:'1.2-vector-algebra.html' },
    { id:'ch1-3',  t:'1.3 方向导数与梯度', ready:true, href:'1.3-directional-derivative.html' },
    { id:'ch1-4',  t:'1.4 通量与散度',     ready:true, active:true },
    { id:'ch1-5',  t:'1.5 环量与旋度',     ready:true, href:'1.5-curl-circulation.html' },
  ]},
  { ch:'第 2 章 · 静电场', items:[ {t:'2.1 电场强度与电位'}, {t:'2.2 高斯定理及其应用'}, {t:'2.3 导体与电介质'} ]},
  { ch:'第 3 章 · 恒定磁场', items:[ {t:'3.1 比奥-萨伐尔定律'}, {t:'3.2 安培环路定理'} ]},
  { ch:'第 4 章 · 时变电磁场', items:[ {t:'4.1 麦克斯韦方程组'}, {t:'4.2 均匀平面波'} ]},
];

/* ---------------- 向量工具 ---------------- */
const pt=(x,y,z)=>({x,y,z});
const vadd=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z});
const vsub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z});
const vmul=(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s});
const vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const vlen=a=>Math.hypot(a.x,a.y,a.z);
const vnorm=a=>{const l=vlen(a)||1;return vmul(a,1/l);};
const vcross=(a,b)=>({x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x});

/* ---------------- 三个示例矢量场 ---------------- */
/* A1 恒定场：∇·A = 0（无源场，所有闭合面净通量=0） */
const A1=p=>pt(1.0, 0.4, 0.6);
const D1=p=>0;
/* A2 中心源：A(x,y,z) = (x,y,z)，∇·A = 3（包围原点的闭合面净通量 = 3·V） */
const A2=p=>pt(p.x, p.y, p.z);
const D2=p=>3;
/* A3 中心汇：∇·A = -3 */
const A3=p=>pt(-p.x, -p.y, -p.z);
const D3=p=>-3;

/* ---------------- 全局状态 ---------------- */
const state = {
  mode:'flux',                         /* flux | div | theorem */
  fluxScene:'lantern',                 /* lantern | bottle | magnet | charge */
  theoremScene:'subdiv',               /* fieldlines | subdiv */
  field:2,                             /* 1 A1 2 A2 3 A3 */
  N:2,                                  /* 立方体剖分密度 */
  P:{x:.3, y:.2},                       /* modeDiv 观察点 */
  halfL:.25,                            /* modeDiv 小立方体半边长 */
  nPlus:2, nMinus:0,                    /* 点电荷球：球心正 / 负电荷个数 */
  magnetTilt:0,                         /* 磁通量场景：面与场线的夹角(度) */
  show:{ flux:true, cancel:true, vec:true, labels:true, box:true, light:true },
  cardTab:'1',
  showReadout:true,
  autoRotate:false,
};
const CUBE_L=1.0;    /* 外壳半边长 */
function field(){
  return state.field===1 ? A1 : (state.field===2 ? A2 : A3);
}
function divF(){
  return state.field===1 ? 0 : (state.field===2 ? 3 : -3);
}
function fieldName(){
  return state.field===1 ? '@{A}=(1, 0.4, 0.6)' :
         (state.field===2 ? '@{A}=(x, y, z)' : '@{A}=-(x, y, z)');
}

/* ---------------- 富文本引擎（与 1.3 同源） ---------------- */
function parseRich(s){
  const items=[], groups=[]; const st={g:-1};
  (function walk(str){
    let buf='';
    const flush=()=>{ if(buf){ items.push({t:'n',s:buf,g:st.g}); buf=''; } };
    for(let i=0;i<str.length;){
      const c=str[i];
      if(c==='@' && str[i+1]==='{'){
        const j=str.indexOf('}', i+2);
        if(j<0){ buf+=c; i++; continue; }
        flush();
        const save=st.g; st.g=groups.length; groups.push(1);
        walk(str.slice(i+2,j)); st.g=save; i=j+1; continue;
      }
      if(c==='_'){
        flush();
        if(str[i+1]==='{'){ const j=str.indexOf('}',i+2);
          if(j>=0){ items.push({t:'s',s:str.slice(i+2,j),g:st.g}); i=j+1; continue; } }
        items.push({t:'s',s:str[i+1]||'',g:st.g}); i+=2; continue;
      }
      if(c==='<'){ const j=str.indexOf('>',i);
        if(j>=0){ buf+=str.slice(i,j+1); i=j+1; continue; } }
      buf+=c; i++;
    }
    flush();
  })(String(s));
  return {items, groups};
}
const RICHFONT='"PingFang SC","Microsoft YaHei",sans-serif';
const RICHFONT_M='Georgia,"Times New Roman",serif';
function richLayout(ctx,rich,size,bold){
  const subSize=size*0.74;
  const wM=bold?'700 ':'';
  const fN =wM+size+'px '+RICHFONT;
  const fNs=wM+subSize+'px '+RICHFONT;
  const fV ='italic '+wM+size+'px '+RICHFONT_M;
  const fVs=wM+subSize+'px '+RICHFONT_M;
  const groups=rich.groups.map(()=>({x0:1e9,x1:-1e9,locked:false,top:1e9}));
  const out=[]; let x=0;
  const oldBL=ctx.textBaseline; ctx.textBaseline='middle';
  rich.items.forEach(it=>{
    const sub=it.t==='s', vec=it.g>=0;
    const font = sub ? (vec?fVs:fNs) : (vec?fV:fN);
    ctx.font=font;
    const m=ctx.measureText(it.s), w=m.width;
    const dy = sub? size*0.20 : 0;
    const asc = (m.actualBoundingBoxAscent!=null) ? m.actualBoundingBoxAscent : size*0.38;
    if(vec){
      const g=groups[it.g];
      if(!g.locked){
        if(sub) g.locked=true;
        else { if(x<g.x0) g.x0=x; g.x1=x+w; }
      }
      const top=dy-asc; if(top<g.top) g.top=top;
    }
    out.push({s:it.s,sub,x,w,font,dy});
    x+=w;
  });
  ctx.textBaseline=oldBL;
  return {items:out, groups, w:x, size, subSize};
}
function richDraw(ctx,lo,cx,cy,align,color){
  let ox = align==='center'? cx-lo.w/2 : align==='right'? cx-lo.w : cx;
  const dy = it=> cy + it.dy;
  const ay = g => cy + g.top - Math.max(2.2, lo.size*0.13);
  const span = g => [ox+g.x0-0.6, ox+g.x1+0.6];
  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.lineJoin='round'; ctx.lineCap='butt';
  ctx.lineWidth=3.4; ctx.strokeStyle='rgba(255,255,255,.92)';
  lo.items.forEach(it=>{ ctx.font=it.font; ctx.strokeText(it.s, ox+it.x, dy(it)); });
  lo.groups.forEach(g=>{ if(g.x1<=g.x0) return;
    const y=ay(g), s=span(g);
    ctx.beginPath(); ctx.moveTo(s[0],y); ctx.lineTo(s[1],y); ctx.stroke(); });
  lo.groups.forEach(g=>{ if(g.x1<=g.x0) return;
    const y=ay(g), s=span(g), ax=s[0], bx=s[1];
    ctx.strokeStyle=color; ctx.lineWidth=1.15;
    ctx.beginPath(); ctx.moveTo(ax,y); ctx.lineTo(bx-1.2,y); ctx.stroke();
    const h=Math.min(3.6, Math.max(2.6,(bx-ax)*0.40));
    ctx.beginPath(); ctx.moveTo(bx,y); ctx.lineTo(bx-h,y-h*0.52); ctx.lineTo(bx-h,y+h*0.52);
    ctx.closePath(); ctx.fillStyle=color; ctx.fill(); });
  lo.items.forEach(it=>{ ctx.font=it.font; ctx.fillStyle=color; ctx.fillText(it.s, ox+it.x, dy(it)); });
  ctx.restore();
}
function richHTML(s){
  const r=parseRich(s);
  let h='', gi=-1;
  r.items.forEach(it=>{
    const body = it.t==='s' ? '<sub>'+it.s+'</sub>' : it.s;
    if(it.g!==gi){ if(gi>=0) h+='</span>'; if(it.g>=0) h+='<span class="vec">'; gi=it.g; }
    h+=body;
  });
  if(gi>=0) h+='</span>';
  return wrapSqrt(h);
}
function wrapSqrt(html){
  const out=[]; let i=0;
  while(i<html.length){
    const k=html.indexOf('√(', i);
    if(k<0){ out.push(html.slice(i)); break; }
    out.push(html.slice(i,k));
    out.push('<span class="sqrt"><span class="in">');
    let j=k+2, depth=1;
    while(j<html.length && depth>0){
      const c=html[j];
      if(c==='(') depth++;
      else if(c===')'){ depth--; if(depth===0) break; }
      j++;
    }
    if(depth!==0){ out.push(html.slice(k)); return out.join(''); }
    out.push(html.slice(k+2, j));
    out.push('</span></span>');
    i=j+1;
  }
  return out.join('');
}

/* ---------------- 配色 ---------------- */
const C = {
  teal:'#156082', orange:'#E97132', green:'#3E9B4F', purple:'#9B59B6',
  crimson:'#D04A3A', blue:'#0F9ED5', gray:'#8CA0AC', light:'#C9D6DD',
  ink:'#22414F', grid:'#EAF0F4', muted:'#7A8F9B',
};

/* ---------------- 画布与相机 ---------------- */
let canvas, ctx, W=800, H=600, DPR=1;
const cam={az:.62, el:.46, zoom:1, px:0, py:0};
let camU, camV, camD, camScale, CX, CY;
function setupCamera(){
  const ca=Math.cos(cam.az), sa=Math.sin(cam.az);
  const ce=Math.cos(cam.el), se=Math.sin(cam.el);
  camD={x:ce*ca, y:ce*sa, z:se};
  camU={x:-sa, y:ca, z:0};
  camV={x:-ca*se, y:-sa*se, z:ce};
  camScale=Math.min(W,H)/3.2*cam.zoom;
  CX=W/2; CY=H*0.55;
}
function pr(p){ return {x:CX+cam.px+camScale*vdot(p,camU), y:CY+cam.py-camScale*vdot(p,camV), d:vdot(p,camD)}; }

/* ---------------- 图元系统（与 1.3 同源） ---------------- */
let prims=[];
function P_(z,fn){ prims.push({z,draw:fn}); }
function line(a,b,o={}){
  const A=pr(a),B=pr(b);
  P_((A.d+B.d)/2, ()=>{ ctx.save();
    ctx.globalAlpha=o.alpha!=null?o.alpha:1;
    ctx.strokeStyle=o.color||C.gray; ctx.lineWidth=o.w||1.4;
    if(o.dash) ctx.setLineDash(o.dash);
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke(); ctx.restore(); });
}
function arrowSeg(A,B,color,w,headScale){
  const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy);
  if(L<0.5) return;
  const ux=dx/L, uy=dy/L, hs=(headScale||1)*9;
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x-ux*hs*.55, B.y-uy*hs*.55); ctx.stroke();
  const ang=Math.atan2(dy,dx);
  ctx.beginPath(); ctx.moveTo(B.x,B.y);
  ctx.lineTo(B.x-hs*Math.cos(ang-.42), B.y-hs*Math.sin(ang-.42));
  ctx.lineTo(B.x-hs*Math.cos(ang+.42), B.y-hs*Math.sin(ang+.42));
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
}
function arrow(a,b,o={}){
  const A=pr(a),B=pr(b);
  P_((A.d+B.d)/2, ()=>{ ctx.save();
    ctx.globalAlpha=o.alpha!=null?o.alpha:1;
    if(o.dash) ctx.setLineDash(o.dash);
    arrowSeg(A,B,o.color||C.teal,o.w||2,o.headScale); ctx.restore(); });
  if(o.label) text(vmul(vadd(a,b),.5), o.label,
    {color:o.color||C.teal, dx:o.ldx||0, dy:o.ldy!==undefined?o.ldy:-10, size:o.lsize||12.5, bold:true, align:o.lalign});
}
function curve(ptsArr,o={}){
  if(ptsArr.length<2) return;
  const S=ptsArr.map(pr);
  P_(S.reduce((s,p)=>s+p.d,0)/S.length, ()=>{ ctx.save();
    ctx.globalAlpha=o.alpha!=null?o.alpha:1;
    ctx.strokeStyle=o.color||C.gray; ctx.lineWidth=o.w||1.8; ctx.lineCap='round';
    if(o.dash) ctx.setLineDash(o.dash);
    ctx.beginPath(); ctx.moveTo(S[0].x,S[0].y);
    for(let i=1;i<S.length;i++) ctx.lineTo(S[i].x,S[i].y);
    ctx.stroke();
    if(o.arrowEnd){ const a=S[S.length-2], b=S[S.length-1];
      ctx.setLineDash([]); arrowSeg(a,b,o.color||C.gray,o.w||1.8,.75); }
    ctx.restore(); });
}
function poly(ptsArr,o={}){
  if(ptsArr.length<3) return;
  const S=ptsArr.map(pr);
  P_(S.reduce((s,p)=>s+p.d,0)/S.length, ()=>{ ctx.save();
    ctx.beginPath(); ctx.moveTo(S[0].x,S[0].y);
    for(let i=1;i<S.length;i++) ctx.lineTo(S[i].x,S[i].y);
    ctx.closePath();
    if(o.fill){ ctx.globalAlpha=o.fillAlpha!=null?o.fillAlpha:.15; ctx.fillStyle=o.fill; ctx.fill(); }
    if(o.stroke){ ctx.globalAlpha=o.strokeAlpha!=null?o.strokeAlpha:1;
      ctx.strokeStyle=o.stroke; ctx.lineWidth=o.w||1.3; if(o.dash)ctx.setLineDash(o.dash); ctx.stroke(); }
    ctx.restore(); });
}
function marker(p,o={}){
  const S=pr(p);
  P_(S.d+0.02, ()=>{ ctx.save();
    ctx.globalAlpha=o.alpha!=null?o.alpha:1;
    ctx.beginPath(); ctx.arc(S.x,S.y,o.r||5,0,7);
    ctx.fillStyle=o.color||C.orange; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
    if(o.ring){ ctx.beginPath(); ctx.arc(S.x,S.y,(o.r||5)+4,0,7);
      ctx.strokeStyle=o.ring; ctx.lineWidth=2.2; ctx.stroke(); }
    ctx.restore(); });
  if(o.label) text(p, o.label, {color:o.color||C.orange,
    dx:o.ldx!=null?o.ldx:10, dy:o.ldy!=null?o.ldy:-10, size:o.lsize||13, bold:true, align:o.lalign});
}
function text(p,str,o={}){
  const S=pr(p);
  P_(1e6, ()=>{ ctx.save();
    const size=o.size||12.5, bold=!!o.bold;
    const lo=richLayout(ctx, parseRich(str), size, bold);
    richDraw(ctx, lo, S.x+(o.dx||0), S.y+(o.dy||0), o.align||'left', o.color||C.ink);
    ctx.restore(); });
}

/* =====================================================================
 * 页签①：通量 —— 四个可切换的子场景，都在回答「什么是通量：穿过即有通量」
 *   ① 灯笼（光通量） ② 瓶子（透光看液面） ③ 磁力线（磁通量） ④ 点电荷球（电通量）
 * ===================================================================== */
const FLUX_SCENES=[
  {k:'lantern', t:'灯笼 · 光通量'},
  {k:'bottle',  t:'瓶子 · 透光看液面'},
  {k:'magnet',  t:'发电机 · 磁通量'},
  {k:'charge',  t:'点电荷球 · 电通量'},
];
const THEOREM_SCENES=[
  {k:'fieldlines', t:'场线穿闭曲面'},
  {k:'subdiv',     t:'立方体剖分'},
];

/* ---------- 通用小工具 ---------- */
function ring(R,z,color,w,alpha,n){
  n=n||44; const loop=[];
  for(let i=0;i<=n;i++){ const a=2*Math.PI*i/n; loop.push(pt(R*Math.cos(a), R*Math.sin(a), z)); }
  curve(loop,{color,w,alpha});
}
function glow(p,color,r0,layers,alphaMax){
  const S=pr(p); layers=layers||4; alphaMax=alphaMax||.16;
  for(let i=layers;i>=1;i--){
    const rr=r0*(0.45+i*0.55), a=alphaMax*(layers-i+1)/layers;
    P_(S.d-0.04, ()=>{ ctx.save(); ctx.globalAlpha=a;
      ctx.beginPath(); ctx.arc(S.x,S.y,rr,0,7); ctx.fillStyle=color; ctx.fill(); ctx.restore(); });
  }
}
/* 球面上均匀分布的单位方向（黄金角螺旋），用于灯笼光线 / 电荷场线 */
function sphereDirs(n){
  const out=[];
  for(let k=0;k<n;k++){
    const z=1-(2*k+1)/n, rr=Math.sqrt(Math.max(0,1-z*z)), a=k*2.399963229728653;
    out.push(pt(rr*Math.cos(a), rr*Math.sin(a), z));
  }
  return out;
}

/* ---------- 场景① 灯笼 · 光通量（实体曲面 + 开/关灯） ---------- */
function sceneLantern(){
  const Hh=0.60, Rtop=0.30, Rb=0.62;
  const prof=z=>{ const t=Math.max(-1,Math.min(1,z/Hh)); return Rtop+(Rb-Rtop)*(1-t*t); };
  const on=state.show.light;
  const CS=pr(pt(0,0,0));
  /* 开灯：整片暖色光晕铺在最后面（照亮周围） */
  if(on){
    P_(-50, ()=>{ ctx.save();
      const g=ctx.createRadialGradient(CS.x,CS.y,8, CS.x,CS.y, 320);
      g.addColorStop(0,'rgba(255,192,80,.55)');
      g.addColorStop(.38,'rgba(255,203,116,.26)');
      g.addColorStop(1,'rgba(255,214,150,0)');
      ctx.beginPath(); ctx.arc(CS.x,CS.y,320,0,7); ctx.fillStyle=g; ctx.fill(); ctx.restore(); });
  }
  /* 灯罩：旋转曲面逐面填充 + 按法向做伪光照（不再画一堆经纬线） */
  const L=vnorm(pt(-0.5,-0.45,0.74));
  const na=28, nz=12, zs=[];
  for(let i=0;i<=nz;i++) zs.push(-Hh+2*Hh*i/nz);
  for(let j=0;j<na;j++){
    const a0=2*Math.PI*j/na, a1=2*Math.PI*(j+1)/na, am=(a0+a1)/2;
    for(let i=0;i<nz;i++){
      const zA=zs[i], zB=zs[i+1], rA=prof(zA), rB=prof(zB);
      const P00=pt(rA*Math.cos(a0), rA*Math.sin(a0), zA);
      const P10=pt(rA*Math.cos(a1), rA*Math.sin(a1), zA);
      const P11=pt(rB*Math.cos(a1), rB*Math.sin(a1), zB);
      const P01=pt(rB*Math.cos(a0), rB*Math.sin(a0), zB);
      let nx=Math.cos(am), ny=Math.sin(am), nz2=(zB>zA? -(rB-rA)/(zB-zA) : 0);
      const nl=Math.hypot(nx,ny,nz2)||1; nx/=nl; ny/=nl; nz2/=nl;
      const lam=Math.max(0, nx*L.x+ny*L.y+nz2*L.z);
      let col;
      if(on){ const s=0.80+0.20*lam;
        col='rgb('+Math.round(255*s)+','+Math.round(206*s)+','+Math.round(124*s)+')'; }
      else  { const s=0.18+0.50*lam;
        col='rgb('+Math.round(170*s)+','+Math.round(128*s)+','+Math.round(84*s)+')'; }
      poly([P00,P10,P11,P01],{fill:col, fillAlpha:1, stroke:col, strokeAlpha:1, w:1});
    }
  }
  /* 开灯：灯罩内生出一团亮核 → 显出"透亮" */
  if(on){
    P_(0.9, ()=>{ ctx.save();
      const g=ctx.createRadialGradient(CS.x,CS.y,4, CS.x,CS.y, 135);
      g.addColorStop(0,'rgba(255,246,214,.80)');
      g.addColorStop(.34,'rgba(255,223,152,.40)');
      g.addColorStop(1,'rgba(255,210,130,0)');
      ctx.beginPath(); ctx.arc(CS.x,CS.y,135,0,7); ctx.fillStyle=g; ctx.fill(); ctx.restore(); });
  }
  /* 上下口沿 + 提手 */
  const rimCol = on? '#8A5A24' : '#241A10';
  ring(Rtop, Hh, rimCol, 2.0, .85);
  ring(Rtop,-Hh, rimCol, 2.0, .85);
  const hd=[];
  for(let i=0;i<=20;i++){ const a=Math.PI*i/20; hd.push(pt(0.26*Math.cos(a),0,Hh+0.26*Math.sin(a))); }
  curve(hd,{color: on?'#8A5A24':'#241A10', w:2.4, alpha:.95});
  /* 开灯：光线穿出灯罩 */
  if(on){
    text(pt(0,0,0),'光源',{color:'#9A5A12', size:11.5, bold:true, dx:12, dy:-9});
    const tShell=d=>{
      const f=t=>{ const p=vmul(d,t); return Math.hypot(p.x,p.y)-prof(p.z); };
      let a=0.12,b=1.5;
      if(f(a)*f(b)>0) return 0.62;
      for(let i=0;i<24;i++){ const m=(a+b)/2; if(f(a)*f(m)<=0) b=m; else a=m; }
      return (a+b)/2;
    };
    sphereDirs(10).forEach(d=>{
      const ts=tShell(d);
      curve([vmul(d, Rb*0.18), vmul(d, ts+0.5)], {color:'#F2A81E', w:1.9, alpha:.9, arrowEnd:true});
      marker(vmul(d, ts),{r:2.8, color:'#E8860F', alpha:.95});
    });
    text(pt(0,0,Rb*1.72),'开灯：光透过灯罩射出，周围被点亮 → 灯罩表面有光通量 Φ > 0',
      {color:C.ink, size:13, bold:true, align:'center'});
    text(pt(0,0,-Rb*1.82),'光"穿过"灯罩这个闭合面 —— 穿过的光的多少就是光通量',
      {color:C.muted, size:11.5, align:'center'});
  }else{
    text(pt(0,0,Rb*1.72),'关灯：灯罩不透光，光出不来 → 外面是暗的',
      {color:'#5F7482', size:13, bold:true, align:'center'});
    text(pt(0,0,-Rb*1.82),'把灯点亮 → 灯罩整面透亮、四周被照亮',
      {color:C.muted, size:11.5, align:'center'});
  }
}

/* ---------- 场景② 瓶子 · 透光看液面（实体玻璃瓶 + 开/关灯） ----------
 * 关灯：瓶身是**不透光的暗实体**，瓶里什么都看不见 → 液面不标注（看不出来）
 * 开灯：瓶身变**半透明玻璃**，外部光穿过瓶壁照进液体 → 液面显形并被标注
 * ------------------------------------------------------------------- */
function sceneBottle(){
  const Rb=0.44, zBot=-0.70, zSh=0.14, zNk=0.52, zTop=0.80, Rn=0.15, liqZ=-0.10;
  const lit=state.show.light;
  /* 母线：瓶身圆筒 → 四分之一椭圆的圆角肩部 → 直瓶颈（真瓶子的比例） */
  const rAt=z=>{
    if(z<=zSh) return Rb;
    if(z>=zNk) return Rn;
    const t=(z-zSh)/(zNk-zSh);
    return Rn+(Rb-Rn)*Math.sqrt(Math.max(0,1-t*t));
  };
  const L=vnorm(pt(-0.62,-0.55,0.55));                 /* 外部平行光方向 */
  const CS=pr(pt(0,0,0));

  /* 开灯：环境亮起来（整片暖白光晕铺在最底层） */
  if(lit){
    P_(-50, ()=>{ ctx.save();
      const g=ctx.createRadialGradient(CS.x,CS.y,10, CS.x,CS.y, 310);
      g.addColorStop(0,'rgba(255,238,196,.46)');
      g.addColorStop(.42,'rgba(255,242,212,.20)');
      g.addColorStop(1,'rgba(255,246,226,0)');
      ctx.beginPath(); ctx.arc(CS.x,CS.y,310,0,7); ctx.fillStyle=g; ctx.fill(); ctx.restore(); });
  }
  /* 瓶底落在桌面上的接触阴影（固定在最底层，避免被算进画家队列） */
  {
    const SB=pr(pt(0,0,zBot)), sr=Rb*camScale*1.62, sq=Math.max(.08,Math.abs(Math.sin(cam.el)));
    P_(-40, ()=>{ ctx.save(); ctx.translate(SB.x,SB.y); ctx.scale(1,sq);
      const g=ctx.createRadialGradient(0,0,2, 0,0,sr);
      g.addColorStop(0,  lit?'rgba(88,110,124,.50)':'rgba(88,110,124,.34)');
      g.addColorStop(.62,'rgba(88,110,124,.16)');
      g.addColorStop(1,  'rgba(88,110,124,0)');
      ctx.beginPath(); ctx.arc(0,0,sr,0,7); ctx.fillStyle=g; ctx.fill(); ctx.restore(); });
  }

  /* ---- 瓶身：用旋转体的**屏幕轮廓**画剪影，内部铺横向光带做玻璃质感。
   *      不做逐面填色（半透明时逐面描边会露出网格线），也不画任何经纬线。 ---- */
  /* ⚠️ se 必须取绝对值：cam.el 可为负（视角拖到地平线以下），而椭圆的竖向半轴
   *    是 r·camScale·|sin el|。直接传 sin(el) 会给 ctx.ellipse 一个负半径 →
   *    抛 IndexSizeError → 渲染循环被打断、画面永久卡住（开关点了也没反应）。 */
  const ce=Math.cos(cam.el), se=Math.abs(Math.sin(cam.el));
  const PX=CX+cam.px, PY=CY+cam.py;
  const Y0=z=>PY-camScale*ce*z;
  function bottlePath(o){
    const NT=32, NS=52, HL=Math.PI/2;
    const aT=Rn*camScale, bT=Rn*camScale*se, yT=Y0(zTop);
    const aB=Rb*camScale, bB=Rb*camScale*se, yB=Y0(zBot);
    o.beginPath();
    for(let i=0;i<=NT;i++){ const f=1.5*Math.PI-Math.PI*i/NT;          /* 瓶口：上半椭圆 */
      const x=PX+aT*Math.sin(f), y=yT+bT*Math.cos(f); i?o.lineTo(x,y):o.moveTo(x,y); }
    for(let i=0;i<=NS;i++){ const z=zTop+(zBot-zTop)*i/NS;             /* 右母线 */
      o.lineTo(PX+rAt(z)*camScale, Y0(z)); }
    for(let i=0;i<=NT;i++){ const f=HL-HL*2*i/NT;                      /* 瓶底：下半椭圆 */
      o.lineTo(PX+aB*Math.sin(f), yB+bB*Math.cos(f)); }
    for(let i=0;i<=NS;i++){ const z=zBot+(zTop-zBot)*i/NS;             /* 左母线 */
      o.lineTo(PX-rAt(z)*camScale, Y0(z)); }
    o.closePath();
  }
  function glassGrad(o){
    const g=o.createLinearGradient(PX-Rb*camScale, 0, PX+Rb*camScale, 0);
    (lit
      ? [[0,'122,170,196'],[.09,'196,226,240'],[.24,'242,251,255'],[.50,'204,231,244'],
         [.72,'160,203,224'],[.88,'232,246,252'],[1,'118,166,193']]
      : [[0,'26,36,44'],[.12,'58,74,88'],[.32,'88,108,126'],[.56,'50,64,76'],
         [.78,'74,92,108'],[1,'24,34,42']]
    ).forEach(st=>g.addColorStop(st[0],'rgb('+st[1]+')'));
    return g;
  }
  /* 后壁（铺在液体之后，远早于光线的画家序） */
  P_(-30, ()=>{ ctx.save(); ctx.globalAlpha= lit?0.82:1;
    bottlePath(ctx); ctx.fillStyle=glassGrad(ctx); ctx.fill(); ctx.restore(); });

  /* ---- 液体（只在开灯时画：关灯时瓶里看不出任何东西） ---- */
  if(lit){
    const Rl=Rb*0.88;
    const aL=Rl*camScale, bL=Rl*camScale*se;
    const yLt=Y0(liqZ), yLb=Y0(zBot), HL=Math.PI/2, NT=34;
    function liqPath(o){                                   /* 液柱剪影：上缘是液面的近半椭圆 */
      o.beginPath(); o.moveTo(PX-aL,yLt);
      for(let i=1;i<=NT;i++){ const f=-HL+2*HL*i/NT; o.lineTo(PX+aL*Math.sin(f), yLt+bL*Math.cos(f)); }
      o.lineTo(PX+aL,yLb);
      for(let i=1;i<=NT;i++){ const f=HL-2*HL*i/NT; o.lineTo(PX+aL*Math.sin(f), yLb+bL*Math.cos(f)); }
      o.closePath();
    }
    function liqGrad(o){                                   /* 横向光带：左亮 → 中透 → 右暗 */
      const g=o.createLinearGradient(PX-Rl*camScale, 0, PX+Rl*camScale, 0);
      [[0,'32,106,170'],[.13,'90,170,218'],[.30,'150,216,246'],[.55,'84,164,214'],
       [.78,'50,132,188'],[.92,'114,190,232'],[1,'30,104,168']]
        .forEach(st=>g.addColorStop(st[0],'rgb('+st[1]+')'));
      return g;
    }
    P_(-25, ()=>{ ctx.save(); liqPath(ctx); ctx.fillStyle=liqGrad(ctx); ctx.fill(); ctx.restore(); });
    /* 液面（水平圆盘）—— 这是"看得清有多少"的唯一依据 */
    P_(-24, ()=>{ ctx.save(); ctx.beginPath();
      ctx.ellipse(PX, yLt, aL, bL, 0, 0, Math.PI*2);
      ctx.fillStyle='#B9E5F9'; ctx.fill();
      ctx.strokeStyle='#2F8FCB'; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore(); });
    text(pt(Rl*0.58, Rl*0.58, liqZ), '液面', {color:'#0F5687', size:11.5, bold:true, dx:10, dy:-4});
  }

  /* ---- 前壁薄雾 + 清晰轮廓（压在内容之上，玻璃才有「透」的感觉） ---- */
  if(lit) P_(45, ()=>{ ctx.save(); ctx.globalAlpha=0.16;
    bottlePath(ctx); ctx.fillStyle=glassGrad(ctx); ctx.fill(); ctx.restore(); });
  P_(46, ()=>{ ctx.save(); bottlePath(ctx);
    ctx.strokeStyle= lit? 'rgba(92,142,172,.80)' : 'rgba(150,176,196,.45)';
    ctx.lineWidth=1.8; ctx.lineJoin='round'; ctx.stroke(); ctx.restore(); });
  P_(46.2, ()=>{ ctx.save(); ctx.beginPath();
    ctx.ellipse(PX, Y0(zTop), Rn*camScale, Rn*camScale*se, 0, 0, Math.PI*2);
    ctx.strokeStyle= lit? 'rgba(92,142,172,.85)' : 'rgba(150,176,196,.40)';
    ctx.lineWidth=1.6; ctx.stroke(); ctx.restore(); });

  /* ---- 外部光源与光线 ---- */
  if(lit){
    const src=pt(-1.40,0,0.03);
    glow(src,'#F6C544',7,4,.18);
    marker(src,{r:5,color:'#F0A800',ring:'#FBE7A8',label:'外部光源',ldx:-12,ldy:-16,lsize:12});
    [-0.26,0,0.26].forEach(y=> [-0.58,-0.36,-0.14,0.06].forEach(z=>{
      const dxw=Math.sqrt(Math.max(1e-4, Rb*Rb-y*y));
      curve([pt(-1.20,y,z), pt(-dxw,y,z)], {color:'#F0A800', w:1.5, alpha:.88, arrowEnd:true});
      marker(pt(-dxw,y,z),{r:2.9,color:'#E07A1F',alpha:.95});
      curve([pt(-dxw,y,z), pt(dxw,y,z)], {color:'#FFC24A', w:1.1, alpha:.40});
    }));
    text(pt(0,0,1.32),'光"穿过"瓶壁这个面 → 这个面就有光通量',
      {color:C.ink, size:12.5, bold:true, align:'center'});
    text(pt(0,0,-1.12),'光穿入瓶壁 → 照亮液体 → 液面显形，看清还剩多少',
      {color:'#B26A1E', size:12, bold:true, align:'center'});
  }else{
    text(pt(0,0,1.32),'关灯：瓶身不透光，瓶里什么都看不见',
      {color:C.ink, size:12.5, bold:true, align:'center'});
    text(pt(0,0,-1.12),'没有光照 → 看不清瓶里还剩多少',
      {color:C.muted, size:12, bold:true, align:'center'});
  }
}

/* ---------- 场景③ 发电机 · 磁通量（线圈面穿过磁力线） ---------- */
function sceneMagnet(){
  const th=state.magnetTilt*Math.PI/180;   /* 线圈面法向 与 磁场 的夹角 */
  const wHalf=0.40;                         /* 线圈矩形面的半宽/半高（做成有厚度的线圈） */
  const nrm=vnorm(pt(Math.sin(th),0,Math.cos(th)));   /* 面法向在 x-z 平面内转动 */
  /* 面内一组正交基：t1 沿"转轴"方向（y 方向，不随 θ 变），t2 在转动平面内 */
  const t1=pt(0,1,0);
  const t2=vnorm(vcross(nrm,t1));          /* = (-cosθ, 0, sinθ) */
  const phi=Math.cos(th);                    /* Φ/Φmax = cosθ */

  /* 磁场源：两块磁极（N 在下、S 在上，中间是匀强区） */
  const gap=.95, wd=.66;
  const NS=[
    {z:-gap, c:'#B23A48', l:'N'},
    {z: gap, c:'#2F6FB2', l:'S'},
  ];
  NS.forEach(mag=>{
    poly([pt(-wd,-wd,mag.z),pt(wd,-wd,mag.z),pt(wd,wd,mag.z),pt(-wd,wd,mag.z)],
         {fill:mag.c, fillAlpha:.28, stroke:mag.c, w:1.8});
    text(pt(0,-wd-.22,mag.z),mag.l,{color:mag.c,size:15,bold:true,align:'center'});
  });

  /* 匀强磁场磁力线：竖直向上（从 N 指向 S）的一族平行线。
   * 只画外圈，中心区让给"穿过线圈面"的红色线，避免视觉打架 */
  const grids=[-0.62,-0.31,0.31,0.62];
  const Bz0=-gap, Bz1=gap;
  grids.forEach(x=>grids.forEach(y=>{
    arrow(pt(x,y,Bz0), pt(x,y,Bz1), {color:'#8BA7B8', w:1.15, alpha:.55});
  }));

  /* 转轴：过原点沿 y 方向的短杆（线圈绕它转） */
  line(pt(0,-.85,0), pt(0,.85,0), {color:'#9DB3BF', w:2.6, alpha:.7});

  /* 线圈：矩形环（有厚度，两根矩形环框出线圈导线），法向 = nrm */
  const ring1=[], ring2=[];
  for(let i=0;i<=40;i++){
    const a=2*Math.PI*i/40;
    const cx=Math.cos(a), cy=Math.sin(a);
    /* 沿 nrm 方向：导线中心在原点，宽度方向沿 t2（在转动平面内） */
    const p1=vadd(vmul(t2,cx*wHalf), vmul(t1,cy*wHalf));
    const p2=vadd(vmul(t2,cx*(wHalf+0.05)), vmul(t1,cy*(wHalf+0.05)));
    ring1.push(p1); ring2.push(p2);
  }
  curve(ring1,{color:'#C26A2B', w:2.4, alpha:.95});
  curve(ring2,{color:'#C26A2B', w:1.4, alpha:.55});
  /* 线圈面（半透明矩形，法向 = nrm） */
  const q=[
    vadd(vmul(t2, wHalf),vmul(t1,wHalf)),
    vadd(vmul(t2,-wHalf),vmul(t1,wHalf)),
    vadd(vmul(t2,-wHalf),vmul(t1,-wHalf)),
    vadd(vmul(t2, wHalf),vmul(t1,-wHalf)),
  ];
  poly(q,{fill:C.orange, fillAlpha:.22, stroke:C.orange, w:2});

  /* 法向箭头 */
  arrow(pt(0,0,0), vmul(nrm,0.85), {color:C.orange, w:2.4, label:'@{n}'});

  /* 穿过线圈面的磁力线：磁力线是空间里固定的一族**竖直平行线**（网格步长 d），
   * 线圈面在其中转动。某条线是否"穿过面" = 它在地面（水平面）的落点是否落在
   * 线圈面的水平投影内；投影面积 = A·cosθ，故穿过条数 ∝ cosθ。 */
  let through=0;
  const d=0.085;                                     /* 磁力线网格步长 */
  for(let x=-0.62; x<=0.62+1e-6; x+=d) for(let y=-0.62; y<=0.62+1e-6; y+=d){
    /* 面在水平面(x-y)的投影：把面内点 c 的水平分量与 (x,y) 比对。
     * 面内点 c = t2·pu + t1·pv，其水平分量 = (pu·t2.x, pv)。反向解出 pu,pv 判范围 */
    const pv=y;                                       /* t1=(0,1,0)，故 v 投影=pv=y */
    const pu = Math.abs(t2.x)>1e-6 ? x/t2.x : 0;      /* 由 x=pu·t2.x 解 pu */
    const inside = Math.abs(pu)<=wHalf && Math.abs(pv)<=wHalf && Math.abs(t2.x)>1e-6;
    arrow(pt(x,y,Bz0), pt(x,y,Bz1),
      {color: inside?'#D0452F':'#BCCAD3', w: inside?1.9:1.0, alpha: inside?.9:.4});
    if(inside){ through++; marker(pt(x,y,-Math.tan(th)*x),{r:2.6,color:'#D0452F', alpha:.9}); }
  }

  /* 读数 */
  text(pt(0,0,1.78),'Φ = B·A·cosθ = '+phi.toFixed(2)+' Φ_{max}　（θ = '+state.magnetTilt+'°，穿过 '+through+' 条）',
    {color:C.crimson, size:13, bold:true, align:'center'});
  text(pt(0,0,-1.70),'线圈一转，穿过的磁力线条数随 θ 变 → Φ 变 → 线圈里感应出电流（发电机）',
    {color:C.muted, size:11.5, align:'center'});
  /* 转轴顶点提示 */
  text(pt(0,.95,0),'转轴',{color:'#7A8F9B',size:11,align:'center'});
}

/* ---------- 场景④ 点电荷球 · 电通量 ---------- */
function sceneCharge(){
  const R=0.85;
  sphereGlass(R,{tint:'116,156,180', line:'#8AA6B6'});
  text(pt(R*0.70, R*0.70, R*0.52),'高斯面（闭合球面）',{color:'#6E8490', size:11.5, bold:true});
  const np=state.nPlus, nm=state.nMinus, Q=np-nm;
  /* 球心电荷簇 */
  const list=[];
  for(let k=0;k<np;k++) list.push('#D9534F');
  for(let k=0;k<nm;k++) list.push('#2F80C8');
  const m=list.length;
  if(m===0){ marker(pt(0,0,0),{r:4.6,color:'#9DB3BF',ring:'#D5DEE3'}); }
  else list.forEach((col,k)=>{
    const a=2*Math.PI*k/m;
    marker(pt(0.11*Math.cos(a), 0.11*Math.sin(a), 0.035*(k%2?1:-1)),{r:4.4,color:col});
  });
  /* 场线：净电荷>0 向外、<0 向内、=0 不画 */
  if(Q!==0){
    const n=Math.max(8, Math.min(18, Math.abs(Q)*5));
    sphereDirs(n).forEach(d=>{
      const p0=vmul(d,R*0.14), p1=vmul(d,R*1.5);
      if(Q>0) curve([p0,p1],{color:'#D9534F', w:1.8, alpha:.8, arrowEnd:true});
      else    curve([p1,p0],{color:'#2F80C8', w:1.8, alpha:.8, arrowEnd:true});
    });
  }
  const sign = Q>0? 'Φ > 0（净穿出）' : (Q<0? 'Φ < 0（净穿入）' : 'Φ = 0（穿出 = 穿入）');
  const col  = Q>0? C.crimson : (Q<0? C.blue : '#7A8F9B');
  text(pt(0,0,R*1.52),'球内：＋q ×'+np+'    −q ×'+nm,
    {color:C.ink, size:12.5, bold:true, align:'center'});
  text(pt(0,0,R*1.74),'净电荷 Q = '+((Q>0?'+':'')+Q)+'q',
    {color:col, size:13, bold:true, align:'center'});
  text(pt(0,0,R*1.96),'Φ = ∮@{E}·d@{S} = Q/ε₀   →   '+sign,
    {color:col, size:12.5, bold:true, align:'center'});
  text(pt(0,0,-R*1.5),'只要球内净电荷一定，通量就不变（与电荷怎么摆无关）',
    {color:C.muted, size:11.5, align:'center'});
}

/* 通量页签的场景分发 */
function sceneFluxTab(){
  switch(state.fluxScene){
    case 'lantern': return sceneLantern();
    case 'bottle':  return sceneBottle();
    case 'magnet':  return sceneMagnet();
    default:        return sceneCharge();
  }
}

/* =====================================================================
 * 「高斯散度定理」页签 · 子演示A：矢量线穿入/穿出闭合曲面
 *   选 A2 中心源场（∇·A=3）：穿出 - 穿入 = 净通量 = 3·V
 * ===================================================================== */
function sceneFieldLines(){
  const R=0.85;
  sphereWire(R, '#9DB3BF', 1.0, 0.55);
  const dirs=[];
  for(let i=0;i<8;i++){
    const th=Math.PI*(i+0.5)/8;
    const ph=i*Math.PI*0.25;
    dirs.push(pt(Math.sin(th)*Math.cos(ph), Math.sin(th)*Math.sin(ph), Math.cos(th)));
  }
  dirs.forEach(d=>{
    const inner=vmul(d,-R*1.15), outer=vmul(d, R*1.25);
    curve([inner, outer], {color:C.teal, w:1.6, alpha:.7});
    const pIn=vmul(d,-R), pInMid=vmul(d,-R*1.06);
    arrow(pIn, pInMid, {color:C.blue, w:2.4, headScale:.85, label:'穿入'});
    const pOutMid=vmul(d,R*1.06), pOut=vmul(d,R);
    arrow(pOutMid, pOut, {color:C.orange, w:2.4, headScale:.85, label:'穿出'});
  });
  marker(pt(0,0,0),{r:6,color:C.crimson,ring:'#F6C9C2',label:'源（+q）'});
  const V=4/3*Math.PI*R*R*R;
  const flux = divF()*V;
  text(pt(0,0,1.6),'Φ = ∮ @{A}·d@{S} = '+flux.toFixed(2),
    {color:C.ink, size:13.5, bold:true, align:'center'});
  text(pt(0,0,-1.25),'∇·@{A} = '+divF()+'  ，  V = '+V.toFixed(3),
    {color:C.muted, size:11.5, align:'center'});
}
function sphereWire(R,color,w,alpha){
  /* 4 条纬线圈 + 4 条经线圈 */
  for(let k=0;k<4;k++){
    const th=Math.PI*(k+1)/5;
    const loop=[];
    for(let i=0;i<=48;i++){ const ph=2*Math.PI*i/48;
      loop.push(pt(R*Math.sin(th)*Math.cos(ph), R*Math.sin(th)*Math.sin(ph), R*Math.cos(th))); }
    curve(loop,{color,w,alpha});
  }
  for(let k=0;k<4;k++){
    const ph=2*Math.PI*k/4;
    const loop=[];
    for(let i=0;i<=48;i++){ const th=Math.PI*i/48;
      loop.push(pt(R*Math.sin(th)*Math.cos(ph), R*Math.sin(th)*Math.sin(ph), R*Math.cos(th))); }
    curve(loop,{color,w,alpha});
  }
}

/* 半透明球壳（**不画任何经纬线**）：球在正交投影下恒为一个屏幕圆，
 * 所以只用一个圆 + 径向渐变就能做出"玻璃球壳"的体积感：
 *   后半球(zBack) 铺一层极淡体色 → 前半球(zFront) 迎光面微亮、中心通透、掠射边缘变厚(Fresnel) + 一点镜面高光。
 * 前后各一层，中间夹着的电荷与场线就成了"球内"的东西。 */
function sphereGlass(R,o){
  o=o||{};
  const tint=o.tint||'116,156,180', line=o.line||'#8AA6B6';
  const S=pr(pt(0,0,0)), rr=R*camScale;
  const zB=o.zBack!=null?o.zBack:-2.5, zF=o.zFront!=null?o.zFront:2.5;
  /* 后半球 */
  P_(zB, ()=>{ ctx.save();
    const g=ctx.createRadialGradient(S.x,S.y,rr*0.05, S.x,S.y,rr);
    g.addColorStop(0,'rgba('+tint+','+(o.aBack0!=null?o.aBack0:0.035)+')');
    g.addColorStop(1,'rgba('+tint+','+(o.aBack1!=null?o.aBack1:0.10)+')');
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,0,7); ctx.fillStyle=g; ctx.fill(); ctx.restore(); });
  /* 前半球 */
  P_(zF, ()=>{ ctx.save();
    const g=ctx.createRadialGradient(S.x-rr*0.34, S.y-rr*0.38, rr*0.06, S.x, S.y, rr*1.02);
    g.addColorStop(0,   'rgba(255,255,255,'+(o.aSpec!=null?o.aSpec:0.20)+')');
    g.addColorStop(0.42,'rgba('+tint+','+(o.aMid !=null?o.aMid :0.025)+')');
    g.addColorStop(0.80,'rgba('+tint+','+(o.aRim1!=null?o.aRim1:0.115)+')');
    g.addColorStop(1,   'rgba('+tint+','+(o.aRim2!=null?o.aRim2:0.40)+')');
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,0,7); ctx.fillStyle=g; ctx.fill();
    /* 掠射镜面高光 */
    const hx=S.x-rr*0.42, hy=S.y-rr*0.46, hr=rr*0.26;
    const gh=ctx.createRadialGradient(hx,hy,0, hx,hy,hr);
    gh.addColorStop(0,'rgba(255,255,255,.58)'); gh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.fillStyle=gh; ctx.fill();
    /* 轮廓圆——全图唯一的"线"，读作球面边缘而非经纬线 */
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,0,7);
    ctx.strokeStyle=line; ctx.lineWidth=o.w||1.7;
    ctx.globalAlpha=(o.aLine!=null?o.aLine:0.72); ctx.stroke();
    ctx.restore(); });
}

/* =====================================================================
 * 模式 2：散度（Divergence）—— 点 P 周围小立方体包围，6 面通量求和
 * ===================================================================== */
function modeDiv(){
  /* P 点（拖动，xy 平面内） */
  const P=pt(state.P.x, state.P.y, 0);
  const l=state.halfL;       /* 小立方体半边长 */
  /* 小立方体的 6 个面：每个面标注通量 */
  const faces=[
    {n:pt(1,0,0),  c:vadd(P,pt(l,0,0)),  off:pt(l*0.7,0,0),  lab:'(+x) 面'},
    {n:pt(-1,0,0), c:vadd(P,pt(-l,0,0)), off:pt(-l*0.7,0,0), lab:'(-x) 面'},
    {n:pt(0,1,0),  c:vadd(P,pt(0,l,0)),  off:pt(0,l*0.7,0),  lab:'(+y) 面'},
    {n:pt(0,-1,0), c:vadd(P,pt(0,-l,0)), off:pt(0,-l*0.7,0), lab:'(-y) 面'},
    {n:pt(0,0,1),  c:vadd(P,pt(0,0,l)),  off:pt(0,0,l*0.7),  lab:'(+z) 面'},
    {n:pt(0,0,-1), c:vadd(P,pt(0,0,-l)), off:pt(0,0,-l*0.7), lab:'(-z) 面'},
  ];
  let sum=0;
  faces.forEach(f=>{
    const A=field()(f.c);
    const dS=(2*l)*(2*l);
    const Phi=vdot(A,f.n)*dS;
    sum += Phi;
    const col=Phi>0? C.orange : (Phi<0? C.blue : '#A0AFB8');
    const a=Math.abs(Phi)*0.25;
    /* 面的四边形（绕法矢旋转） */
    let t1=vnorm(vcross(f.n, Math.abs(f.n.z)<.9?pt(0,0,1):pt(1,0,0)));
    const t2=vnorm(vcross(f.n,t1));
    const q=[vadd(vadd(f.c,vmul(t1,l)),vmul(t2,l)),
             vadd(vadd(f.c,vmul(t1,-l)),vmul(t2,l)),
             vadd(vadd(f.c,vmul(t1,-l)),vmul(t2,-l)),
             vadd(vadd(f.c,vmul(t1,l)),vmul(t2,-l))];
    poly(q,{fill:col, fillAlpha:Math.min(.55,.45+a), stroke:col, w:1.6});
    /* 外向法矢箭头 */
    arrow(vadd(f.c,vmul(f.n,l*0.35)), vadd(f.c,vmul(f.n,l*1.05)), {color:col, w:2});
    /* 通量数字 */
    text(vadd(f.c,vmul(f.n,l*1.45)), (Phi>=0?'+':'')+Phi.toFixed(2),
      {color:col, size:12.5, bold:true, align:'center', dy:0});
  });
  /* 小立方体棱（淡） */
  drawCube(P, l*2, '#B9C9D2', 0.55);
  /* P 点 */
  marker(P,{r:6,color:C.teal,ring:'#BBD9E6',label:'P'});
  /* 6 面通量求和 vs 解析 ∇·A·ΔV */
  const V=(2*l)*(2*l)*(2*l);
  const exact=divF()*V;
  text(vadd(P,pt(0,0,-l*1.7)),
    'ΣΦ ≈ '+sum.toFixed(3)+'     ∇·A·ΔV = '+exact.toFixed(3),
    {color:C.ink, size:12.5, bold:true, align:'center'});
  text(vadd(P,pt(0,0,l*1.95)),
    'div '+fieldName()+' = '+divF()+'（常数）',
    {color:C.muted, size:11.5, align:'center'});
}
function drawCube(c, side, color, alpha){
  const a=side/2;
  const v=[pt(-a,-a,-a),pt(a,-a,-a),pt(a,a,-a),pt(-a,a,-a),
           pt(-a,-a,a),pt(a,-a,a),pt(a,a,a),pt(-a,a,a)];
  const edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  edges.forEach(([i,j])=>line(vadd(c,v[i]),vadd(c,v[j]),{color,w:1.2,alpha}));
}

/* =====================================================================
 * 模式 3：散度定理（Theorem）—— 立方体网格剖分演示 ★ 用户最强调
 *   内部相邻面的通量一正一负相互抵消，只剩最外侧表面未被抵消
 * ===================================================================== */
function modeTheorem(){
  const N=state.N, l=CUBE_L/N;          /* 小立方体半边长 = 1/N */
  const A=field();
  /* 外壳 12 棱 */
  drawCube(pt(0,0,0), CUBE_L*2, C.ink, 0.95);
  /* 内部 N×N×N 个体元 */
  let sumInt=0, sumSurf=0;
  /* 用 map 记录每个面是否已被相邻体元绘制（避免重复画内部面） */
  for(let i=0;i<N;i++) for(let j=0;j<N;j++) for(let k=0;k<N;k++){
    /* 体元中心：整个大立方体跨 [-CUBE_L, +CUBE_L]，N 等分 → 半边长 l=CUBE_L/N */
    const cx=(2*(i+0.5)/N - 1)*CUBE_L;
    const cy=(2*(j+0.5)/N - 1)*CUBE_L;
    const cz=(2*(k+0.5)/N - 1)*CUBE_L;
    const P=pt(cx,cy,cz);
    /* 每个体元 6 面 */
    const dirs=[
      {axis:'x', sgn:+1, n:pt(+1,0,0)},
      {axis:'x', sgn:-1, n:pt(-1,0,0)},
      {axis:'y', sgn:+1, n:pt(0,+1,0)},
      {axis:'y', sgn:-1, n:pt(0,-1,0)},
      {axis:'z', sgn:+1, n:pt(0,0,+1)},
      {axis:'z', sgn:-1, n:pt(0,0,-1)},
    ];
    dirs.forEach(d=>{
      /* 面中心 */
      const fc=vadd(P, vmul(d.n, l));
      const Aa=A(fc);
      const dS=(2*l)*(2*l);
      const Phi=vdot(Aa, d.n)*dS;
      /* 判断是否为内部面（与 i+sgn*step 方向的体元相邻） */
      const ni=i+(d.axis==='x'?d.sgn:0);
      const nj=j+(d.axis==='y'?d.sgn:0);
      const nk=k+(d.axis==='z'?d.sgn:0);
      const isInner = (ni>=0&&ni<N && nj>=0&&nj<N && nk>=0&&nk<N);
      sumSurf += isInner? 0 : Phi;
      if(isInner){
        if(state.show.cancel){
          /* 内部抵消面：灰化 + 半透明 */
          let t1=vnorm(vcross(d.n, Math.abs(d.n.z)<.9?pt(0,0,1):pt(1,0,0)));
          const t2=vnorm(vcross(d.n,t1));
          const q=[vadd(vadd(fc,vmul(t1,l*0.95)),vmul(t2,l*0.95)),
                   vadd(vadd(fc,vmul(t1,-l*0.95)),vmul(t2,l*0.95)),
                   vadd(vadd(fc,vmul(t1,-l*0.95)),vmul(t2,-l*0.95)),
                   vadd(vadd(fc,vmul(t1,l*0.95)),vmul(t2,-l*0.95))];
          poly(q,{fill:'#D5DEE3', fillAlpha:0.45, stroke:'#9DB3BF', strokeAlpha:0.55, w:1, dash:[3,2]});
        }
        /* 不计入 sumSurf，但相邻体元反过来也会有这一面，sumInt 也跳过（避免双计） */
      }else{
        /* 外壳面：按通量上色 */
        const col=Phi>0?C.orange:(Phi<0?C.blue:'#A0AFB8');
        const a=Math.min(0.7, 0.18+Math.abs(Phi)*0.30);
        let t1=vnorm(vcross(d.n, Math.abs(d.n.z)<.9?pt(0,0,1):pt(1,0,0)));
        const t2=vnorm(vcross(d.n,t1));
        const q=[vadd(vadd(fc,vmul(t1,l*0.98)),vmul(t2,l*0.98)),
                 vadd(vadd(fc,vmul(t1,-l*0.98)),vmul(t2,l*0.98)),
                 vadd(vadd(fc,vmul(t1,-l*0.98)),vmul(t2,-l*0.98)),
                 vadd(vadd(fc,vmul(t1,l*0.98)),vmul(t2,-l*0.98))];
        poly(q,{fill:col, fillAlpha:a, stroke:col, w:1.6});
        /* 外向法矢 */
        arrow(vadd(fc,vmul(d.n,l*0.4)), vadd(fc,vmul(d.n,l*1.05)), {color:col, w:1.8, headScale:.7});
        if(state.show.labels){
          const lab = (Phi>=0?'+':'')+Phi.toFixed(2);
          const pos=vadd(fc,vmul(d.n,l*1.5));
          text(pos, lab, {color:col, size:11.5, bold:true, align:'center', dy:0});
        }
      }
    });
    /* 体元散度（解析）累加：∇·A · ΔV */
    sumInt += divF() * (2*l)*(2*l)*(2*l);
  }
  /* 注解文字 */
  const err = sumSurf - sumInt;
  text(pt(0,0,CUBE_L+0.35),'N = '+N+'×'+N+'×'+N+' 体元',
    {color:C.muted, size:11.5, align:'center', dy:0});
  text(pt(0,0,CUBE_L+0.55),'外壳通量 ∮ @{A}·d@{S} ≈ '+sumSurf.toFixed(2),
    {color:C.crimson, size:12.5, bold:true, align:'center', dy:0});
  text(pt(0,0,CUBE_L+0.78),'体元散度累加 ∫<sub>V</sub> ∇·@{A} dV ≈ '+sumInt.toFixed(2),
    {color:C.teal, size:12.5, bold:true, align:'center', dy:0});
  text(pt(0,0,CUBE_L+1.02),'误差 ≈ '+Math.abs(err).toFixed(2),
    {color:Math.abs(err)<0.05?C.green:(Math.abs(err)<0.2?C.orange:C.crimson),
     size:12, bold:true, align:'center'});
}

/* ---------------- 主场景构建 ---------------- */
function buildScene(){
  prims=[];
  const objScene = (state.mode==='flux' && (state.fluxScene==='lantern'||state.fluxScene==='bottle'||state.fluxScene==='magnet'));
  if(!objScene) drawAxes();
  if(state.mode==='flux') sceneFluxTab();
  else if(state.mode==='div') modeDiv();
  else if(state.theoremScene==='fieldlines') sceneFieldLines();
  else modeTheorem();
}

/* ---------------- 渲染循环 ---------------- */
let needsRender=true;
function draw(){ setupCamera(); ctx.clearRect(0,0,W,H); buildScene();
  prims.sort((a,b)=>a.z-b.z); for(const p of prims) p.draw(ctx);
  const t=document.getElementById('panTag'); if(t) t.classList.toggle('show', Math.abs(cam.px)>2||Math.abs(cam.py)>2);
  needsRender=false; }
/* ⚠️ draw() 必须包 try/catch：一旦某帧抛异常，若直接冒泡出 tick，
 *    requestAnimationFrame 就再也不会被排上 —— 整个渲染循环永久停摆，
 *    表现为「画面卡住 + 点什么都没反应」，排查时极难定位。
 *    这里兜住异常、复位 needsRender（避免每帧刷错），循环继续存活。 */
function tick(){
  if(state.autoRotate){ cam.az+=0.0045; needsRender=true; }
  if(needsRender){
    try{ draw(); }
    catch(e){ needsRender=false;
      if(!tick._last || tick._last!==e.message){ tick._last=e.message;
        console.error('[draw] 渲染异常（已跳过该帧，循环继续）：', e); } }
  }
  requestAnimationFrame(tick);
}
function updateAll(){
  needsRender=true;
  if(typeof syncSliders==='function') syncSliders();
  if(typeof updateReadout==='function') updateReadout();
  if(typeof updateModeTag==='function') updateModeTag();
}

function subChips(parent, items, isOn, onPick){
  const box=h('<div class="sub-chips"></div>').firstChild;
  items.forEach(it=>{
    const fb=h('<button class="chip '+(it.col||'')+(isOn(it)?' on':'')+'" data-k="'+it.k+'">'+it.t+'</button>').firstChild;
    fb.onclick=()=>{ onPick(it); };
    box.appendChild(fb);
  });
  parent.appendChild(box);
  return box;
}

function mkSlider(sec,label,id,min,max,step,val,oninput,fmt){
  const r=h('<div class="slider-row xl"><label>'+label+'</label>'+
    '<input type="range" id="s_'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'">'+
    '<span class="val" id="v_'+id+'">'+(fmt?fmt(val):val)+'</span></div>');
  const inp=r.querySelector('input');
  inp.oninput=()=>{ const v=parseFloat(inp.value); oninput(v);
    document.getElementById('v_'+id).textContent = fmt? fmt(v) : v;
    needsRender=true; updateReadout(); updateModeTag(); };
  sec.appendChild(r);
}
function updateQNote(){
  const e=document.getElementById('qNote'); if(!e) return;
  const Q=state.nPlus-state.nMinus;
  e.innerHTML='球内净电荷 Q = '+((Q>0?'+':'')+Q)+'q；Φ = Q/ε₀ '+
    (Q>0?'&gt; 0（正源 → 净穿出）':(Q<0?'&lt; 0（负源 / 汇 → 净穿入）':'= 0（正负相等 → 穿出 = 穿入）'));
}
function updateMagNote(){
  const e=document.getElementById('magNote'); if(!e) return;

    (th>82?'：线圈面几乎与磁力线平行，几乎没有磁力线穿过 → Φ ≈ 0':'')+
    (th<3?'：线圈面与磁力线垂直，穿过的磁力线最多 → Φ = Φ<sub>max</sub>':'');

function syncSliders(){
  const set=(id,val,fmt)=>{ const s=document.getElementById('s_'+id); if(s) s.value=val;
    const v=document.getElementById('v_'+id); if(v) v.textContent = fmt? fmt(val) : val; };

    if(state.fluxScene==='charge'){ set('nPlus',state.nPlus); set('nMinus',state.nMinus); updateQNote(); }
    else if(state.fluxScene==='magnet'){ set('mTilt',state.magnetTilt); updateMagNote(); }
  } else if(state.mode==='div'){
    set('hL',state.halfL,v=>v.toFixed(2)); set('Px',state.P.x,v=>v.toFixed(2)); set('Py',state.P.y,v=>v.toFixed(2));
  } else if(state.theoremScene==='subdiv'){
    set('N',state.N);
  }
}

        '<li>通量是<b>标量</b>，可正可负：定了面的正方向，正向穿过为正、反向为负</li>'+
        '<li>对<b>闭合面</b>：净通量 = 穿出 − 穿入</li></ul>'+
        '<div class="ex-note">先用四个日常场景建立直觉，再到页签②③看"每一点的通量密度"（散度）与"总量守恒"（散度定理）。</div>'},
      {k:'2', tab:'2. 光与磁的类比', cls:'c2', body:
        '<b>① 灯笼（光通量）：</b>灯笼里有光源，光从里面射出来、<b>穿过灯罩表面</b>，我们才看得见它亮。<br>'+
        '<b>② 瓶子（透光看液面）：</b>没有光时看不清瓶里剩多少；<b>对着光一照</b>，外部光线穿过瓶壁照进去，液面就显出来了 —— 光穿过瓶壁这个面，瓶壁就有光通量。<br>'+
        '<b>③ 发电机（磁通量）：</b>磁铁产生磁场，磁力线穿过线圈围成的面。线圈一转，穿过面的磁力线条数跟着变 —— 这就是磁通量 Φ = B·A·cosθ，也是发电机发电的根源。'+
        '<div class="ex-note">光本身也是电磁波 —— 所以"光通量"和"磁通量 / 电通量"在数学上是同一回事：都是矢量场穿过一个面的通量。</div>'},
      {k:'3', tab:'3. 包围电荷的通量', cls:'c3', body:
        '<b>闭合球面（高斯面）里的净电荷，决定净通量：</b>'+
        '<div class="frm">Φ = ∮<sub>S</sub> @{E}·d@{S} = Q<sub>内</sub> / ε<sub>0</sub></div>'+
        '<ul><li>球内净电荷 <b>Q &gt; 0</b>（正源）→ 场线净穿出 → <b>Φ &gt; 0</b></li>'+
        '<li>球内 <b>Q = 0</b>（正负相等）→ 穿出 = 穿入 → <b>Φ = 0</b></li>'+
        '<li>球内净电荷 <b>Q &lt; 0</b>（负源 / 汇）→ 场线净穿入 → <b>Φ &lt; 0</b></li>'+
        '<li>通量只由<b>球内</b>净电荷决定；球外电荷、以及电荷摆在球内什么位置，都不影响</li></ul>'+
        '<div class="ex-note">这就是高斯定律的雏形 —— 页签③把"通量"和"散度"用闭合面彻底联系起来。</div>'},
    ];
  } else if(state.mode==='div'){
    cards=[
      {k:'1', tab:'1. 散度定义', cls:'c1', body:
        '<b>定义：</b>单位体积的通量（"通量的密度"）'+
        '<div class="frm">∇·@{A} = lim<sub>ΔV→0</sub> ∮<sub>ΔS</sub> @{A}·d@{S} / ΔV</div>'+
        '<ul><li>它是<b>标量</b>，可正可负；正 = 该点是<b>正源</b>（流出 &gt; 流入），负 = 汇</li>'+
        '<li>本演示把小立方体套在 P 点，6 面通量求和 ≈ ∇·A · ΔV</li>'+
        '<li>半边长 l → 0 时，6 面求和 / ΔV 趋近 P 点的<b>真实散度值</b></li></ul>'},
      {k:'2', tab:'2. 直角系计算', cls:'c2', body:
        '<b>直角坐标下的算法：</b>'+
        '<div class="frm">∇·@{A} = ∂A<sub>x</sub>/∂x + ∂A<sub>y</sub>/∂y + ∂A<sub>z</sub>/∂z</div>'+
        '<ul><li>散度是<b>标量场</b>：给空间每一点配一个数</li>'+
        '<li>例：A=(1, 0.4, 0.6) → ∇·A = 0（无源场）</li>'+
        '<li>A=(x, y, z) → ∇·A = 3（处处正源）；A = −(x, y, z) → ∇·A = −3</li></ul>'},
      {k:'3', tab:'3. 用散度算通量', cls:'c3', body:
        '<b>由散度得到通量：</b>均匀场下 净通量 = 散度 × 体积'+
        '<div class="frm">∮<sub>S</sub> @{A}·d@{S} = (∇·@{A}) · V</div>'+
        '<ul><li>演示：小立方体 6 个面的通量相加 ΣΦ ≈ ∇·A · ΔV</li>'+
        '<li>l 越小，ΣΦ / ΔV 越接近真实散度（画布下方读数实时对比）</li></ul>'},
    ];
  } else {
    if(state.theoremScene==='fieldlines'){
      cards=[
        {k:'1', tab:'1. 场线穿闭曲面', cls:'c1', body:
          '<b>净通量 = 穿出 − 穿入：</b>'+
          '<div class="frm">Φ = ∮<sub>S</sub> @{A}·d@{S}</div>'+
          '<ul><li>闭合面内<b>无源</b>：矢量线穿进多少就穿出多少 → 净通量 = 0</li>'+
          '<li>闭合面内<b>有正源</b>：穿出 &gt; 穿入 → 净通量 &gt; 0</li>'+
          '<li>闭合面内有负源（汇）：净通量 &lt; 0</li></ul>'+
          '<div class="ex-note">净通量只看"面内有没有净源"，与面的形状无关。</div>'},
        {k:'2', tab:'2. 高斯散度定理', cls:'c3', body:
          '<b>高斯散度定理</b>：闭合面通量 = 体积内散度的积分'+
          '<div class="frm">∮<sub>S</sub> @{A}·d@{S} = ∫<sub>V</sub> ∇·@{A} dV</div>'+
          '<div class="ex-note">它把"面上的通量"折算成"体积里的源强总和"。切到「立方体剖分」看它是怎么成立的。</div>'},
      ];
    } else {
      cards=[
        {k:'1', tab:'1. 剖分思想', cls:'c1', body:
          '<b>把大闭合面里的体积切成 N×N×N 个小体元：</b>'+
          '<ul><li>每个体元都有自己的 6 个面</li>'+
          '<li><b>相邻体元的公共面</b>上，两侧法矢相反 → 通量一正一负，<b>相互抵消</b></li>'+
          '<li>只有<b>最外壳面</b>没有配对面，净通量被保留下来</li></ul>'+
          '<div class="frm">Σ（体元散度 × 体积） = 外壳净通量</div>'},
        {k:'2', tab:'2. 定理与验证', cls:'c3', body:
          '<b>高斯散度定理：</b>'+
          '<div class="frm">∮<sub>S</sub> @{A}·d@{S} = ∫<sub>V</sub> ∇·@{A} dV</div>'+
          '<ul><li>以中央源场 A=(x,y,z) 为例：∇·A = 3（常数），半边长 1 的立方体 V = 8 → ∮ = 24</li>'+
          '<li>切 8 个体元：每个 ∇·A·ΔV = 3 × 1 = 3，累加 = 24 ✓</li>'+
          '<li>切得越细（N 越大），数值误差越小</li></ul>'+
          '<div class="ex-note">画布下方读数同时给出<b>外壳通量</b> ∮ 与<b>体元散度累加</b> ∫，两者应相等（误差 ≈ 0）。</div>'},
      ];
    }
  }
  if(!cards.find(c=>c.k===state.cardTab)) state.cardTab='1';
  const cur=cards.find(c=>c.k===state.cardTab);
  sec.appendChild(h('<div class="ex-title">公式与解读</div>'+
    '<div class="card-tabs">'+cards.map(c=>'<button class="card-tab '+c.cls+(c.k===state.cardTab?' on':'')+'" data-k="'+c.k+'">'+c.tab+'</button>').join('')+'</div>'+
    '<div class="card-body '+cur.cls+'"><div class="ex-body">'+richHTML(cur.body)+'</div></div>'));
  sec.querySelectorAll('.card-tab').forEach(b=>{ b.onclick=()=>{ state.cardTab=b.dataset.k; renderPanel(); }; });
}

function renderPanel(){
  ['subSec','sliderSec','explainSec'].forEach(id=>{ const el=document.getElementById(id); if(el) el.remove(); });
  const mk=id=>{ const d=document.createElement('div'); d.className='panel-sec'; d.id=id; return d; };
  let togsec=document.getElementById('toggleSec');
  if(!togsec){
    togsec=mk('toggleSec');
    togsec.appendChild(h('<label class="readout-toggle"><input type="checkbox" id="showReadoutCb"'+
      (state.showReadout?' checked':'')+'><span>在<b>画布下方</b>显示<b>实时数据</b>条</span></label>'));
    togsec.querySelector('#showReadoutCb').onchange=e=>{ state.showReadout=e.target.checked; updateReadout(); };
    panel.appendChild(togsec);
  }else{ togsec.querySelector('#showReadoutCb').checked=state.showReadout; }
  const ssec=mk('subSec'), slsec=mk('sliderSec'), esec=mk('explainSec');
  panel.appendChild(ssec); panel.appendChild(slsec); panel.appendChild(esec);
  renderSubSec(ssec); renderSliders(slsec); renderExplain(esec);
  updateReadout(); updateModeTag();
}

/* ---------------- 读数 / 提示 ---------------- */
function updateReadout(){
  const strip=document.getElementById('coordStrip');
  if(!strip) return;
  if(!state.showReadout){ strip.innerHTML=''; return; }
  let html='';
  const lgTitle=document.getElementById('lgTitle'), lgNote=document.getElementById('lgNote');
  if(state.mode==='flux'){
    if(state.fluxScene==='lantern'){
      html += kchip('场景 =','灯笼 · 光通量');
      html += kchip('光照 =', state.show.light?'开':'关', state.show.light?'acc':'warn');
      html += kchip('穿过灯罩 =', state.show.light?'Φ > 0':'Φ = 0（不透光）', state.show.light?'acc':'warn');
      lgTitle.textContent='通量 · 光通量';
      lgNote.textContent= state.show.light? '光源在灯罩内，光穿过灯罩表面射出' : '关灯：灯罩不透光，光出不来，外面是暗的';
    } else if(state.fluxScene==='bottle'){
      html += kchip('场景 =','瓶子 · 透光看液面');
      html += kchip('光照 =', state.show.light?'开':'关', state.show.light?'acc':'warn');
      if(state.show.light){
        html += kchip('光穿入瓶壁 =','Φ ≠ 0','acc');
        html += kchip('液面 =','看得清');
        lgTitle.textContent='通量 · 光穿入瓶壁';
        lgNote.textContent='光穿过瓶壁照进液体，于是看得见液面还剩多少';
      }else{
        html += kchip('光穿入瓶壁 =','Φ = 0','warn');
        html += kchip('液面 =','看不清','warn');
        lgTitle.textContent='通量 · 无光穿入';
        lgNote.textContent='关灯：瓶身不透光，瓶里看不见 → 液面不显形';
      }
    } else if(state.fluxScene==='magnet'){
      const th=state.magnetTilt, cos=Math.cos(th*Math.PI/180);
      html += kchip('场景 =','发电机 · 磁通量');
      html += kchip('线圈转角 θ =', th+'°');
      html += kchip('Φ = B·A·cosθ =', cos.toFixed(2)+' Φmax','acc');
      lgTitle.textContent='通量 · 磁通量（发电机）'; lgNote.textContent='磁力线穿过线圈面：穿过的条数 = 磁通量';
    } else {
      const np=state.nPlus, nm=state.nMinus, Q=np-nm;
      html += kchip('球内 ＋q / −q =', np+' / '+nm);
      html += kchip('净电荷 Q =', ((Q>0?'+':'')+Q)+'q');
      html += kchip('Φ = Q/ε₀', Q>0?'> 0':(Q<0?'< 0':'= 0'), Q>0?'acc':(Q<0?'warn':''));
      lgTitle.textContent='通量 · 包围电荷的球面'; lgNote.textContent='闭合面内的净电荷决定净通量：Φ = Q内/ε₀';
    }
  } else if(state.mode==='div'){
    const l=state.halfL, V=(2*l)*(2*l)*(2*l);
    const faces=[pt(1,0,0),pt(-1,0,0),pt(0,1,0),pt(0,-1,0),pt(0,0,1),pt(0,0,-1)];
    const P=pt(state.P.x, state.P.y, 0);
    let sum=0;
    faces.forEach(n=>{ const fc=vadd(P,vmul(n,l)); sum += vdot(field()(fc), n)*V; });
    html += kchip('P =', '('+P.x.toFixed(2)+', '+P.y.toFixed(2)+', 0)');
    html += kchip('小立方体边 =', (2*l).toFixed(2));
    html += kchip('ΣΦ ≈', sum.toFixed(3), 'acc');
    html += kchip('∇·@{A}·ΔV =', (divF()*V).toFixed(3), 'acc');
    lgTitle.textContent='散度的极限定义';
    lgNote.textContent='l → 0 时 ΣΦ/ΔV 趋近 ∇·A(P)';
  } else {
    if(state.theoremScene==='fieldlines'){
      const V=4/3*Math.PI*0.85*0.85*0.85;
      html += kchip('矢量场 =', richHTML(FIELD_OPTS[state.field-1].label));
      html += kchip('∇·@{A} =', divF());
      html += kchip('净通量 Φ =', (divF()*V).toFixed(3), 'acc');
      lgTitle.textContent='通量 · 闭合曲面';
      lgNote.textContent='净通量 Φ = ∮A·dS = (∇·A)·V';
    } else {
      const N=state.N, l=CUBE_L/N;
      const dV=(2*l)*(2*l)*(2*l);
      const sumInt = divF() * dV * N*N*N;
      const A=field();
      let sumSurf=0;
      for(let i=0;i<N;i++) for(let j=0;j<N;j++) for(let k=0;k<N;k++){
        const cx=(i+0.5)/N - 0.5, cy=(j+0.5)/N - 0.5, cz=(k+0.5)/N - 0.5;
        const P=pt(cx,cy,cz);
        const dirs=[pt(+1,0,0),pt(-1,0,0),pt(0,+1,0),pt(0,-1,0),pt(0,0,+1),pt(0,0,-1)];
        dirs.forEach(n=>{
          const fc=vadd(P, vmul(n,l));
          const Phi=vdot(A(fc), n)*dV;
          const ni=i+(n.x?Math.sign(n.x):0), nj=j+(n.y?Math.sign(n.y):0), nk=k+(n.z?Math.sign(n.z):0);
          if(!(ni>=0&&ni<N&&nj>=0&&nj<N&&nk>=0&&nk<N)) sumSurf+=Phi;
        });
      }
      html += kchip('场 '+richHTML('@{A}')+' =', richHTML(FIELD_OPTS[state.field-1].label.replace(/_o|_g|_p/g,'')));
      html += kchip('∇·@{A} =', divF());
      html += kchip('N =', N+'×'+N+'×'+N+'='+N*N*N);
      html += kchip('∮<sub>S</sub> @{A}·d@{S} =', sumSurf.toFixed(3), 'acc');
      html += kchip('∫<sub>V</sub> ∇·@{A} dV =', sumInt.toFixed(3), 'acc');
      const err = sumSurf-sumInt;
      html += kchip('误差 =', err.toFixed(3), Math.abs(err)<0.05?'':'warn');
      lgTitle.textContent='散度定理 · '+N+'×'+N+'×'+N+' 剖分';
      lgNote.textContent='内部相邻面 ±Φ 自动抵消，仅外壳净通量保留';
    }
  }
  strip.innerHTML=html;
}
function updateModeTag(){
  const t=document.getElementById('modeTag');
  const sub=document.getElementById('moduleSub');
  if(state.mode==='flux'){
    t.innerHTML={lantern:'通量 · 灯笼（光通量）', bottle:'通量 · 瓶子（透光看液面）',
      magnet:'通量 · 发电机（磁通量）', charge:'通量 · 包围电荷的球面（电通量）'}[state.fluxScene];
    sub.textContent='凡"穿过"即有通量：光通量 / 磁通量 / 电通量';
  } else if(state.mode==='div'){
    t.innerHTML='散度定义 · l='+state.halfL.toFixed(2)+'（越小越接近真实散度）';
    sub.textContent='小立方体 6 面通量 ≈ ∇·A · ΔV';
  } else if(state.theoremScene==='fieldlines'){
    t.innerHTML='高斯散度定理 · 场线穿闭曲面';
    sub.textContent='净通量 = 穿出 − 穿入，只看面内净源';
  } else {
    t.innerHTML='高斯散度定理 · '+state.N+'×'+state.N+'×'+state.N+' 剖分';
    sub.textContent='体元散度堆叠 = 外壳通量';
  }
}

/* ---------------- 交互 ---------------- */
let drag=null;
function localPos(ev){ const r=canvas.getBoundingClientRect(); return {x:ev.clientX-r.left, y:ev.clientY-r.top}; }
canvas=document.getElementById('cv');
ctx=canvas.getContext('2d');
canvas.addEventListener('pointerdown',ev=>{
  canvas.setPointerCapture(ev.pointerId);
  const m=localPos(ev);
  drag={x:m.x, y:m.y, btn:ev.button, mode:(ev.button===2||ev.ctrlKey)?'pan':'rot'};
  ev.preventDefault();
});
canvas.addEventListener('pointermove',ev=>{
  const m=localPos(ev);
  if(!drag) return;
  const dx=m.x-drag.x, dy=m.y-drag.y; drag.x=m.x; drag.y=m.y;
  if(drag.mode==='pan'){ cam.px+=dx; cam.py+=dy; needsRender=true; }
  else{ cam.az-=dx*0.0075; cam.el=Math.max(-1.45,Math.min(1.45,cam.el+dy*0.0062)); needsRender=true; }
});
canvas.addEventListener('pointerup',()=>{ drag=null; });
canvas.addEventListener('pointercancel',()=>{ drag=null; });
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{ e.preventDefault();
  cam.zoom=Math.max(.45,Math.min(3.2,cam.zoom*(e.deltaY<0?1.09:1/1.09))); needsRender=true; },{passive:false});

/* 工具栏 / 折叠 / 快捷键 */
document.getElementById('btnReset').onclick=()=>{ cam.az=.62;cam.el=.46;cam.zoom=1;cam.px=0;cam.py=0; needsRender=true; };
document.getElementById('btnRotate').onclick=e=>{ state.autoRotate=!state.autoRotate; e.target.classList.toggle('on',state.autoRotate); };
document.getElementById('btnPanReset').onclick=()=>{ cam.px=0;cam.py=0; needsRender=true; };
function bindFold(bid,cls){ document.getElementById(bid).onclick=()=>{
  document.body.classList.toggle(cls); setTimeout(resize,60); setTimeout(resize,260); }; }
bindFold('foldNav','nav-off'); bindFold('foldPanel','panel-off');
document.getElementById('tglNav').onclick=()=>{ document.body.classList.toggle('nav-off'); setTimeout(resize,260); };
document.getElementById('tglPanel').onclick=()=>{ document.body.classList.toggle('panel-off'); setTimeout(resize,260); };
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='['){ document.body.classList.toggle('nav-off'); setTimeout(resize,260); }
  if(e.key===']'){ document.body.classList.toggle('panel-off'); setTimeout(resize,260); }
});

/* modeTabs */
const MT=[
  {k:'flux',    t:'① 通量'},
  {k:'div',     t:'② 散度'},
  {k:'theorem', t:'③ 高斯散度定理'},
];
const modeTabs=document.getElementById('modeTabs');
MT.forEach(m=>{ const b=document.createElement('button'); b.textContent=m.t; b.dataset.k=m.k;
  b.onclick=()=>{ state.mode=m.k; syncModeTabs(); renderPanel(); updateAll(); };
  modeTabs.appendChild(b);
});
function syncModeTabs(){ Array.from(modeTabs.children).forEach(b=>b.classList.toggle('on', b.dataset.k===state.mode)); }

/* 尺寸 */
function resize(){
  const r=canvas.getBoundingClientRect();
  const nw=Math.max(60,Math.round(r.width)), nh=Math.max(60,Math.round(r.height));
  DPR=Math.min(2, window.devicePixelRatio||1);
  if(nw===W && nh===H && canvas.width===Math.round(nw*DPR)) return;
  W=nw; H=nh; canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0); needsRender=true;
}
new ResizeObserver(()=>resize()).observe(canvas);

/* 导航 */
const nav=document.getElementById('nav');
NAV.forEach(g=>{
  nav.appendChild(h('<div class="nav-ch">'+g.ch+'</div>'));
  g.items.forEach(it=>{
    const cls='nav-item'+(it.active?' active':'')+(it.ready?'':' soon');
    const el=h('<a class="'+cls+'" '+(it.href?'href="'+it.href+'"':'')+'><span class="dot"></span>'+it.t+'</a>');
    nav.appendChild(el);
  });
});

/* 启动 */
syncModeTabs();
resize();
renderPanel();
updateAll();
tick();
</script>
