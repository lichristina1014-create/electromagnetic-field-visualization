<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2.2 静电场中的导体 · 电磁场可视化平台</title>
<style>

:root{--teal:#156082;--teal-dark:#0E4A66;--teal-light:#E3EFF4;--orange:#E97132;--orange-light:#FDF0E7;--green:#3E9B4F;--green-light:#EAF5EC;--purple:#9B59B6;--crimson:#D04A3A;--blue:#0F9ED5;--ink:#1F3D4C;--muted:#5F7482;--line:#DCE6EB;--bg:#F2F6F8;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px;}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#2E86AB);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;text-decoration:none;}
header h1{font-size:18px;font-weight:700;letter-spacing:.5px;}
header .sub{font-size:12px;color:var(--muted);margin-top:2px;}
header .badge{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
header .badge .chip{font-size:12px;color:var(--teal);background:var(--teal-light);border:1px solid #C5DEE9;padding:4px 12px;border-radius:20px;white-space:nowrap;}
header .badge .owner{font-size:11px;color:#5C6B73;background:#F4F7F9;border:1px solid #E2E8EC;padding:3px 10px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
header .badge .owner b{color:var(--teal);font-weight:600;letter-spacing:.3px;}
header .badge .owner::before{content:"";display:inline-block;width:5px;height:5px;background:var(--teal);border-radius:50%;}
.layout{display:flex;height:calc(100vh - 76px);}
aside{width:236px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:14px 0;flex-shrink:0;}
aside::-webkit-scrollbar{width:6px;} aside::-webkit-scrollbar-thumb{background:#D5E0E6;border-radius:3px;}
.nav-ch{font-size:12px;color:var(--muted);padding:12px 18px 6px;font-weight:600;letter-spacing:.5px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 18px;font-size:13.5px;cursor:pointer;color:#3D5A68;border-left:3px solid transparent;transition:background .15s;text-decoration:none;}
.nav-item:hover{background:#F5F9FB;}
.nav-item.active{background:var(--teal-light);color:var(--teal-dark);font-weight:600;border-left-color:var(--teal);}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:#C6D4DB;flex-shrink:0;}
.nav-item.active .dot{background:var(--teal);}
.nav-item.soon{color:#A5B6C0;cursor:not-allowed;}
.nav-item.soon .dot{background:#E1E9ED;}
.nav-item.soon::after{content:"建设中";font-size:10px;color:#B7C6CE;margin-left:auto;border:1px solid #DCE6EB;border-radius:8px;padding:1px 6px;}
main{flex:1;display:flex;flex-direction:column;padding:14px 16px 12px;overflow:hidden;min-width:0;}
.module-head{display:flex;align-items:center;gap:16px;margin-bottom:10px;flex-wrap:wrap;}
.module-title{font-size:17px;font-weight:700;}
.module-title small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px;}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap;}
.seg button{border:none;background:transparent;padding:7px 15px;font-size:13px;border-radius:8px;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .15s;white-space:nowrap;}
.seg button:hover{color:var(--teal);}
.seg button.on{background:var(--teal);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(21,96,130,.3);}
.content-row{flex:1;display:flex;gap:14px;min-height:0;}
.canvas-card{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(30,60,80,.05);}
#cv{width:100%;flex:1;min-height:0;min-width:0;display:block;cursor:grab;touch-action:none;}
#cv:active{cursor:grabbing;}
.cv-toolbar{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:5;}
.cv-toolbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;backdrop-filter:blur(4px);transition:all .15s;}
.cv-toolbar button:hover{color:var(--teal);border-color:var(--teal);}
.cv-toolbar button.on{background:var(--teal);color:#fff;border-color:var(--teal);}
.cv-mode-tag{position:absolute;top:12px;left:12px;font-size:12px;color:var(--teal-dark);background:rgba(227,239,244,.92);border:1px solid #C9E0EA;border-radius:8px;padding:5px 12px;z-index:4;pointer-events:none;font-weight:600;max-width:56%;}
aside,.panel{transition:width .22s ease,padding .22s ease,border-width .22s ease;}
body.nav-off aside{width:0;padding-top:0;padding-bottom:0;border-right-width:0;overflow:hidden;}
body.panel-off .panel{width:0;border-left-width:0;border-right-width:0;overflow:hidden;}
.fold-handle{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:15px;height:58px;padding:0;line-height:1;border:1px solid var(--line);background:rgba(255,255,255,.94);color:#A3B7C2;font-size:11px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:all .15s;}
.fold-handle:hover{color:var(--teal);border-color:var(--teal);background:#fff;}
#foldNav{left:0;border-left:none;border-radius:0 9px 9px 0;}
#foldPanel{right:0;border-right:none;border-radius:9px 0 0 9px;}
.view-toggles{display:flex;gap:6px;margin-right:6px;}
.view-toggles button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;}
.view-toggles button:hover{border-color:var(--teal);color:var(--teal);}
.view-toggles button.on{background:var(--teal);color:#fff;border-color:var(--teal);}
.cv-pan-tag{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:6;font-size:11.5px;color:#8A5A20;background:rgba(255,248,236,.95);border:1px solid #E7C48F;border-radius:8px;padding:5px 12px;display:none;align-items:center;gap:8px;}
.cv-pan-tag.show{display:flex;}
.cv-pan-tag button{border:1px solid #E0BE8C;background:#fff;border-radius:6px;padding:2px 9px;font-size:11.5px;color:#8A5A20;cursor:pointer;font-family:inherit;}
.cv-pan-tag button:hover{background:#8A5A20;color:#fff;border-color:#8A5A20;}
.cv-legend{position:absolute;bottom:14px;right:14px;z-index:5;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:9px;padding:7px 11px 8px;font-size:11px;color:var(--muted);backdrop-filter:blur(4px);pointer-events:none;min-width:130px;}
.cv-legend .lg-t{font-size:11px;color:var(--ink);font-weight:600;margin-bottom:5px;}
.cv-legend .lg-note{font-size:10.5px;color:var(--muted);line-height:1.55;margin-top:4px;}
.coord-strip{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#FBFDFE;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;}
.coord-strip::-webkit-scrollbar{height:5px;}
.coord-strip::-webkit-scrollbar-thumb{background:#D5E0E6;border-radius:3px;}
.coord-strip:empty{padding:0;border-top:none;}
.coord-chip{font-size:12px;color:var(--muted);background:#F3F8FA;border:1px solid #E2ECF1;border-radius:8px;padding:5px 12px;white-space:nowrap;}
.coord-chip b{color:var(--teal-dark);font-weight:600;margin-left:5px;font-family:Menlo,monospace;}
.coord-chip i{font-style:italic;font-family:Georgia,serif;color:var(--ink);}
.coord-chip.acc{background:#F5F0FA;border-color:#E2D4F0;}
.coord-chip.acc b{color:#6B4E8A;}
.coord-chip.warn{background:#FFF6EC;border-color:#F3DCC0;}
.coord-chip.warn b{color:#B26A1E;}
.panel{width:398px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow-y:auto;box-shadow:0 1px 4px rgba(30,60,80,.05);}
.panel::-webkit-scrollbar{width:6px;} .panel::-webkit-scrollbar-thumb{background:#D5E0E6;border-radius:3px;}
.panel-sec{padding:14px 16px;border-bottom:1px solid #EEF3F6;}
.panel-sec:last-child{border-bottom:none;}
.readout-toggle{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:12px;background:#F3F8FA;border:1px solid #E2ECF1;border-radius:8px;cursor:pointer;font-size:12.5px;line-height:1.5;color:var(--muted);}
.readout-toggle:hover{border-color:#C6DAE3;background:#EDF4F7;}
.readout-toggle input{accent-color:var(--teal);cursor:pointer;margin:0;}
.readout-toggle b{color:var(--ink);}
.sec-title{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sec-title::before{content:"";width:3px;height:12px;background:var(--teal);border-radius:2px;}
.sub-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 13px;font-size:12.5px;line-height:1.5;cursor:pointer;font-family:inherit;color:var(--muted);transition:all .15s;}
.chip:hover{border-color:var(--teal);color:var(--teal);}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
.chip.pre{border-style:dashed;border-color:#C9D6DD;color:#7A8F9B;}
.chip.pre:hover{border-color:var(--orange);color:var(--orange);background:#FFF8F2;}
.chip.g.on{background:var(--green);border-color:var(--green);}
.chip.o.on{background:var(--orange);border-color:var(--orange);}
.chip.p.on{background:var(--purple);border-color:var(--purple);}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.slider-row label{width:46px;font-size:13px;font-style:italic;font-family:Georgia,serif;color:var(--ink);text-align:right;flex-shrink:0;}
.slider-row.w label{width:62px;font-style:normal;font-family:inherit;}
.slider-row input[type=range]{flex:1;accent-color:var(--teal);height:4px;cursor:pointer;}
.slider-row .val{width:62px;font-size:12px;color:var(--muted);font-family:Menlo,monospace;flex-shrink:0;}
.ex-title{font-size:14.5px;font-weight:700;color:var(--teal-dark);margin-bottom:8px;line-height:1.45;}
.ex-body{font-size:14px;line-height:1.7;color:#3A5462;}
.ex-body b{color:var(--ink);}
.ex-body ul{padding-left:18px;margin:6px 0;}
.ex-body li{margin-bottom:3px;}
.ex-note{font-size:12.5px;line-height:1.65;color:#6B8290;background:#F7FAFB;border:1px solid #E7EFF3;border-radius:8px;padding:8px 11px;margin-top:9px;}
.frm{display:block;background:#F4F9FB;border:1px solid #DDE9EF;border-left:3px solid var(--teal);border-radius:8px;padding:10px 14px 10px 18px;margin:10px 0;font-size:14px;line-height:1.7;font-family:Georgia,"Times New Roman",serif;color:var(--ink);overflow-x:auto;white-space:nowrap;}
.vec{position:relative;font-style:italic;font-weight:700;white-space:nowrap;}
.vec::before,.vec::after{content:'';position:absolute;pointer-events:none;}
.vec::before{left:0;right:.24em;top:-.28em;height:1px;background:currentColor;opacity:.9;}
.vec::after{right:0;top:-.42em;width:0;height:0;border-left:.26em solid currentColor;border-top:.14em solid transparent;border-bottom:.14em solid transparent;}
sub{font-size:.72em;vertical-align:-.24em;}
.vec sub{font-style:normal;font-weight:600;}
.sqrt{display:inline-block;position:relative;padding-left:.62em;margin-left:.05em;font-style:normal;}
.sqrt::before{content:"√";position:absolute;left:.02em;top:-.12em;font-size:1.1em;font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",Georgia,serif;}
.sqrt .in{display:inline-block;border-top:1.15px solid currentColor;padding:.10em .06em .02em .06em;border-radius:4px 4px 0 0;line-height:1.1;}
.card-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px;}
.card-tab{cursor:pointer;font-family:inherit;font-size:12.5px;padding:5px 9px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);transition:all .15s;line-height:1.4;white-space:nowrap;flex:1;text-align:center;min-width:0;}
.card-tab:hover{border-color:var(--teal);color:var(--teal);}
.card-tab.c1.on{background:#156082;border-color:#156082;color:#fff;font-weight:600;}
.card-tab.c2.on{background:#0F9ED5;border-color:#0F9ED5;color:#fff;font-weight:600;}
.card-tab.c3.on{background:#E97132;border-color:#E97132;color:#fff;font-weight:600;}
.card-tab.c4.on{background:#9B59B6;border-color:#9B59B6;color:#fff;font-weight:600;}
.card-body{background:#FCFEFE;border:1px solid #E2ECF1;border-radius:8px;padding:12px 16px 8px;border-left:4px solid var(--teal);}
.card-body.c1{border-left-color:#156082;} .card-body.c2{border-left-color:#0F9ED5;}
.card-body.c3{border-left-color:#E97132;} .card-body.c4{border-left-color:#9B59B6;}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(31,61,76,.94);color:#fff;font-size:13px;padding:9px 20px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;}
#toast.show{opacity:1;}

/* 2.1 追加：滑块分组标签（1.3 有定义、1.5 漏了，这里补齐） */
.slider-group-label{font-size:12px;font-weight:600;color:var(--crimson);margin:4px 0 8px;}
.slider-group-label.q{color:var(--blue);}
.slider-group-label.g{color:var(--green);}
.slider-group-label.o{color:var(--orange);}
/* 2.1 追加：画布内小面板（1/R² 曲线 / 收敛曲线）的标题用不着额外样式，坐标条已够 */
</style>

<script>
'use strict';
/* ============================== 向量工具 ============================== */
const pt=(x,y,z)=>({x,y,z});
const vadd=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z});
const vsub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z});
const vmul=(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s});
const vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const vlen=a=>Math.hypot(a.x,a.y,a.z);
const vnorm=a=>{const l=vlen(a)||1;return vmul(a,1/l);};
const vcross=(a,b)=>({x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x});
const D2R=Math.PI/180, R2D=180/Math.PI;

/* ============================== 富文本引擎（同源） ============================== */
function parseRich(s){
  const items=[], groups=[]; const st={g:-1};
  (function walk(str){
    let buf='';
    const flush=()=>{ if(buf){ items.push({t:'n',s:buf,g:st.g}); buf=''; } };
    for(let i=0;i<str.length;){
      const c=str[i];
      if(c==='@' && str[i+1]==='{'){
        const j=str.indexOf('}', i+2);
        if(j<0){ buf+=c; i++; continue; }
        flush();
        const save=st.g; st.g=groups.length; groups.push(1);
        walk(str.slice(i+2,j)); st.g=save; i=j+1; continue;
      }
      if(c==='_'){
        flush();
        if(str[i+1]==='{'){ const j=str.indexOf('}',i+2);
          if(j>=0){ items.push({t:'s',s:str.slice(i+2,j),g:st.g}); i=j+1; continue; } }
        items.push({t:'s',s:str[i+1]||'',g:st.g}); i+=2; continue;
      }
      if(c==='<'){ const j=str.indexOf('>',i);
        if(j>=0){ buf+=str.slice(i,j+1); i=j+1; continue; } }
      buf+=c; i++;
    }
    flush();
  })(String(s));
  return {items, groups};
}
const RICHFONT='"PingFang SC","Microsoft YaHei",sans-serif';
const RICHFONT_M='Georgia,"Times New Roman",serif';
function richLayout(ctx,rich,size,bold){const subSize=size*0.74;const wM=bold?'700 ':'';const fN=wM+size+'px '+RICHFONT;const fNs=wM+subSize+'px '+RICHFONT;const fV='italic '+wM+size+'px '+RICHFONT_M;const fVs=wM+subSize+'px '+RICHFONT_M;const groups=rich.groups.map(()=>({x0:1e9,x1:-1e9,locked:false,top:1e9}));const out=[];let x=0;const oldBL=ctx.textBaseline;ctx.textBaseline='middle';rich.items.forEach(it=>{const sub=it.t==='s',vec=it.g>=0;const font=sub?(vec?fVs:fNs):(vec?fV:fN);ctx.font=font;const m=ctx.measureText(it.s),w=m.width;const dy=sub?size*0.20:0;const asc=(m.actualBoundingBoxAscent!=null)?m.actualBoundingBoxAscent:size*0.38;if(vec){const g=groups[it.g];if(!g.locked){if(sub)g.locked=true;else{if(x<g.x0)g.x0=x;g.x1=x+w;}}const top=dy-asc;if(top<g.top)g.top=top;}out.push({s:it.s,sub,x,w,font,dy});x+=w;});ctx.textBaseline=oldBL;return{items:out,groups,w:x,size,subSize};}
function richDraw(ctx,lo,cx,cy,align,color){let ox=align==='center'?cx-lo.w/2:align==='right'?cx-lo.w:cx;const dy=it=>cy+it.dy;const ay=g=>cy+g.top-Math.max(2.2,lo.size*0.13);const span=g=>[ox+g.x0-0.6,ox+g.x1+0.6];ctx.save();ctx.textAlign='left';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineCap='butt';ctx.lineWidth=3.4;ctx.strokeStyle='rgba(255,255,255,.92)';lo.items.forEach(it=>{ctx.font=it.font;ctx.strokeText(it.s,ox+it.x,dy(it));});lo.groups.forEach(g=>{if(g.x1<=g.x0)return;const y=ay(g),s=span(g);ctx.beginPath();ctx.moveTo(s[0],y);ctx.lineTo(s[1],y);ctx.stroke();});lo.groups.forEach(g=>{if(g.x1<=g.x0)return;const y=ay(g),s=span(g),ax=s[0],bx=s[1];ctx.strokeStyle=color;ctx.lineWidth=1.15;ctx.beginPath();ctx.moveTo(ax,y);ctx.lineTo(bx-1.2,y);ctx.stroke();const h=Math.min(3.6,Math.max(2.6,(bx-ax)*0.40));ctx.beginPath();ctx.moveTo(bx,y);ctx.lineTo(bx-h,y-h*0.52);ctx.lineTo(bx-h,y+h*0.52);ctx.closePath();ctx.fillStyle=color;ctx.fill();});lo.items.forEach(it=>{ctx.font=it.font;ctx.fillStyle=color;ctx.fillText(it.s,ox+it.x,dy(it));});ctx.restore();}
function richHTML(s){const r=parseRich(s);let h='',gi=-1;r.items.forEach(it=>{const body=it.t==='s'?'<sub>'+it.s+'</sub>':it.s;if(it.g!==gi){if(gi>=0)h+='</span>';if(it.g>=0)h+='<span class="vec">';gi=it.g;}h+=body;});if(gi>=0)h+='</span>';return wrapSqrt(h);}
function wrapSqrt(html){const out=[];let i=0;while(i<html.length){const k=html.indexOf('√(',i);if(k<0){out.push(html.slice(i));break;}out.push(html.slice(i,k));out.push('<span class="sqrt"><span class="in">');let j=k+2,depth=1;while(j<html.length&&depth>0){const c=html[j];if(c==='(')depth++;else if(c===')'){depth--;if(depth===0)break;}j++;}if(depth!==0){out.push(html.slice(k));return out.join('');}out.push(html.slice(k+2,j));out.push('</span></span>');i=j+1;}return out.join('');}

/* ============================== 颜色 / 相机 / 图元 ============================== */
const C = {teal:'#156082',orange:'#E97132',green:'#3E9B4F',purple:'#9B59B6',crimson:'#D04A3A',blue:'#0F9ED5',gray:'#8CA0AC',light:'#C9D6DD',ink:'#22414F',grid:'#EAF0F4',muted:'#7A8F9B'};

let canvas,ctx,W=800,H=600,DPR=1;
const cam={az:0.62,el:0.46,zoom:1,px:0,py:0};
let camU,camV,camD,camScale,CX2,CY;
function setupCamera(){const ca=Math.cos(cam.az),sa=Math.sin(cam.az);const ce=Math.cos(cam.el),se=Math.sin(cam.el);camD={x:ce*ca,y:ce*sa,z:se};camU={x:-sa,y:ca,z:0};camV={x:-ca*se,y:-sa*se,z:ce};camScale=Math.min(W,H)/3.2*cam.zoom;CX2=W/2;CY=H*0.55;}
function pr(p){return{x:CX2+cam.px+camScale*vdot(p,camU),y:CY+cam.py-camScale*vdot(p,camV),d:vdot(p,camD)};}

let prims=[];
function P_(z,fn){prims.push({z,draw:fn});}
/* ⚠️ 各图元的 o.z：**可选**覆盖画家算法的深度。半透明壳体（等位面）会横跨一大段
   深度，凡是"必须始终看得清"的标注（P、θ/φ 角弧、E 箭头）都要显式抬到壳体之上，
   否则它们会被自己所在的球面那层 Fresnel 厚边洗掉。默认 0 / +1e4 一段留空，互不打架。 */
function line(a,b,o={}){const A=pr(a),B=pr(b);P_(o.z!=null?o.z:(A.d+B.d)/2,()=>{ctx.save();ctx.globalAlpha=o.alpha!=null?o.alpha:1;ctx.strokeStyle=o.color||C.gray;ctx.lineWidth=o.w||1.4;if(o.dash)ctx.setLineDash(o.dash);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.restore();});}
function arrowSeg(A,B,color,w,headScale){const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);if(L<0.5)return;const ux=dx/L,uy=dy/L,hs=(headScale||1)*9;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x-ux*hs*.55,B.y-uy*hs*.55);ctx.stroke();const ang=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(B.x,B.y);ctx.lineTo(B.x-hs*Math.cos(ang-.42),B.y-hs*Math.sin(ang-.42));ctx.lineTo(B.x-hs*Math.cos(ang+.42),B.y-hs*Math.sin(ang+.42));ctx.closePath();ctx.fillStyle=color;ctx.fill();}
function arrow(a,b,o={}){const A=pr(a),B=pr(b);P_(o.z!=null?o.z:(A.d+B.d)/2,()=>{ctx.save();ctx.globalAlpha=o.alpha!=null?o.alpha:1;if(o.dash)ctx.setLineDash(o.dash);arrowSeg(A,B,o.color||C.teal,o.w||2,o.headScale);ctx.restore();});if(o.label)text(vmul(vadd(a,b),.5),o.label,{color:o.color||C.teal,dx:o.ldx||0,dy:o.ldy!==undefined?o.ldy:-10,size:o.lsize||12.5,bold:true,align:o.lalign,alpha:o.alpha});}
function curve(ptsArr,o={}){if(ptsArr.length<2)return;const S=ptsArr.map(pr);P_(o.z!=null?o.z:S.reduce((s,p)=>s+p.d,0)/S.length,()=>{ctx.save();ctx.globalAlpha=o.alpha!=null?o.alpha:1;ctx.strokeStyle=o.color||C.gray;ctx.lineWidth=o.w||1.8;ctx.lineCap='round';if(o.dash)ctx.setLineDash(o.dash);ctx.beginPath();ctx.moveTo(S[0].x,S[0].y);for(let i=1;i<S.length;i++)ctx.lineTo(S[i].x,S[i].y);ctx.stroke();if(o.arrowEnd){const a=S[S.length-2],b=S[S.length-1];ctx.setLineDash([]);arrowSeg(a,b,o.color||C.gray,o.w||1.8,.75);}ctx.restore();});}
function poly(ptsArr,o={}){if(ptsArr.length<3)return;const S=ptsArr.map(pr);P_(o.z!=null?o.z:S.reduce((s,p)=>s+p.d,0)/S.length,()=>{ctx.save();ctx.beginPath();ctx.moveTo(S[0].x,S[0].y);for(let i=1;i<S.length;i++)ctx.lineTo(S[i].x,S[i].y);ctx.closePath();if(o.fill){ctx.globalAlpha=o.fillAlpha!=null?o.fillAlpha:.15;ctx.fillStyle=o.fill;ctx.fill();}if(o.stroke!==false){ctx.globalAlpha=o.strokeAlpha!=null?o.strokeAlpha:(o.fillAlpha!=null?o.fillAlpha:1);ctx.strokeStyle=o.stroke||o.fill||C.gray;ctx.lineWidth=o.w||1;if(o.dash)ctx.setLineDash(o.dash);ctx.stroke();}ctx.restore();});}
function marker(p,o={}){
  const S=pr(p);
  P_(o.z!=null?o.z:S.d+0.02, ()=>{ ctx.save();
    ctx.globalAlpha=o.alpha!=null?o.alpha:1;
    ctx.beginPath(); ctx.arc(S.x,S.y,o.r||5,0,7);
    ctx.fillStyle=o.color||C.orange; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
    if(o.ring){ ctx.beginPath(); ctx.arc(S.x,S.y,(o.r||5)+4,0,7);
      ctx.strokeStyle=o.ring; ctx.lineWidth=2.2; ctx.stroke(); }
    ctx.restore(); });
  if(o.label) text(p, o.label, {color:o.color||C.orange,
    dx:o.ldx!=null?o.ldx:10, dy:o.ldy!=null?o.ldy:-10, size:o.lsize||13, bold:true, align:o.lalign, alpha:o.alpha});
}
function text(p,str,o={}){const S=pr(p);P_(1e6,()=>{ctx.save();if(o.alpha!=null)ctx.globalAlpha*=o.alpha;const size=o.size||12.5,bold=!!o.bold;const lo=richLayout(ctx,parseRich(str),size,bold);richDraw(ctx,lo,S.x+(o.dx||0),S.y+(o.dy||0),o.align||'left',o.color||C.ink);ctx.restore();});}
/* 屏幕坐标文本（不随平移缩放跑掉） */
function textScreen(x,y,str,o={}){P_(1e6+1,()=>{ctx.save();if(o.alpha!=null)ctx.globalAlpha*=o.alpha;const lo=richLayout(ctx,parseRich(str),o.size||12,!!o.bold);richDraw(ctx,lo,x,y,o.align||'left',o.color||C.ink);ctx.restore();});}
/* 距离标注（★ 规范：距离一律用 dimLine，绝不用箭头） */
function dimLine(a,b,o={}){
  line(a,b,o);
  const A=pr(a),B=pr(b);
  const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);
  if(L<1)return;
  const px=-dy/L,py=dx/L,t=o.tick||6;
  const tk=P=>{P_(o.z!=null?o.z:(A.d+B.d)/2,()=>{ctx.save();if(o.alpha!=null)ctx.globalAlpha*=o.alpha;ctx.strokeStyle=o.color||C.gray;ctx.lineWidth=o.w||1.4;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(P.x+px*t,P.y+py*t);ctx.lineTo(P.x-px*t,P.y-py*t);ctx.stroke();ctx.restore();});};
  tk(A);tk(B);
  if(o.label)text(vmul(vadd(a,b),.5),o.label,{color:o.color||C.gray,dx:o.ldx||0,dy:o.ldy!==undefined?o.ldy:-10,size:o.lsize||12.5,bold:true,align:o.lalign,alpha:o.alpha});
}
function screenDot(p,rad,fill,alpha,z){const S=pr(p);P_(z!=null?z:S.d+0.02,()=>{ctx.save();ctx.globalAlpha=alpha!=null?alpha:1;ctx.beginPath();ctx.arc(S.x,S.y,rad,0,7);ctx.fillStyle=fill;ctx.fill();ctx.restore();});}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')';}

/* 坐标轴（ext = 轴长） */
function drawAxes(ext){
  if(!state.show.box) return;
  const g=ext*0.86;
  for(let v=-g;v<=g+1e-9;v+=ext*0.30){line(pt(v,-g,-ext*0.86),pt(v,g,-ext*0.86),{color:C.grid,w:1});line(pt(-g,v,-ext*0.86),pt(g,v,-ext*0.86),{color:C.grid,w:1});}
  line(pt(0,0,0),pt(-ext,0,0),{color:'#B9C9D2',dash:[5,4],w:1.2});
  line(pt(0,0,0),pt(0,-ext,0),{color:'#B9C9D2',dash:[5,4],w:1.2});
  line(pt(0,0,0),pt(0,0,-ext),{color:'#B9C9D2',dash:[5,4],w:1.2});
  arrow(pt(0,0,0),pt(ext,0,0),{color:C.teal,w:2});
  arrow(pt(0,0,0),pt(0,ext,0),{color:C.orange,w:2});
  arrow(pt(0,0,0),pt(0,0,ext),{color:C.green,w:2.2});
  text(pt(ext*1.05,0,0),'x',{color:C.teal,bold:true,size:13,dy:-4});
  text(pt(0,ext*1.05,0),'y',{color:C.orange,bold:true,size:13,dy:-4});
  text(pt(0,0,ext*1.05),'z',{color:C.green,bold:true,size:13,dx:-4});
  text(pt(0,0,0),'O',{color:'#7A8F9B',size:12,dx:-13,dy:13});
}

/* ── 已退役：球线框 sphereWireAt + 伪隐线辅助 splitByVis ───────────────────────
   2026-09-23 用户明确否掉「用经线/纬线代替球面」的做法（"学生看不懂，就是一个面"），
   2.1 里最后两处调用（② 过 P 的等位面、③ 带电球轮廓）都已换成 shellBall / ballRim。
   两个函数随即成为死代码，一并删除 —— 留着一个现成的"线球"helper 只会诱导以后
   再犯同一个错。历史与替代方案见 memory/ref-21-field-charge-density.md。 */

/* 球面的剪影圆 —— 正交投影下，球面的轮廓**恰好是一个圆**（圆心 = 球心的投影，
   半径 = R·camScale，与相机方位角、仰角都无关）。所以"球长什么样"这件事，
   在屏幕空间画一个圆最准、最省，也不受 3D 交点计算误差影响。
   参考用的同心球壳只画这个圆（dash 表示"只是刻度"）。
   ⚠️ 深度必须写 `S.d`（pr() 的返回值）—— `pt()` 造的点**没有 .d**，
      写成 c.d 会得到 undefined ⇒ NaN 深度 ⇒ 排序被静默废掉（只靠稳定排序的插入序侥幸看着对）。 */
function ballRim(c,R,hexBase,w,alpha,o){
  if(R<=1e-6) return;
  o=o||{};
  const S=pr(c), rad=R*camScale;
  const aL=Math.atan2(SPH_LY,SPH_LX);
  P_(o.z!=null?o.z:S.d+0.02,()=>{ ctx.save(); ctx.lineCap='round';
    if(o.dash) ctx.setLineDash(o.dash);
    /* ★ 与 shellBall 同一条规矩：拆成受光侧/背光侧两段 ——
       否则一串同心圆是"平面上的圆"，加上明暗才是"退到远处的球"。 */
    ctx.strokeStyle=hexA(hexBase,alpha*0.52); ctx.lineWidth=w||1.3;
    ctx.beginPath(); ctx.arc(S.x,S.y,rad,aL-Math.PI/2,aL+Math.PI/2); ctx.stroke();
    ctx.strokeStyle=hexA(hexBase,alpha); ctx.lineWidth=(w||1.3)*1.3;
    ctx.beginPath(); ctx.arc(S.x,S.y,rad,aL+Math.PI/2,aL+Math.PI*1.5); ctx.stroke();
    ctx.restore(); });
}
/* 半透明球面 —— ★ 球面就画成"一个面"，不再用经线/纬线网格代替（学生读不出网格是球）。
   ★★ 球感（2026-09-23 二次返工，用户反馈"球视觉上看不太出来"）：
   **同心的径向渐变只能做出"一块圆片"** —— 实测整圈边缘 alpha 0.68、中心 0.12，各向同性，
   学生看到的是"描了边的橙圆盘"，不是球。真正让人读成球的是两条**不对称**：
     ① 明暗不对称 —— 光源在屏幕左上方 ⇒ 左上亮、右下厚（叠一层斜向线性渐变）；
     ② 轮廓不对称 —— 受光侧细而淡、背光侧粗而实（把剪影圆拆成两段弧）。
   （透明玻璃壳本身没有强明暗交界，所以斜向那层要克制：体色 alpha 仍在 0.1 量级，
     靠"高光 + 厚壁 + 双色轮廓"三条一起给球感。）
   配方与 1.3 的「半透明玻璃壳」同源（那里已经用过、用户认可），照抄而不是另发明一套：
     ① 背面（z = S.d − R）：极淡的一层体色，靠剪影略厚 —— 透过它才看得见壳里的电荷与场线；
     ② 正面（z = S.d + R）：偏心径向渐变做 Fresnel 厚壁（中心几乎透明 → 掠射边缘陡增）
        + 斜向明暗 + 双瓣镜面高光 + 两段式轮廓；
     ③ 轮廓仍用屏幕空间的剪影圆（正交投影下球面轮廓恰是圆，与相机角无关）。
   ⚠️ 踩过的坑（已用截图确认）：**逐四边形铺半透明色是行不通的**。球面在正交投影下，
   前后两半各自恰好盖满整个圆盘一次 ⇒ 复合透明度处处相等 ⇒ 屏幕上就是一块"橙色圆片"，
   shade() 那点 0.80~1.00 的伪光照调制被 alpha 完全淹没。
   ★ 分层取 ±R（球面真实的前后极值）⇒ 壳内物体（电荷、场线、R 标注）自动落在两层之间
     被罩住 = "包在玻璃球里"；而 P、θ/φ 角弧、E 箭头这些标注用 o.z 显式抬到壳体之上。
   改 R ⇒ 球面整体放大/缩小；改 θ/φ ⇒ 这个球面一动不动。
   emph 强调档（本体/厚壁都加深）；rimA 覆盖厚壁透明度（不给就用强调档默认值）。 */
const SPH_LX=-0.55, SPH_LY=-0.83;   /* 屏幕空间光方向（指向左上方光源，单位向量） */
function shellBall(c,R,hexBase,emph,rimA){
  if(R<=1e-6) return;
  const S=pr(c), rr=R*camScale;
  const aBody=emph?0.085:0.045, aRim=rimA!=null?rimA:(emph?0.46:0.28);
  /* ① 背面：极淡体色，越靠剪影越厚 */
  P_(S.d-R*1.02,()=>{ ctx.save();
    const g=ctx.createRadialGradient(S.x,S.y,rr*0.05,S.x,S.y,rr);
    g.addColorStop(0,hexA(hexBase,aBody*0.50));
    g.addColorStop(1,hexA(hexBase,aBody*1.40));
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,0,7); ctx.fillStyle=g; ctx.fill(); ctx.restore(); });
  /* ② 正面 */
  P_(S.d+R*1.02,()=>{ ctx.save();
    /* 2a 同心 Fresnel：中心高透 → 掠射边缘变厚（终值收到 aRim*0.82，免得整圈太"实"） */
    const g=ctx.createRadialGradient(S.x-rr*0.32,S.y-rr*0.36,rr*0.06,S.x,S.y,rr*1.02);
    g.addColorStop(0,   'rgba(255,255,255,'+(emph?0.20:0.13)+')');
    g.addColorStop(0.44,hexA(hexBase,aBody*0.30));
    g.addColorStop(0.82,hexA(hexBase,aRim*0.30));
    g.addColorStop(1,   hexA(hexBase,aRim*0.82));
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,0,7); ctx.fillStyle=g; ctx.fill();
    /* 2b ★ 斜向明暗：左上传光、右下背光 —— "圆"变"球"的关键一层 */
    const dl=ctx.createLinearGradient(S.x+SPH_LX*rr*0.95, S.y+SPH_LY*rr*0.95,
                                      S.x-SPH_LX*rr*0.95, S.y-SPH_LY*rr*0.95);
    dl.addColorStop(0,   'rgba(255,255,255,'+(emph?0.26:0.17)+')');
    dl.addColorStop(0.46,hexA(hexBase,aBody*0.14));
    dl.addColorStop(1,   hexA(hexBase,aBody*(emph?1.60:1.30)));
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,0,7); ctx.fillStyle=dl; ctx.fill();
    /* 2c 双瓣镜面高光：大而软 + 小而亮（玻璃感） */
    const hx=S.x+SPH_LX*rr*0.40, hy=S.y+SPH_LY*rr*0.44, hr=rr*0.30;
    const gh=ctx.createRadialGradient(hx,hy,0,hx,hy,hr);
    gh.addColorStop(0,'rgba(255,255,255,'+(emph?0.50:0.32)+')');
    gh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.fillStyle=gh; ctx.fill();
    const hx2=S.x+SPH_LX*rr*0.52, hy2=S.y+SPH_LY*rr*0.56, hr2=rr*0.085;
    const gh2=ctx.createRadialGradient(hx2,hy2,0,hx2,hy2,hr2);
    gh2.addColorStop(0,'rgba(255,255,255,'+(emph?0.85:0.55)+')');
    gh2.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(hx2,hy2,hr2,0,7); ctx.fillStyle=gh2; ctx.fill();
    /* 2d ★ 两段式轮廓：受光侧细而淡、背光侧粗而实（同心圆变球面光边） */
    const aL=Math.atan2(SPH_LY,SPH_LX);
    ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,aL-Math.PI/2,aL+Math.PI/2);
    ctx.strokeStyle=hexA(hexBase,aRim*(emph?0.40:0.30));
    ctx.lineWidth=emph?1.4:1.1; ctx.stroke();
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,aL+Math.PI/2,aL+Math.PI*1.5);
    ctx.strokeStyle=hexA(hexBase,aRim*(emph?0.92:0.68));
    ctx.lineWidth=emph?2.5:1.8; ctx.stroke();
    ctx.restore(); });
}

   2.2 静电场中的导体 —— 页面主体（渲染引擎与 2.1 同源，见上方「向量工具 / 图元」段）

   ★ 单位约定（本页特有，全页统一）：
       长度 m　场强 kV/m　电位 kV　面电荷密度 nC/m²　腔内点电荷 µC
     为什么用 kV/m 而不是 2.1 的 V/m：导体在匀强场里的问题，外场量级就是 10³ V/m
     （10 kV/m 只是很普通的一个场），用 kV/m 读数才不至于满屏 4 个零。
     为什么腔内电荷用 µC：1 µC 在 1 m 处恰好产生 8.99 kV/m —— 与「外场 10 kV/m」同量级。
     若仍用 nC，电荷的场会比外场小 6 个量级，画在同一张图里整个被淹没。

   ★★ 全页用**严格解析解**，不做数值采样（这是本页最重要的技术决定）：
       导体球（半径 a）放进匀强外场 E₀ẑ，取导体电位为 0
         V(r,θ) = −E₀(r − a³/r²)·cosθ   (r ≥ a)      V ≡ 0  (r ≤ a)
         E_r    =  E₀(1 + 2a³/r³)·cosθ                E ≡ 0  (r ≤ a)
         E_θ    = −E₀(1 −   a³/r³)·sinθ
         σ(θ)   = ε₀·E_n|表面 = 3ε₀E₀·cosθ
       三条教学结论因此是**恒等式**而不是近似，自检可以直接钉死：
         ① r ≤ a 时 |E| ≡ 0（严格 0，不是"很小"）
         ② r = a 时 E_θ ≡ 0 ⇒ 表面场严格沿法向
         ③ V(a,θ) ≡ 0（任意 θ）⇒ 导体是等位体、表面是等位面
   ============================================================================ */

/* ============================== 物理常数与几何 ============================== */
const EPS0  = 8.8541878128e-12;          /* 真空介电常数 F/m */
const A_C   = 0.80;                      /* 导体球半径 m */
const B_C   = 0.52;                      /* 空腔球壳内半径 m（③ 静电屏蔽） */
/* σ[nC/m²] = 3ε₀E₀·cosθ，E₀ 取 kV/m ⇒ 3·8.854e-12·1e3·1e9 = 26.56256… */
const SIG_K = 3*EPS0*1e3*1e9;
/* 点电荷：q 取 µC、r 取 m ⇒ E[kV/m] = Q_KV·q/r²，Q_KV = 1e-6/(4πε₀)/1e3 = 8.9875517873… */
const Q_KV  = 1e-6/(4*Math.PI*EPS0)/1e3;
/* ★ E 矢量的显示长度（世界米）：**线性 + 上下限钳制**，与 2.1 的 LE 同构。
   ⚠️ 绝不能用固定的 "m per (kV/m)"：|E| 在球面上跨 0 → 3E₀（赤道 0、两极 30），
      固定比例下若要两极不超长，典型场点只剩 ~23 px（实测），箭头与箭头头一样大。
   取 EREF = 2E₀ ⇒ |E| = E₀（典型场点）约 0.45 m ≈ 70 px；|E| ≥ 1.8E₀ 封顶 0.90 m（≈1.1a）。
   注意 E / E_n / E_t 三者必须**共用同一个比例 s = eLen/L**，否则平行四边形分解不闭合。 */
const EARR_MAX = 0.90, EARR_GATE = 0.12;
const eLen = (mag,E0)=>Math.max(0.05, Math.min(EARR_MAX, mag/(2*E0)));
const FL_B  = [0, 0.45, 0.95, 1.32, 1.60, 1.723, 2.05, 2.60];   /* 场线瞄准距离（× A_C） */
const FL_PH = [0, Math.PI/2, Math.PI, 3*Math.PI/2];             /* 4 条子午面（= 2 个平面） */
const B_CRIT= Math.sqrt(3)*A_C;          /* 瞄准距离 > √3·a 的场线掠过导体，不落在球上 */

const E0_RANGE=[2,20];                   /* 外场 kV/m */
const RP_RANGE=[0.32,1.90];              /* 探针半径 m */
const QC_RANGE=[-2,2];                   /* 腔内电荷 µC */
const TH_LIM=[2,178];                    /* 探针极角的可用范围（避开极点退化） */

/* ============================== 状态 ============================== */
const state = {
  mode:'build',            /* build | concl | shield */
  E0:10,                   /* 外场 E₀ (kV/m) */
  t:1,                     /* ① 建立进度 0→1 */
  rp:1.15,                 /* ② 探针半径 r (m) */
  thp:55,                  /* ② 探针极角 θ (°) */
  qc:0,                    /* ③ 腔内电荷 (µC) */
  sweep:null,              /* ② 自动扫掠：'rad' | 'surf' */
  show:{box:true, lines:true, chg:true, inner:true, flow:true, equi:true, dec:true, vz:true},
  showReadout:true,
  autoRotate:false,
  cardTab:'1',
};
const SWEEP_SPEED={rad:0.55, surf:34};   /* rad: m/s   surf: °/s */

/* ============================== 球坐标 ⇄ 直角坐标 ============================== */
const sphPt=(r,th,ph)=>{const st=Math.sin(th);return pt(r*st*Math.cos(ph), r*st*Math.sin(ph), r*Math.cos(th));};
const eR  =(th,ph)=>pt(Math.sin(th)*Math.cos(ph), Math.sin(th)*Math.sin(ph), Math.cos(th));
const eTh =(th,ph)=>pt(Math.cos(th)*Math.cos(ph), Math.cos(th)*Math.sin(ph), -Math.sin(th));
const clamp1=v=>Math.max(-1,Math.min(1,v));

/* ============================== 解析场 ============================== */
/* 严格解（r ≥ a 用外解、r < a 严格为 0）；θ 自 +z 起算。返回 {Er,Eth}，单位 kV/m。
   ⚠️ 边界必须是**严格小于**：r = a（导体表面）属于"外部解"，那里 E_n = 3E₀cosθ、E_θ = 0。
      写成 r ≤ a 会把表面误判成内部而返回 0 —— 那样"表面场垂直且等于 σ/ε₀"这条结论
      在读数里就永远是 0（本页最早的一个 bug 就是这个）。 */
function fieldE(r,th,E0){
  if(r < A_C) return {Er:0,Eth:0};
  const k=A_C*A_C*A_C/(r*r*r);
  return {Er:E0*(1+2*k)*Math.cos(th), Eth:-E0*(1-k)*Math.sin(th)};
}
/* ① 的"建立过程"插值：
     t=0 → 纯匀强场（球内也照样穿过）　t=1 → 严格解（球内恰好被抵消干净）
   ⚠️ t<1 只是**过程示意**。真实的静电平衡在 ~10⁻¹⁸ s 内就完成了，
      物理上根本不存在"看到中间状态"的可能 —— 这里是为了把"为什么内部会变成 0"讲出来。 */
function fieldT(r,th,E0,t){
  if(r<A_C) return {Er:E0*(1-t)*Math.cos(th), Eth:-E0*(1-t)*Math.sin(th)};
  const k=A_C*A_C*A_C/(r*r*r);
  return {Er:E0*(1+2*t*k)*Math.cos(th), Eth:-E0*(1-t*k)*Math.sin(th)};
}
const fieldAt=(r,th,E0,t)=>(t==null?fieldE(r,th,E0):fieldT(r,th,E0,t));
function evec(r,th,ph,E0,t){
  const f=fieldAt(r,th,E0,t);
  return vadd(vmul(eR(th,ph),f.Er), vmul(eTh(th,ph),f.Eth));
}
/* 电位 kV。r ≤ a 恒为 0 ⇒ 导体是等位体（参考点取在导体上）。 */
function volt(r,th,E0){ return r<=A_C ? 0 : -E0*(r - A_C*A_C*A_C/(r*r))*Math.cos(th); }
/* 面电荷密度 nC/m²（t 为 ① 的建立进度，其余场景 t 传 null = 1） */
const sigma=(th,E0,t)=>(t==null?1:t)*SIG_K*E0*Math.cos(th);

/* ③ 空腔球壳：内半径 B_C、外半径 A_C。腔内中心放点电荷 qc(µC)。 */
function shellField(r,th,E0,qc){
  if(r<B_C)  return {Er:Q_KV*qc/(r*r), Eth:0};        /* 腔内：只由 q 决定，外场进不来 */
  if(r<=A_C) return {Er:0, Eth:0};                     /* 导体壳中：E ≡ 0 */
  const k=A_C*A_C*A_C/(r*r*r);                         /* 壳外：外表面等效为"匀强场中的球 + 总量 q" */
  return {Er:E0*(1+2*k)*Math.cos(th) + Q_KV*qc/(r*r), Eth:-E0*(1-k)*Math.sin(th)};
}
function shellVolt(r,th,E0,qc){
  if(r<B_C)  return Q_KV*qc*(1/r - 1/B_C);             /* 内表面 V=0（与导体同电位）*/
  if(r<=A_C) return 0;
  return -E0*(r - A_C*A_C*A_C/(r*r))*Math.cos(th) + Q_KV*qc*(1/r - 1/A_C);
}
/* 面电荷密度：内表面 −q/(4πb²) 均匀；外表面 = 外场诱导 + q/(4πa²) 均匀（nC/m²） */
const sigIn =(qc)=>-qc*1000/(4*Math.PI*B_C*B_C);
const sigOut=(th,E0,qc)=>SIG_K*E0*Math.cos(th) + qc*1000/(4*Math.PI*A_C*A_C);

/* ═══════════ ①② 的场线：解析流函数 ψ = E₀ sin²θ (r²/2 + a³/r) 的等值线 ═══════════
   验证：E_r = (1/(r²sinθ))·∂ψ/∂θ = E₀cosθ(1+2a³/r³) ✓
        E_θ = −(1/(r sinθ))·∂ψ/∂r = −E₀sinθ(1−a³/r³) ✓
   球面上 ψ = E₀(3a²/2)·sin²θ ⇒ 等值线就是 θ=const ⇒ **场线垂直入射球面**（正是要讲的那条）。
   远处瞄准距离 b：ψ(∞) = E₀b²/2 = ψ(球面) ⇒ sinθ₀ = b/(√3a) ⇒ 只有 b < √3·a 的线落在导体上。

   ★ 为什么不用"沿 E 方向一步步积分"（本页第一版就是那么写的，实测不可靠）：
     b 逼近 √3a 时场线贴着赤道滑行，一阶欧拉在那一带 **5% 级的角度误差**，
     最接近掠射的那条（b=1.723a）甚至滑过赤道跑到下半空间（θ₀ 报 150.9°，真值 84.2°）。
     改成"给定 ψ 解出 r(θ)"：每条线是**精确**的等值线，垂直入射这个性质由构造保证，与步长无关。
     方程：sin²θ(r²/2 + a³/r) = b²/2  ⇒  r³ − (b²/sin²θ) r + 2a³ = 0（取最大正根）
     该三次方程在物理分支上恰好有三个实根（判别式 Δ = a⁶ − P³/27 < 0，P = b²/sin²θ ≥ 3a²），
     用三角形式解；P < 3a² 时无正根（对应"场线到不了的区域"），返回 NaN。 */
function streamR(th,b){
  const s=Math.max(Math.sin(th),1e-7);
  const P=b*b/(s*s), q=2*A_C*A_C*A_C, p=-P;
  if(P < 3*A_C*A_C*(1-1e-9)) return NaN;           /* 该 θ 上没有场线（r 无正解） */
  const D=(q/2)*(q/2)+(p/3)*(p/3)*(p/3);
  /* ⚠️ P ≥ 3a² ⇒ 数学上 D ≤ 0 ⇒ **永远走三实根这一支**。
     不能写 `if(D<0)` 把 D==0 丢给 Cardano：D=0 时那个三次方程是 (r−a)²(r+2a)=0，
     Cardano 公式只给出单根 −2a，**正好漏掉我们最需要的重根 r=a**（表面落点！）；
     浮点还会把 D 算成 ±1e-18 两边跳。所以给 D 留一个正容差，把边界一并收进三角支。 */
  if(D <= 1e-14*A_C*A_C*A_C*A_C*A_C*A_C){
    const m=2*Math.sqrt(P/3);
    const arg=Math.max(-1,Math.min(1,(3*q)/(2*p)*Math.sqrt(3/P)));
    const t0=Math.acos(arg)/3;
    let best=-1e9;
    for(let k2=0;k2<3;k2++){ const r=m*Math.cos(t0-2*Math.PI*k2/3); if(r>best) best=r; }
    if(best>0) return best;
  }
  const sD=Math.sqrt(Math.max(0,D)), r=Math.cbrt(-q/2+sD)+Math.cbrt(-q/2-sD);
  return r>0?r:NaN;
}
/* r(θ) 在 (0, 90°] 上单调递减 ⇒ 二分求"r = target"的角度 */
function thetaAtR(target,b,thLo,thHi){
  let lo=thLo, hi=thHi;
  for(let i=0;i<46;i++){
    const m=(lo+hi)/2, r=streamR(m,b);
    if(!isFinite(r)||r>target) lo=m; else hi=m;
  }
  return (lo+hi)/2;
}
/* 返回一批"xz 平面内的折线"（绕 z 轴转到各 φ 就是 3D 场线） */
function dipolarLines(){
  const Zmax=A_C*3.1, segs=[];
  FL_B.forEach(bm=>{
    const b=bm*A_C;
    if(b<1e-9){                                   /* b=0：沿 z 轴，上下各一段 */
      segs.push([pt(0,0,Zmax),pt(0,0,A_C)]);
      segs.push([pt(0,0,-Zmax),pt(0,0,-A_C)]);
      return;
    }
    const hit=(b < B_CRIT*0.999);
    const thEnd = hit ? Math.asin(Math.min(1,b/B_CRIT)) : Math.PI/2;
    const thSt  = thetaAtR(Zmax,b,1e-4,thEnd*0.99999);
    const N=34, up=[];
    for(let i=0;i<=N;i++){
      const th=thSt+(thEnd-thSt)*i/N, r=streamR(th,b);
      if(!isFinite(r)) break;
      up.push(pt(r*Math.sin(th),0,r*Math.cos(th)));
    }
    if(up.length<2) return;
    if(hit){                                      /* 上半落在球面 θ₀，下半镜像落在 180°−θ₀ */
      /* ★ 末点吸附到 r=a：θ₀ 处 ψ 方程的重根就是 r=a，但浮点会让它差 ~1e-9·a。
         "场线垂直入射球面"是本页要讲的结论，落点必须**精确**在表面上（截图与断言都看这个）。 */
      up[up.length-1]=vmul(vnorm(up[up.length-1]),A_C);
      segs.push(up.slice());
      /* 下半段：镜像后**保持**"从远端 (r=Zmax) 走向球面"的顺序，不要 reverse ——
         否则段的末点变成远端，读数/断言都会被带偏（本页最早的一版就踩了这个）。 */
      segs.push(up.map(p=>pt(p.x,0,-p.z)));
    } else {                                      /* 掠过导体：过赤道一次走通 */
      segs.push(up.concat(up.slice(0,-1).reverse().map(p=>pt(p.x,0,-p.z))));
    }
  });
  return segs;
}
/* ③ 空腔壳的外部场线：场是"匀强球场 + 点电荷场"的叠加，没有单一流函数 ⇒ 只能数值积分。
   用 **RK4**（不是欧拉）+ 更小步长，并把瞄准距离限制在 1.55a 以内（避开掠射的病态区）。 */
const FL_B_SHELL=[0, 0.55, 1.05, 1.55, 2.1];
function traceLineF(fFn,bm,dir){
  const Z=A_C*3.1, hs=0.03*A_C, MAXS=800;
  let p=pt(bm*A_C,0,dir>0?-Z:Z);
  const out=[p];
  const dirAt=q=>{
    const r=vlen(q); if(r<1e-9) return pt(0,0,0);
    const th=Math.acos(clamp1(q.z/r)), f=fFn(r,th);
    const d=vadd(vmul(eR(th,0),f.Er), vmul(eTh(th,0),f.Eth));
    const L=vlen(d);
    return L<1e-12 ? pt(0,0,0) : vmul(d,1/L);
  };
  for(let i=0;i<MAXS;i++){
    const r0=vlen(p), th0=Math.acos(clamp1(p.z/r0)), f0=fFn(r0,th0);
    if(Math.hypot(f0.Er,f0.Eth)<1e-9){            /* 场为零 ⇒ 线终止（导体壳内部） */
      if(r0<A_C*1.08) out.push(vmul(vnorm(p),A_C));
      break;
    }
    const u1=dirAt(p), u2=dirAt(vadd(p,vmul(u1,dir*hs*0.5)));
    const u3=dirAt(vadd(p,vmul(u2,dir*hs*0.5))), u4=dirAt(vadd(p,vmul(u3,dir*hs)));
    const u=vadd(vadd(u1,vmul(u2,2)),vadd(vmul(u3,2),u4));
    p=vadd(p, vmul(u, dir*hs/6));
    const r=vlen(p);
    if(r<A_C*1.003){ out.push(vmul(vnorm(p),A_C)); break; }
    if(Math.abs(p.z)>Z || r>3.3*A_C){ out.push(p); break; }
    out.push(p);
  }
  return out;
}
function fieldLines(E0,t){
  if(t==null || t>0.98) return dipolarLines();     /* 静电平衡：精确等值线 */
  /* 建立过程中（t<1）内部也有场、流函数不再是常量 ⇒ 退回数值积分，并避开掠射的 b */
  const fFn=(r,th)=>fieldAt(r,th,E0,t);
  const segs=[];
  FL_B_SHELL.forEach(bm=>{
    if(bm*A_C < B_CRIT*0.998) { segs.push(traceLineF(fFn,bm,-1)); segs.push(traceLineF(fFn,bm,1)); }
    else segs.push(traceLineF(fFn,bm,1));
  });
  return segs;
}
function shellLines(E0,qc){
  const fFn=(r,th)=>shellField(r,th,E0,qc);
  const segs=[];
  FL_B_SHELL.forEach(bm=>{
    if(bm*A_C < B_CRIT*0.998) { segs.push(traceLineF(fFn,bm,-1)); segs.push(traceLineF(fFn,bm,1)); }
    else segs.push(traceLineF(fFn,bm,1));
  });
  return segs;
}
/* 把 xz 平面内的折线绕 z 轴旋到 φ，得到一条子午线 */
const rotZ=(p,ph)=>pt(p.x*Math.cos(ph), p.x*Math.sin(ph), p.z);

/* ═══════════════ 等位面：V = V₀ 的曲面（xz 剖面内是一条"帽形"曲线） ═══════════════
   V = −E₀·cosθ·u(r)，u(r) = r − a³/r²（u 在 r>a 上严格递增，u(a)=0）
   ⇒ 给定 |V₀| 与 θ：u = |V₀|/(E₀|cosθ|) ⇒ 解 u(r)=K，牛顿迭代几轮即可。
   注意 V 的符号 = −sign(cosθ)：上半空间 V<0、下半空间 V>0 ⇒ 每个等位面只存在于一"半"。
   θ→90° 时 cosθ→0 ⇒ u→∞ ⇒ 等位面延伸向无穷远（这就是"远处又还原成水平面"）。 */
function equiR(K){
  let r=A_C+K;                                   /* r³−Kr²−a³=0，r=a 处为负、+∞ 处为正 ⇒ 唯一正根 */
  for(let i=0;i<26;i++){
    const g=r*r*r-K*r*r-A_C*A_C*A_C, gp=3*r*r-2*K*r;
    if(Math.abs(gp)<1e-12) break;
    const nr=r-g/gp;
    if(!isFinite(nr)||nr<=0) break;
    if(Math.abs(nr-r)<1e-12){ r=nr; break; }
    r=nr;
  }
  return r;
}
/* 返回半条等位面（θ 从 0 或 180 起、到能画得下的最大角为止）的剖面折线 */
function equiCurve(sign,E0,fac,Rmax){
  const V0=E0*fac;                               /* |V₀| = E₀·fac，fac 单位 m ⇒ 形状与 E₀ 无关 */
  const umax=Rmax - A_C*A_C*A_C/(Rmax*Rmax);
  const cmin=Math.min(1, V0/(E0*umax));          /* cosθ 的下限 */
  const thEnd=Math.acos(Math.max(0.02,cmin));
  const N=34, out=[];
  for(let i=0;i<=N;i++){
    const th=thEnd*i/N;
    const r=equiR(V0/(E0*Math.max(0.02,Math.cos(th))));
    const tc=sign>0 ? th : Math.PI-th;           /* 上半空间取 θ，下半空间取 180°−θ */
    out.push(sphPt(Math.min(r,Rmax),tc,0));
  }
  return out;
}

/* ============================== 绘制：共用元素 ============================== */
/* 匀强外场 E₀ 的"背景刻度"：短箭头，只标方向与大小，不参与严格解 */
function drawE0Hint(E0){
  const s=0.16+0.055*E0;                         /* 箭头长度随 E₀ 增长（示意） */
  const G=A_C*1.75;
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
    if(i===0&&j===0) continue;
    const x=i*G*0.86, y=j*G*0.86;
    arrow(pt(x,y,-A_C*2.5), pt(x,y,-A_C*2.5+s), {color:'#9DB3BF',w:1.6,headScale:.7,alpha:.75});
  }
  text(pt(0,0,-A_C*2.5), '@{E}₀ = '+E0.toFixed(1)+' kV/m', {color:'#7A8F9B',size:11.5,dy:16,align:'center'});
}

/* 表面感应电荷：按 θ 分档布 ⊕/⊖ 符号 —— 字号与透明度 ∝ |cosθ|，
   于是"两极最密、赤道为零"是看出来的（也是 σ = 3ε₀E₀cosθ 的图形）。 */
/* 表面电荷符号：按 θ 分档布 ⊕/⊖ —— 字号与透明度 ∝ |σ(θ)|/max|σ|，
   于是"两极最密、赤道为零"是看出来的（正是 σ = 3ε₀E₀cosθ 的图形）。
   ★ 泛化成"按 σ 函数取值"，于是空腔壳（σ_out 可以是同号）也共用这一段。 */
/* ★ 把"要保护的画布文字"折算成**屏幕避让点串**（每 ~10px 一个点）。
   ⊕/⊖ 的避让必须用一串点而不是一个锚点 —— 一句注释 150+ px 宽，一个点挡不住。
   宽度估计：CJK 按 1.0×字号、其它按 0.55×字号（与实测误差 <15%，够用）。 */
function textWidth(str,size){
  let w=0; for(const ch of str) w += (ch.charCodeAt(0)>0x2E80 ? 1.0 : 0.55);
  return w*size;
}
function avoidText(p0,str,size,dx,dy,align){
  const s=pr(p0), a=[], w=textWidth(str,size), st=Math.max(9,size*0.62);
  let x0=s.x+(dx||0);
  if(align==='center') x0-=w/2; else if(align==='right') x0-=w;
  const n=Math.max(2,Math.ceil(w/st));
  for(let k=0;k<=n;k++) a.push({x:x0+Math.min(k*st,w), y:s.y+(dy||0)});
  return a;
}
function drawSurfaceCharge(rr,sigFn,o){
  o=o||{};
  const al=(o.alpha==null?1:o.alpha);
  if(al<=0.01) return;
  const NU=o.nu||9, NV=o.nv||8, ths=[], mags=[];
  for(let i=0;i<NU;i++){ const th=(i+0.5)/NU*Math.PI; ths.push(th); mags.push(Math.abs(sigFn(th))); }
  const mx=Math.max.apply(null,mags.concat([1e-9]));
  /* ⚠️ 必须做**屏幕空间最小间距**过滤：两极附近 NV 个 φ 会投影到几乎同一个点
     （实测相邻两个 ⊕ 只差 0.5 px ⇒ 糊成一团）。以"先放先得"的方式丢弃过近的符号。
     ⚠️ o.share 让**多次调用共用同一张已放表** —— ③ 的内表面 −q 与外表面 +q 是两次调用，
        不共享时两者会在屏幕上叠在一起（实测 3 px）。 */
  const SEPS=Math.max(15, (o.sep||15));
  const placed = o.share || [];
  const w = o.avoidS || [];
  const gap = o.probeGap || 34;
  for(let i=0;i<NU;i++){
    const th=ths[i], s=sigFn(th), mag=mags[i]/mx;
    if(mag<0.10) continue;
    for(let j=0;j<NV;j++){
      const ph=(j+0.42)/NV*2*Math.PI;
      const p=sphPt(rr,th,ph), sp=pr(p);
      if(w.some(q=>Math.hypot(sp.x-q.x,sp.y-q.y)<gap)) continue;
      if(placed.some(q=>(q.x-sp.x)*(q.x-sp.x)+(q.y-sp.y)*(q.y-sp.y)<SEPS*SEPS)) continue;
      placed.push(sp);
      text(p, s>0?'+':'−', {color: s>0?C.crimson:'#2E7FA6',
        size:7.5+7.5*mag, bold:true, align:'center',
        alpha:(0.25+0.75*mag)*al});
    }
  }
}
/* ① 的"电荷迁移"弧箭头：正电荷顺场线往 +z 极跑、负电荷逆场线往 −z 极跑 */
function drawFlow(E0,t){
  if(t<=0.02||t>=0.985) return;
  const a=0.55*(1-Math.abs(2*t-1))*2.4;          /* 中途最亮 */
  const up=[],dn=[];
  for(let k=0;k<=16;k++){
    const th=Math.PI*0.50 - Math.PI*0.34*k/16;
    up.push(sphPt(A_C*1.16,th,0.42));
    const th2=Math.PI*0.50 + Math.PI*0.34*k/16;
    dn.push(sphPt(A_C*1.16,th2,0.42));
  }
  curve(up,  {color:C.crimson,w:2.2,arrowEnd:true,alpha:Math.min(1,a)});
  curve(dn,  {color:'#2E7FA6',w:2.2,arrowEnd:true,alpha:Math.min(1,a)});
  text(up[up.length-1],'正电荷',{color:C.crimson,size:11,bold:true,dx:6,dy:-4,alpha:Math.min(1,a)});
  text(dn[dn.length-1],'负电荷',{color:'#2E7FA6',size:11,bold:true,dx:6,dy:10,alpha:Math.min(1,a)});
}
/* ① 的球内合场：箭头长度 ∝ (1−t)·E₀ ⇒ t→1 时"肉眼可见地缩到 0"。
   ★ 刻意空出正中央一格 —— 那里要写"内部 |E| = ?"的读数，别叠字。 */
function drawInner(E0,t){
  if(!state.show.inner || t>=0.995) return;
  const L=eLen(E0*(1-t), E0), g=A_C*0.40;
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
    if(i===0&&j===0) continue;
    const x=i*g, y=j*g, z0=-L*0.5;
    arrow(pt(x,y,z0), pt(x,y,z0+L), {color:'#7A8F9B',w:1.8,headScale:.75,alpha:.55+.35*(1-t),
      z:1e4+30});
  }
}
function drawFieldLines(E0,t){
  const segs=fieldLines(E0,t);
  const col = (t==null||t>0.98) ? '#2E7FA6' : '#8FB3C6';
  segs.forEach(sg=>{
    if(sg.length<2) return;
    FL_PH.forEach(ph=>curve(sg.map(p=>rotZ(p,ph)), {color:col,w:1.25,alpha:t==null||t>0.98?0.62:0.5}));
  });
}
function drawAxesFor(){ drawAxes(A_C*2.35); }

/* 小图/小卡用的画布助手（与 2.1 同源） */
function txt(x,y,str,o={}){
  ctx.save();
  const lo=richLayout(ctx,parseRich(str),o.size||12,!!o.bold);
  richDraw(ctx,lo,x,y,o.align||'left',o.color||C.ink);
  ctx.restore();
}
function rrPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function crd(x,y,w,h){
  ctx.save();
  ctx.shadowColor='rgba(30,60,80,.10)'; ctx.shadowBlur=8; ctx.shadowOffsetY=2;
  rrPath(x,y,w,h,10); ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fill();
  ctx.restore(); ctx.save();
  rrPath(x,y,w,h,10); ctx.strokeStyle='#DCE6EB'; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}
const CARD_W=248, CARD_X=()=>W-CARD_W-16, CARD_Y=62;

/* ════════════ 小卡：电位沿 z 轴的剖面 —— "导体内部是一条水平线" ════════════
   这是"导体是等位体"最直接的证据：|z| < a 的一段严格平（V=0），出球面才弯。 */
function chartVz(){
  const x0=CARD_X(), y0=CARD_Y, w=CARD_W, h=150;
  crd(x0,y0,w,h);
  txt(x0+12,y0+15,'电位沿 z 轴的剖面　V(z)',{size:11.5,bold:true,color:'#1F3D4C'});
  const px0=x0+40, py0=y0+32, pw=w-56, ph=h-66;
  const E0=state.E0;
  const ZR=A_C*2.2;
  const Vmax=E0*(ZR-A_C*A_C*A_C/(ZR*ZR));        /* z=+ZR 处的 |V| 作为纵轴满量程 */
  const fx=z=>px0+pw*(z+ZR)/(2*ZR);
  const fy=v=>py0+ph*0.5-ph*0.45*(v/Vmax);
  /* 轴 */
  ctx.save(); ctx.strokeStyle='#EEF3F6'; ctx.lineWidth=1;
  [0.5,-0.5].forEach(k=>{const y=fy(k*Vmax); ctx.beginPath(); ctx.moveTo(px0,y); ctx.lineTo(px0+pw,y); ctx.stroke();});
  ctx.strokeStyle='#DCE6EB'; ctx.beginPath(); ctx.moveTo(px0,fy(0)); ctx.lineTo(px0+pw,fy(0)); ctx.stroke();
  ctx.restore();
  /* 导体那一段：粗绿线，标「等位」 */
  const xL=fx(-A_C), xR=fx(A_C), y0v=fy(0);
  ctx.save(); ctx.strokeStyle=C.green; ctx.lineWidth=3.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(xL,y0v); ctx.lineTo(xR,y0v); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.fillStyle='rgba(62,155,79,.10)';
  ctx.fillRect(xL,py0,xR-xL,ph); ctx.restore();
  /* V(z) 两条曲线：z>0 用 θ=0（V=−E₀u）、z<0 用 θ=180°（V=+E₀u） */
  ctx.save(); ctx.strokeStyle=C.blue; ctx.lineWidth=2.2; ctx.beginPath();
  let first=true;
  for(let i=0;i<=80;i++){
    const z=ZR*i/80, v=-E0*(z-A_C*A_C*A_C/(z*z||1e-9));
    const X=fx(Math.max(z,A_C)), Y=fy(z<=A_C?0:v);
    if(first){ctx.moveTo(X,Y);first=false;} else ctx.lineTo(X,Y);
  }
  ctx.stroke();
  ctx.beginPath(); first=true;
  for(let i=0;i<=80;i++){
    const z=-ZR*i/80, az=Math.abs(z), v=E0*(az-A_C*A_C*A_C/(az*az||1e-9));
    const X=fx(Math.min(z,-A_C)), Y=fy(z>=-A_C?0:v);
    if(first){ctx.moveTo(X,Y);first=false;} else ctx.lineTo(X,Y);
  }
  ctx.stroke(); ctx.restore();
  /* 探针位置竖线 */
  if(state.mode==='concl'){
    const P=sphPt(state.rp,state.thp*D2R,0);
    if(Math.abs(P.x)<1e-6){
      const zc=P.z; const v=volt(Math.abs(zc),zc>=0?0:Math.PI,E0)*Math.sign(zc||1);
      const X=fx(Math.max(-ZR,Math.min(ZR,zc)));
      ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle='#B9CBD6'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(X,py0); ctx.lineTo(X,py0+ph); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.arc(X,fy(v),4.2,0,7); ctx.fillStyle=C.purple; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    }
  }
  txt(px0-6,py0+4,'+'+(Vmax).toFixed(0),{size:10,color:'#7A8F9B',align:'right'});
  txt(px0-6,y0v+4,'0',{size:10,color:'#7A8F9B',align:'right'});
  txt(px0-6,py0+ph+4,'−'+(Vmax).toFixed(0),{size:10,color:'#7A8F9B',align:'right'});
  txt(xL,py0+ph+16,'−a',{size:10,color:'#7A8F9B',align:'center'});
  txt(xR,py0+ph+16,'+a',{size:10,color:'#7A8F9B',align:'center'});
  txt(x0+w/2,py0+ph+28,'导体内部（绿色段）严格水平 ⇒ 等位体（V 单位 kV）',{size:10,color:'#2C6B3B',align:'center'});
}

/* ══════════════════════════════ 场景（三个页签） ══════════════════════════════ */
const O=pt(0,0,0);
const COND_COL='#3E7C99';      /* 导体（球 / 壳）的基色 */
const FLD_COL ='#2E7FA6';      /* 场线 */
const ZL=1e4+40;               /* 探针相关图元的深度档：必须压在球壳正面之上，不然会被洗掉 */

/* z 轴方向的角弧（θ 从 +z 起算）—— 与 1.x 的 meridianArc 同义，这里只用到 φ 固定的一条 */
function arcZ(r0,th0,th1,ph,n){
  const a=[];
  for(let i=0;i<=n;i++) a.push(sphPt(r0, th0+(th1-th0)*i/n, ph));
  return a;
}
/* 导体球的统一画法：半透明玻璃壳（同源 shellBall）+ 剪影圆，ed 强调档给 ② 用 */
function drawBall(c,R,col,emph,rimA){
  shellBall(c,R,col,!!emph,rimA);
  ballRim(c,R,col,emph?1.9:1.5,emph?0.95:0.8);
}
const probeP=()=>sphPt(state.rp, state.thp*D2R, 0);

/* ══════════ ① 静电平衡的建立 ══════════ */
function sceneBuild(){
  const E0=state.E0, t=state.t;
  if(state.show.box) drawAxesFor();
  if(state.show.lines) drawE0Hint(E0);
  if(state.show.lines) drawFieldLines(E0,t);
  drawBall(O,A_C,COND_COL,false,0.30);
  if(state.show.chg) drawSurfaceCharge(A_C*1.05, th=>sigma(th,E0,t), {alpha:t});
  if(state.show.flow) drawFlow(E0,t);
  drawInner(E0,t);
  /* 关键读数直接写在球心：t<1 时报"还没抵消完"的数，t=1 时报"严格 0" */
  if(t>=0.995)
    text(O,'导体内部　@{E} ≡ 0',{color:C.green,size:13,bold:true,align:'center'});
  else
    text(O,'内部 |@{E}| = '+(E0*(1-t)).toFixed(2)+' kV/m',{color:'#8A5A20',size:12.5,bold:true,align:'center'});
}

/* ══════════ ② 静电平衡的四个结论 ══════════ */
/* 等位面：V = ∓E₀·fac 的"帽形"曲面。fac 的单位是 m ⇒ 形状与 E₀ 无关（只是整体缩放）。 */
function drawEqui(E0){
  const Rmax=A_C*3.3, facs=[0.85,1.45,2.05];
  facs.forEach((fac,i)=>{
    [1,-1].forEach(sg=>{
      const c=equiCurve(sg,E0,fac,Rmax);
      if(c.length<3) return;
      FL_PH.forEach(ph=>curve(c.map(p=>rotZ(p,ph)),{color:'#8FB3C6',w:1.15,dash:[5,5],alpha:0.50}));
    });
  });
  const V1=E0*facs[0];
  text(sphPt(A_C*1.72,0.30,0.55),'V = −'+(E0*0.85).toFixed(1)+' kV 等位面',
    {color:'#7A8F9B',size:11,dx:6,dy:-4});
  text(sphPt(A_C*1.72,Math.PI-0.30,0.55),'V = +'+(E0*0.85).toFixed(1)+' kV 等位面',
    {color:'#7A8F9B',size:11,dx:6,dy:10});
}
/* ★ 探针 P 的几何：P / E 终点 / E_n 终点 / E_t 终点。
   "画"与"避让"共用同一套坐标 ⇒ 以后改比例不会出现"标注躲错地方"。
   三个分量**共用同一个比例 s = L/|E|**，⇒ E = E_n + E_t 的平行四边形严格闭合
   （若改成逐分量各自 eLen，饱和区会被各自钳住 ⇒ 矩形变形）。 */
function probeGeom(E0){
  const th=state.thp*D2R, r=state.rp;
  const P=probeP(), f=fieldE(r,th,E0);
  const E=vadd(vmul(eR(th,0),f.Er), vmul(eTh(th,0),f.Eth)), mag=vlen(E);
  const L=eLen(mag,E0);
  const g={P,f,E,mag,nr:eR(th,0),nt:eTh(th,0),L,s:0,tip:null,Pr:null,Pt:null,Ers:0,Ets:0,shown:false};
  if(mag>1e-9 && L>=EARR_GATE){
    const s=L/mag; g.s=s; g.shown=true; g.tip=vadd(P,vmul(E,s));
    g.Ers=Math.abs(f.Er)*s; g.Ets=Math.abs(f.Eth)*s;
    if(g.Ers>1e-9) g.Pr=vadd(P,vmul(g.nr,f.Er*s));
    if(g.Ets>1e-9) g.Pt=vadd(P,vmul(g.nt,f.Eth*s));
  }
  return g;
}
const probeAvoid=E0=>{const g=probeGeom(E0),a=[g.P];
  [g.tip,g.Pr,g.Pt].forEach(v=>{if(v)a.push(v);}); return a.map(p=>pr(p));};
/* θ 角弧上那个 'θ' 的锚点（drawProbe 里用同一个式子算出来，这里复算一遍给它避让） */
const probeThetaLab=()=>{ const r=state.rp, ra=Math.min(Math.max(r,A_C*0.55),A_C*1.15)*0.52;
  return sphPt(ra*1.16, state.thp*D2R/2, 0); };
/* 画布上的固定注记（与其锚点一起让给 ⊕/⊖） */
const LBL_SURF=()=>sphPt(A_C*1.02,0.30,Math.PI*0.72);
function drawProbe(E0){
  const th=state.thp*D2R, r=state.rp;
  const g=probeGeom(E0), P=g.P, f=g.f, mag=g.mag;
  /* 半径：距离一律用 dimLine（本项目规范：距离绝不用箭头） */
  if(r>A_C+1e-6){
    const Lr=Math.hypot(pr(P).x-pr(O).x, pr(P).y-pr(O).y);
    if(Lr>=70) dimLine(O,P,{color:'#9DB3BF',w:1.2,dash:[5,4],label:'r = '+r.toFixed(2)+' m',
      ldx:10,ldy:-8,lsize:11,z:ZL});
  }
  /* θ 角弧（自 +z 轴起算） */
  const ra=Math.min(Math.max(r,A_C*0.55),A_C*1.15)*0.52;
  line(O,pt(0,0,ra),{color:'#C9D8E0',w:1.1,z:ZL-2});
  curve(arcZ(ra,0,Math.max(th,0.12),0,14),{color:C.orange,w:1.7,arrowEnd:true,z:ZL-2});
  text(sphPt(ra*1.16,th/2,0),'θ',{color:C.orange,size:12,bold:true,dx:4,dy:-3});
  /* E 矢量 + 法向/切向分解 */
  if(g.shown){
    const showN=state.show.dec&&g.Pr&&g.Ers>=0.09, showT=state.show.dec&&g.Pt&&g.Ets>=0.09;
    if(showN&&showT){
      line(g.Pr,g.tip,{color:'#C9D6DD',w:1,dash:[4,4],z:ZL-1});
      line(g.Pt,g.tip,{color:'#C9D6DD',w:1,dash:[4,4],z:ZL-1});
      arrow(P,g.Pr,{color:C.orange,w:2,headScale:.85,label:'@{E}_n',ldx:10,ldy:-8,lsize:11,z:ZL});
      arrow(P,g.Pt,{color:C.green,w:2,headScale:.85,label:'@{E}_t',ldx:10,ldy:12,lsize:11,z:ZL});
      arrow(P,g.tip,{color:C.blue,w:2.7,headScale:1.0,label:'@{E}',ldx:12,ldy:-14,lsize:12,z:ZL+1});
    } else if(showN){
      /* ★ 切向分量为零（恰好落在导体表面上）⇒ E ≡ E_n 是**同一支箭头**。
         此时若仍旧画两支蓝/橙箭头 + 两个标签，标签会在同一点上叠字（实测 7.5 px）。 */
      arrow(P,g.tip,{color:C.blue,w:2.7,headScale:1.0,label:'@{E} = @{E}_n',ldx:12,ldy:-14,lsize:12,z:ZL+1});
    } else {
      arrow(P,g.tip,{color:C.blue,w:2.7,headScale:1.0,label:'@{E}',ldx:12,ldy:-14,lsize:12,z:ZL+1});
    }
  }
  marker(P,{r:5.5,color:C.purple,ring:'#E6D6F0',label:'P',ldx:-28,ldy:14,lsize:12.5,z:ZL+2});
  /* ⚠️ P 的标签放**左下**：右下是 E_t 的标签（arrow 的标签画在杆的中点！实测两者只差 3.5 px） */
}
function sceneConcl(){
  const E0=state.E0;
  if(state.show.box) drawAxesFor();
  if(state.show.lines) drawE0Hint(E0);
  if(state.show.equi) drawEqui(E0);
  if(state.show.lines) drawFieldLines(E0,null);
  drawBall(O,A_C,COND_COL,true,0.42);
  /* ⊕/⊖ 要让开：P、E/E_n/E_t 的标注区、"导体表面"注记、以及 r 尺寸线的标签
     （尺寸线标签画在 O—P 的中点 + (10,−8)，见 dimLine） */
  const lp=LBL_SURF();
  if(state.show.chg){
    const av=probeAvoid(E0).concat(avoidText(lp,'导体表面：V = 0 等位面',11.5,6,-2),
      avoidText(probeThetaLab(),'θ',12,4,-3),
      avoidText(vmul(probeP(),0.5),'r = '+state.rp.toFixed(2)+' m',11,10,-8),
      avoidText(probeP(),'P',12.5,-28,14));
    drawSurfaceCharge(A_C*1.05, th=>sigma(th,E0,null), {alpha:1, avoidS:av, probeGap:34});
  }
  text(lp,'导体表面：V = 0 等位面',{color:C.green,size:11.5,bold:true,dx:6,dy:-2});
  drawProbe(E0);
  if(state.show.vz) chartVz();
}

/* ══════════ ③ 静电屏蔽 ══════════ */
function sceneShield(){
  const E0=state.E0, qc=state.qc;
  if(state.show.box) drawAxesFor();
  if(state.show.lines) drawE0Hint(E0);
  if(state.show.lines){
    shellLines(E0,qc).forEach(sg=>{
      if(sg.length<2) return;
      FL_PH.forEach(ph=>curve(sg.map(p=>rotZ(p,ph)),{color:FLD_COL,w:1.25,alpha:0.62}));
    });
  }
  drawBall(O,A_C,COND_COL,true,0.40);           /* 外表面 */
  drawBall(O,B_C,'#8FB3C6',false,0.26);         /* 腔内表面 */
  /* 赤道上一圈"壳厚"短划：让"导体壳是有厚度的一层"看得见 */
  for(let j=0;j<16;j++){
    const ph=j/16*2*Math.PI;
    line(sphPt(B_C,Math.PI/2,ph),sphPt(A_C,Math.PI/2,ph),{color:COND_COL,w:1.3,alpha:0.45});
  }
  const labShell = sphPt(A_C*1.02,Math.PI/2,Math.PI*1.25);
  const eLab = '腔内 |E| = '+(Q_KV*Math.abs(qc)/(B_C*B_C*0.25)).toFixed(1)+' kV/m（r = b/2 处）';
  /* ★ 一次场景里两次 drawSurfaceCharge 共用 sep ⇒ 内外表面的符号绝不互相压住；
     ★ 三句注记（壳内、q、腔内场）与坐标轴原点的 O 一起进避让表（实测它们原本各压着 1~2 个符号） */
  const sep=[], avS=[pr(O)].concat(
      avoidText(labShell,'导体壳：内部 E ≡ 0',11.5,6,-2),
      Math.abs(qc)>0.02
        ? avoidText(O,(qc>0?'+q = ':'−q = ')+Math.abs(qc).toFixed(2)+' µC',12,14,-14)
            .concat(avoidText(O,eLab,11.5,0,34,'center'))
        : avoidText(O,'腔内无电荷 ⇒ E ≡ 0',12.5,0,0,'center'));
  if(Math.abs(qc)>0.02)
    drawSurfaceCharge(B_C*0.93,()=>sigIn(qc),{alpha:1,nu:5,nv:6,avoidS:avS,share:sep,probeGap:30});
  drawSurfaceCharge(A_C*1.05,th=>sigOut(th,E0,qc),{alpha:1,avoidS:avS,share:sep,probeGap:30});
  text(labShell,'导体壳：内部 @{E} ≡ 0',{color:C.green,size:11.5,bold:true,dx:6,dy:-2});

  /* 腔内点电荷 + 腔内的径向场线 */
  if(Math.abs(qc)>0.02){
    const dir=qc>0?1:-1;
    const ths=[0.45,1.15,Math.PI/2,2.0,2.7], phs=[0,Math.PI/2,Math.PI,3*Math.PI/2];
    ths.forEach(t0=>phs.forEach(p0=>{
      const a=sphPt(B_C*0.10,t0,p0), b=sphPt(B_C*0.985,t0,p0);
      if(dir>0) arrow(a,b,{color:'#B07A2A',w:1.6,headScale:.7,alpha:.85});
      else      arrow(b,a,{color:'#B07A2A',w:1.6,headScale:.7,alpha:.85});
    }));
    marker(O,{r:6,color:'#B07A2A',ring:'#F0E0C8',
      label:(qc>0?'+q = ':'−q = ')+Math.abs(qc).toFixed(2)+' µC',ldx:14,ldy:-14,lsize:12,z:ZL+2});
    text(O,'腔内 |@{E}| = '+(Q_KV*Math.abs(qc)/(B_C*B_C*0.25)).toFixed(1)+' kV/m（r = b/2 处）',
      {color:'#8A5A20',size:11.5,dy:34,align:'center'});   /* dy 要够大：否则压住坐标轴原点的 O */
  } else {
    text(O,'腔内无电荷 ⇒ @{E} ≡ 0',{color:C.green,size:12.5,bold:true,align:'center'});
  }
}

/* ══════════ 场景装配 ══════════ */
function buildScene(){
  prims=[];                                  /* ★ 第一句必须是 prims=[]（否则每次重绘再叠一层） */
  if(state.mode==='build')  sceneBuild();
  else if(state.mode==='concl') sceneConcl();
  else                      sceneShield();
}
function drawOverlays(){

  const x0=CARD_X(), y0=CARD_Y, w=CARD_W, h=118;

    ['壳内（b<r<a）', '|@{E}| ≡ 0', C.green],

/* ══════════════════════════════ 读数与判定 ══════════════════════════════ */
function probeInfo(){
  const E0=state.E0, r=state.rp, th=state.thp*D2R;
  const f=fieldE(r,th,E0);
  const mag=Math.hypot(f.Er,f.Eth);
  const onSurf = Math.abs(r-A_C)<1e-6;
  const zone = r<A_C-1e-6 ? 'in' : (onSurf ? 'surf' : 'out');
  const ang = mag>1e-9 ? Math.acos(Math.min(1,Math.abs(f.Er)/mag))*R2D : 0;
  return {E0,r,th,Er:f.Er,Eth:f.Eth,mag,V:volt(r,th,E0),zone,ang,
          ett: mag>1e-9 ? Math.abs(f.Eth)/mag : 0,
          sig: onSurf ? sigma(th,E0,null) : null};
}
function zoneWord(z){ return z==='in'?'导体内部':(z==='surf'?'导体表面':'导体外部'); }
const sgnTxt=(v,d)=>(v>0?'+':'')+v.toFixed(d);

/* ② 面板底部的实时结论条 */
function probeNote(){
  const p=probeInfo();
  const E0=state.E0;
  if(p.zone==='in')
    return '<b>P 在导体内部</b>：严格解给出 @{E} ≡ 0（不是"很小"，是恒等于 0）、'+
           'V ≡ 0。这正是"导体是等位体"的由来 —— 内部没有场，也就没有电位差。';
  if(p.zone==='surf')
    return '<b>P 正好落在导体表面</b>（r = a）：E_θ ≡ 0 ⇒ @{E} 严格沿法向；'+
           '法向分量 E_n = 3E₀cosθ = '+p.Er.toFixed(2)+' kV/m，而 σ = ε₀E_n = '+p.sig.toFixed(1)+' nC/m²。'+
           'V 与 θ 无关、恒为 0 ⇒ 表面是等位面。';
  return '<b>P 在导体外部</b>：E_n = '+p.Er.toFixed(2)+' kV/m、E_t = '+p.Eth.toFixed(2)+' kV/m，'+
         '切向分量占比 '+(p.ett*100).toFixed(1)+'% ⇒ @{E} 与法向夹 '+p.ang.toFixed(1)+'°（外部不垂直，只有表面才垂直）。';
}
function buildNote(){
  const t=state.t, E0=state.E0;
  if(t>=0.995) return '<b>已达静电平衡</b>：内部 |@{E}| ≡ 0，表面电荷不再移动。'+
    '此时表面 σ(θ) = 3ε₀E₀cosθ ⇒ 总量 ∮σdS = 0（下半球负电荷与上半球正电荷恰好抵消）。';
  if(t<=0.005) return '<b>刚加上外场</b>：还没有电荷迁移，球内球外都是同一个匀强场 @{E}₀。'+
    '把进度条往右拖，看自由电荷怎么跑、内部场怎么被抵消掉。';
  return '<b>正在建立</b>（进度 '+(t*100).toFixed(0)+'%）：正电荷顺场线往 +z 极跑、负电荷逆场线往 −z 极跑，'+
    '它们在表面产生的场与外场反向 ⇒ 内部合场降到 '+(E0*(1-t)).toFixed(2)+' kV/m。'+
    '<b>⚠️ 真实过程 ~10⁻¹⁸ s 就结束了，这里是为了看清机理而放慢的示意。</b>';
}
function shieldNote(){
  const qc=state.qc;
  if(Math.abs(qc)<0.02)
    return '<b>腔内无电荷</b>：腔内 @{E} ≡ 0（严格），与外加场 E₀ 多大完全无关 —— '+
      '这就是"导体空腔屏蔽外场"。原因是外表面的感应电荷把外场在壳内恰好抵消干净。';
  return '<b>腔内有电荷 q = '+qc.toFixed(2)+' µC</b>：内表面感应出 −q、外表面多出 +q。'+
    '腔内的场只由 q 决定；而<b>腔外</b>的场只与"总量 q"有关 —— '+
    '把 q 在腔内挪到任何位置（不止球心），外部场的分布<b>一个字都不变</b>。'+
    '想连总量也屏蔽掉，必须把外壳<b>接地</b>（把 +q 引走）。';
}

/* ══════════════════════════════ 右侧面板 ══════════════════════════════ */
const panel=document.getElementById('panel');
function h(html){const d=document.createElement('div');d.innerHTML=html;return d;}
function kchip(k,v,cls){return '<span class="coord-chip '+(cls||'')+'">'+richHTML(k)+'<b>'+v+'</b></span>';}
function chipRow(parent,items,isOn,onPick){
  const box=h('<div class="sub-chips"></div>').firstChild;
  items.forEach(it=>{
    const lab=richHTML(String(it.t??it.sub??it.label??''));
    const b=h('<button class="chip '+(it.col||'')+(isOn(it.k)?' on':'')+'" data-k="'+it.k+'">'+lab+'</button>').firstChild;
    b.onclick=()=>onPick(it.k);
    box.appendChild(b);
  });
  parent.appendChild(box);
  return box;
}
const SHOW_ITEMS={
  build: [{k:'lines',t:'外场 @{E}₀ 与场线'},{k:'chg',t:'表面感应电荷'},{k:'flow',t:'电荷迁移方向'},
          {k:'inner',t:'球内合场'},{k:'box',t:'坐标轴'}],
  concl: [{k:'lines',t:'外场 @{E}₀ 与场线'},{k:'equi',t:'等位面 V = const'},{k:'chg',t:'表面感应电荷'},
          {k:'dec',t:'@{E} 的法向 / 切向分解'},{k:'vz',t:'V 沿 z 剖面小卡'},{k:'box',t:'坐标轴'}],
  shield:[{k:'lines',t:'外场 @{E}₀ 与场线'},{k:'chg',t:'感应电荷'},{k:'box',t:'坐标轴'}],
};
function mkRange(sec,d){
  /* ⚠️ d.label 里会写 @{E}₀ ⇒ 必须过 richHTML，否则字面显示 */

    '<span class="val" id="v_'+d.k+'">'+d.fmt(d.get())+'</span></div>');

function clampRp(){ state.rp=Math.max(RP_RANGE[0],Math.min(RP_RANGE[1],state.rp)); }
function clampThp(){ state.thp=Math.max(TH_LIM[0],Math.min(TH_LIM[1],state.thp)); }
/* ⚠️ 让「表面」这个位置**够得着**：r 的步长 0.01、最小值 0.32，恰好能落到 0.80；
   但浮点误差会让 0.7999999 被判成"内部" ⇒ 显式吸附（这是本页最关键的一个位置）。 */
function snapRp(){ if(Math.abs(state.rp-A_C)<0.006) state.rp=A_C; clampRp(); }

const SLIDER_FMT={
  E0:v=>v.toFixed(1)+' kV/m',

      '导体球在匀强场里是**轴对称**的 ⇒ 绕 z 轴转 φ 什么都不变，所以两个坐标 (r, θ) 就够了。'+

  } else {

    mkRange(sec,{k:'qc',label:'q',wide:true,min:QC_RANGE[0],max:QC_RANGE[1],step:0.1,
      get:()=>state.qc, set:v=>state.qc=Math.round(v*10)/10, fmt:v=>sgnTxt(v,2)+' µC'});

  }
}

function renderExplain(sec){
  sec.innerHTML='';
  const list=CARDS[state.mode];
  sec.appendChild(h('<div class="sec-title">讲解</div>'));
  const tabs=h('<div class="card-tabs"></div>').firstChild;
  list.forEach(c=>{
    const b=h('<button class="card-tab '+c.cls+(c.k===state.cardTab?' on':'')+'">'+c.tab+'</button>').firstChild;
    b.onclick=()=>{ state.cardTab=c.k; renderPanel(); };
    tabs.appendChild(b);
  });
  sec.appendChild(tabs);
  const cur=list.find(c=>c.k===state.cardTab)||list[0];
  const body=h('<div class="card-body '+cur.cls+'"><div class="ex-title">'+cur.tab+'</div></div>').firstChild;
  body.appendChild(h('<div class="ex-body">'+richHTML(cur.body)+'</div>').firstChild);
  sec.appendChild(body);
}
function renderPanel(){
  ['subSec','sliderSec','explainSec'].forEach(id=>{const el=document.getElementById(id);if(el)el.remove();});
  const mk=id=>{const d=document.createElement('div');d.className='panel-sec';d.id=id;return d;};
  let tog=document.getElementById('toggleSec');
  if(!tog){
    tog=mk('toggleSec');
    tog.appendChild(h('<label class="readout-toggle"><input type="checkbox" id="showReadoutCb"'+(state.showReadout?' checked':'')+'><span>在<b>画布下方</b>显示<b>实时数据</b>条</span></label>'));
    tog.querySelector('#showReadoutCb').onchange=e=>{state.showReadout=e.target.checked;updateReadout();};
    panel.appendChild(tog);
  }else tog.querySelector('#showReadoutCb').checked=state.showReadout;
  const s=mk('subSec'), sl=mk('sliderSec'), ex=mk('explainSec');
  panel.appendChild(s); panel.appendChild(sl); panel.appendChild(ex);
  renderSubSec(s); renderSliders(sl); renderExplain(ex);
  updateReadout(); updateModeTag();
}

function updateReadout(){
  const strip=document.getElementById('coordStrip'); if(!strip)return;
  if(!state.showReadout){ strip.innerHTML=''; return; }
  let html='';
  if(state.mode==='build'){
    const E0=state.E0, t=state.t;
    html += kchip('外加场 @{E}₀ =', E0.toFixed(1)+' kV/m');
    html += kchip('建立进度 t =', Math.round(t*100)+'%');
    html += kchip('内部 |@{E}| =', (E0*(1-t)).toFixed(3)+' kV/m', t>=0.995?'acc':'warn');
    html += kchip('表面 σ(0°) =', (t*SIG_K*E0).toFixed(1)+' nC/m²','acc');
    html += kchip('表面 σ(90°) =', '0.0 nC/m²');
    html += kchip('感应电荷总量 =', '0.0 nC');
    html += kchip('状态 =', t>=0.995?'静电平衡':'电荷仍在移动', t>=0.995?'acc':'warn');
    document.getElementById('lgTitle').textContent='静电平衡的建立';
    document.getElementById('lgNote').innerHTML=richHTML(
      '正电荷顺场线、负电荷逆场线 ⇒ 表面堆出感应电荷 ⇒ 它的场在内部抵消外场');
  } else if(state.mode==='concl'){
    const p=probeInfo();
    html += kchip('P 的位置 (r, θ) =', '('+p.r.toFixed(2)+' m, '+Math.round(state.thp)+'°)');
    html += kchip('所在区域 =', zoneWord(p.zone), p.zone==='out'?'':'acc');
    html += kchip('|@{E}| =', p.mag.toFixed(3)+' kV/m', p.zone==='in'?'acc':'');
    html += kchip('法向分量 @{E}_n =', p.Er.toFixed(3)+' kV/m','acc');
    html += kchip('切向分量 @{E}_t =', p.Eth.toFixed(3)+' kV/m', Math.abs(p.Eth)<1e-9?'acc':'warn');
    html += kchip('切向占比 =', (p.ett*100).toFixed(1)+'%', p.ett<1e-9?'acc':'warn');
    html += kchip('@{E} 与法向夹角 =', p.ang.toFixed(1)+'°', p.ang<1e-9?'acc':'warn');
    html += kchip('电位 V(P) =', p.V.toFixed(3)+' kV', p.zone==='in'||p.zone==='surf'?'acc':'');
    if(p.sig!=null) html += kchip('该点 σ =', p.sig.toFixed(1)+' nC/m²','acc');
    document.getElementById('lgTitle').textContent='静电平衡的四个结论 · 探针 P';
    document.getElementById('lgNote').innerHTML=richHTML(
      '内部 @{E}≡0 · 表面 @{E}⊥面 · 导体是等位体（V≡0）· 电荷只在表面');
  } else {
    const E0=state.E0, qc=state.qc;
    const rHalf=B_C*0.5, rIn=B_C*0.95, rOut=A_C*1.0, rFar=A_C*2.0;
    const Ein=q=>Q_KV*q/(rIn*rIn);
    const Efar=q=>E0*(1+2*Math.pow(A_C/rFar,3)) + Q_KV*q/(rFar*rFar);
    html += kchip('外加场 @{E}₀ =', E0.toFixed(1)+' kV/m');
    html += kchip('腔内电荷 q =', sgnTxt(qc,2)+' µC');
    html += kchip('腔内 |@{E}|(r=b/2) =', (Q_KV*Math.abs(qc)/(rHalf*rHalf)).toFixed(3)+' kV/m',
      Math.abs(qc)<0.02?'acc':'warn');
    html += kchip('腔内 |@{E}|(r=0.95b) =', (Q_KV*Math.abs(qc)/(rIn*rIn)).toFixed(3)+' kV/m');
    html += kchip('壳内 |@{E}| =', '0.000 kV/m','acc');
    html += kchip('内表面总电荷 =', sigIn(qc).toFixed(1)+' nC','acc');
    html += kchip('外表面总电荷 =', (qc*1000).toFixed(1)+' nC','acc');
    html += kchip('外部 |@{E}|(r=2a,θ=0) =', Efar(qc).toFixed(3)+' kV/m');
    html += kchip('结论 =', Math.abs(qc)<0.02?'外场被完全屏蔽':'外部只认总量 q', 'acc');
    document.getElementById('lgTitle').textContent='静电屏蔽 · 空腔导体';
    document.getElementById('lgNote').innerHTML=richHTML(
      '腔内无电荷 ⇒ 腔内 @{E}≡0；腔内有电荷 ⇒ 内表面 −q、外表面 +q，外部只认总量');
  }
  strip.innerHTML=html;
}

/* ══════════════════════════════ 主循环 ══════════════════════════════ */
let needsRender=true;
function draw(){
  setupCamera(); ctx.clearRect(0,0,W,H);
  buildScene();
  prims.sort((a,b)=>a.z-b.z);
  for(const p of prims) p.draw(ctx);
  drawOverlays();
  const pt2=document.getElementById('panTag');
  if(pt2) pt2.classList.toggle('show',Math.abs(cam.px)>2||Math.abs(cam.py)>2);
  needsRender=false;
}
let _lastT=performance.now();
function tick(){
  const now=performance.now(); const dt=Math.min(0.05,(now-_lastT)/1000); _lastT=now;
  try{
    if(state.autoRotate){ cam.az+=0.0045; needsRender=true; }
    if(state.replay){
      state.t+=dt/2.4;
      if(state.t>=1){ state.t=1; state.replay=false; renderPanel(); }
      needsRender=true; syncSliders(); updateReadout(); updateModeTag();
    }
    if(state.mode==='concl' && state.sweep){
      if(state.sweep==='rad'){
        state.rp += dt*SWEEP_SPEED.rad;
        if(state.rp>RP_RANGE[1]) state.rp=RP_RANGE[1]-(state.rp-RP_RANGE[1]);
        if(state.rp<RP_RANGE[0]) state.rp=RP_RANGE[0]+(RP_RANGE[0]-state.rp);
      } else {
        state.rp=A_C;
        state.thp += dt*SWEEP_SPEED.surf;
        if(state.thp>TH_LIM[1]) state.thp=TH_LIM[1]-(state.thp-TH_LIM[1]);
        if(state.thp<TH_LIM[0]) state.thp=TH_LIM[0]+(TH_LIM[0]-state.thp);
      }
      needsRender=true; syncSliders();
      updateReadout(); updateModeTag();
      const pn=document.getElementById('probeNote'); if(pn) pn.innerHTML=richHTML(probeNote());
    }
    if(needsRender) draw();
  }catch(err){ needsRender=false; console.error('draw/tick error:',err); }
  requestAnimationFrame(tick);
}
function updateAll(){ needsRender=true; syncSliders(); updateReadout(); updateModeTag(); }

/* ══════════════════════════════ 交互 ══════════════════════════════ */
let drag=null;
function localPos(ev){const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};}
/* 探针 P = (r, θ) 两个自由度 ⇒ 拖动 = 把鼠标位移反解成 (Δr, Δθ)。
   两个世界基：B₁ = ∂P/∂r = (sinθ, 0, cosθ)、B₂ = ∂P/∂θ = (r cosθ, 0, −r sinθ)。
   它们在当前相机下的屏幕投影构成 2×2 矩阵 J；解 J·(Δr,Δθ) = mouseΔ 即可。
   ★ 与 2.1 线电荷的 xyJac() 是同一套技术（那里的两个基是 x̂/ŷ），这里换成 (r,θ) 的两个自然基。
   ★ J 会在"两个基的投影共线"时退化（例如 θ→0 时 B₂ ∥ x̂ 而视线正对 x̂）⇒ |det| 加下限，
     灵敏度被钳住（拖起来变钝）但绝不会飞出去，且越界还会被 clamp 兜住。 */
const P_HIT=26;
function probeJac(){
  const th=state.thp*D2R, r=state.rp;
  const B1=pt(Math.sin(th),0,Math.cos(th));
  const B2=pt(r*Math.cos(th),0,-r*Math.sin(th));
  const P1={x:camScale*vdot(B1,camU), y:-camScale*vdot(B1,camV)};
  const P2={x:camScale*vdot(B2,camU), y:-camScale*vdot(B2,camV)};
  const det0=P1.x*P2.y-P1.y*P2.x;
  const ref=camScale*camScale*vlen(B1)*vlen(B2);
  if(!isFinite(det0)||ref<1e-9) return null;
  return {P1,P2,det0,ref};
}
function overProbe(m){
  if(state.mode!=='concl') return false;
  const w=pr(probeP());
  return Math.hypot(m.x-w.x,m.y-w.y)<P_HIT;
}
canvas=document.getElementById('cv');
ctx=canvas.getContext('2d');
canvas.addEventListener('pointerdown',ev=>{
  canvas.setPointerCapture(ev.pointerId);
  const m=localPos(ev);
  if(ev.button===0 && overProbe(m)){ drag={x:m.x,y:m.y,btn:0,mode:'probe'}; ev.preventDefault(); return; }
  drag={x:m.x,y:m.y,btn:ev.button,mode:(ev.button===2||ev.ctrlKey)?'pan':'rot'};
  ev.preventDefault();
});
canvas.addEventListener('pointermove',ev=>{
  const m=localPos(ev);
  if(!drag){ canvas.style.cursor = overProbe(m) ? 'move' : ''; return; }
  const dx=m.x-drag.x, dy=m.y-drag.y; drag.x=m.x; drag.y=m.y;
  if(drag.mode==='probe'){
    state.sweep=null;
    const J=probeJac();
    if(J){
      const det=(Math.abs(J.det0) < 0.25*J.ref) ? ((J.det0>=0?1:-1)*0.25*J.ref) : J.det0;
      state.rp += (dx*J.P2.y - dy*J.P2.x)/det;
      state.thp += (J.P1.x*dy - J.P1.y*dx)/det*R2D;
      snapRp(); clampThp();
      needsRender=true; syncSliders(); updateReadout(); updateModeTag();
      const pn=document.getElementById('probeNote'); if(pn) pn.innerHTML=richHTML(probeNote());
    }
  }
  else if(drag.mode==='pan'){ cam.px+=dx; cam.py+=dy; needsRender=true; }
  else { cam.az-=dx*0.0075; cam.el=Math.max(-1.45,Math.min(1.45,cam.el+dy*0.0062)); needsRender=true; }
});
canvas.addEventListener('pointerup',()=>{ if(drag&&drag.mode==='probe') syncSliders(); drag=null; });
canvas.addEventListener('pointercancel',()=>{ if(drag&&drag.mode==='probe') syncSliders(); drag=null; });
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=Math.max(.45,Math.min(3.2,cam.zoom*(e.deltaY<0?1.09:1/1.09)));needsRender=true;},{passive:false});
document.getElementById('btnReset').onclick=()=>{ cam.az=.62; cam.el=.40; cam.zoom=1; cam.px=0; cam.py=0; needsRender=true; };
document.getElementById('btnRotate').onclick=e=>{state.autoRotate=!state.autoRotate;e.target.classList.toggle('on',state.autoRotate);};
document.getElementById('btnPanReset').onclick=()=>{cam.px=0;cam.py=0;needsRender=true;};
function bindFold(bid,cls){document.getElementById(bid).onclick=()=>{document.body.classList.toggle(cls);setTimeout(resize,60);setTimeout(resize,260);};}
bindFold('foldNav','nav-off'); bindFold('foldPanel','panel-off');
document.getElementById('tglNav').onclick=()=>{document.body.classList.toggle('nav-off');setTimeout(resize,260);};
document.getElementById('tglPanel').onclick=()=>{document.body.classList.toggle('panel-off');setTimeout(resize,260);};
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='['){document.body.classList.toggle('nav-off');setTimeout(resize,260);}
  if(e.key===']'){document.body.classList.toggle('panel-off');setTimeout(resize,260);}});

/* ══════════════════════════════ 页签 ══════════════════════════════ */
const MT=[{k:'build',t:'① 静电平衡的建立'},
          {k:'concl',t:'② 静电平衡的四个结论'},
          {k:'shield',t:'③ 静电屏蔽'}];
const modeTabs=document.getElementById('modeTabs');
MT.forEach(m=>{const b=document.createElement('button');b.textContent=m.t;b.dataset.k=m.k;
  b.onclick=()=>{ state.mode=m.k; state.cardTab='1'; state.sweep=null; state.replay=false;
    syncModeTabs(); cam.az=.62; cam.el=.40; cam.px=0; cam.py=0;
    renderPanel(); updateAll(); };
  modeTabs.appendChild(b);});
function syncModeTabs(){Array.from(modeTabs.children).forEach(b=>b.classList.toggle('on',b.dataset.k===state.mode));}

function resize(){
  const r=canvas.getBoundingClientRect();
  const nw=Math.max(60,Math.round(r.width)),nh=Math.max(60,Math.round(r.height));
  DPR=Math.min(2,window.devicePixelRatio||1);
  if(nw===W&&nh===H&&canvas.width===Math.round(nw*DPR))return;
  W=nw;H=nh;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0); needsRender=true;
}
new ResizeObserver(()=>resize()).observe(canvas);

const nav=document.getElementById('nav');
NAV.forEach(g=>{nav.appendChild(h('<div class="nav-ch">'+g.ch+'</div>'));
  g.items.forEach(it=>{const cls='nav-item'+(it.active?' active':'')+(it.ready?'':' soon');
    nav.appendChild(h('<a class="'+cls+'" '+(it.href?'href="'+it.href+'"':'')+'><span class="dot"></span>'+it.t+'</a>'));});});

clampRp(); clampThp();
syncModeTabs();
resize();
renderPanel();
updateAll();
tick();

</script>
