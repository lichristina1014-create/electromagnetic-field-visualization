.nav-item:hover{background:#F5F9FB;}

      否则宽度会有 0.22s 的追赶延迟，鼠标跑得越快面板越"跟不上"。 */
.panel-resizer{flex:0 0 11px;width:11px;margin:0 -5px;align-self:stretch;cursor:col-resize;position:relative;z-index:7;}
.panel-resizer::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:3px;height:46px;border-radius:2px;background:#DCE6EB;transition:background .15s,height .15s;}

body.resizing,body.resizing .panel,body.resizing aside{transition:none!important;}
body.resizing{user-select:none;cursor:col-resize;}
body.panel-off .panel-resizer{display:none;}
.view-toggles{display:flex;gap:6px;margin-right:6px;}

.cv-pan-tag button{border:1px solid #E0BE8C;background:#fff;border-radius:6px;padding:2px 9px;font-size:11.5px;color:#8A5A20;cursor:pointer;font-family:inherit;}
.cv-pan-tag button:hover{background:#8A5A20;color:#fff;border-color:#8A5A20;}

.coord-chip.acc{background:#F5F0FA;border-color:#E2D4F0;}

.panel{width:var(--panel-w,398px);flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow-y:auto;box-shadow:0 1px 4px rgba(30,60,80,.05);}

.panel-sec:last-child{border-bottom:none;}
.readout-toggle{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:12px;background:#F3F8FA;border:1px solid #E2ECF1;border-radius:8px;cursor:pointer;font-size:12.5px;line-height:1.5;color:var(--muted);}

.sec-title{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sec-title::before{content:"";width:3px;height:12px;background:var(--teal);border-radius:2px;}
.sub-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 13px;font-size:12.5px;line-height:1.5;cursor:pointer;font-family:inherit;color:var(--muted);transition:all .15s;}
.chip:hover{border-color:var(--teal);color:var(--teal);}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
.chip.pre{border-style:dashed;border-color:#C9D6DD;color:#7A8F9B;}
.chip.pre:hover{border-color:var(--orange);color:var(--orange);background:#FFF8F2;}
.chip.g.on{background:var(--green);border-color:var(--green);}
.chip.o.on{background:var(--orange);border-color:var(--orange);}
.chip.p.on{background:var(--purple);border-color:var(--purple);}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.slider-row label{width:46px;font-size:13px;font-style:italic;font-family:Georgia,serif;color:var(--ink);text-align:right;flex-shrink:0;}
.slider-row.w label{width:62px;font-style:normal;font-family:inherit;}
.slider-row input[type=range]{flex:1;accent-color:var(--teal);height:4px;cursor:pointer;}
.slider-row .val{width:62px;font-size:12px;color:var(--muted);font-family:Menlo,monospace;flex-shrink:0;}
.ex-title{font-size:14.5px;font-weight:700;color:var(--teal-dark);margin-bottom:8px;line-height:1.45;}
.ex-body{font-size:14px;line-height:1.7;color:#3A5462;}

.ex-body ul{padding-left:18px;margin:6px 0;}

.ex-note{font-size:12.5px;line-height:1.65;color:#6B8290;background:#F7FAFB;border:1px solid #E7EFF3;border-radius:8px;padding:8px 11px;margin-top:9px;}
.frm{display:block;background:#F4F9FB;border:1px solid #DDE9EF;border-left:3px solid var(--teal);border-radius:8px;padding:10px 14px 10px 18px;margin:10px 0;font-size:14px;line-height:1.7;font-family:Georgia,"Times New Roman",serif;color:var(--ink);overflow-x:auto;white-space:nowrap;}

.vec::before,.vec::after{content:'';position:absolute;pointer-events:none;}
.vec::before{left:0;right:.24em;top:-.28em;height:1px;background:currentColor;opacity:.9;}

.card-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px;}

#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(31,61,76,.94);color:#fff;font-size:13px;padding:9px 20px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;}

'use strict';

/* ============================== 向量工具（与 2.1 / 2.2 同源） ============================== */
const pt=(x,y,z)=>({x,y,z});
const vadd=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z});
const vsub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z});
const vmul=(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s});
const vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const vlen=a=>Math.hypot(a.x,a.y,a.z);

const D2R=Math.PI/180, R2D=180/Math.PI;

const sstep=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};

/* ============================== 富文本引擎（同源，勿改语义） ============================== */
function parseRich(s){
  const items=[], groups=[]; const st={g:-1};
  (function walk(str){
    let buf='';
    const flush=()=>{ if(buf){ items.push({t:'n',s:buf,g:st.g}); buf=''; } };
    for(let i=0;i<str.length;){
      const c=str[i];
      if(c==='@' && str[i+1]==='{'){
        const j=str.indexOf('}', i+2);
        if(j<0){ buf+=c; i++; continue; }
        flush();
        const save=st.g; st.g=groups.length; groups.push(1);
        walk(str.slice(i+2,j)); st.g=save; i=j+1; continue;
      }
      if(c==='_'){
        flush();
        if(str[i+1]==='{'){ const j=str.indexOf('}',i+2);
          if(j>=0){ items.push({t:'s',s:str.slice(i+2,j),g:st.g}); i=j+1; continue; } }
        items.push({t:'s',s:str[i+1]||'',g:st.g}); i+=2; continue;
      }
      if(c==='<'){ const j=str.indexOf('>',i);
        if(j>=0){ buf+=str.slice(i,j+1); i=j+1; continue; } }
      buf+=c; i++;
    }
    flush();
  })(String(s));
  return {items, groups};
}
const RICHFONT='"PingFang SC","Microsoft YaHei",sans-serif';

         场景右缘 = W/2 + 164，卡片左缘 = W − 268 ⇒ **W < 864 就开始重叠**。
      用户反馈的正是这个（窄窗口下卡片盖住了右边的介质盒）。

      ① 只要够宽就把场景居中不动（W ≥ 864 时行为与旧版**完全一致**）；
      ② 不够宽就把场景整体左移到卡片左边；实在放不下（cx 被压到可用区的 30% 以左）

const CARD_W=252, CARD_X=()=>W-CARD_W-16, CARD_Y=62;

  const ca=Math.cos(cam.az),sa=Math.sin(cam.az),ce=Math.cos(cam.el),se=Math.sin(cam.el);

/* ============================================================================
   5.4 电磁场遇到介质边界会怎样 —— 物理模型与几何
   ----------------------------------------------------------------------------
   ★★ 两个页签（对应 LCL-第5章 PPT 第 38–50 页 = 5.4 分界面衔接条件 + 扩展）：
       ① 衔接条件：跨界面小矩形回路（高 h 可压扁）⇒ ∮E·dl=(E_1t−E_2t)·l，
         而右端 −dΦ_B/dt·(l·h) 随 h→0 ⇒ **E_1t = E_2t**（切向连续）；
         高斯扁盒 ⇒ D_2n − D_1n = σ_s（法向跳变 = 自由面电荷）。
       ② 反射与透射（扩展）：斜入射平面波 ⇒ 反射角=入射角、
         斯涅尔定律定透射角、菲涅尔系数定幅值；n₁>n₂ 且 θ>θ_c ⇒ 全反射。

   ★★ 物理（μ_r=1，归一化阻抗 η_i = 1/n_i，n_i=√ε_ri）：
       斯涅尔：n₁·sinθ_i = n₂·sinθ_t
       垂直极化（E⊥入射面）：Γ⊥=(η₂cosθ_i−η₁cosθ_t)/(η₂cosθ_i+η₁cosθ_t)
                            T⊥=2η₂cosθ_i/(η₂cosθ_i+η₁cosθ_t)
       平行极化：Γ∥=(η₂cosθ_t−η₁cosθ_i)/(η₂cosθ_t+η₁cosθ_i)
       能量：R=|Γ|²，T_能=(n₂cosθ_t)/(n₁cosθ_i)·|T|²，R+T_能=1
       全反射：sinθ_t>1（n₁>n₂ 且 θ_i>θ_c=asin(n₂/n₁)）

   ★ 世界坐标：xy 平面侧视（y=界面法向，上=介质1，下=介质2），相机近俯视。
   ============================================================================ */

/* ============================== 状态 ============================== */
const state = {
  mode:'bc',                   /* bc 衔接条件 | rt 反射透射 */
  /* ① 的参数 */
  th1:35,                      /* 介质1 中 E_1 与界面的夹角 ° */
  hLoop:0.14,                  /* 小矩形回路高度 m（可压扁到 0.02） */
  epsr1:1, epsr2:4,            /* 两侧介电常数 */
  sigmaS:0.6,                  /* 界面自由面电荷 σ_s（归一化） */
  /* ② 的参数 */
  thI:35,                      /* 入射角 ° */
  pol:'perp',                  /* perp ⊥ | para ∥ */
  t:0, playing:true,
  anim:null,
  showReadout:true,
  autoRotate:false,
  cardTab:'1',
  /* ⚠️⚠️ 键必须与 SHOW_ITEMS（page1.js）逐字对齐（两页签取并集） */
  show:{ bc:true, dn:true, fronts:true },
};
const EPSR_RANGE=[1,9], TH1_RANGE=[5,80], H_RANGE=[0.02,0.2],
      THI_RANGE=[5,85], SIGS_RANGE=[0,1.5];
const PRESET={
  bc:{th1:35, hLoop:0.14, epsr1:1, epsr2:4, sigmaS:0.6},
  rt:{thI:35, epsr1:1, epsr2:4, pol:'perp'},
};
function clampState(){
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  state.th1=cl(state.th1,TH1_RANGE[0],TH1_RANGE[1]);
  state.hLoop=cl(state.hLoop,H_RANGE[0],H_RANGE[1]);
  state.epsr1=cl(state.epsr1,EPSR_RANGE[0],EPSR_RANGE[1]);
  state.epsr2=cl(state.epsr2,EPSR_RANGE[0],EPSR_RANGE[1]);
  state.sigmaS=cl(state.sigmaS,SIGS_RANGE[0],SIGS_RANGE[1]);
  state.thI=cl(state.thI,THI_RANGE[0],THI_RANGE[1]);
  state.t=((state.t%1)+1)%1;         /* ② 的相位 ∈[0,1) */
  return state;
}

/* ============================== ① 衔接条件 ============================== */
/* 介质1 中 E_1 固定方向（与界面夹角 th1）；E_2 由衔接条件解出：
   E_2t = E_1t；ε₂E_2n = ε₁E_1n + σ_s（法向 D 跳变 = 自由面电荷） */
function bcFields(){
  const a=state.th1*Math.PI/180;
  const E1={t:Math.cos(a), n:-Math.sin(a)};      /* E_1 归一化幅值 1，法向朝下 */
  const E2={t:E1.t, n:(state.epsr1*E1.n+state.sigmaS)/state.epsr2};
  return {E1,E2};
}
/* 小矩形回路的 ∮E·dl（= (E_1t−E_2t)·l，与 h 无关 ⇒ h→0 时右端 −dΦ/dt·lh→0 ⇒ 连续） */
function loopCirc(){ const {E1,E2}=bcFields(); return (E1.t-E2.t)*0.3; }

/* ============================== ② 反射与透射 ============================== */
function nmed(i){ return Math.sqrt(i===1?state.epsr1:state.epsr2); }
/* 透射角（斯涅尔）；全反射时返回 null */
function snellT(thIdeg){
  const s=nmed(1)*Math.sin(thIdeg*Math.PI/180)/nmed(2);
  return Math.abs(s)<=1 ? Math.asin(s)*180/Math.PI : null;
}
function criticalDeg(){ return nmed(1)>nmed(2) ? Math.asin(nmed(2)/nmed(1))*180/Math.PI : null; }
/* 菲涅尔系数（场强比）；全反射 ⇒ Γ 模为 1 */
function fresnel(thIdeg){
  const thT=snellT(thIdeg);
  const n1=nmed(1), n2=nmed(2), eta1=1/n1, eta2=1/n2;
  const ci=Math.cos(thIdeg*Math.PI/180);
  if(thT===null) return {G:1, T:0, R:1, Te:0, thT:null, tir:true};
  const ct=Math.cos(thT*Math.PI/180);
  let G,T;
  if(state.pol==='perp'){ G=(eta2*ci-eta1*ct)/(eta2*ci+eta1*ct); T=2*eta2*ci/(eta2*ci+eta1*ct); }
  else { G=(eta2*ct-eta1*ci)/(eta2*ct+eta1*ci); T=2*eta2*ci/(eta2*ct+eta1*ci); }
  const R=G*G, Te=(n2*ct)/(n1*ci)*T*T;
  return {G,T,R,Te,thT,tir:false};
}

/* ---------- 画布小卡助手 ---------- */
function txt(x,y,str,o={}){
  ctx.save();
  const lo=richLayout(ctx,parseRich(str),o.size||12,!!o.bold);
  richDraw(ctx,lo,x,y,o.align||'left',o.color||C.ink);
  ctx.restore();
}
function rrPath(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w,y+h-r);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x+r,y+h);
  ctx.lineTo(x,y+h-r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function crd(x,y,w,h){
  ctx.save(); ctx.shadowColor='rgba(30,60,80,.10)'; ctx.shadowBlur=8; ctx.shadowOffsetY=2;
  rrPath(x,y,w,h,10); ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fill(); ctx.restore();
  ctx.save(); rrPath(x,y,w,h,10); ctx.strokeStyle='#DCE6EB'; ctx.lineWidth=1; ctx.stroke(); ctx.restore();
}
const ZL = 1e4+40;
const M1_FILL = '#0F9ED5';         /* 介质 1（淡蓝） */
const M2_FILL = '#E97132';         /* 介质 2（淡橙） */

const E1_HEX  = '#136A9B';         /* E_1 */

const RR_HEX  = '#E97132';         /* 反射 */

function arcPts(cx,cy,r,a0,a1,n=24){     /* xy 平面角弧（从 a0 到 a1，°） */
  const pts=[];
  for(let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; pts.push(pt(cx+r*Math.cos(a),cy+r*Math.sin(a),0)); }
  return pts;
}

/* ══════════════════════════ 右上角信息卡 ══════════════════════════ */
function infoCard(title,rows,h){
  const x0=CARD_X(), y0=CARD_Y, w=CARD_W;
  crd(x0,y0,w,h);
  txt(x0+12,y0+15,title,{size:11.5,bold:true,color:'#1F3D4C'});
  rows.forEach((r,i)=>{
    const y=y0+38+i*19;
    const markerOnly=(r[0]==='§');
    if(markerOnly || (r.length===1 && String(r[0]||'')[0]==='§')){
      const lab=markerOnly ? String(r[1]==null?'':r[1]) : String(r[0]).slice(1);
      txt(x0+11,y,lab.trim(),{size:11,bold:true,color:r[2]||'#1F3D4C'}); return;
    }
    let lab=String(r[0]==null?'':r[0]);
    if(lab[0]==='§') lab=lab.slice(1).trim();
    txt(x0+13,y,lab,{size:11,color:'#5F7482'});
    txt(x0+w-13,y,r[1]==null?'':String(r[1]),{size:11,bold:true,color:r[2]||'#0E4A66',align:'right'});
  });
}

/* ══════════════════════════ ① 衔接条件推导 ══════════════════════════ */
function drawBC(){
  if(state.mode!=='bc') return;
  const {E1,E2}=bcFields();
  /* E_1（介质1，入射点左）与 E_2（介质2，右） */
  const P1=pt(-0.20,0.17,0), P2=pt(0.22,-0.17,0);
  const L1=0.15, L2=0.15*Math.hypot(E2.t,E2.n);
  arrow(P1, vadd(P1,pt(E1.t*L1,E1.n*L1,0)), {color:E1_HEX,w:2.6,headScale:1.05,z:ZL-1});
  arrow(P2, vadd(P2,pt(E2.t*L2/Math.hypot(E2.t,E2.n),E2.n*L2/Math.hypot(E2.t,E2.n),0)), {color:E2_HEX,w:2.6,headScale:1.05,z:ZL-1});
  text(P1, '@{E}_1', {color:E1_HEX,size:12,bold:true,dx:-10,dy:-14,align:'right',z:ZL});
  text(P2, '@{E}_2', {color:E2_HEX,size:12,bold:true,dx:10,dy:16,z:ZL});
  /* 切向/法向分量（E_2 的分解，界面附近） */
  if(state.show.bc){
    const b0=pt(0.22,0,0);
    arrow(b0, vadd(b0,pt(E2.t*0.15,0,0)), {color:ET_HEX,w:2.0,dash:[5,3],headScale:0.9,z:ZL-1});
    arrow(b0, vadd(b0,pt(0,E2.n*0.15,0)), {color:EN_HEX,w:2.0,dash:[5,3],headScale:0.9,z:ZL-1});
    text(b0, 'E_2t', {color:ET_HEX,size:10.5,bold:true,dx:16,dy:-4,z:ZL});
    text(b0, 'E_2n', {color:EN_HEX,size:10.5,bold:true,dx:6,dy:-18,z:ZL});
  }
  /* 小矩形回路（跨界面，高 h 可压扁）：∮E·dl=(E_1t−E_2t)·l */
  const h=state.hLoop, x0=-0.10, l=0.20;
  const yT=h/2, yB=-h/2;
  arrow(pt(x0,yT,0), pt(x0+l,yT,0), {color:ET_HEX,w:1.8,headScale:0.9,z:ZL-2});
  arrow(pt(x0+l,yB,0), pt(x0,yB,0), {color:ET_HEX,w:1.8,headScale:0.9,z:ZL-2});
  line(pt(x0,yB,0), pt(x0,yT,0), {color:'#8AA3AF',w:1.2,dash:[4,3],z:ZL-2});
  line(pt(x0+l,yB,0), pt(x0+l,yT,0), {color:'#8AA3AF',w:1.2,dash:[4,3],z:ZL-2});
  text(pt(x0+l/2,yT,0), 'l（上边在介质 1）', {color:ET_HEX,size:10.5,dx:0,dy:-8,align:'center',z:ZL});
  text(pt(x0,yB,0), 'h→0', {color:'#5F7482',size:10.5,dx:-6,dy:14,align:'right',z:ZL});
  /* 高斯扁盒（法向 D_n） */
  if(state.show.dn){
    const gx=-0.34, gw=0.12, gh=0.05;
    poly([pt(gx,-gh,0),pt(gx+gw,-gh,0),pt(gx+gw,gh,0),pt(gx,gh,0)],
         {fill:EN_HEX,stroke:EN_HEX,w:1.2,dash:[5,3],fillAlpha:0.08,strokeAlpha:0.9,z:ZL-2});
    const {E1:F1,E2:F2}=bcFields();
    const D1n=state.epsr1*F1.n, D2n=state.epsr2*F2.n;
    arrow(pt(gx+gw/2,gh,0), pt(gx+gw/2,gh+0.09*Math.sign(D1n||1)*Math.min(1,Math.abs(D1n)),0), {color:EN_HEX,w:2.0,headScale:0.9,z:ZL-1});
    arrow(pt(gx+gw/2,-gh,0), pt(gx+gw/2,-gh-0.09*Math.sign(D2n||1)*Math.min(1,Math.abs(D2n)),0), {color:EN_HEX,w:2.0,headScale:0.9,z:ZL-1});
    text(pt(gx+gw/2,-gh,0), 'D_n 扁盒', {color:EN_HEX,size:10.5,bold:true,dx:0,dy:26,align:'center',z:ZL});
  }
}

/* ══════════════════════════ ② 反射与透射 ══════════════════════════ */
function drawRT(){
  if(state.mode!=='rt') return;
  const thI=state.thI*Math.PI/180;
  const F=fresnel(state.thI);
  const OG=pt(0,0,0), RAY=0.46;
  /* 入射（左上→原点）、反射（→右上）、透射（→右下，折射角 θ_t） */
  const di=pt(Math.sin(thI),-Math.cos(thI),0);
  const Pi=vsub(OG,vmul(di,RAY));
  arrow(Pi, OG, {color:RI_HEX,w:3.0,headScale:1.15,z:ZL-1});
  arrow(OG, vadd(OG,pt(Math.sin(thI)*RAY*0.9,Math.cos(thI)*RAY*0.9,0)),
        {color:RR_HEX,w:1.4+2.2*Math.abs(F.G),headScale:1.15,z:ZL-1});
  if(F.thT!==null){
    const thT=F.thT*Math.PI/180;
    arrow(OG, vadd(OG,pt(Math.sin(thT)*RAY*0.9,-Math.cos(thT)*RAY*0.9,0)),
          {color:RT_HEX,w:1.4+2.2*Math.abs(F.T),headScale:1.15,z:ZL-1});
  } else {
    /* 全反射：界面下方画衰减隐失波提示 */
    for(let i=0;i<3;i++)
      line(pt(0.06+i*0.05,-0.03,0), pt(0.06+i*0.05,-0.05,0), {color:RT_HEX,w:1.2,alpha:0.5-0.15*i,dash:[3,3],z:ZL-2});
  }
  /* 相位脉冲沿三条射线走（t∈[0,1)） */
  const pulse=(p0,p1,col)=>{
    const q=vadd(p0,vmul(vsub(p1,p0),state.t));
    marker(q,{r:4.2,color:col,ring:'#fff',z:ZL+2});
  };
  pulse(Pi,OG,RI_HEX);
  pulse(OG,vadd(OG,pt(Math.sin(thI)*RAY*0.9,Math.cos(thI)*RAY*0.9,0)),RR_HEX);
  if(F.thT!==null){ const thT=F.thT*Math.PI/180;
    pulse(OG,vadd(OG,pt(Math.sin(thT)*RAY*0.9,-Math.cos(thT)*RAY*0.9,0)),RT_HEX); }
  /* 法线 + 角弧（θ_i 在法线左侧，θ_r 在右侧，θ_t 在下方） */
  line(pt(0,0.40,0), pt(0,-0.40,0), {color:'#8AA3AF',w:1.2,dash:[5,4],z:ZL-3});
  if(state.show.fronts){
    curve(arcPts(0,0,0.17,90,90+state.thI), {color:RI_HEX,w:1.4,z:ZL-2});
    curve(arcPts(0,0,0.17,90-state.thI,90), {color:RR_HEX,w:1.4,z:ZL-2});
    text(pt(0,0,0), 'θ_i', {color:RI_HEX,size:11,bold:true,dx:-30,dy:30,align:'right',z:ZL});
    if(F.thT!==null){
      curve(arcPts(0,0,0.17,-90,-90+F.thT), {color:RT_HEX,w:1.4,z:ZL-2});
      text(pt(0,0,0), 'θ_t', {color:RT_HEX,size:11,bold:true,dx:26,dy:44,z:ZL});
    }
  }
  /* 射线标签（固定屏幕偏移，避免与弧撞） */
  text(Pi, '入射 1.0', {color:RI_HEX,size:11,bold:true,dx:-10,dy:18,align:'right',z:ZL});
  text(vadd(OG,pt(Math.sin(thI)*RAY*0.9,Math.cos(thI)*RAY*0.9,0)), '反射 |Γ|='+Math.abs(F.G).toFixed(2),
       {color:'#8A4A12',size:11,bold:true,dx:10,dy:-10,z:ZL});
  text(vadd(OG,pt(0.10,-0.30,0)), F.thT!==null?('透射 |T|='+Math.abs(F.T).toFixed(2)):'全反射（θ_i > θ_c）',
       {color:'#27500A',size:11,bold:true,dx:0,dy:16,z:ZL});
}

function currentCard(){

      ['电磁项 −dΦ_B/dt ∝ l·h', 'h='+state.hLoop.toFixed(2)+' m ⇒ 随 h→0', '#B85A1E'],
      ['D_2n − D_1n', (D2n-D1n).toFixed(2)+' = σ_s = '+state.sigmaS.toFixed(2),'#72243E'],
      ['§ 结论（PPT 第 44–48 页）'],
      ['E_t 连续 · H_t 连续（无面电流）','D_n 跳 σ_s · B_n 连续','#2E7D32'],
    ],38+8*19+8];
  }
  const F=fresnel(state.thI), thC=criticalDeg();
  const rows=[
    ['入射角 θ_i', state.thI.toFixed(1)+'°'],
    ['反射角 θ_r', state.thI.toFixed(1)+'°（= θ_i）'],
  ];
  if(F.thT!==null){
    rows.push(['透射角 θ_t（斯涅尔）', F.thT.toFixed(1)+'°','#27500A']);
    rows.push(['Γ（'+(state.pol==='perp'?'⊥':'∥')+' 极化反射系数）', F.G.toFixed(3),'#B85A1E']);
    rows.push(['T（透射系数）', F.T.toFixed(3),'#27500A']);
    rows.push(['能量：R + T_能', (F.R+F.Te).toFixed(4)+'（=1）','#2E7D32']);
  } else {
    rows.push(['透射角', '无实数解 ⇒ 全反射','#C62828']);
    rows.push(['|Γ|', '1（全反射）','#C62828']);
    rows.push(['界面下方', '只剩隐失波（不进能量）','#B85A1E']);
  }
  if(thC!==null) rows.push(['临界角 θ_c = asin(n₂/n₁)', thC.toFixed(1)+'°','#72243E']);
  rows.push(['§ 物理图像']);
  rows.push([F.thT!==null?'光密→光疏还是光疏→光密，看折射角':'能量 100% 反射回介质 1',
             nmed(1)>nmed(2)?'n₁>n₂（向光疏）':'n₁<n₂（向光密）']);
  return ['反射与透射（扩展）', rows, 38+rows.length*19+8];
}

let needsRender=true;
function draw(){
  setupCamera(); ctx.clearRect(0,0,W,H);
  buildScene();
  prims.sort((a,b)=>a.z-b.z);
  for(const p of prims) p.draw(ctx);
  drawOverlays();
  const tg=document.getElementById('panTag');
  if(tg) tg.classList.toggle('show',Math.abs(cam.px)>2||Math.abs(cam.py)>2);
  needsRender=false;
}
let _lastT=0;
function tick(ts){
  try{
    const dt=_lastT?Math.min(0.05,(ts-_lastT)/1000):0.016; _lastT=ts||0;
    if(state.playing && state.mode==='rt'){
      state.t+=dt*0.45;
      if(state.t>=1) state.t-=1;
      needsRender=true;
    }
    if(state.autoRotate){ cam.az+=0.0045; needsRender=true; }
    if(needsRender) draw();
  }catch(err){ needsRender=false; console.error('draw/tick error:',err); }
  requestAnimationFrame(tick);
}
function updateAll(){ needsRender=true; syncSliders(); updateReadout(); updateModeTag(); }
function playPause(){ state.playing=!state.playing; }
function stopAnim(){ state.playing=false; }

let drag=null;
function localPos(ev){const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};}
canvas=document.getElementById('cv');
ctx=canvas.getContext('2d');
canvas.addEventListener('pointerdown',ev=>{
  try{ canvas.setPointerCapture(ev.pointerId); }catch(e){}
  const m=localPos(ev);
  drag={x:m.x,y:m.y,btn:ev.button,mode:(ev.button===2||ev.ctrlKey)?'pan':'rot'};
  ev.preventDefault();
});
canvas.addEventListener('pointermove',ev=>{
  const m=localPos(ev);
  if(!drag) return;
  const dx=m.x-drag.x, dy=m.y-drag.y; drag.x=m.x; drag.y=m.y;
  if(drag.mode==='pan'){ cam.px+=dx; cam.py+=dy; needsRender=true; }
  else { cam.az-=dx*0.0075; cam.el=Math.max(-1.45,Math.min(1.45,cam.el+dy*0.0062)); needsRender=true; }
});
canvas.addEventListener('pointerup',()=>{ drag=null; });

window.addEventListener('resize',()=>{ const cur=panelEl.getBoundingClientRect().width;
  if(cur>panelMaxW()) setPanelW(cur,true); });

/* ══════════════════════════════ 页签 / 相机 / 启动 ══════════════════════════════ */
const CAM0={az:-1.45, el:1.25};
const MT=[{k:'bc', t:'① 衔接条件（推导）'},
          {k:'rt', t:'② 反射与透射（扩展）'}];
const modeTabs=document.getElementById('modeTabs');
MT.forEach(m=>{const b=document.createElement('button');b.textContent=m.t;b.dataset.k=m.k;
  b.onclick=()=>{ stopAnim(); state.mode=m.k; state.cardTab='1';
    Object.assign(state, JSON.parse(JSON.stringify(PRESET[m.k])));
    clampState();
    syncModeTabs(); cam.az=CAM0.az; cam.el=CAM0.el; cam.zoom=1.12; cam.px=0; cam.py=0;
    renderPanel(); updateAll(); };
  modeTabs.appendChild(b);});
function syncModeTabs(){Array.from(modeTabs.children).forEach(b=>b.classList.toggle('on',b.dataset.k===state.mode));}

function resize(){
  const r=canvas.getBoundingClientRect();
  const nw=Math.max(60,Math.round(r.width)),nh=Math.max(60,Math.round(r.height));
  DPR=Math.min(2,window.devicePixelRatio||1);
  if(nw===W&&nh===H&&canvas.width===Math.round(nw*DPR))return;
  W=nw;H=nh;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0); needsRender=true;
  placeLegend();
}
new ResizeObserver(()=>resize()).observe(canvas);

const nav=document.getElementById('nav');
NAV.forEach(g=>{nav.appendChild(h('<div class="nav-ch">'+g.ch+'</div>'));
  g.items.forEach(it=>{const cls='nav-item'+(it.active?' active':'')+(it.ready?'':' soon');
    nav.appendChild(h('<a class="'+cls+'" '+(it.href?'href="'+it.href+'"':'')+'><span class="dot"></span>'+it.t+'</a>'));});});

cam.az=CAM0.az; cam.el=CAM0.el; cam.zoom=1.12;
syncModeTabs();
resize();
renderPanel();
updateAll();
tick(0);

</script>
</body>
</html>
