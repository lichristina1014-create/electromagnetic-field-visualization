<script>
'use strict';
/* 1.5 环量与旋度 · 斯托克斯定理 —— 复用 1.3/1.4 同源引擎 */

const NAV = [
  { ch:'第 1 章 · 矢量分析', items:[
    { id:'coord',  t:'1.1 三种常见坐标系', ready:true, href:'index.html' },
    { id:'ch1-2',  t:'1.2 矢量的代数运算', ready:true, href:'1.2-vector-algebra.html' },
    { id:'ch1-3',  t:'1.3 方向导数与梯度', ready:true, href:'1.3-directional-derivative.html' },
    { id:'ch1-4',  t:'1.4 通量与散度',     ready:true, href:'1.4-divergence-flux.html' },
    { id:'ch1-5',  t:'1.5 环量与旋度',     ready:true, active:true },
  ]},
  { ch:'第 2 章 · 静电场', items:[ {t:'2.1 电场强度与电位'}, {t:'2.2 高斯定理及其应用'}, {t:'2.3 导体与电介质'} ]},
  { ch:'第 3 章 · 恒定磁场', items:[ {t:'3.1 比奥-萨伐尔定律'}, {t:'3.2 安培环路定理'} ]},
  { ch:'第 4 章 · 时变电磁场', items:[ {t:'4.1 麦克斯韦方程组'}, {t:'4.2 均匀平面波'} ]},
];

const pt=(x,y,z)=>({x,y,z});
const vadd=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z});
const vsub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z});
const vmul=(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s});
const vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const vlen=a=>Math.hypot(a.x,a.y,a.z);
const vnorm=a=>{const l=vlen(a)||1;return vmul(a,1/l);};
const vcross=(a,b)=>({x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x});
const D2R=Math.PI/180, R2D=180/Math.PI;

/* === 三个示例矢量场 ===
   V1: 纯旋转场 A = (-y, x, 0)，∇×A = (0,0,2)（绕 z 轴正方向旋转） */
const V1=p=>pt(-p.y, p.x, 0);
const curlV1=p=>pt(0,0,2);
/* V2: 中心源汇对 A = (x, -y, 0)，∇×A = (0,0,0)（无旋场，可视为保守场） */
const V2=p=>pt(p.x, -p.y, 0);
const curlV2=p=>pt(0,0,0);
/* V3: 螺旋场 A = (-y, x, z)，∇×A = (0,0,2)（与V1 类似，但带 z 分量变化） */
const V3=p=>pt(-p.y, p.x, p.z*0.3);
const curlV3=p=>pt(0,0,2);

const state = {
  mode:'circ',                            /* circ | circdens | curl | stokes */
  field:1,                                /* 1 V1 2 V2 3 V3 */
  loopR:0.7,                              /* 主闭合回路半径 */
  loopCx:0, loopCy:0,                     /* 回路中心 */
  N:3,                                    /* 斯托克斯网格密度 */
  show:{ vec:true, loop:true, surf:true, cancel:true, labels:true, box:true },
  cardTab:'1',
  showReadout:true,
  autoRotate:false,
  /* --- 环量页（小溪 + 风车 + 杯子）--- */
  circView:'stream',                      /* stream | cup：环量页两个子视图 */
  pinX:0.55, pinY:0.0,                    /* 风车位置（世界坐标，可拖动） */
  cupSpin:false,                          /* 杯子：是否在搅动（旋转） */
  cupSpinSpeed:0,                         /* 杯子：当前旋转角速度（°/s，衰减用） */
  pinAngle:0,                             /* 风车叶片累积角度（动画） */
  cupAngle:0,                             /* 杯水累积角度（动画） */
  /* --- 环量密度页 --- */
  loopDir:1,                              /* 绕行方向：1=逆时针(n=+z) -1=顺时针(n=−z) */
  circShrink:false,                       /* 「缩小到 P」动画开关 */
};

function field(){ return state.field===1?V1:(state.field===2?V2:V3); }
function curlF(){ return state.field===1?curlV1:(state.field===2?curlV2:curlV3); }
function fieldName(){ return state.field===1?'@{A}=(-y, x, 0)':(state.field===2?'@{A}=(x, -y, 0)':'@{A}=(-y, x, 0.3z)'); }

/* --- 富文本引擎 --- */
function parseRich(s){
  const items=[], groups=[]; const st={g:-1};
  (function walk(str){
    let buf='';
    const flush=()=>{ if(buf){ items.push({t:'n',s:buf,g:st.g}); buf=''; } };
    for(let i=0;i<str.length;){
      const c=str[i];
      if(c==='@' && str[i+1]==='{'){
        const j=str.indexOf('}', i+2);
        if(j<0){ buf+=c; i++; continue; }
        flush();
        const save=st.g; st.g=groups.length; groups.push(1);
        walk(str.slice(i+2,j)); st.g=save; i=j+1; continue;
      }
      if(c==='_'){
        flush();
        if(str[i+1]==='{'){ const j=str.indexOf('}',i+2);
          if(j>=0){ items.push({t:'s',s:str.slice(i+2,j),g:st.g}); i=j+1; continue; } }

const C = {teal:'#156082',orange:'#E97132',green:'#3E9B4F',purple:'#9B59B6',crimson:'#D04A3A',blue:'#0F9ED5',gray:'#8CA0AC',light:'#C9D6DD',ink:'#22414F',grid:'#EAF0F4',muted:'#7A8F9B'};

/* 闭合回路采样（圆心 + 半径 + z） */
function loopSamples(cx,cy,r,z,n){
  const out=[]; for(let i=0;i<=n;i++){ const a=2*Math.PI*i/n;
    out.push(pt(cx+r*Math.cos(a), cy+r*Math.sin(a), z)); } return out; }

/* 沿闭合回路的线积分 ∮ A·dl（数值） */
function circulation(cx,cy,r,z,A,n){
  const pts=loopSamples(cx,cy,r,z,n);
  let sum=0;
  for(let i=0;i<n;i++){
    const a=pts[i], b=pts[i+1];
    const mid=vmul(vadd(a,b),0.5);
    const Av=A(mid);
    const dl=vsub(b,a);
    sum += vdot(Av, dl);
  }
  return sum;
}

/* 矢量场采样箭头（平面网格） */
function drawFieldGrid(z){
  if(!state.show.vec) return;
  const N=8, L=1.25;
  for(let i=-N;i<=N;i++) for(let j=-N;j<=N;j++){
    const x=L*i/N, y=L*j/N;
    if(Math.hypot(x,y)>1.35) continue;
    const A=field()(pt(x,y,z));
    const L2=vlen(A);
    if(L2<0.05) continue;

/* =========== 模式 1：环量（Circulation）—— 小溪 + 风车 + 杯子 直觉 =========== */
/* 小溪流场：直流 + 高斯型局部漩涡。风车转速 ∝ 该点涡量 curl（直觉：环量密度） */
const STREAM_CX=0, STREAM_CY=0;      /* 漩涡中心 */
const STREAM_SIG=0.42;               /* 漩涡高斯宽度 */
const STREAM_OM=0.85;                /* 漩涡强度 */
const STREAM_U0=0.45;                /* 直流流速 */
function streamV(p){                 /* 小溪流场（2D，z 忽略） */
  const dx=p.x-STREAM_CX, dy=p.y-STREAM_CY, r2=dx*dx+dy*dy;
  const g=Math.exp(-r2/(STREAM_SIG*STREAM_SIG));
  return pt(STREAM_U0 - STREAM_OM*g*dy, STREAM_OM*g*dx, 0);
}
function streamCurl(p){              /* 小溪流场的涡量（z 分量） */
  const dx=p.x-STREAM_CX, dy=p.y-STREAM_CY, r2=dx*dx+dy*dy;
  const s2=STREAM_SIG*STREAM_SIG;
  const g=Math.exp(-r2/s2);
  return 2*STREAM_OM*g*(1 - r2/s2);
}

/* 伪光照着色：hex 基色 × 环境光+漫反射（lam=|n·L|），返回 rgb() 串 */
function hexShade(hex,lam){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const f=0.72+0.38*Math.max(0,Math.min(1,lam));
  return 'rgb('+Math.min(255,Math.round(r*f))+','+Math.min(255,Math.round(g*f))+','+Math.min(255,Math.round(b*f))+')';
}
const CUP_L={x:0.35,y:-0.5,z:0.8};       /* 光方向（左前上） */

/* 风车：屏幕空间手绘，spin 为当前角速度（°/s，正=逆时针），angle 为累积相位 */
function drawPinwheel(p, spin, angle, o={}){
  const S=pr(p);
  const R=o.r||20;
  P_(S.d+0.03, ()=>{
    ctx.save();
    const n=spin>0.5?0.02:(0.05);          /* 慢转时叶片略虚 */
    /* 中心轴 */
    ctx.beginPath(); ctx.arc(S.x,S.y,R*0.14,0,7); ctx.fillStyle='#8A6A3A'; ctx.fill();
    /* 4 片叶片（角度取负：canvas 屏幕 y 向下，angle 递增会呈顺时针；水流在世界系是逆时针） */
    const A=-angle*Math.PI/180;
    for(let k=0;k<4;k++){
      const a=A+k*Math.PI/2;
      const ex=S.x+Math.cos(a)*R*0.82, ey=S.y+Math.sin(a)*R*0.82;
      const px=S.x-Math.sin(a)*R*0.30, py=S.y+Math.cos(a)*R*0.30;
      ctx.beginPath();
      ctx.moveTo(S.x+Math.cos(a)*R*0.10, S.y+Math.sin(a)*R*0.10);
      ctx.lineTo(px,py); ctx.lineTo(ex,ey); ctx.lineTo(S.x-Math.sin(a)*R*0.10, S.y+Math.cos(a)*R*0.10);
      ctx.closePath();
      ctx.fillStyle='rgba(230,140,60,'+Math.max(0.35,Math.min(1,Math.abs(spin)/90*0.9+0.35)).toFixed(3)+')';
      ctx.fill();
      ctx.lineWidth=1.2; ctx.strokeStyle='#A8622A'; ctx.stroke();
    }
    /* 底座小竖线（示意立在地上） */
    ctx.beginPath(); ctx.moveTo(S.x,S.y+R*0.14); ctx.lineTo(S.x,S.y+R*0.5);
    ctx.strokeStyle='#8A6A3A'; ctx.lineWidth=2; ctx.stroke();
    /* 转动指示：快转时外圈虚线 */
    if(Math.abs(spin)>8){ ctx.beginPath(); ctx.arc(S.x,S.y,R+4,0,7); ctx.strokeStyle='rgba(200,120,50,.5)'; ctx.setLineDash([3,3]); ctx.lineWidth=1.2; ctx.stroke(); ctx.setLineDash([]); }
    ctx.restore();
  });
}

function modeCirc(){
  if(state.circView==='cup'){ modeCircCup(); return; }
  /* ---- 小溪视图 ---- */
  /* 河岸（两条水平虚线） */
  line(pt(-1.35, 0.95, 0), pt(1.35, 0.95, 0), {color:'#B9C9D2', dash:[6,4], w:1.3});
  line(pt(-1.35,-0.95, 0), pt(1.35,-0.95, 0), {color:'#B9C9D2', dash:[6,4], w:1.3});
  text(pt(-1.30, 1.08, 0),'河岸',{color:'#8CA0AC',size:11,dy:0});
  /* 直流区水流箭头（避开漩涡核心区，让画面分清「直流」与「漩涡」） */
  for(let i=-5;i<=5;i++) for(let j=-4;j<=4;j++){
    const x=0.28*i, y=0.24*j;
    if(Math.abs(x)<0.55 && Math.abs(y)<0.55) continue;   /* 漩涡核心区不画直流 */
    if(Math.abs(y)>0.92) continue;
    const v=streamV(pt(x,y,0));
    const L=vlen(v); if(L<0.03) continue;
    const a=vnorm(v), s=0.055;
    arrow(pt(x-a.x*s,y-a.y*s,0), pt(x+a.x*s,y+a.y*s,0), {color:'#7FB3C8', w:1.0, headScale:0.5, alpha:0.6});
  }
  /* 漩涡区：绕中心旋转的箭头（半径 0.12~0.45） */
  for(let r=0.13;r<=0.45;r+=0.08){
    for(let k=0;k<8;k++){
      const a=2*Math.PI*k/8;
      const x=STREAM_CX+r*Math.cos(a), y=STREAM_CY+r*Math.sin(a);
      const t=pt(-Math.sin(a), Math.cos(a), 0);      /* 切向（逆时针） */
      arrow(pt(x-t.x*0.055,y-t.y*0.055,0), pt(x+t.x*0.055,y+t.y*0.055,0), {color:C.crimson, w:1.4, headScale:0.62, alpha:0.85});
    }
  }
  /* 漩涡中心标记 + 标注 */
  marker(pt(STREAM_CX,STREAM_CY,0), {r:5, color:C.crimson, ring:'#F0D5D0', label:'漩涡（涡量源）', ldx:12, ldy:-8, lsize:12.5});
  /* 风车（可拖动） */
  const curlHere=streamCurl(pt(state.pinX,state.pinY,0));
  const spinDeg=Math.max(0,curlHere)*55;    /* 涡量→转速（°/s），负涡量（外围反旋）视为 0 */
  drawPinwheel(pt(state.pinX,state.pinY,0), spinDeg, state.pinAngle, {r:22});
  text(pt(state.pinX,state.pinY,0.01),'风车',{color:'#A8622A',size:12.5,bold:true,dy:34,align:'center'});
  /* 读数（压缩两行，避免俯视下超出画布下缘） */
  const c=curlHere;
  const verdict = c>0.15?'转（有漩涡）':(c>0.02?'微转':'不转（直流区）');
  text(pt(0,-1.12,0),'风车处涡量 = '+curlHere.toFixed(2)+'　→　风车 '+verdict,
    {color: c>0.15?C.crimson:C.muted, size:13, bold:true, align:'center'});
  text(pt(0,-1.36,0),'拖动风车：直流区不转 · 拖进漩涡转起来　　环量 Γ = 绕一圈切向累计（随位置而变）',
    {color:C.muted, size:11.5, align:'center'});
}

/* 杯子子视图：实体 3D 玻璃杯（水体条带光照 + 玻璃罩），水绕竖直轴旋转 */
function arcPts(cx,cy,z,r,a0,a1,n){
  const out=[]; for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n;
    out.push(pt(cx+r*Math.cos(a), cy+r*Math.sin(a), z)); } return out; }
function modeCircCup(){
  const R=0.66, H=0.58, zW=H*0.78;        /* 杯外半径 / 杯高 / 水面高度（瘦高杯形） */
  const rW=R-0.11;                        /* 水体半径（留壁厚） */
  const spin=state.cupSpinSpeed;          /* °/s */
  const nS=Math.max(0,Math.min(1,Math.abs(spin)/90));
  const NQ=28;
  /* --- 1. 杯底玻璃（最先画，透过水可见） --- */
  poly(arcPts(0,0,0,R*0.985,0,2*Math.PI,36), {fill:'#E4EFF5', fillAlpha:0.55, stroke:'#C3D6E0', strokeAlpha:0.8, w:1});
  /* --- 2. 水体侧面：逐 quad 填充 + 法向光照（画家算法自动分前后） --- */
  for(let i=0;i<NQ;i++){
    const a0=2*Math.PI*i/NQ, a1=2*Math.PI*(i+1)/NQ, am=(a0+a1)/2;
    const lam=Math.abs(Math.cos(am)*CUP_L.x+Math.sin(am)*CUP_L.y);
    const col=hexShade('#5FA8C9',lam);
    poly([pt(rW*Math.cos(a0),rW*Math.sin(a0),0.015), pt(rW*Math.cos(a1),rW*Math.sin(a1),0.015),
          pt(rW*Math.cos(a1),rW*Math.sin(a1),zW),   pt(rW*Math.cos(a0),rW*Math.sin(a0),zW)],
         {fill:col, fillAlpha:0.86, stroke:col, strokeAlpha:1, w:1});
  }
  /* --- 3. 水面（顶盖，光照亮） --- */
  poly(arcPts(0,0,zW,rW,0,2*Math.PI,40), {fill:hexShade('#9FD0E4',0.85), fillAlpha:0.95,
    stroke:hexShade('#4E90B0',0.8), strokeAlpha:1, w:1.2});
  /* --- 4. 玻璃杯壁外表面：淡色条带（半透明罩在水体外） --- */
  for(let i=0;i<NQ;i++){
    const a0=2*Math.PI*i/NQ, a1=2*Math.PI*(i+1)/NQ, am=(a0+a1)/2;
    const lam=Math.abs(Math.cos(am)*CUP_L.x+Math.sin(am)*CUP_L.y);
    const col=hexShade('#D9EAF2',lam);
    poly([pt(R*Math.cos(a0),R*Math.sin(a0),0.01), pt(R*Math.cos(a1),R*Math.sin(a1),0.01),
          pt(R*Math.cos(a1),R*Math.sin(a1),H),    pt(R*Math.cos(a0),R*Math.sin(a0),H)],
         {fill:col, fillAlpha:0.14+0.10*lam, stroke:col, strokeAlpha:0.55, w:0.8});
  }
  /* --- 5. 玻璃高光母线（左右两条） --- */
  for(const ah of [2.62, 0.52]){
    line(pt(R*0.995*Math.cos(ah),R*0.995*Math.sin(ah),0.03), pt(R*0.995*Math.cos(ah),R*0.995*Math.sin(ah),H-0.02),
      {color:'#FFFFFF', w:2.6, alpha:0.55});
  }
  /* --- 6. 水流箭头：水面上的两个同心环（虚线引导环 + 切向箭头） --- */
  if(nS>=0.05){
    for(const rr of [0.36*rW, 0.7*rW]){
      curve(arcPts(0,0,zW+0.008,rr,0,2*Math.PI,40), {color:'#2E86B5', w:1, alpha:0.4, dash:[3,4]});
      for(let k=0;k<10;k++){
        const a=2*Math.PI*k/10;
        const x=rr*Math.cos(a), y=rr*Math.sin(a);
        const t=pt(-Math.sin(a), Math.cos(a), 0);
        const len=0.055+0.055*nS;
        arrow(pt(x-t.x*len,y-t.y*len,zW+0.015), pt(x+t.x*len,y+t.y*len,zW+0.015),
          {color:'#155E86', w:2.2, headScale:0.8, alpha:0.55+0.45*nS});
      }
    }
  }
  /* --- 7. 杯中风车（立于水面中心） --- */
  drawPinwheel(pt(0,0,zW+0.015), spin, state.cupAngle, {r:20});
  /* --- 8. 杯口沿（最上层：外口 + 内口） --- */
  curve(arcPts(0,0,H,R,0,2*Math.PI,40), {color:'#7A93A2', w:2.6});
  curve(arcPts(0,0,H,rW,0,2*Math.PI,40), {color:'#A9BCC7', w:1.1, alpha:0.75});
  /* --- 9. 杯柄（C 形双线，贴 +x 侧） --- */
  const hx=R, hz0=0.16, hz1=0.46, hr=(hz1-hz0)/2, hz2=(hz0+hz1)/2;
  curve([pt(hx,0,hz1), pt(hx+0.24,0,hz1-0.02), pt(hx+0.30,0,hz2), pt(hx+0.24,0,hz0+0.02), pt(hx,0,hz0)],
    {color:'#8FA6B3', w:3.4});
  curve([pt(hx,0,hz1-0.045), pt(hx+0.19,0,hz1-0.06), pt(hx+0.245,0,hz2), pt(hx+0.19,0,hz0+0.06), pt(hx,0,hz0+0.045)],
    {color:'#C7D8E0', w:1.4, alpha:0.8});
  /* --- 10. 标签与读数 --- */
  text(pt(1.05,-0.55,0.15),'玻璃杯',{color:'#6B8290',size:12,bold:true});
  const verdict = nS>0.05 ? '转（有旋场：有漩涡源）' : '不转（静止水：无旋场）';
  text(pt(0,-1.12,0),'杯中水流 '+(nS>0.05?'正以 '+Math.abs(spin).toFixed(0)+'°/s 旋转':'静止')+'　→　风车 '+verdict,
    {color: nS>0.05?C.crimson:C.muted, size:13, bold:true, align:'center'});
  text(pt(0,-1.36,0),'搅动 → 水转成旋转流速场 → 绕圈环量非零；停手 → 水渐停 → 环量归零（漩涡源消失）',
    {color:C.muted, size:11.5, align:'center'});
}

/* =========== 模式 2：环量密度（Circ. density）—— 大环缩小到 P + 绕行方向/法线 =========== */
function modeCircDens(){
  const cx=state.loopCx, cy=state.loopCy, r=state.loopR, dir=state.loopDir;
  drawFieldGrid(0);
  /* 面元：环包围的开曲面（圆盘，淡紫填充） */
  if(r>0.05) poly(loopSamples(cx,cy,r,0,48), {fill:'#B08BD4', fillAlpha:0.14});
  /* 闭合回路（按绕行方向画箭头，段贡献正=橙/负=蓝） */
  const n=72, pts=loopSamples(cx,cy,r,0,n);
  for(let i=0;i<n;i++){
    const a=pts[i], b=pts[i+1];
    const A1=dir>0?a:b, B1=dir>0?b:a;             /* dir=-1 时反向绘制 */
    const mid=vmul(vadd(A1,B1),0.5);
    const Av=field()(mid);
    const dphi=vdot(Av, vsub(B1,A1));
    const col = dphi*dir>0?C.orange:(dphi*dir<0?C.blue:'#A0AFB8');
    arrow(A1, B1, {color:col, w:2.2, headScale:0.75, alpha:0.95});
  }
  curve(pts.slice(0,-1), {color:C.ink, w:1.4, dash:[4,3], alpha:0.6});
  /* P 点（环缩小所包围的那一点） */
  marker(pt(cx,cy,0),{r:6,color:C.teal,ring:'#BBD9E6',label:'P'});
  /* 面元法线箭头（绕行方向 ↔ 法线方向，右手螺旋） */
  const nl=0.42+0.12*r;
  arrow(pt(cx,cy,0), pt(cx,cy,nl*dir),
    {color:C.purple, w:2.8, label:dir>0?'@{n}（+z）':'@{n}（−z）', lsize:12.5, ldy:dir>0?-6:14});
  /* 数值 */
  const circ1=circulation(cx,cy,r,0,field(),96);   /* 逆时针（+n）环量 */
  const circ=circ1*dir;                             /* 当前绕行方向环量 */
  const S=Math.PI*r*r;
  const dens=circ/S;
  const cz=curlF()(pt(cx,cy,0)).z;
  text(pt(cx, cy, -0.92),'∮ @{B}·d@{l} = '+circ.toFixed(2)+'　（绕行方向：'+(dir>0?'逆时针 → @{n}=+z':'顺时针 → @{n}=−z')+'）',
    {color:C.crimson, size:12.5, bold:true, align:'center'});
  text(pt(cx, cy, -1.12),'ΔS = πR² = '+S.toFixed(3)+'　　环量面密度 = ∮@{B}·d@{l} / ΔS = '+dens.toFixed(2),
    {color:C.teal, size:12, bold:true, align:'center'});
  text(pt(cx, cy, -1.34),'换绕行方向 → 密度 '+(-cz*dir).toFixed(2)+'　　最大环量面密度 = |∇×@{B}| = '+Math.abs(cz).toFixed(2),
    {color:C.purple, size:11.5, bold:true, align:'center'});
  text(pt(cx, cy, -1.56),'让环缩小到包围某点 P：最大环量面密度就定义为旋度（方向 = 使密度最大的 @n）',
    {color:C.muted, size:11, align:'center'});
}

/* =========== 模式 2：旋度（Curl）—— 点 P + 小回路，求最大环量面密度 =========== */
function modeCurl(){
  drawFieldGrid(0);
  const px=state.loopCx, py=state.loopCy, r=state.loopR*0.5;
  const n=48;
  const circ = circulation(px, py, r, 0, field(), n);
  const A=Math.PI*r*r;
  const dens=circ/A;
  const pts=loopSamples(px,py,r,0,n);
  for(let i=0;i<n;i++){
    const a=pts[i], b=pts[i+1];
    const mid=vmul(vadd(a,b),0.5);
    const Av=field()(mid);
    const dl=vsub(b,a);
    const dphi=vdot(Av, dl);
    const col = dphi>0?C.orange:(dphi<0?C.blue:'#A0AFB8');
    arrow(a, b, {color:col, w:1.8, headScale:0.65, alpha:0.85});
  }
  curve(pts.slice(0,-1), {color:C.ink, w:1.2, dash:[3,3], alpha:0.55});
  /* P 点 */
  marker(pt(px,py,0),{r:6,color:C.teal,ring:'#BBD9E6',label:'P'});
  /* 旋度箭头 */
  const cv = curlF()(pt(px,py,0));
  const Lc=Math.min(0.5, 0.20*vlen(cv));
  if(Lc>0.05){
    const tip=pt(px,py,Lc);
    arrow(pt(px,py,0), tip, {color:C.purple, w:2.6, label:'∇×A', ldy:-11, lsize:13});
  }
  /* 数值 */
  text(pt(px, py, -0.9),'小回路环量 ∮ A·dl = '+circ.toFixed(3),
    {color:C.crimson, size:12, bold:true, align:'center'});
  text(pt(px, py, -1.10),'面积 ΔS = '+A.toFixed(3)+'   环量面密度 ≈ '+dens.toFixed(3),
    {color:C.teal, size:11.5, bold:true, align:'center'});
  text(pt(px, py, -1.30),'r → 0 时趋近 |∇×A(P)| = '+vlen(cv).toFixed(3),
    {color:C.muted, size:11, align:'center'});
}

/* =========== 模式 3：斯托克斯定理（Stokes）—— 表面网格剖分 =========== */
function modeStokes(){
  drawFieldGrid(0);
  const L=state.loopR;                 /* 圆盘半径（=边界回路半径） */
  const NR=state.N;                    /* 同心环数 */
  const NP=Math.max(8, 4*NR);          /* 每环扇形数 */
  let sumInt=0, nCell=0, area=0;
  /* ---- 1. 小面片（环形扇区）：填色 + 旋度累加 ----
     极坐标剖分的外边界天然是圆，Σ ΔS = πR² 精确，不再有方形网格锯齿误差 */
  for(let i=0;i<NR;i++){
    const r0=L*i/NR, r1=L*(i+1)/NR;
    for(let j=0;j<NP;j++){
      const a0=2*Math.PI*j/NP, a1=2*Math.PI*(j+1)/NP;
      const am=(a0+a1)/2, rm=(r0+r1)/2;
      const c=pt(rm*Math.cos(am), rm*Math.sin(am), 0);
      const cv=curlF()(c).z;
      const dS=0.5*(r1*r1-r0*r0)*(a1-a0);   /* 环形扇区面积 */
      sumInt += cv*dS; area += dS; nCell++;
      if(state.show.surf){
        const seg=Math.max(3, Math.round(NP/12)+2), ring=[];
        for(let t=0;t<=seg;t++){ const a=a0+(a1-a0)*t/seg; ring.push(pt(r0*Math.cos(a), r0*Math.sin(a), 0)); }
        for(let t=seg;t>=0;t--){ const a=a0+(a1-a0)*t/seg; ring.push(pt(r1*Math.cos(a), r1*Math.sin(a), 0)); }
        const col=cv>0?C.orange:(cv<0?C.blue:'#A0AFB8');
        poly(ring.slice(0,-1), {fill:col, fillAlpha:0.11, stroke:col, strokeAlpha:0.22, w:0.7});
      }
    }
  }
  /* ---- 2. 内部剖分线：相邻面片共享 → 一正一负抵消（灰化虚线） ---- */
  if(state.show.cancel){
    for(let i=1;i<NR;i++){
      const rr=L*i/NR, lp=[];
      for(let t=0;t<=72;t++){ const a=2*Math.PI*t/72; lp.push(pt(rr*Math.cos(a), rr*Math.sin(a), 0)); }
      curve(lp, {color:'#9DB3BF', w:1.0, alpha:0.55, dash:[3,3]});
    }
    for(let j=0;j<NP;j++){
      const a=2*Math.PI*j/NP;
      line(pt(0,0,0), pt(L*Math.cos(a), L*Math.sin(a), 0),
        {color:'#9DB3BF', w:1.0, alpha:0.55, dash:[3,3]});
    }
  }
  /* ---- 3. 外边界：唯一未被抵消的回路（彩色分段箭头） ---- */
  const NB=Math.max(32, NP*2);
  for(let t=0;t<NB;t++){
    const a0=2*Math.PI*t/NB, a1=2*Math.PI*(t+1)/NB;
    const p0=pt(L*Math.cos(a0), L*Math.sin(a0), 0);
    const p1=pt(L*Math.cos(a1), L*Math.sin(a1), 0);
    const mid=vmul(vadd(p0,p1),0.5);
    const dphi=vdot(field()(mid), vsub(p1,p0));
    const col=dphi>0?C.orange:(dphi<0?C.blue:'#A0AFB8');
    arrow(p0, p1, {color:col, w:2.4, headScale:0.8, alpha:0.95});
  }
  /* ---- 4. 数值对比 ---- */
  const circ=circulation(0, 0, L, 0, field(), 240);
  const err=circ-sumInt;
  text(pt(0, 0, -1.0),'边界环量 ∮ @{A}·d@{l} ≈ '+circ.toFixed(2),
    {color:C.crimson, size:12.5, bold:true, align:'center'});
  text(pt(0, 0, -1.22),'面片旋度累加 Σ(∇×@{A})·Δ@{S} ≈ '+sumInt.toFixed(2)+'（'+nCell+' 片）',
    {color:C.teal, size:12.5, bold:true, align:'center'});
  text(pt(0, 0, -1.44),'误差 ≈ '+Math.abs(err).toFixed(3)+'   剖分面积 Σ ΔS = '+area.toFixed(3)+'（πR² = '+(Math.PI*L*L).toFixed(3)+'）',
    {color:Math.abs(err)<0.05?C.green:(Math.abs(err)<0.2?C.orange:C.crimson),
     size:11.5, bold:true, align:'center'});
  /* 中心标记 */
  marker(pt(0,0,0),{r:4.5,color:C.purple,ring:'#E0CFEC',label:'中心'});
}

function buildScene(){
  prims=[];
  if(state.mode==='circ'){ modeCirc(); return; }
  if(state.mode==='circdens'){ drawAxes(); modeCircDens(); return; }
  drawAxes();
  if(state.mode==='curl') modeCurl();
  else modeStokes();
}

let needsRender=true;
function draw(){setupCamera();ctx.clearRect(0,0,W,H);buildScene();prims.sort((a,b)=>a.z-b.z);for(const p of prims)p.draw(ctx);const t=document.getElementById('panTag');if(t)t.classList.toggle('show',Math.abs(cam.px)>2||Math.abs(cam.py)>2);needsRender=false;}
let _lastT=performance.now();
function tick(){
  const now=performance.now(); const dt=Math.min(0.05,(now-_lastT)/1000); _lastT=now;
  if(state.autoRotate){cam.az+=0.0045;needsRender=true;}
  /* 环量页动画：风车 / 杯水 */
  if(state.mode==='circ'){
    if(state.circView==='stream'){
      const c=streamCurl(pt(state.pinX,state.pinY,0));
      const spinDeg=Math.max(0,c)*55;
      state.pinAngle+=spinDeg*dt;
      if(Math.abs(spinDeg)>0.1) needsRender=true;
    }else{
      /* 杯水：搅动则加速到 90，停手则指数衰减 */
      if(state.cupSpin){ state.cupSpinSpeed += (90-state.cupSpinSpeed)*Math.min(1,dt*4); }
      else if(Math.abs(state.cupSpinSpeed)>1){ state.cupSpinSpeed*=Math.pow(0.02,dt); }
      else if(state.cupSpinSpeed!==0){ state.cupSpinSpeed=0; }
      state.cupAngle += state.cupSpinSpeed*dt;
      if(Math.abs(state.cupSpinSpeed)>0.2) needsRender=true;
    }
  }
  /* 环量密度页：环自动缩小到 P */
  if(state.mode==='circdens'&&state.circShrink){
    state.loopR=Math.max(0.04, state.loopR-dt*0.28);
    if(state.loopR<=0.041){ state.circShrink=false; renderPanel(); }
    needsRender=true; updateReadout(); syncSliders();
  }
  if(needsRender)draw();
  requestAnimationFrame(tick);
}
function updateAll(){needsRender=true;syncSliders();updateReadout();updateModeTag();}

const panel=document.getElementById('panel');
function h(html){const d=document.createElement('div');d.innerHTML=html;return d;}
function kchip(k,v,cls){return '<span class="coord-chip '+(cls||'')+'">'+richHTML(k)+'<b>'+v+'</b></span>';}

const FIELD_OPTS=[
  {k:1, label:'@{A}=(-y, x, 0)',  sub:'∇×A=(0,0,2) · 旋转场', col:'o'},
  {k:2, label:'@{A}=(x, -y, 0)',  sub:'∇×A=0 · 无旋场',     col:'g'},
  {k:3, label:'@{A}=(-y, x, 0.3z)',sub:'∇×A=(0,0,2) · 螺旋', col:'p'},
];

function renderSubSec(sec){
  sec.innerHTML='';
  if(state.mode==='circ'){
    /* 环量页：小溪 / 杯子 子视图切换 */
    sec.appendChild(h('<div class="sec-title">环量直觉</div>'));
    const box=h('<div class="sub-chips"></div>').firstChild;
    [['stream','小溪 · 漩涡 · 风车'],['cup','杯子 · 旋转的水']].forEach(([k,t])=>{
      const b=h('<button class="chip'+(state.circView===k?' on':'')+'" data-k="'+k+'">'+t+'</button>').firstChild;
      b.onclick=()=>{state.circView=k;
        /* 杯子=实体3D杯需斜俯视（看到水面）；小溪=正俯视平面 */
        cam.az=-Math.PI/2; cam.el=(k==='cup')?0.92:1.35; cam.px=0; cam.py=0;
        renderPanel();updateAll();};
      box.appendChild(b);
    });
    sec.appendChild(box);
    if(state.circView==='stream'){
      sec.appendChild(h('<div class="ex-note">拖动画布中的<b>风车</b>：把它从直流区拖进漩涡，看风车从「不转」变成「转」——环量是随位置变化的「绕圈累计」。</div>'));
    }else{
      const bx=h('<div class="sub-chips" style="margin-top:12px"></div>').firstChild;
      const cb=h('<button class="chip'+(state.cupSpin?' on':'')+'">'+(state.cupSpin?'⏸ 停手（水渐停）':'▶ 搅动（给旋转的力）')+'</button>').firstChild;
      cb.onclick=()=>{state.cupSpin=!state.cupSpin; cb.className='chip'+(state.cupSpin?' on':''); cb.textContent=state.cupSpin?'⏸ 停手（水渐停）':'▶ 搅动（给旋转的力）'; updateAll();};
      bx.appendChild(cb); sec.appendChild(bx);
      sec.appendChild(h('<div class="ex-note">按「搅动」给杯子一个旋转的力 → 水转成旋转流速场 → 风车转（<b>有旋场 / 有漩涡源</b>）；停手水渐停 → 风车停（<b>无旋场</b>）。</div>'));
    }
    return;
  }
  /* 环量密度页：矢量场选择（本页按磁感应强度 B 叙述），去掉图中显示 */
  if(state.mode==='circdens'){
    sec.appendChild(h('<div class="sec-title">选择磁感应强度 B（本页以 B 场叙述）</div>'));
    const box=h('<div class="sub-chips"></div>').firstChild;
    FIELD_OPTS.forEach(it=>{
      const fb=h('<button class="chip '+(it.col||'')+(state.field===it.k?' on':'')+'" data-k="'+it.k+'">'+richHTML(it.sub.replace(/A/g,'B'))+'</button>').firstChild;
      fb.onclick=()=>{state.field=it.k;updateAll();renderPanel();};
      box.appendChild(fb);
    });
    sec.appendChild(box);
    sec.appendChild(h('<div class="ex-note">拖「半径 R」或点「让环缩小到 P 点」：观察环量与<b>环量面密度</b>随环缩小的变化；切换<b>绕行方向</b>（= 翻转面元法线 n）密度变号——其中<b>最大</b>的环量面密度就定义为<b>旋度</b>。</div>'));
    return;
  }
  /* 旋度 / 斯托克斯页：选择矢量场 + 图中显示 */
  sec.appendChild(h('<div class="sec-title">选择矢量场</div>'));
  const box=h('<div class="sub-chips"></div>').firstChild;
  FIELD_OPTS.forEach(it=>{
    const fb=h('<button class="chip '+(it.col||'')+(state.field===it.k?' on':'')+'" data-k="'+it.k+'">'+richHTML(it.sub)+'</button>').firstChild;
    fb.onclick=()=>{state.field=it.k;updateAll();renderPanel();};
    box.appendChild(fb);
  });
  sec.appendChild(box);
  sec.appendChild(h('<div class="sec-title" style="margin-top:14px">图中显示</div>'));
  const SHOW=[
    {k:'vec',    label:'矢量场网格'},
    {k:'loop',   label:'闭合回路'},
    {k:'surf',   label:'剖分面片'},
    {k:'cancel', label:'内部抵消（灰化）'},
    {k:'labels', label:'通量/环量数字'},
    {k:'box',    label:'坐标轴'},
  ];
  const bx=h('<div class="sub-chips"></div>').firstChild;
  SHOW.forEach(it=>{
    const sb=h('<button class="chip '+(state.show[it.k]?'on':'')+'" data-k="'+it.k+'">'+it.label+'</button>').firstChild;
    sb.onclick=()=>{state.show[it.k]=!state.show[it.k];sb.classList.toggle('on',state.show[it.k]);updateAll();};
    bx.appendChild(sb);
  });
  sec.appendChild(bx);
}

function renderSliders(sec){
  sec.innerHTML='';
  if(state.mode==='circ'){
    /* 环量页：仅小溪视图给风车位置滑块（风车也可直接拖画布）；杯子视图风车固定杯心 */
    if(state.circView!=='stream'){
      sec.appendChild(h('<div class="ex-note">杯中风车固定在杯心。用上方「搅动 / 停手」按钮控制水流旋转，观察风车转不转。</div>'));

function vstr(v){ return '('+v.x.toFixed(2)+', '+v.y.toFixed(2)+', '+v.z.toFixed(2)+')'; }
function updateReadout(){
  const strip=document.getElementById('coordStrip');
  if(!strip)return;
  if(!state.showReadout){strip.innerHTML='';return;}
  let html='';
  if(state.mode==='circ'){
    /* 环量页：小溪/杯子，显示涡量读数 */
    if(state.circView==='stream'){
      const c=streamCurl(pt(state.pinX,state.pinY,0));
      html += kchip('风车位置 =', '('+state.pinX.toFixed(2)+', '+state.pinY.toFixed(2)+')');
      html += kchip('涡量 ∇×V =', c.toFixed(2), c>0.15?'acc':'');
      html += kchip('风车 =', c>0.15?'转（有漩涡）':(c>0.02?'微转':'不转'), c>0.15?'acc':'warn');
    }else{
      const n=Math.max(0,Math.min(1,Math.abs(state.cupSpinSpeed)/90));
      html += kchip('杯中水流 =', n>0.05?('旋转 '+Math.abs(state.cupSpinSpeed).toFixed(0)+'°/s'):'静止');
      html += kchip('风车 =', n>0.05?'转（有旋场）':'不转（无旋场）', n>0.05?'acc':'warn');
    }
    document.getElementById('lgTitle').textContent='环量 · 直觉';
    document.getElementById('lgNote').textContent='环量 Γ = ∮V·dl：绕一圈切向累计，风车转不转就是它';
  }
  else if(state.mode==='circdens'){
    const dir=state.loopDir;
    const circ1=circulation(state.loopCx,state.loopCy,state.loopR,0,field(),96);
    const circ=circ1*dir;
    const A=Math.PI*state.loopR*state.loopR;
    const cz=curlF()(pt(state.loopCx,state.loopCy,0)).z;
    html += kchip('场 B', richHTML(FIELD_OPTS[state.field-1].label.replace(/\{A\}/g,'{B}')));
    html += kchip('绕行方向 =', dir>0?'逆时针（n=+z）':'顺时针（n=−z）');
    html += kchip('∮ @{B·dl} =', circ.toFixed(3), 'acc');
    html += kchip('环量面密度 =', (circ/A).toFixed(3), 'acc');
    html += kchip('R→0 极限 (∇×B)·n =', (cz*dir).toFixed(3), 'acc');
    html += kchip('最大密度 |∇×B| =', Math.abs(cz).toFixed(3), 'acc');
    document.getElementById('lgTitle').textContent='环量密度 · 大环缩小到 P';
    document.getElementById('lgNote').textContent='换绕行方向=翻转法线，密度变号；最大者定义为旋度';
  }
  else if(state.mode==='curl'){
    html += kchip('场', richHTML(FIELD_OPTS[state.field-1].label));
    const r=state.loopR*0.5;
    const circ=circulation(state.loopCx,state.loopCy,r,0,field(),48);
    const A=Math.PI*r*r;
    html += kchip('小回路半径 =', r.toFixed(2));
    html += kchip('∮ A·dl =', circ.toFixed(3), 'acc');
    html += kchip('环量面密度 ≈', (circ/A).toFixed(3), 'acc');
    html += kchip('|∇×A(P)| =', vlen(curlF()(pt(state.loopCx,state.loopCy,0))).toFixed(3));
    document.getElementById('lgTitle').textContent='旋度定义 · 环量面密度';
    document.getElementById('lgNote').textContent='r → 0 时，环量/面积 → |∇×A(P)|';
  }else{
    html += kchip('场', richHTML(FIELD_OPTS[state.field-1].label));
    const N=state.N, NP=Math.max(8, 4*N);
    const circ=circulation(0,0,state.loopR,0,field(),96);
    html += kchip('边界 R =', state.loopR.toFixed(2));
    html += kchip('剖分 =', N+' 环 × '+NP+' 扇区 = '+(N*NP));
    html += kchip('∮ @{A·dl} =', circ.toFixed(3), 'acc');
    let sumInt=0;
    const L=state.loopR;
    for(let i=0;i<N;i++){
      const r0=L*i/N, r1=L*(i+1)/N;
      for(let j=0;j<NP;j++){
        const am=2*Math.PI*(j+0.5)/NP, rm=(r0+r1)/2;
        sumInt += curlF()(pt(rm*Math.cos(am),rm*Math.sin(am),0)).z * 0.5*(r1*r1-r0*r0)*(2*Math.PI/NP);
      }
    }
    html += kchip('Σ(∇×A)·ΔS =', sumInt.toFixed(3), 'acc');
    html += kchip('误差 =', Math.abs(circ-sumInt).toFixed(3), Math.abs(circ-sumInt)<0.05?'':'warn');
    document.getElementById('lgTitle').textContent='斯托克斯定理 · '+N+' 环 × '+NP+' 扇区';
    document.getElementById('lgNote').textContent='内部分界线抵消，仅外边界贡献净环量';
  }
  strip.innerHTML=html;
}

let drag=null;
function localPos(ev){const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};}
/* 屏幕坐标 → 世界坐标（z=0 平面，反解 pr） */
function screenToWorld(mx,my){
  /* pr(p) = (CX2+px+camScale*(p·camU), CY+py-camScale*(p·camV), p·camD)；
     求 p=(x,y,0) 使投影落在 (mx,my)：解 2×2 线性方程 */
  const ux=camU.x, uy=camU.y, vx=camV.x, vy=camV.y;
  const bx=(mx-CX2-cam.px)/camScale, by=(CY+cam.py-my)/camScale;
  const det=ux*vy-uy*vx;
  if(Math.abs(det)<1e-9) return null;
  const x=(bx*vy-by*vx)/det, y=(ux*by-uy*bx)/det;
  return pt(x,y,0);
}
canvas=document.getElementById('cv');
ctx=canvas.getContext('2d');
canvas.addEventListener('pointerdown',ev=>{
  canvas.setPointerCapture(ev.pointerId);
  const m=localPos(ev);
  /* 环量页·小溪视图：点中/靠近风车 → 拖风车 */
  if(state.mode==='circ' && state.circView==='stream' && ev.button===0){
    const wp=pr(pt(state.pinX,state.pinY,0));
    if(Math.hypot(m.x-wp.x, m.y-wp.y) < 34){
      drag={x:m.x,y:m.y,btn:0,mode:'pin'};
      ev.preventDefault();
      return;
    }
  }
  drag={x:m.x,y:m.y,btn:ev.button,mode:(ev.button===2||ev.ctrlKey)?'pan':'rot'};
  ev.preventDefault();
});
canvas.addEventListener('pointermove',ev=>{
  const m=localPos(ev);
  if(!drag)return;
  const dx=m.x-drag.x,dy=m.y-drag.y;drag.x=m.x;drag.y=m.y;
  if(drag.mode==='pin'){
    const w=screenToWorld(m.x,m.y);
    if(w){ state.pinX=Math.max(-1.25,Math.min(1.25,w.x)); state.pinY=Math.max(-0.85,Math.min(0.85,w.y)); needsRender=true; updateReadout(); updateModeTag(); }
  }
  else if(drag.mode==='pan'){cam.px+=dx;cam.py+=dy;needsRender=true;}
  else{cam.az-=dx*0.0075;cam.el=Math.max(-1.45,Math.min(1.45,cam.el+dy*0.0062));needsRender=true;}
});
canvas.addEventListener('pointerup',()=>{if(drag&&drag.mode==='pin')syncSliders();drag=null;});
canvas.addEventListener('pointercancel',()=>{if(drag&&drag.mode==='pin')syncSliders();drag=null;});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=Math.max(.45,Math.min(3.2,cam.zoom*(e.deltaY<0?1.09:1/1.09)));needsRender=true;},{passive:false});

function resize(){
  const r=canvas.getBoundingClientRect();
  const nw=Math.max(60,Math.round(r.width)),nh=Math.max(60,Math.round(r.height));
  DPR=Math.min(2,window.devicePixelRatio||1);
  if(nw===W&&nh===H&&canvas.width===Math.round(nw*DPR))return;
  W=nw;H=nh;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);needsRender=true;
}
