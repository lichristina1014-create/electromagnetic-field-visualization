<script>
'use strict';
/* ============================================================================
   2.1 电场强度与电荷密度 —— 复用 1.1/1.3/1.4/1.5 同源引擎（单文件、零依赖、纯 Canvas 2D）

   ★ 单位约定（本页特有的一个重要决定）：
       长度 m ，电荷 nC ，场强 V/m ，力 nN ，密度 nC/m³ · nC/m² · nC/m
     于是 KC = 1/(4πε₀)·1e-9 ≈ 8.9876 ，有   E[V/m] = KC · q[nC] / R[m]²
     好处：1 nC 的点电荷在 1 m 处产生 8.99 V/m —— 读数就是能直接讲的物理量，
     不用“归一化单位”糊弄学生。
   ============================================================================ */

/* ============================== 目录 ============================== */
const NAV = [
  { ch:'第 1 章 · 矢量分析', items:[
    { id:'coord',  t:'1.1 三种常见坐标系', ready:true, href:'index.html' },
    { id:'ch1-2',  t:'1.2 矢量的代数运算', ready:true, href:'1.2-vector-algebra.html' },
    { id:'ch1-3',  t:'1.3 方向导数与梯度', ready:true, href:'1.3-directional-derivative.html' },
    { id:'ch1-4',  t:'1.4 通量与散度',     ready:true, href:'1.4-divergence-flux.html' },
    { id:'ch1-5',  t:'1.5 环量与旋度',     ready:true, href:'1.5-curl-circulation.html' },
  ]},
  { ch:'第 2 章 · 静电场', items:[
    { id:'ch2-1', t:'2.1 电场强度与电荷密度', ready:true, active:true },
    { id:'ch2-2', t:'2.2 静电场中的导体',     ready:true, href:'2.2-conductor-electrostatic.html' },
    { t:'2.3 高斯定理及其应用' },
    { t:'2.4 电介质与极化' },
  ]},
  { ch:'第 3 章 · 恒定磁场', items:[ {t:'3.1 比奥-萨伐尔定律'}, {t:'3.2 安培环路定理'} ]},
  { ch:'第 4 章 · 时变电磁场', items:[ {t:'4.1 麦克斯韦方程组'}, {t:'4.2 均匀平面波'} ]},
];

/* ============================== 向量工具 ============================== */
const pt=(x,y,z)=>({x,y,z});
const vadd=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z});
const vsub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z});
const vmul=(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s});
const vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const vlen=a=>Math.hypot(a.x,a.y,a.z);
const vnorm=a=>{const l=vlen(a)||1;return vmul(a,1/l);};
const vcross=(a,b)=>({x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x});
const D2R=Math.PI/180, R2D=180/Math.PI;

/* ============================== 富文本引擎（同源） ============================== */
function parseRich(s){
  const items=[], groups=[]; const st={g:-1};
  (function walk(str){
    let buf='';
    const flush=()=>{ if(buf){ items.push({t:'n',s:buf,g:st.g}); buf=''; } };
    for(let i=0;i<str.length;){
      const c=str[i];
      if(c==='@' && str[i+1]==='{'){
        const j=str.indexOf('}', i+2);
        if(j<0){ buf+=c; i++; continue; }
        flush();
        const save=st.g; st.g=groups.length; groups.push(1);
        walk(str.slice(i+2,j)); st.g=save; i=j+1; continue;
      }
      if(c==='_'){
        flush();
        if(str[i+1]==='{'){ const j=str.indexOf('}',i+2);
          if(j>=0){ items.push({t:'s',s:str.slice(i+2,j),g:st.g}); i=j+1; continue; } }
        items.push({t:'s',s:str[i+1]||'',g:st.g}); i+=2; continue;
      }
      if(c==='<'){ const j=str.indexOf('>',i);
        if(j>=0){ buf+=str.slice(i,j+1); i=j+1; continue; } }
      buf+=c; i++;
    }
    flush();
  })(String(s));
  return {items, groups};
}
const RICHFONT='"PingFang SC","Microsoft YaHei",sans-serif';
const RICHFONT_M='Georgia,"Times New Roman",serif';
function richLayout(ctx,rich,size,bold){const subSize=size*0.74;const wM=bold?'700 ':'';const fN=wM+size+'px '+RICHFONT;const fNs=wM+subSize+'px '+RICHFONT;const fV='italic '+wM+size+'px '+RICHFONT_M;const fVs=wM+subSize+'px '+RICHFONT_M;const groups=rich.groups.map(()=>({x0:1e9,x1:-1e9,locked:false,top:1e9}));const out=[];let x=0;const oldBL=ctx.textBaseline;ctx.textBaseline='middle';rich.items.forEach(it=>{const sub=it.t==='s',vec=it.g>=0;const font=sub?(vec?fVs:fNs):(vec?fV:fN);ctx.font=font;const m=ctx.measureText(it.s),w=m.width;const dy=sub?size*0.20:0;const asc=(m.actualBoundingBoxAscent!=null)?m.actualBoundingBoxAscent:size*0.38;if(vec){const g=groups[it.g];if(!g.locked){if(sub)g.locked=true;else{if(x<g.x0)g.x0=x;g.x1=x+w;}}const top=dy-asc;if(top<g.top)g.top=top;}out.push({s:it.s,sub,x,w,font,dy});x+=w;});ctx.textBaseline=oldBL;return{items:out,groups,w:x,size,subSize};}
function richDraw(ctx,lo,cx,cy,align,color){let ox=align==='center'?cx-lo.w/2:align==='right'?cx-lo.w:cx;const dy=it=>cy+it.dy;const ay=g=>cy+g.top-Math.max(2.2,lo.size*0.13);const span=g=>[ox+g.x0-0.6,ox+g.x1+0.6];ctx.save();ctx.textAlign='left';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineCap='butt';ctx.lineWidth=3.4;ctx.strokeStyle='rgba(255,255,255,.92)';lo.items.forEach(it=>{ctx.font=it.font;ctx.strokeText(it.s,ox+it.x,dy(it));});lo.groups.forEach(g=>{if(g.x1<=g.x0)return;const y=ay(g),s=span(g);ctx.beginPath();ctx.moveTo(s[0],y);ctx.lineTo(s[1],y);ctx.stroke();});lo.groups.forEach(g=>{if(g.x1<=g.x0)return;const y=ay(g),s=span(g),ax=s[0],bx=s[1];ctx.strokeStyle=color;ctx.lineWidth=1.15;ctx.beginPath();ctx.moveTo(ax,y);ctx.lineTo(bx-1.2,y);ctx.stroke();const h=Math.min(3.6,Math.max(2.6,(bx-ax)*0.40));ctx.beginPath();ctx.moveTo(bx,y);ctx.lineTo(bx-h,y-h*0.52);ctx.lineTo(bx-h,y+h*0.52);ctx.closePath();ctx.fillStyle=color;ctx.fill();});lo.items.forEach(it=>{ctx.font=it.font;ctx.fillStyle=color;ctx.fillText(it.s,ox+it.x,dy(it));});ctx.restore();}
function richHTML(s){const r=parseRich(s);let h='',gi=-1;r.items.forEach(it=>{const body=it.t==='s'?'<sub>'+it.s+'</sub>':it.s;if(it.g!==gi){if(gi>=0)h+='</span>';if(it.g>=0)h+='<span class="vec">';gi=it.g;}h+=body;});if(gi>=0)h+='</span>';return wrapSqrt(h);}
function wrapSqrt(html){const out=[];let i=0;while(i<html.length){const k=html.indexOf('√(',i);if(k<0){out.push(html.slice(i));break;}out.push(html.slice(i,k));out.push('<span class="sqrt"><span class="in">');let j=k+2,depth=1;while(j<html.length&&depth>0){const c=html[j];if(c==='(')depth++;else if(c===')'){depth--;if(depth===0)break;}j++;}if(depth!==0){out.push(html.slice(k));return out.join('');}out.push(html.slice(k+2,j));out.push('</span></span>');i=j+1;}return out.join('');}

/* ============================== 颜色 / 相机 / 图元 ============================== */
const C = {teal:'#156082',orange:'#E97132',green:'#3E9B4F',purple:'#9B59B6',crimson:'#D04A3A',blue:'#0F9ED5',gray:'#8CA0AC',light:'#C9D6DD',ink:'#22414F',grid:'#EAF0F4',muted:'#7A8F9B'};

let canvas,ctx,W=800,H=600,DPR=1;
const cam={az:0.62,el:0.46,zoom:1,px:0,py:0};
let camU,camV,camD,camScale,CX2,CY;
function setupCamera(){const ca=Math.cos(cam.az),sa=Math.sin(cam.az);const ce=Math.cos(cam.el),se=Math.sin(cam.el);camD={x:ce*ca,y:ce*sa,z:se};camU={x:-sa,y:ca,z:0};camV={x:-ca*se,y:-sa*se,z:ce};camScale=Math.min(W,H)/3.2*cam.zoom;CX2=W/2;CY=H*0.55;}
function pr(p){return{x:CX2+cam.px+camScale*vdot(p,camU),y:CY+cam.py-camScale*vdot(p,camV),d:vdot(p,camD)};}

let prims=[];
function P_(z,fn){prims.push({z,draw:fn});}
/* ⚠️ 各图元的 o.z：**可选**覆盖画家算法的深度。半透明壳体（等位面）会横跨一大段
   深度，凡是"必须始终看得清"的标注（P、θ/φ 角弧、E 箭头）都要显式抬到壳体之上，
   否则它们会被自己所在的球面那层 Fresnel 厚边洗掉。默认 0 / +1e4 一段留空，互不打架。 */
function line(a,b,o={}){const A=pr(a),B=pr(b);P_(o.z!=null?o.z:(A.d+B.d)/2,()=>{ctx.save();ctx.globalAlpha=o.alpha!=null?o.alpha:1;ctx.strokeStyle=o.color||C.gray;ctx.lineWidth=o.w||1.4;if(o.dash)ctx.setLineDash(o.dash);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.restore();});}
function arrowSeg(A,B,color,w,headScale){const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);if(L<0.5)return;const ux=dx/L,uy=dy/L,hs=(headScale||1)*9;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x-ux*hs*.55,B.y-uy*hs*.55);ctx.stroke();const ang=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(B.x,B.y);ctx.lineTo(B.x-hs*Math.cos(ang-.42),B.y-hs*Math.sin(ang-.42));ctx.lineTo(B.x-hs*Math.cos(ang+.42),B.y-hs*Math.sin(ang+.42));ctx.closePath();ctx.fillStyle=color;ctx.fill();}
function arrow(a,b,o={}){const A=pr(a),B=pr(b);P_(o.z!=null?o.z:(A.d+B.d)/2,()=>{ctx.save();ctx.globalAlpha=o.alpha!=null?o.alpha:1;if(o.dash)ctx.setLineDash(o.dash);arrowSeg(A,B,o.color||C.teal,o.w||2,o.headScale);ctx.restore();});if(o.label)text(vmul(vadd(a,b),.5),o.label,{color:o.color||C.teal,dx:o.ldx||0,dy:o.ldy!==undefined?o.ldy:-10,size:o.lsize||12.5,bold:true,align:o.lalign,alpha:o.alpha});}
function curve(ptsArr,o={}){if(ptsArr.length<2)return;const S=ptsArr.map(pr);P_(o.z!=null?o.z:S.reduce((s,p)=>s+p.d,0)/S.length,()=>{ctx.save();ctx.globalAlpha=o.alpha!=null?o.alpha:1;ctx.strokeStyle=o.color||C.gray;ctx.lineWidth=o.w||1.8;ctx.lineCap='round';if(o.dash)ctx.setLineDash(o.dash);ctx.beginPath();ctx.moveTo(S[0].x,S[0].y);for(let i=1;i<S.length;i++)ctx.lineTo(S[i].x,S[i].y);ctx.stroke();if(o.arrowEnd){const a=S[S.length-2],b=S[S.length-1];ctx.setLineDash([]);arrowSeg(a,b,o.color||C.gray,o.w||1.8,.75);}ctx.restore();});}
function poly(ptsArr,o={}){if(ptsArr.length<3)return;const S=ptsArr.map(pr);P_(o.z!=null?o.z:S.reduce((s,p)=>s+p.d,0)/S.length,()=>{ctx.save();ctx.beginPath();ctx.moveTo(S[0].x,S[0].y);for(let i=1;i<S.length;i++)ctx.lineTo(S[i].x,S[i].y);ctx.closePath();if(o.fill){ctx.globalAlpha=o.fillAlpha!=null?o.fillAlpha:.15;ctx.fillStyle=o.fill;ctx.fill();}if(o.stroke!==false){ctx.globalAlpha=o.strokeAlpha!=null?o.strokeAlpha:(o.fillAlpha!=null?o.fillAlpha:1);ctx.strokeStyle=o.stroke||o.fill||C.gray;ctx.lineWidth=o.w||1;if(o.dash)ctx.setLineDash(o.dash);ctx.stroke();}ctx.restore();});}
function marker(p,o={}){
  const S=pr(p);
  P_(o.z!=null?o.z:S.d+0.02, ()=>{ ctx.save();
    ctx.globalAlpha=o.alpha!=null?o.alpha:1;
    ctx.beginPath(); ctx.arc(S.x,S.y,o.r||5,0,7);
    ctx.fillStyle=o.color||C.orange; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
    if(o.ring){ ctx.beginPath(); ctx.arc(S.x,S.y,(o.r||5)+4,0,7);
      ctx.strokeStyle=o.ring; ctx.lineWidth=2.2; ctx.stroke(); }
    ctx.restore(); });
  if(o.label) text(p, o.label, {color:o.color||C.orange,
    dx:o.ldx!=null?o.ldx:10, dy:o.ldy!=null?o.ldy:-10, size:o.lsize||13, bold:true, align:o.lalign, alpha:o.alpha});
}
function text(p,str,o={}){const S=pr(p);P_(1e6,()=>{ctx.save();if(o.alpha!=null)ctx.globalAlpha*=o.alpha;const size=o.size||12.5,bold=!!o.bold;const lo=richLayout(ctx,parseRich(str),size,bold);richDraw(ctx,lo,S.x+(o.dx||0),S.y+(o.dy||0),o.align||'left',o.color||C.ink);ctx.restore();});}
/* 屏幕坐标文本（不随平移缩放跑掉） */
function textScreen(x,y,str,o={}){P_(1e6+1,()=>{ctx.save();if(o.alpha!=null)ctx.globalAlpha*=o.alpha;const lo=richLayout(ctx,parseRich(str),o.size||12,!!o.bold);richDraw(ctx,lo,x,y,o.align||'left',o.color||C.ink);ctx.restore();});}
/* 距离标注（★ 规范：距离一律用 dimLine，绝不用箭头） */
function dimLine(a,b,o={}){
  line(a,b,o);
  const A=pr(a),B=pr(b);
  const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);
  if(L<1)return;
  const px=-dy/L,py=dx/L,t=o.tick||6;
  const tk=P=>{P_(o.z!=null?o.z:(A.d+B.d)/2,()=>{ctx.save();if(o.alpha!=null)ctx.globalAlpha*=o.alpha;ctx.strokeStyle=o.color||C.gray;ctx.lineWidth=o.w||1.4;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(P.x+px*t,P.y+py*t);ctx.lineTo(P.x-px*t,P.y-py*t);ctx.stroke();ctx.restore();});};
  tk(A);tk(B);
  if(o.label)text(vmul(vadd(a,b),.5),o.label,{color:o.color||C.gray,dx:o.ldx||0,dy:o.ldy!==undefined?o.ldy:-10,size:o.lsize||12.5,bold:true,align:o.lalign,alpha:o.alpha});
}
function screenDot(p,rad,fill,alpha,z){const S=pr(p);P_(z!=null?z:S.d+0.02,()=>{ctx.save();ctx.globalAlpha=alpha!=null?alpha:1;ctx.beginPath();ctx.arc(S.x,S.y,rad,0,7);ctx.fillStyle=fill;ctx.fill();ctx.restore();});}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')';}

/* 坐标轴（ext = 轴长） */
function drawAxes(ext){
  if(!state.show.box) return;
  const g=ext*0.86;
  for(let v=-g;v<=g+1e-9;v+=ext*0.30){line(pt(v,-g,-ext*0.86),pt(v,g,-ext*0.86),{color:C.grid,w:1});line(pt(-g,v,-ext*0.86),pt(g,v,-ext*0.86),{color:C.grid,w:1});}
  line(pt(0,0,0),pt(-ext,0,0),{color:'#B9C9D2',dash:[5,4],w:1.2});
  line(pt(0,0,0),pt(0,-ext,0),{color:'#B9C9D2',dash:[5,4],w:1.2});
  line(pt(0,0,0),pt(0,0,-ext),{color:'#B9C9D2',dash:[5,4],w:1.2});
  arrow(pt(0,0,0),pt(ext,0,0),{color:C.teal,w:2});
  arrow(pt(0,0,0),pt(0,ext,0),{color:C.orange,w:2});
  arrow(pt(0,0,0),pt(0,0,ext),{color:C.green,w:2.2});
  text(pt(ext*1.05,0,0),'x',{color:C.teal,bold:true,size:13,dy:-4});
  text(pt(0,ext*1.05,0),'y',{color:C.orange,bold:true,size:13,dy:-4});
  text(pt(0,0,ext*1.05),'z',{color:C.green,bold:true,size:13,dx:-4});
  text(pt(0,0,0),'O',{color:'#7A8F9B',size:12,dx:-13,dy:13});
}

/* ── 已退役：球线框 sphereWireAt + 伪隐线辅助 splitByVis ───────────────────────
   2026-09-23 用户明确否掉「用经线/纬线代替球面」的做法（"学生看不懂，就是一个面"），
   2.1 里最后两处调用（② 过 P 的等位面、③ 带电球轮廓）都已换成 shellBall / ballRim。
   两个函数随即成为死代码，一并删除 —— 留着一个现成的"线球"helper 只会诱导以后
   再犯同一个错。历史与替代方案见 memory/ref-21-field-charge-density.md。 */

/* 球面的剪影圆 —— 正交投影下，球面的轮廓**恰好是一个圆**（圆心 = 球心的投影，
   半径 = R·camScale，与相机方位角、仰角都无关）。所以"球长什么样"这件事，
   在屏幕空间画一个圆最准、最省，也不受 3D 交点计算误差影响。
   参考用的同心球壳只画这个圆（dash 表示"只是刻度"）。
   ⚠️ 深度必须写 `S.d`（pr() 的返回值）—— `pt()` 造的点**没有 .d**，
      写成 c.d 会得到 undefined ⇒ NaN 深度 ⇒ 排序被静默废掉（只靠稳定排序的插入序侥幸看着对）。 */
function ballRim(c,R,hexBase,w,alpha,o){
  if(R<=1e-6) return;
  o=o||{};
  const S=pr(c), rad=R*camScale;
  const aL=Math.atan2(SPH_LY,SPH_LX);
  P_(o.z!=null?o.z:S.d+0.02,()=>{ ctx.save(); ctx.lineCap='round';
    if(o.dash) ctx.setLineDash(o.dash);
    /* ★ 与 shellBall 同一条规矩：拆成受光侧/背光侧两段 ——
       否则一串同心圆是"平面上的圆"，加上明暗才是"退到远处的球"。 */
    ctx.strokeStyle=hexA(hexBase,alpha*0.52); ctx.lineWidth=w||1.3;
    ctx.beginPath(); ctx.arc(S.x,S.y,rad,aL-Math.PI/2,aL+Math.PI/2); ctx.stroke();
    ctx.strokeStyle=hexA(hexBase,alpha); ctx.lineWidth=(w||1.3)*1.3;
    ctx.beginPath(); ctx.arc(S.x,S.y,rad,aL+Math.PI/2,aL+Math.PI*1.5); ctx.stroke();
    ctx.restore(); });
}
/* 半透明球面 —— ★ 球面就画成"一个面"，不再用经线/纬线网格代替（学生读不出网格是球）。
   ★★ 球感（2026-09-23 二次返工，用户反馈"球视觉上看不太出来"）：
   **同心的径向渐变只能做出"一块圆片"** —— 实测整圈边缘 alpha 0.68、中心 0.12，各向同性，
   学生看到的是"描了边的橙圆盘"，不是球。真正让人读成球的是两条**不对称**：
     ① 明暗不对称 —— 光源在屏幕左上方 ⇒ 左上亮、右下厚（叠一层斜向线性渐变）；
     ② 轮廓不对称 —— 受光侧细而淡、背光侧粗而实（把剪影圆拆成两段弧）。
   （透明玻璃壳本身没有强明暗交界，所以斜向那层要克制：体色 alpha 仍在 0.1 量级，
     靠"高光 + 厚壁 + 双色轮廓"三条一起给球感。）
   配方与 1.3 的「半透明玻璃壳」同源（那里已经用过、用户认可），照抄而不是另发明一套：
     ① 背面（z = S.d − R）：极淡的一层体色，靠剪影略厚 —— 透过它才看得见壳里的电荷与场线；
     ② 正面（z = S.d + R）：偏心径向渐变做 Fresnel 厚壁（中心几乎透明 → 掠射边缘陡增）
        + 斜向明暗 + 双瓣镜面高光 + 两段式轮廓；
     ③ 轮廓仍用屏幕空间的剪影圆（正交投影下球面轮廓恰是圆，与相机角无关）。
   ⚠️ 踩过的坑（已用截图确认）：**逐四边形铺半透明色是行不通的**。球面在正交投影下，
   前后两半各自恰好盖满整个圆盘一次 ⇒ 复合透明度处处相等 ⇒ 屏幕上就是一块"橙色圆片"，
   shade() 那点 0.80~1.00 的伪光照调制被 alpha 完全淹没。
   ★ 分层取 ±R（球面真实的前后极值）⇒ 壳内物体（电荷、场线、R 标注）自动落在两层之间
     被罩住 = "包在玻璃球里"；而 P、θ/φ 角弧、E 箭头这些标注用 o.z 显式抬到壳体之上。
   改 R ⇒ 球面整体放大/缩小；改 θ/φ ⇒ 这个球面一动不动。
   emph 强调档（本体/厚壁都加深）；rimA 覆盖厚壁透明度（不给就用强调档默认值）。 */
const SPH_LX=-0.55, SPH_LY=-0.83;   /* 屏幕空间光方向（指向左上方光源，单位向量） */
function shellBall(c,R,hexBase,emph,rimA){
  if(R<=1e-6) return;
  const S=pr(c), rr=R*camScale;
  const aBody=emph?0.085:0.045, aRim=rimA!=null?rimA:(emph?0.46:0.28);
  /* ① 背面：极淡体色，越靠剪影越厚 */
  P_(S.d-R*1.02,()=>{ ctx.save();
    const g=ctx.createRadialGradient(S.x,S.y,rr*0.05,S.x,S.y,rr);
    g.addColorStop(0,hexA(hexBase,aBody*0.50));
    g.addColorStop(1,hexA(hexBase,aBody*1.40));
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,0,7); ctx.fillStyle=g; ctx.fill(); ctx.restore(); });
  /* ② 正面 */
  P_(S.d+R*1.02,()=>{ ctx.save();
    /* 2a 同心 Fresnel：中心高透 → 掠射边缘变厚（终值收到 aRim*0.82，免得整圈太"实"） */
    const g=ctx.createRadialGradient(S.x-rr*0.32,S.y-rr*0.36,rr*0.06,S.x,S.y,rr*1.02);
    g.addColorStop(0,   'rgba(255,255,255,'+(emph?0.20:0.13)+')');
    g.addColorStop(0.44,hexA(hexBase,aBody*0.30));
    g.addColorStop(0.82,hexA(hexBase,aRim*0.30));
    g.addColorStop(1,   hexA(hexBase,aRim*0.82));
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,0,7); ctx.fillStyle=g; ctx.fill();
    /* 2b ★ 斜向明暗：左上传光、右下背光 —— "圆"变"球"的关键一层 */
    const dl=ctx.createLinearGradient(S.x+SPH_LX*rr*0.95, S.y+SPH_LY*rr*0.95,
                                      S.x-SPH_LX*rr*0.95, S.y-SPH_LY*rr*0.95);
    dl.addColorStop(0,   'rgba(255,255,255,'+(emph?0.26:0.17)+')');
    dl.addColorStop(0.46,hexA(hexBase,aBody*0.14));
    dl.addColorStop(1,   hexA(hexBase,aBody*(emph?1.60:1.30)));
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,0,7); ctx.fillStyle=dl; ctx.fill();
    /* 2c 双瓣镜面高光：大而软 + 小而亮（玻璃感） */
    const hx=S.x+SPH_LX*rr*0.40, hy=S.y+SPH_LY*rr*0.44, hr=rr*0.30;
    const gh=ctx.createRadialGradient(hx,hy,0,hx,hy,hr);
    gh.addColorStop(0,'rgba(255,255,255,'+(emph?0.50:0.32)+')');
    gh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.fillStyle=gh; ctx.fill();
    const hx2=S.x+SPH_LX*rr*0.52, hy2=S.y+SPH_LY*rr*0.56, hr2=rr*0.085;
    const gh2=ctx.createRadialGradient(hx2,hy2,0,hx2,hy2,hr2);
    gh2.addColorStop(0,'rgba(255,255,255,'+(emph?0.85:0.55)+')');
    gh2.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(hx2,hy2,hr2,0,7); ctx.fillStyle=gh2; ctx.fill();
    /* 2d ★ 两段式轮廓：受光侧细而淡、背光侧粗而实（同心圆变球面光边） */
    const aL=Math.atan2(SPH_LY,SPH_LX);
    ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,aL-Math.PI/2,aL+Math.PI/2);
    ctx.strokeStyle=hexA(hexBase,aRim*(emph?0.40:0.30));
    ctx.lineWidth=emph?1.4:1.1; ctx.stroke();
    ctx.beginPath(); ctx.arc(S.x,S.y,rr,aL+Math.PI/2,aL+Math.PI*1.5);
    ctx.strokeStyle=hexA(hexBase,aRim*(emph?0.92:0.68));
    ctx.lineWidth=emph?2.5:1.8; ctx.stroke();
    ctx.restore(); });
}

const EPS0 = 8.8541878128e-12;        /* 真空介电常数 F/m */
const KC   = 1e-9/(4*Math.PI*EPS0);   /* = 8.987551787368176 ⇒ E[V/m] = KC·q[nC]/R[m]² */
const GA   = 0.60;                    /* 带电体特征尺寸（球半径 / 圆盘半径 / 线半长） m */
const NL_K = 0.70;                    /* 非均匀剖面系数：ρ ∝ 1 + 0.7·ξ² */
const KD   = 0.35;                    /* 「实验电荷自身扰动」示意系数 1/nC */
const RHO0 = 1.00, SIG0 = 1.00, TAU0 = 1.00;   /* 密度基值 nC/m³ · nC/m² · nC/m */

function kE(qnC, R){ return KC*Math.abs(qnC)/(R*R); }          /* 点电荷场强大小 V/m */
function prof(xi){ return 1 + (state.nonuni?NL_K:0)*xi*xi; }    /* 归一化密度剖面 */
function sgnTxt(v,d){ return (v>=0?'+':'−')+Math.abs(v).toFixed(d==null?2:d); }
/* 与 a 方向垂直、尽量落在屏幕平面内的单位向量（用来把两条箭头并排错开） */
function perpOf(d){
  let a=pt(0,0,1);
  if(Math.abs(vdot(d,a))>0.95) a=pt(1,0,0);
  return vnorm(vsub(a, vmul(d, vdot(a,d))));
}
/* 世界方向 → **屏幕单位方向**（px），用来把标注沿"背离带电体"的一侧外推。
   dimLine/arrow 的标签偏移是像素量（ldx/ldy），写死常数会在某些机位把标签压到线上；
   按当前相机算方向 ⇒ 任何机位标签都在外侧。 */
function sd2(d){
  const x=vdot(d,camU), y=-vdot(d,camV);
  const L=Math.hypot(x,y)||1;
  return [x/L, y/L];
}

function geoSym(){ return state.geo==='vol'?'ρ':(state.geo==='surf'?'σ':'τ'); }
function geoBase(){ return state.geo==='vol'?RHO0:(state.geo==='surf'?SIG0:TAU0); }
function geoMeas(){ return state.geo==='vol'?'ΔV′':(state.geo==='surf'?'ΔS′':'Δl′'); }
function geoMeasUnit(){ return state.geo==='vol'?'m³':(state.geo==='surf'?'m²':'m'); }

function clampMicro(){

    const n=tetCount();

     拖动 = 在投影面上找**离鼠标最近的四面体形心**（带一点"偏向迎面"的权重，
     否则前后半球的形心投影会重合、点到背面去），于是"任意一个四面体都能选"。

function microAxis(){ return state.geo==='surf' ? 1 : 0; }          /* 0 = x 轴，1 = y 轴 */
/* 默认选中的四面体：形心方向最"正对相机"的那一个（正交投影下 = 投影最靠近球心的那个），

function defaultTetIdx(){
  const ca=Math.cos(cam.az), sa=Math.sin(cam.az), ce=Math.cos(cam.el), se=Math.sin(cam.el);
  const D=pt(ce*ca, ce*sa, se);
  const M=tetMesh(tetK());
  let bi=0, bv=-9;
  M.faces.forEach((f,i)=>{
    const g=vnorm(vadd(vadd(M.unit[f[0]],M.unit[f[1]]),M.unit[f[2]]));
    const v=vdot(g,D); if(v>bv){ bv=v; bi=i; }
  });
  return bi;
}
/* 鼠标点 → 最近的四面体序号（体电荷专用）。屏幕上比形心投影距离，再给迎面一点折扣。 */
function pickTet(mx,my){
  const M=tetMesh(tetK());
  let bi=0, bs=Infinity;
  for(let i=0;i<M.faces.length;i++){
    const f=M.faces[i];
    const cen=vmul(vadd(vadd(M.unit[f[0]],M.unit[f[1]]),M.unit[f[2]]),0.25*GA);
    const S=pr(cen);
    /* 0.03·camScale 的"迎面折扣" ≈ 6~7 px：只用来打破前后半球投影重合的平局，
       不会把明显更近的背面四面体抢过来。 */
    const sc=Math.hypot(mx-S.x,my-S.y) - 0.03*camScale*(S.d/GA);
    if(sc<bs){ bs=sc; bi=i; }
  }

function microCenterW(){
  if(state.geo==='vol') return volTet(state.mu).cen;

/* 微元投影剪影的**内切半径**（px）—— 面/线元用。
   剪影 = "投影轴张成的中心对称多边形"：面元 2 条轴（平行四边形）、线元 1 条（线段）。
   内切半径 = min_i [ Σ_{j≠i} |det(pᵢ,pⱼ)| / |pᵢ| ] × hs，pᵢ = 第 i 条世界轴的单位投影(px)。
   ⚠️ 必须算而不能写死常数：面元斜看会被压扁，常数必然在某个方位角上让团雾溢出轮廓。
   （体电荷不用这个函数了 —— 它是四面体，改用内切球，见 FOG_K_VOL 的说明。） */
function microInradiusPx(hs){
  const P=[0,1,2].map(i=>{ const u=[camU.x,camU.y,camU.z][i], v=[camV.x,camV.y,camV.z][i];
    return [u*camScale, -v*camScale]; });
  const n=(state.geo==='surf')?2:3;
  let best=Infinity;
  for(let i=0;i<n;i++){
    const a=P[i], la=Math.hypot(a[0],a[1]);
    if(la<1e-9) continue;
    let d=0; for(let j=0;j<n;j++) if(j!==i) d+=Math.abs(a[0]*P[j][1]-a[1]*P[j][0]);
    best=Math.min(best,d/la);
  }
  return (best===Infinity?0:best)*hs;
}
/* 拖动手感阈值（px）：微元越小越得"够得着"（下限 30 px 给极小尺寸一个抓手），
   但也不能大到把"拖空白处旋转"整个吃掉（上限 72 px）。
   · 面/线元：1.25 倍内切半径 ≈ 剪影的外接半径（正交投影下恰是这个比例）。
   · 体电荷：四面体在屏幕上的尺度 ~ 内切球半径 rIn·camScale（k=2 时只有 18 px），
     所以下限得抬高一点，否则 k 大时那点小体积元根本抓不住。 */
function microHitR(){
  if(state.geo==='vol'){
    const t=volTet(state.mu);
    return Math.max(30, Math.min(72, t.rIn*camScale*1.7));
  }
  return Math.max(30, Math.min(66, microInradiusPx(state.mh*GA/2)*1.25));
}

/* ── 「团雾」：微元内部那团电荷的意象 ─────────────────────────────────────────
   ★ 要的是"雾"而不是"一块橙色"：雾 = 没有硬边界、浓淡不均、有团絮。
     做法 = 若干净布 4 层**偏心**的径向渐变斑（实心核 → alpha 0 的边缘）叠起来：
     单个正圆渐变只是"一个橙点"，几个错开大小/位置的斑才有团絮感；
     主斑偏暖白、副斑偏正橙，于是雾里有浓有淡、看得出层次。
   ★ 半径 ∝ 微元尺寸 ⇒ 拖「尺寸」时雾同步胀缩；尺寸 → 0 时雾自己消失，
     正好对应"这个微元里几乎没有电量"—— 同一个数的两个后果，不必再解释一遍。

   抬层之后"探针在哪、是不是在体内"由 O→微元的虚线与读数承担，信息一点不丢；

const Z_MICRO=9e5;          /* 微元本体所在的"档" */

const Z_MICRO_FOG=9e5-300;  /* 团雾：夹在背面与迎面之间 ⇒ 真的"在盒子里" */
const Z_MICRO_FAR=9e5-400;  /* 背面（背向相机）的面 */
const Z_MICRO_LINE=9e5-600; /* O→微元 的位置虚线：最先画，压在雾与本体底下 */

const FOG_K=0.95;

   所以只要雾的外缘 ≤ rIn·camScale 就一定在四面体轮廓之内，且与相机方位**无关**

function microFog(c,z,rad){

      const x=S.x+b[0]*rad, y=S.y+b[1]*rad, r=rad*b[2], a=b[3];
      const g=ctx.createRadialGradient(x,y,r*0.04,x,y,r);
      g.addColorStop(0,   hexA(i?FOG_BODY:FOG_CORE,a));
      g.addColorStop(0.42,hexA(FOG_BODY,a*0.62));
      g.addColorStop(0.74,hexA(FOG_BODY,a*0.20));
      g.addColorStop(1,   hexA(FOG_BODY,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    });
    ctx.restore(); });
}

/* ============================================================================
   伪光照 / 密度色阶（③ 用）
   ============================================================================ */
const L_DIR = vnorm(pt(0.36,-0.52,0.78));
function shade(hex,n){
  const lam=Math.abs(vdot(n,L_DIR)), f=0.80+0.20*lam;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgb('+Math.min(255,Math.round(r*f))+','+Math.min(255,Math.round(g*f))+','+Math.min(255,Math.round(b*f))+')';
}
const DENS_HEX='#2E7FA6';
/* 归一化剖面 prof(ξ) ∈ [1, 1+0.7] ⇒ 透明度 0.12 → 0.48 */
function densAlpha(t){ const u=Math.max(0,Math.min(1,(t-1)/NL_K)); return 0.12+0.36*u; }
function densHex(t){ const u=Math.max(0,Math.min(1,(t-1)/NL_K)); return 'rgba(46,127,166,'+(0.20+0.62*u).toFixed(3)+')'; }

/* ============================================================================
   ③ 微元：测度 / 微元内电量 Δq（对微元做数值积分 ⇒ 三种几何都精确）
   ============================================================================ */
function microInfo(){
  const xi=state.mu, h=state.mh, k=state.nonuni?NL_K:0;
  const f=t=>1+k*t*t;
  let meas, dq, pointDens;
  if(state.geo==='line'){
    const n=64; let s=0;
    for(let i=0;i<n;i++) s+=f(xi+(i+0.5)/n*h - h/2);
    meas = h*GA;                                    /* Δl′ (m) */
    dq   = TAU0*(s/n)*meas;                         /* nC */
    pointDens = TAU0*f(xi);                         /* τ(ξ) nC/m */
  } else if(state.geo==='surf'){
    const n=36; let s=0;
    for(let i=0;i<n;i++) for(let j=0;j<n;j++){
      const xx=-h/2+(i+0.5)/n*h;                    /* 微元内 x 偏移（归一化） */
      const yy=xi+(-h/2+(j+0.5)/n*h);               /* 微元内 y（归一化，= ρ′/GA） */
      s += f(Math.hypot(xx,yy));
    }
    meas = (h*GA)*(h*GA);                           /* ΔS′ (m²) */
    dq   = SIG0*(s/(n*n))*meas;                     /* nC */
    pointDens = SIG0*f(xi);                         /* σ(ξ) nC/m² */
  } else {
    /* 体电荷：微元 = 球体剖分里第 state.mu 个四面体。
       ★ 不用数值积分：四面体上 <x²> 有精确闭式（xsqTet），而 ρ = ρ₀(1+kξ²) 只随 x 变
         ⇒ Δq = ρ₀(1 + k·<x²>/a²)·ΔV′ 是**精确**的（不是采样近似）。
         这一点对非均匀分布尤其重要：读数里的"偏差 dev"于是只剩一个来源 ——
         "体积内的平均值 ≠ 该点的值"，而这正是有限体积元取密度时唯一的误差。 */
    const t=volTet(state.mu);
    const x2=xsqTet(t.A,t.B,t.Cc);
    const xic=t.cen.x/GA;                           /* 形心的归一化 x（可为负，ρ 是偶函数） */
    meas = t.V;                                     /* ΔV′ (m³) */
    dq   = RHO0*(1 + k*x2/(GA*GA))*meas;            /* nC（对 ρ 精确积分） */
    pointDens = RHO0*f(xic);                        /* ρ(ξ_cen) nC/m³ */
    const densV = dq/meas;
    return {xi:xic, h:0, meas, dq, dens:densV, pointDens, tet:state.mu, k:tetK(),
            dev:densV-pointDens, devRel:(densV-pointDens)/pointDens};
  }
  const dens = dq/meas;
  return {xi, h, meas, dq, dens, pointDens,
          dev:dens-pointDens, devRel:(dens-pointDens)/pointDens};
}

/* 总电量 Q = ∫ 密度 d(测度)。
   ★ 剖面取 ρ ∝ 1+kξ² 时三种几何都有**初等闭式解**（就不必数值积分了，读数才是精确的）：
     线：Q = τ₀·2L·(1 + k/3)        （∫_{−L}^{L} x² dx = 2L³/3）
     面：Q = σ₀·πa²·(1 + k/2)       （∫_盘 ρ′² dS = πa⁴/2）
     体：Q = ρ₀·(4/3)πa³·(1 + k/5)  （∫_球 x² dV = 4πa⁵/15）
   k=0 即均匀情形，退化为 Q = ρ₀V′ / σ₀S′ / τ₀l′。 */
const Q_KF={ line:1/3, surf:1/2, vol:1/5 };
let _Qcache={};
/* 均匀分布的 Q（均匀时三种几何都有初等解析场强当裁判；非均匀见 refField() 的数值参考） */
function uniformQ(){
  const a=GA, L=GA;
  if(state.geo==='line') return TAU0*2*L;
  if(state.geo==='surf') return SIG0*Math.PI*a*a;
  return RHO0*(4/3)*Math.PI*a*a*a;
}
/* ③ 页用：含非均匀剖面 */
function totalQ(){
  const key=state.geo+'|'+(state.nonuni?1:0);
  if(_Qcache[key]!=null) return _Qcache[key];
  const k=state.nonuni?NL_K:0;
  const Q = uniformQ()*(1 + k*Q_KF[state.geo]);
  _Qcache[key]=Q; return Q;
}

/* ============================================================================
   ③ 带电体绘制
   ============================================================================ */
/* ═══ 体电荷：球体的「星形四面体剖分」（SWG 式：球心 O + 球面三角形）════════════
   2026-09-23 用户改版。原做法是"把球按等体积切成 N 个壳层、画成一堆小方块"，
   被否掉的理由：N 小 ⇒ 方块又大又稀，凑在一起像马赛克；N 大 ⇒ 看不出 N 的效果
   （相邻两档视觉几乎一样）。新做法：

     · 先有**一个标准的球**，再对这个球做**体剖分**；
     · 球面三角剖分取二十面体，每个面做 k 阶重心细分、新点投回球面（= 球面三角网格）；
     · 每个球面三角形与球心 O 围成一个四面体 ⇒ 共 20k² 个四面体，严丝合缝铺满整个球；
     · 任意一个四面体都能选作「体积元」——它就是"体由体积元叠加而成"里的那个元。

   ★★ 「剖分尺寸」与「体积元大小」是**同一个数**（都只由 k 决定）：
      k 越大 ⇒ 每个四面体越小 ⇒ 剖分越细。这正是学生要看到的那件事，
      所以本页只给**一个**控件（原来那排 N = 1/8/32/128/384 与本控件重复，已删）。

   ★ 数值标定（/tmp/tetmesh3.js · /tmp/tetfield.js · /tmp/final-decide.js，均已复核）：
      k         1      2      3      4      5      6
      四面体数   20     80     180    320    500    720
      V多面体/V球 0.6055 0.8735 0.9409 0.9662 0.9781 0.9848
   ★ 每个四面体当成一个点电荷（作用点取其形心）时，**多面体的外场 ≈ 自身电量的点电荷场**：
     实测 ΣdE/[KC·ΣΔq/d²] − 1 = −0.31%(k=2,d=0.75) → −0.005%(k=2,d=1.2) → −0.0001%(k=4,d=1.5)
     ⇒ "把每个体积元当点电荷再求和"这一步几乎不引入误差，形状偏差可以忽略；
        外观上剩下的偏差只有一个来源 —— **20k² 个四面体拼出的多面体比球小**（k=2 时少 12.65%）。
        于是 ΣΔq/Q 与 ΣdE/E解析 会给出**同一个数**，这就是本页要演示的"自洽"。
   ⚠️ 顶点去重：先归一化、再取整到 1e-5 网格。**必须把 −0 归一为 0** ——
      (−0).toFixed(5) 是 "-0.00000"、与 "0.00000" 不相等 ⇒ 会多出重复顶点与细长三角形
      （实测 k=3 会多 2 个顶点、最小内角掉到 3.07°，修正后回到 54.6°）。 */
const ICO_V=[pt(0,0.5257311121,0.8506508084),pt(0.5257311121,0.8506508084,0),pt(0.8506508084,0,0.5257311121),
  pt(0,0.5257311121,-0.8506508084),pt(0.5257311121,-0.8506508084,0),pt(-0.8506508084,0,0.5257311121),
  pt(0,-0.5257311121,0.8506508084),pt(-0.5257311121,0.8506508084,0),pt(0.8506508084,0,-0.5257311121),
  pt(0,-0.5257311121,-0.8506508084),pt(-0.5257311121,-0.8506508084,0),pt(-0.8506508084,0,-0.5257311121)];
const ICO_F=[[0,1,2],[0,1,7],[0,2,6],[0,5,6],[0,5,7],[1,2,8],[1,3,7],[1,3,8],[2,4,6],[2,4,8],
  [3,7,11],[3,8,9],[3,9,11],[4,6,10],[4,8,9],[4,9,10],[5,6,10],[5,7,11],[5,10,11],[9,10,11]];
const TET_KMIN=1, TET_KMAX=4;               /* 剖分阶 k 的可选范围（20 / 80 / 180 / 320 个四面体） */
const _tm={};
function tetMesh(k){
  if(_tm[k]) return _tm[k];
  const q=v=>{ const t=Math.round(v*1e5); return t===0?0:t; };     /* −0 → 0（见上方警告） */
  const key=new Map(), unit=[];
  const vid=p=>{ const n=vnorm(p); const s=q(n.x)+','+q(n.y)+','+q(n.z);
    let i=key.get(s); if(i==null){ i=unit.length; unit.push(n); key.set(s,i);} return i; };
  ICO_V.forEach(v=>vid(v));                 /* 先放十二个顶点 ⇒ 序号 0..11 恒为它们 */
  const faces=[];
  ICO_F.forEach(f=>{
    const A=ICO_V[f[0]], B=ICO_V[f[1]], Cc=ICO_V[f[2]];
    const P=(i,j)=>{ const a=i/k, b=j/k, c=1-a-b;
      return vnorm(pt(A.x*a+B.x*b+Cc.x*c, A.y*a+B.y*b+Cc.y*c, A.z*a+B.z*b+Cc.z*c)); };
    const idx=[];
    for(let i=0;i<=k;i++){ idx.push([]); for(let j=0;j<=k-i;j++) idx[i].push(vid(P(i,j))); }
    for(let i=0;i<k;i++) for(let j=0;j<k-i;j++){
      faces.push([idx[i][j], idx[i+1][j], idx[i][j+1]]);
      if(j<k-i-1) faces.push([idx[i+1][j], idx[i+1][j+1], idx[i][j+1]]);
    }
  });
  const m={unit,faces}; _tm[k]=m; return m;
}
function tetK(){ return Math.max(TET_KMIN, Math.min(TET_KMAX, Math.round(state.mh))); }
function tetCount(k){ k=k||tetK(); return 20*k*k; }
/* 第 i 个四面体（球心 O + 球面三角形 i）的几何量，世界坐标、球半径 GA。
   k 可显式给（收敛曲线要扫别的 k），默认取当前剖分阶。 */
function volTet(i,k){
  const M=tetMesh(k==null?tetK():k), f=M.faces[i];
  const u1=M.unit[f[0]], u2=M.unit[f[1]], u3=M.unit[f[2]];
  const A=vmul(u1,GA), B=vmul(u2,GA), Cc=vmul(u3,GA);
  const V=Math.abs(vdot(u1,vcross(u2,u3)))*GA*GA*GA/6;                     /* ΔV′ (m³) */
  const S=0.5*(vlen(vcross(A,B))+vlen(vcross(B,Cc))+vlen(vcross(Cc,A))
              +vlen(vcross(vsub(B,A),vsub(Cc,A))));                        /* 四面体表面积 */
  return {A,B,Cc,V, rIn:3*V/S, cen:vmul(vadd(vadd(A,B),Cc),0.25)};
}
/* 四面体 OABC 上 <x²> 的**精确**平均。顶点取 O,A,B,C ⇒ Σx_i = x_A+x_B+x_C。
   推导（three-simplex 的 degree-2 重心矩）：∫x²dV = (V/20)[Σx_i² + (Σx_i)²]。
   已用 Keast 精确求积交叉验证到 1e-11%（/tmp/verify-formulas.js）。 */
function xsqTet(A,B,Cc){ const s=A.x+B.x+Cc.x; return (A.x*A.x+B.x*B.x+Cc.x*Cc.x + s*s)/20; }
/* 全部 20k² 个四面体各摊一个点电荷（作用点 = 形心）：ΣdE 与 ΣΔq **共用这一份**，
   这就是"图与数不打架"的保证。按 k 缓存，收敛曲线要扫 k=1…6。 */
const _volK={};
function volSamplesK(k){
  const key=k+'|'+(state.nonuni?1:0);
  if(_volK[key]) return _volK[key];
  const M=tetMesh(k), cc=state.nonuni?NL_K:0, out=[], G2=GA*GA;
  for(let i=0;i<M.faces.length;i++){
    const t=volTet(i,k), x2=xsqTet(t.A,t.B,t.Cc);
    out.push({p:t.cen, dq:RHO0*(1+cc*x2/G2)*t.V, V:t.V});                 /* 对 ρ 精确积分 */
  }
  _volK[key]=out; return out;
}
function volSamples(){ return volSamplesK(tetK()); }
/* ΣΔq：把当前剖分里每个体积元的电量加起来（非均匀时对 ρ 逐四面体精确积分 ⇒
   这份和是"算出来"的，不是把 Q 摊下来的）。用于演示"总电量 = 各体积元电量之和"。 */
function volSumQ(k){ return volSamplesK(k==null?tetK():k).reduce((a,s)=>a+s.dq,0); }
/* 剖分多面体的体积 V_多面体 = ΣΔV′（均匀时 ΣΔq = ρ₀·V_多面体）。
   ★ 球体积 V_球 = (4/3)πa³ 恒大于 V_多面体 ⇒ 读数里那个"少掉的百分比"就是它。 */
function volPolyV(k){ return volSamplesK(k==null?tetK():k).reduce((a,s)=>a+s.V,0); }
function volSphereV(){ return (4/3)*Math.PI*GA*GA*GA; }
/* 体电荷的"球体剖分"外观：径向棱（骨架）+ 逐三角形外露面（带缝 ⇒ 看得出是一块块拼的） */
function drawTetBall(){
  const k=tetK(), M=tetMesh(k);
  const spA=0.34/Math.pow(k,0.85);          /* 棱越多越淡，总量守恒，不至于糊成一片 */
  for(let i=0;i<M.unit.length;i++)
    line(pt(0,0,0), vmul(M.unit[i],GA), {color:'#1F5F7C',w:0.85,alpha:spA});
  const s=0.93;                             /* 每个面片朝自身重心收缩 ⇒ 露出 7% 的缝 */
  for(const f of M.faces){
    const A=vmul(M.unit[f[0]],GA), B=vmul(M.unit[f[1]],GA), Cc=vmul(M.unit[f[2]],GA);
    const g=vmul(vadd(vadd(A,B),Cc),1/3);
    const al=densAlpha(prof(g.x/GA));
    const col=shade(DENS_HEX,vnorm(g));
    poly([vadd(g,vmul(vsub(A,g),s)),vadd(g,vmul(vsub(B,g),s)),vadd(g,vmul(vsub(Cc,g),s))],
      {fill:col,fillAlpha:al,stroke:col,strokeAlpha:Math.min(0.95,al+0.22),w:0.9});
  }
}
/* 被选中的那个四面体：四个面（外表面 + 三个"从球心发出的"侧面），按面法向分远近两档，
   团雾夹在中间 ⇒ 雾真的在四面体"里面"。整组抬到 Z_MICRO 档（微元是"仪器"，不能被
   半透明面片洗掉，理由见上方 Z_MICRO* 的注释）。 */
function drawTetPiece(t){
  const OC='#E97132', O=pt(0,0,0);
  /* 四个面：V = 三个顶点，ref/sg = 让法向朝外的朝向判据 */
  const F=[[[t.A,t.B,t.Cc], t.A,  1],      /* 外表面：n·A > 0 ⇔ 背离球心 */
           [[O,t.A,t.B],   t.Cc,-1],      /* 三个侧面：n·Cc < 0 ⇔ 背离对面顶点 */
           [[O,t.B,t.Cc],  t.A, -1],
           [[O,t.Cc,t.A],  t.B, -1]];
  F.forEach(fc=>{
    const V=fc[0];
    let n=vnorm(vcross(vsub(V[1],V[0]),vsub(V[2],V[0])));
    if(vdot(n,fc[1])*fc[2]<0) n=vmul(n,-1);
    const z=(vdot(n,camD)>0)?Z_MICRO_NEAR:Z_MICRO_FAR;
    poly(V,{fill:OC,fillAlpha:0.20,stroke:OC,strokeAlpha:0.95,w:1.6,z});
  });
  microFog(t.cen, Z_MICRO_FOG, FOG_K_VOL*t.rIn*camScale);
  text(vadd(t.cen,vmul(vnorm(t.cen),0.085)),'ΔV′',
    {color:'#B25D18',size:12,bold:true,align:'center',dy:-10});
}
function rhoDisk(){
  const nR=12,nP=40,a=GA;
  const V=(r,p)=>pt(r*Math.cos(p), r*Math.sin(p), 0);
  for(let i=0;i<nR;i++){
    const r0=a*i/nR, r1=a*(i+1)/nR;
    for(let j=0;j<nP;j++){
      const p0=2*Math.PI*j/nP, p1=2*Math.PI*(j+1)/nP;
      const al=densAlpha(prof(((r0+r1)/2)/a));
      poly([V(r0,p0),V(r1,p0),V(r1,p1),V(r0,p1)],
           {fill:DENS_HEX,fillAlpha:al,stroke:DENS_HEX,strokeAlpha:Math.min(0.92,al+0.20),w:1});
    }
  }
  const rim=[]; for(let i=0;i<=72;i++){const ph=2*Math.PI*i/72; rim.push(pt(a*Math.cos(ph),a*Math.sin(ph),0));}
  curve(rim,{color:'#1F5F7C',w:1.5,alpha:.9});
}
function rhoLine(){
  const n=60,L=GA;
  for(let i=0;i<n;i++){
    const x0=-L+2*L*i/n, x1=-L+2*L*(i+1)/n;
    const al=densAlpha(prof(((x0+x1)/2)/L));
    line(pt(x0,0,0),pt(x1+2*L/n*0.3,0,0),{color:hexA('#2E7FA6',Math.min(0.95,al+0.38)),w:10});
  }
  screenDot(pt(-L,0,0),3.4,'#1F5F7C',0.95); screenDot(pt(L,0,0),3.4,'#1F5F7C',0.95);
}
/* ── 已退役：cubeAt(c,hs,…) ────────────────────────────────────────────────────
   原来体电荷的微元画成一个"立方体"，2026-09-23 改成"剖分球里的一个四面体"之后
   就没有调用者了（drawTetPiece 自带四面的远近分档）。删掉而不是留着 ——
   留一个现成的"画立方体"helper，只会诱导以后又把体元画回马赛克小方块。 */
function drawMicro(){

    /* 体电荷：微元 = 剖分球里的某一个四面体（state.mu = 序号）。

  }
  const xi=state.mu, hs=state.mh*GA/2;
  const inr=microInradiusPx(hs);               /* 剪影内切半径（px）：团雾尺寸按它定 */
  /* 位置指示先画（最底层）：从原点沿几何轴线到微元中心的一条虚线 */
  line(pt(0,0,0),microCenterW(),{color:'#E0B48C',w:1.1,alpha:.85,dash:[4,4],z:Z_MICRO_LINE});
  if(state.geo==='surf'){
    const c=pt(0,xi*GA,0);
    poly([pt(c.x-hs,c.y-hs,0),pt(c.x+hs,c.y-hs,0),pt(c.x+hs,c.y+hs,0),pt(c.x-hs,c.y+hs,0)],
         {fill:OC,fillAlpha:0.26,stroke:OC,strokeAlpha:0.95,w:1.8,z:Z_MICRO});
    microFog(c,Z_MICRO_TOP,FOG_K*inr);         /* 面元是"薄"的：雾压在片之上 */
    /* ★ 标签沿几何轴往外推 1.3 hs 再落笔：原来落在 c+(hs,0,0)——面元斜看时
       那个点几乎就落在片子中央，'ΔS′' 三个字把团雾盖掉一半（截图实测）。 */
    text(vadd(c,pt(0,hs*1.30,0)),'ΔS′',{color:'#B25D18',size:12,bold:true,dx:6,dy:-8});
  } else {
    /* 线元是 1 维的，画不成"一团雾"（雾要有体积感）—— 它就是一小段加粗的线段。 */
    line(pt(xi*GA-hs,0,0),pt(xi*GA+hs,0,0),{color:OC,w:11,alpha:0.42,z:Z_MICRO});
    line(pt(xi*GA-hs,0,0),pt(xi*GA+hs,0,0),{color:OC,w:2,alpha:0.95,z:Z_MICRO});
    text(pt(xi*GA,0,0),'Δl′',{color:'#B25D18',size:12,bold:true,dy:-18,align:'center'});
  }
}
/* ③ 页三种几何的"带电体"视觉：
     vol  → drawTetBall()（球 + 二十面体 k 阶细分的星形四面体剖分）
     surf → rhoDisk()    （圆盘扇形分块）
     line → rhoLine()    （等长小段）
   密度探针微元（drawMicro）由 modeCont() 在带电体之后调用。 */

/* ============================================================================
   ① 电场强度的定义
   ============================================================================ */
const SRC_P = pt(-0.62,-0.14,0.00);        /* 源点电荷位置（固定） */
function defModel(){
  const rT=pt(state.tp.x,state.tp.y,state.tp.z);
  const R=vsub(rT,SRC_P), Rn=vlen(R), eR=vnorm(R);
  const E=kE(state.q,Rn);                   /* V/m，真实场强 */
  const kd=state.disturb?(1+KD*state.qt):1;  /* 扰动因子（示意） */
  const F=E*state.qt*kd;                    /* nN，实际测到的力 */
  const se=(state.q>=0)?1:-1;               /* E 方向：单位正电荷受力方向 */
  const sf=((state.q*state.qt)>=0)?1:-1;    /* F 方向：同号相斥 */
  return {rT,R,Rn,eR,E,kd,F,Fraw:F,eE:vmul(eR,se),eF:vmul(eR,sf),Fq:E*kd};
}
function modeDef(){
  const d=defModel();
  const qs=Math.abs(state.q);
  /* 源电荷 */
  marker(SRC_P,{r:5+2.0*Math.min(2,qs), color:state.q>=0?C.crimson:C.blue,
    ring:state.q>=0?'#F6C9C2':'#C9E4F2', label:'q = '+sgnTxt(state.q,2)+' nC',
    ldx:14, ldy:-14, lsize:12.5});
  /* 实验电荷 */
  marker(d.rT,{r:5.4, color:C.purple, ring:'#E6D6F0', label:'q_t = '+state.qt.toFixed(2)+' nC',
    ldx:14, ldy:-13, lsize:12.5});
  /* 距离 R（★ 距离用 dimLine） */
  dimLine(SRC_P,d.rT,{color:'#9DB3BF',w:1.3,dash:[5,4],label:'R = '+d.Rn.toFixed(2)+' m',
    ldx:0,ldy:16,lsize:12});
  /* e_R 单位矢量 */
  const erLen=Math.min(0.30, d.Rn*0.34);
  arrow(SRC_P, vadd(SRC_P, vmul(d.eR,erLen)), {color:'#3E9B4F',w:1.9,headScale:.8,
    label:'@{e_R}', ldx:6, ldy:-11, lsize:12});
  /* E 与 F 两条并排箭头：E 固定长、F ∝ q_t（★ 核心对照） */
  const np=perpOf(d.eE);
  /* E 箭头长度固定（0.70 ⇒ 屏幕上约 70px）——它是"F 缩短而 E 不动"的参照物，
     太短就看不出对照（曾踩：0.42 时只投影出 43px）。 */
  const LE=0.70;
  const LF=Math.min(0.95, 0.95*state.qt*(state.disturb?(d.kd/(1+KD)):1));
  const pE=vadd(d.rT, vmul(np,-0.085));
  const pF=vadd(d.rT, vmul(np, 0.085));
  arrow(pE, vadd(pE, vmul(d.eE,LE)), {color:C.blue,w:2.4,headScale:.92,
    label:'@{E}', ldx:8, ldy:14, lsize:12.5});
  if(LF>0.012)
    arrow(pF, vadd(pF, vmul(d.eF,LF)), {color:C.crimson,w:2.4,headScale:.92,
      label:'@{F}', ldx:8, ldy:-13, lsize:12.5});
  /* 场点在源周围的一个"小球面"提示：不画，避免杂乱 */
}

/* ============================================================================
   ② 点电荷的场
   ============================================================================ */
const P_SRC = pt(-0.32,0,0);
const FIB_GA = Math.PI*(3-Math.sqrt(5));
function fibDirs(m,phase){
  const out=[];
  for(let i=0;i<m;i++){
    const y=1-2*(i+0.5)/m;
    const r=Math.sqrt(Math.max(0,1-y*y));
    const th=FIB_GA*i+(phase||0);
    out.push(pt(r*Math.cos(th), y, r*Math.sin(th)));
  }
  return out;
}
const FL_DIRS = fibDirs(46);
const SHELL_R = [0.30,0.60,0.90];
const SR_RANGE=[0.28,1.45];
/* ⭐ P 点位置由球坐标 (R, θ, φ) 唯一确定（原点在源电荷处，轴与世界轴平行）。
   教学要点：E 只依赖 R ⇒ 固定 R、改 θ/φ，P 沿**同一个等位面（球面）**滑动，
   E 方向跟着转、|E| 一字不变。所以 P 不给自由拖拽，只给三个变量。 */
function Ppos(){
  const t=state.sth*D2R, p=state.sph*D2R, R=state.sr;
  return vadd(P_SRC, pt(R*Math.sin(t)*Math.cos(p), R*Math.sin(t)*Math.sin(p), R*Math.cos(t)));
}
function pointModel(){
  const P=Ppos();
  const R=vsub(P,P_SRC), Rn=vlen(R), eR=vnorm(R);
  const E=kE(state.qP,Rn);
  return {P,R,Rn,eR,E,dir:vmul(eR,(state.qP>=0)?1:-1),th:state.sth,ph:state.sph};
}
/* 屏幕点 → 以 c 为心、半径 R 的球面上的点。
   本引擎是正交投影（pr() 无透视除法）⇒ 拾取射线 = base + t·camD，
   其中 base = u·camU + v·camV 是"camD 分量为 0"的射线上一点。 */
function screenToSphere(mx,my,c,R){
  const u=(mx-CX2-cam.px)/camScale, v=(CY+cam.py-my)/camScale;
  const base=vadd(vmul(camU,u),vmul(camV,v));
  const t=vdot(vsub(c,base),camD);                   /* 射线上离球心最近的点 */
  const q=vadd(base,vmul(camD,t));
  let d=vsub(q,c);
  if(vlen(d)<1e-6) d=camU;
  return vadd(c, vmul(vnorm(d),R));
}
/* 世界点（相对源）→ 球坐标，写回 state（度；θ∈[0,180]，φ∈[0,360)） */
function setPFromVec(p){
  const d=vsub(p,P_SRC), L=vlen(d)||1;
  const th=Math.acos(Math.max(-1,Math.min(1,d.z/L)))*R2D;
  let ph=Math.atan2(d.y,d.x)*R2D; if(ph<0) ph+=360;
  state.sth=Math.round(th); state.sph=Math.round(ph);
}
function modePoint(){
  const d=pointModel();
  const qn=state.qP;
  /* ★ 标注层深度梯子：等位面壳体横跨 c.d±R 一大段，凡"必须始终看得清"的元素
     （角弧 / 标记 / E 箭头）都要显式抬到壳体之上，否则会被自己脚下的 Fresnel 厚壁洗掉。 */
  const Z_RIM=1e4, Z_ARC=1e4+10, Z_MARK=1e4+20, Z_E=1e4+30;
  /* ★★ 深度感（2026-09-23，用户反馈"P 动的时候感觉不到是在球面上动"）：
     P 在球面的**前半球还是后半球** —— 正交投影下就是视线方向的分量 depN = (P−S)·camD / R。
     depN>0 朝观察者；depN<0 已绕到球背面。整组 P 的标注（P 标记 / θφ 角弧 / E 箭头 / R 标注）
     按 kNear **统一变淡** ⇒ 学生看得见"P 绕到球后面又绕回来"，而不是在平面圆盘上平移。
     同一个量还决定 E 的屏幕投影长度：|投影| = LE·camScale·√(1−depN²)。
     ⚠️ 默认参数必须让 √(1−depN²) 够大 —— 旧默认 (θ=55°,φ=40°) 的 depN=0.986（几乎正对镜头）
        ⇒ 屏幕偏移只有 0.164R、E 只投影 26.8px，成了贴在盘心的小短棍。已改默认，见 state 处注释。 */
  const depN=vdot(vsub(d.P,P_SRC),camD)/d.Rn;
  const kNear=depN>=0 ? (0.80+0.20*depN) : (0.42+0.38*(1+depN));  /* 角弧 / E 箭头 / R 尺寸线 */
  /* ⚠️ P 本体（标记点 + "P" 标签）**不能**跟着压到 0.42 —— 实测那样绕到背面就找不到 P 在哪了。
     给它一个有下限的档：弧线可以淡到几乎看不见（那才是深度线索），但学生必须始终定位得到 P。 */
  const kDot = 0.72+0.28*kNear;
  const kTxt = 0.55+0.45*kNear;      /* 文字别压太狠，θ/φ 读数必须始终看得清 */
  /* 场线（球对称径向） */
  if(state.show.fld && Math.abs(qn)>0.06){
    for(const u of FL_DIRS){
      curve([vadd(P_SRC,vmul(u,0.10)), vadd(P_SRC,vmul(u,1.02))],{color:'#A9C3D2',w:1.15,alpha:.52});
      const t0=vadd(P_SRC,vmul(u,0.86)), t1=vadd(P_SRC,vmul(u,1.02));
      if(qn>0) arrow(t0,t1,{color:'#7FA8BF',w:1.4,headScale:.7,alpha:.9});
      else     arrow(t1,t0,{color:'#7FA8BF',w:1.4,headScale:.7,alpha:.9});
    }
  }
  /* 等距球面：r₀ / 2r₀ / 3r₀ —— 场强按 1 : 1/4 : 1/9 掉。
     ★ 它们与「过 P 的等位面」是同一族球面，但身份不同：这几个只是**距离刻度**，
       所以只画剪影圆（虚线）而不铺透明面 —— 四个半透明球套在一起会糊成一片雾。 */
  if(state.show.shells){
    SHELL_R.forEach((r,i)=>{
      ballRim(P_SRC,r,'#8FAEC0',1.15, i===0?.70:.46, {dash:[5,5], z:Z_RIM+i});
      text(pt(P_SRC.x-r*0.72, P_SRC.y-r*0.70, 0), (i===0?'r₀':(i===1?'2r₀':'3r₀')),
        {color:'#7E96A6',size:11.5,bold:true});
    });
  }
  /* ★ 过 P 的等位面（球心在源电荷、半径 = R）：θ/φ 怎么变，P 都留在这个球面上 */
  if(state.show.equi){
    shellBall(P_SRC,d.Rn,'#E97132',true);
    /* 标签挂在球面右缘（camU 方向），转相机时总在视线内 */
    text(vadd(P_SRC,vmul(camU,d.Rn)),'等位面 R = '+d.Rn.toFixed(2)+' m',
      {color:'#C1682A',size:11.5,bold:true,dx:7,dy:-2});
  }
  /* ★ 球坐标的 θ / φ 角弧（参考轴过源、与世界轴平行）—— 抬到壳体之上当标注 */
  {
    const t=d.th*D2R, hx=Math.cos(d.ph*D2R), hy=Math.sin(d.ph*D2R);
    const rh=d.Rn*Math.sin(t);
    if(d.th>1.5){
      /* θ：+z → OP，在「过源且含 +z」的子午面内，弧半径 = R */
      const arc=[];
      for(let i=0;i<=20;i++){ const a=t*i/20;
        arc.push(vadd(P_SRC, pt(d.Rn*Math.sin(a)*hx, d.Rn*Math.sin(a)*hy, d.Rn*Math.cos(a)))); }
      line(P_SRC, vadd(P_SRC,pt(0,0,d.Rn)),{color:'#C4B0D6',w:1.1,alpha:.7*kNear,dash:[4,4],z:Z_ARC});
      curve(arc,{color:'#9B59B6',w:1.9,alpha:.92*kNear,z:Z_ARC});
      const m=vadd(P_SRC, pt(d.Rn*0.62*Math.sin(t/2)*hx, d.Rn*0.62*Math.sin(t/2)*hy, d.Rn*0.62*Math.cos(t/2)));
      text(m,'θ = '+Math.round(d.th)+'°',{color:'#7A3E93',size:12,bold:true,dx:6,dy:-6,alpha:kTxt});
    }
    /* φ：画在 **P 自己所在的那条纬线**上（平面 z = R·cosθ，半径 ρ = R·sinθ），自 +x 起算到 P。
       ★ 2026-09-23 用户指出："P 点沿 φ 方向变化的时候，不应该画 z=0 平面的纬线，
         而应该画 P 点所在的纬线"。原来画在 z=0 —— 那是"赤道"，而 P 高出 z=0 有 R·cosθ
         （默认 θ=52° ⇒ 高出 0.62R）⇒ 弧与 P 分居两圈，"改 φ 时 P 沿着哪条圈滑"看不出来。
       ★ 现改：纬线圆心抬到轴上的 A = 源 + (0,0,R·cosθ)，于是弧的终点**恰好就是 P**
         （A + ρ·(cosφ,sinφ,0) ≡ P —— 测试里直接断言这一点，防止以后再漂移）。
         两条半径线随之从 A 出发：**角 φ 沿 z 平移不变**，所以读数不受影响；
         且 A→P 这一段正好把"水平半径 ρ = R·sinθ"显式画了出来。
       ★ 分两层：淡虚线整圈 = 纬线本身（P 能绕它跑满一整圈）；实线弧 = 已扫过的角 0→φ。
         与 ballRim(虚线=刻度) / shellBall(实线=主角) 同一套视觉语言。 */
    if(rh>0.04 && d.th>1.5 && d.th<178.5){
      const A=vadd(P_SRC,pt(0,0,d.Rn*Math.cos(t)));
      const ring=[];
      for(let i=0;i<=56;i++){ const a=2*Math.PI*i/56; ring.push(vadd(A,pt(rh*Math.cos(a),rh*Math.sin(a),0))); }
      curve(ring,{color:'#9FC4D8',w:1.1,alpha:.34*kNear,dash:[3,5],z:Z_ARC});
      const arc=[];
      for(let i=0;i<=24;i++){ const a=d.ph*D2R*i/24; arc.push(vadd(A,pt(rh*Math.cos(a),rh*Math.sin(a),0))); }
      line(A, vadd(A,pt(rh,0,0)),{color:'#8FC2DA',w:1.1,alpha:.8*kNear,dash:[4,4],z:Z_ARC});
      line(A, vadd(A,pt(rh*hx,rh*hy,0)),{color:'#8FC2DA',w:1.1,alpha:.8*kNear,dash:[4,4],z:Z_ARC});
      curve(arc,{color:'#2A7FA8',w:1.9,alpha:.92*kNear,z:Z_ARC});
      const ma=d.ph*D2R/2;
      text(vadd(A,pt(rh*1.10*Math.cos(ma),rh*1.10*Math.sin(ma),0)),'φ = '+Math.round(d.ph)+'°',
        {color:'#1F6A8E',size:12,bold:true,dx:6,dy:8,alpha:kTxt});
    }
    if(d.th<=1.5||d.th>=178.5)
      text(vadd(P_SRC,pt(0,0,d.Rn*1.10)),'θ 在极轴上：φ 不再影响 P 的位置（极点退化）',
        {color:'#B25D18',size:11.5,align:'center'});
  }
  /* 点电荷本体 */
  marker(P_SRC,{z:Z_MARK,r:5+2.0*Math.min(2,Math.abs(qn)), color:qn>=0?C.crimson:C.blue,
    ring:qn>=0?'#F6C9C2':'#C9E4F2', label:'q = '+sgnTxt(qn,2)+' nC', ldx:-14, ldy:-16, lalign:'right', lsize:12.5});
  /* 场点 P —— 弧线与 E 箭头按 kNear 变淡（后半球 = 被玻璃球罩住），P 本体只按 kDot 轻压 */
  marker(d.P,{z:Z_MARK, r:5.4,color:C.purple,ring:'#E6D6F0',label:'P',ldx:12,ldy:-12,lsize:12.5,alpha:kDot});
  dimLine(P_SRC,d.P,{color:'#9DB3BF',w:1.3,dash:[5,4],label:'R = '+d.Rn.toFixed(2)+' m',ldx:0,ldy:-16,lsize:12,alpha:kNear});
  /* E 箭头（长度 ∝ E，做饱和限幅以免近距离爆掉） */
  const EREF=KC*1.0/(0.65*0.65);
  const LE=Math.abs(qn)>0.06?Math.max(0.05,Math.min(0.90, d.E/EREF)):0;
  /* ★ |E| 不变的可视化：E 尖端始终落在以 P 为心、半径 ∝ |E| 的球面上；
     正交投影下这个球的轮廓就是一个圆 ⇒ 屏幕空间画虚线圆即可（相机怎么转都成立） */
  if(state.show.guide && LE>0.06){
    const Sp=pr(d.P), rad=LE*camScale;
    P_(1e5+2,()=>{ ctx.save(); ctx.setLineDash([5,5]); ctx.globalAlpha*=kNear;
      ctx.strokeStyle='rgba(15,158,213,.5)'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.arc(Sp.x,Sp.y,rad,0,7); ctx.stroke(); ctx.restore(); });
    textScreen(Sp.x+rad*0.72, Sp.y-rad*0.72, '|@{E}| 不变', {size:11,color:'#0B6E93',alpha:kTxt});
  }
  if(LE>0){
    const np=perpOf(d.dir);
    arrow(vadd(d.P,vmul(np,0.02)), vadd(vadd(d.P,vmul(np,0.02)), vmul(d.dir,LE)),
      {color:C.blue,w:2.6,headScale:.95,label:'@{E}',ldx:10,ldy:-13,lsize:12.5,z:Z_E,alpha:kNear});
  }
}

/* ============================================================================
   ③ 页公共件：剖分（partition）、采样、求和、裁判
   ★ 体电荷**不再走 partition()** —— 它的"剖分"就是球体的星形四面体剖分
     （volSamples()），图与数共用同一份四面体表。
     partition() 现在只管面电荷（等面积环）与线电荷（等长段）。
   ============================================================================ */
/* 按权重把 N 个点分给若干组：结果长度不变、**和恰为 N**、N ≥ 组数时每份 ≥1。
   ⚠️ 早年版本死守「每份 ≥1」，当 N < 组数时永远收敛不了（guard 跑满仍不等于 N）—— 已修。 */
function allocByWeight(w,N){
  const n=w.length;
  if(!n) return [];
  const W=w.reduce((a,b)=>a+b,0)||1;
  const raw=w.map(v=>v/W*N);
  const atLeastOne = (N>=n);
  const base=raw.map(v=>atLeastOne?Math.max(1,Math.floor(v)):Math.floor(v));
  let s=base.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>({i,r:v-Math.floor(v)})).sort((a,b)=>b.r-a.r);
  let k=0,guard=0;
  while(s<N && guard++<100000){ base[order[k%n].i]++; s++; k++; }
  k=0; guard=0;
  while(s>N && guard++<100000){
    const i=order[n-1-(k%n)].i;
    if(base[i]>(atLeastOne?1:0)){ base[i]--; s--; }
    k++;
  }
  return base;
}
/* 把带电体切成 N 份**等测度**（等面积 / 等长）的"块"，每块的电量 = 对该块精确积分
   （均匀 ⇒ 每块 Q/N；非均匀 ρ∝1+0.7ξ² ⇒ 有闭式：线段 ∫x²dx、环 ∫ρ²dS）。
   ★ 图与数共用这一条剖分：画布上画出来的块、Σ 求和里的点电荷元，都来自 partition()。
   ★ 关键：每"组"的电量必须等于该组真实的电量，而不是 Q/N 平均摊。
     面电荷 = 等面积环；线电荷 = 等长小段。
   ⚠️ 早期版本所有点都摊 Q/N，而环内点数又 ∝ ρ ⇒ 等面积环被赋予 ∝ρ 的错权重，
      误差随 N 不降反升、卡在 3.35% 不动。改成"组电量恒定 + 组内再摊"后，
      面电荷的求和就退化为 u=ρ² 上的**中点法则**（精确到 O(1/nR²)）。
   ⚠️ 环数必须随 N 一起长（面 ≈0.85√N），否则 N 再大误差也不再下降。 */
function partition(N){
  const a=GA, L=GA, k=state.nonuni?NL_K:0;
  const groups=[];
  if(state.geo==='line'){

function samplePoints(N){
  const out=[]; const pd=partition(N);

/* 当前几何下"点电荷元"的取样点表：

   ★ ΣdE 与 ΣΔq 都读这一份 ⇒ "图"和"数"永远一致。 */
let _samp={key:null,pts:null};
function curSamples(){
  if(state.geo==='vol') return volSamples();
  const k=state.geo+'|'+state.NS+'|'+(state.nonuni?1:0);

  return _samp.pts;
}
/* 当前"点电荷元个数 N"：体电荷 = 20k²（只由剖分阶决定）；面/线 = 滑块给的 NS */
function curN(){ return state.geo==='vol' ? tetCount() : state.NS; }
function sumField(pts,P){
  let E=pt(0,0,0);

/* 球体（ρ = ρ₀(1+kξ²)，ξ = x/a）在 (d,0,0) 处的**精确**场强 —— 均匀与非均匀都有闭式。
   ★ 非均匀的推导：把 ρ 拆成"均匀部分 + c·x² 部分"（c = ρ₀k/a²），x² 部分的场由 1/R 的
     多极展开解析求出。用 x² = r²/3 + (2/3)r²P₂(cosθ) 加上 ∫P_l dΩ 的正交性，
     只剩 l=0 与 l=2 两项（μ 积分有初等原函数；/tmp/final-decide.js 用它 + 1D Simpson

function volEan(d){
  const a=GA, k=state.nonuni?NL_K:0;
  const Q=RHO0*(4/3)*Math.PI*a*a*a;

/* ★★ 有限长**均匀**线电荷（x 轴上 −L…L，线密度 τ₀）在**任意场点** P 处的解析场。
   2026-09-24 用户要求把 P 从"延长线上"挪到"线的侧面"，于是原来那个只对延长线成立的

   两个积分都是初等函数（u = x_P − x′，∫u/(u²+ρ²)^{3/2}du = −1/√(u²+ρ²)，
   ∫du/(u²+ρ²)^{3/2}du = u/(ρ²√(u²+ρ²))）：
       E_x = KC·τ·∫(x_P−x′)/R³ dx′ = KC·τ·( 1/R₂ − 1/R₁ )
       E_ρ = KC·τ·ρ·∫   1     /R³ dx′ = KC·τ/ρ·( A/R₁ − B/R₂ )

   （P 落在 xy 平面内时 ρ = |y_P|）。E_ρ 沿"从线指向 P"的径向单位矢量。

   ★ 三个极限自检（页面内脚本逐条验过）：
     · ρ→0 且 x_P > L：E_x → KC·τ(1/d − 1/(d+2L))（d = x_P−L）—— 就是原来那条延长线公式 ✓
     · x_P = 0：E_x ≡ 0、E_ρ = KC·τ·2L/(ρ√(L²+ρ²)) —— 中垂面上场严格垂直于线 ✓
     · 2L ≫ ρ：E_ρ = KC·τ·2L/(ρ√(L²+ρ²)) → KC·τ·2/ρ = τ/(2πε₀ρ) —— 无限长线的 1/ρ 规律 ✓
       ⚠️ 注意极限里 **L 会被约掉**（√(L²+ρ²)→L），写 KC·τ·2L/ρ 是错的（差一个 L）：

   非均匀（τ ∝ 1+kξ²）没有这么短的初等闭式（要出 asinh 项），
   所以非均匀的裁判仍由 refField() 用 N=8192 数值积分给出，界面如实标注。 */
function lineEan(P){
  const L=GA, A=P.x+L, B=P.x-L;
  const rho=Math.hypot(P.y,P.z);
  const R1=Math.hypot(A,rho), R2=Math.hypot(B,rho);
  const Ex=KC*TAU0*(1/R2 - 1/R1);
  const Er=KC*TAU0/rho*(A/R1 - B/R2);
  const er=(rho>1e-9) ? vmul(pt(0,P.y,P.z),1/rho) : pt(0,0,0);   /* 从线指向 P 的径向单位矢量 */
  return vadd(pt(Ex,0,0), vmul(er,Er));
}
function geomData(){
  const a=GA,L=GA, Q=totalQ();         /* Q 随分布（均匀/非均匀）变；均匀时 = uniformQ() */
  if(state.geo==='vol'){
    const P=pt(state.sd,0,0), E=volEan(state.sd);
    return {Q,P,Ean:pt(E,0,0),d:state.sd,dLab:'球心 → P',ax:pt(1,0,0),
            posTxt:'球心 → P　d = '+state.sd.toFixed(2)+' m'};
  }
  if(state.geo==='surf'){
    const z=state.sd, P=pt(0,0,z);
    const E=KC*2*Math.PI*SIG0*(1 - z/Math.sqrt(z*z+a*a));
    return {Q,P,Ean:pt(0,0,E),d:z,dLab:'盘心 → P',ax:pt(0,0,1),
            posTxt:'盘心 → P　d = '+z.toFixed(2)+' m'};
  }
  /* ★★ 线电荷（2026-09-24 用户改版）：P 不再放在**延长线**上，而是放到线的**侧面**任意一点。
     旧做法 P = (L+d, 0, 0) 的两个毛病（用户原话）：线要缩得很小才看得见 P；
     P 只能沿一条线（x 轴）拖动。新做法 P = (x_P, ρ, 0)：
       · 即使只画线的一段，P 也在画面里（它在线的旁边，不是线外 0.22 m 的延长处）；
       · 两个自由度（轴向 x_P / 径向 ρ）都能拖 ⇒ "任意一点"是真的任意。
     ★ ρ 恒 > 0（clampSd 下限 0.18）⇒ 不落在场的奇异面上；P 始终在同侧，不会穿线而过。 */
  const P=pt(state.px, state.sd, 0);
  const E=lineEan(P);
  return {Q,P,Ean:E,d:state.sd,dLab:'到线的径向距离 ρ',ax:pt(1,0,0),
          posTxt:'P：(x_P, ρ) = ('+state.px.toFixed(2)+' m, '+state.sd.toFixed(2)+' m)'};
}
/* 裁判场：体电荷三种情形都走 g.Ean（解析精确值）；

let _nref={key:null,v:null};
function refField(){

  const key=state.geo+'|'+state.sd.toFixed(2)+'|'+state.px.toFixed(2)+'|n';

let _conv={key:null,data:null};
const CONV_NS=[1,2,3,4,6,8,12,16,24,32,48,64,96,128,192,256,384];

    const Lrho=Math.hypot(B0.x-A0.x,B0.y-A0.y);
    let oN=[-oR[1],oR[0]];
    { const Mx=(A0.x+B0.x)/2, My=(A0.y+B0.y)/2;
      const toLab=[B0.x+P_LD[0]-Mx, B0.y+P_LD[1]-My];
      if(oN[0]*toLab[0]+oN[1]*toLab[1] > 0) oN=[-oN[0],-oN[1]]; }
    /* ⚠️ 曾试过再加一个"朝 F 让开 / 朝 P 让开"的偏置，**扫描后否掉了**：
       180 帧 × 三个变体的标注重叠面积总和，无偏置 243 px² < 朝 P 245 < 朝 F 673。
       原因：标注居中在尺寸线上时两端余量最均衡，加任何偏置都会把一端顶到
       {原点的 O / 微元的 Δl′ / P 的 "P"} 上去。⇒ 参数是扫出来的，不是拍的。 */
    dimLine(F,g.P,{color:'#9DB3BF',w:1.2,dash:[5,4],
      label: Lrho>=RHO_LAB_MIN ? ('ρ = '+state.sd.toFixed(2)+' m') : null,
      ldx:oN[0]*13, ldy:oN[1]*13, lsize:11.5, lalign:'center'});
    if(Math.abs(g.P.x)>0.06){
      /* ⚠️ x_P 尺寸线的两个参数都是**扫出来的**（180 帧：6 机位 × 30 组 (x_P,ρ)，
         逐帧做画布文字包围盒两两求交）：
         · os = 0.30（原来 0.13）：太贴轴线时，尺寸线恰好从微元的标签 Δl′ 底下穿过，
           中点标注必然与 Δl′、以及原点的 "O" 撞字（实测撞 8×12 px）；
           外移到 0.30 后标注落在"轴线与微元标签之外"的那一圈，全部组合都留出 ≥30 px。
         · 标注沿法向外推 18 px 且 **右对齐**：左对齐会一路顶到线上；右对齐朝 −x 一侧展开，
           那边是空的（半条线到屏幕 x≈428 才出现）。 */
      const os=0.30, oX=sd2(pt(0,-1,0));
      line(pt(0,0,0),pt(0,-os,0),{color:'#C9D8E0',w:1});
      line(pt(g.P.x,0,0),pt(g.P.x,-os,0),{color:'#C9D8E0',w:1});
      dimLine(pt(0,-os,0),pt(g.P.x,-os,0),{color:'#B9CBD6',w:1.1,alpha:.92,
        label:'x_P = '+state.px.toFixed(2)+' m', ldx:oX[0]*24, ldy:oX[1]*24, lsize:11, lalign:'right'});
    }
  } else {
    dimLine(pt(0,0,0),g.P,{color:'#9DB3BF',w:1.2,dash:[5,4],label:'d = '+g.d.toFixed(2)+' m',
      ldx:state.geo==='surf'?14:0,ldy:state.geo==='surf'?2:14,lsize:11.5});
  }
  /* Σ dE：P 点处全部点电荷元叠加出的合成场，**单支**。
     ★ 2026-09-23 用户删掉了「dE 累加链」与「积分对照箭头」。那对并排箭头唯一的用途是
       "链尾与箭尖的缝隙 = 偏差"，可偏差不多是几何量 —— 0.001% 的偏差缝隙根本看不见，
       数看得见的是下方 supNote 与右上角收敛曲线；而两支箭头（还各带标签）把 P 附近塞满，
       反而挡住了 dE 和 P 本身。
     ★ 锚点随之回归 ② 的约定：起于 `P + 0.02·np`（只挪一丁点，免得起笔埋在 P 标记底下），
       不再用当年为"两支并排"设计的 ±0.085 分离量 —— 对照物没了，分离就只剩"箭头不指着 P"这个副作用。
     长度仍与 ∫ 参考同比例尺（S），只是不再画参考那支。 */
  const E=sumField(pts,g.P), mag=vlen(E), ref=Math.max(vlen(rf.v),1e-12);
  const S=Math.min(0.85/ref, 1.05/Math.max(mag,1e-12));
  if(mag>1e-9){
    const np=perpOf(g.ax);
    /* ⚠️ 标签对齐方向**跟着箭头的屏幕朝向走**：文字一律朝箭尖那一侧延伸（= 远离 P）。
       原来恒为左对齐，箭头一旦转到朝左（az≈2.2/3.6 这些"从背后看"的机位），
       这串 119 px 的文字就横穿整个 P 与 P 的标注（实测压字 96 px²，是既有毛病）；
       改成动态对齐后文字落在箭尖前方，P 与 ρ 标注都空出来了。 */
    const eS=sd2(E);
    arrow(vadd(g.P,vmul(np,0.02)), vadd(vadd(g.P,vmul(np,0.02)),vmul(vnorm(E),mag*S)),
      {color:C.teal,w:2.5,headScale:.9,
       label:'Σ d@{E} = '+mag.toFixed(2)+'　('+curN()+' 元)',ldx:12,ldy:16,lsize:11.5,
       lalign:(eS[0]>=0?'left':'right')});
  }
}

/* ============================================================================
   场景装配
   ============================================================================ */
function buildScene(){
  /* ⚠️ 必须先清空图元表：P_() 只做 push，不清就等于「每次重绘都往画布上再叠一层整个场景」。
     静态页面看不出来（两层完全重合），一旦相机转动 / 动画推进，就会叠出几十层不同角度的
     复制品（含标签），症状＝「点一下鼠标，线和字就满屏都是」。
     1.2 / 1.3 / 1.4 / 1.5 / index 的 buildScene() 首句都是 prims=[]，只有本页曾漏掉。 */
  prims=[];
  if(state.mode==='def'){ drawAxes(1.55); modeDef(); return; }
  if(state.mode==='point'){ drawAxes(1.75); modePoint(); return; }
  drawAxes(1.75); modeCont();
}

/* ============================================================================
   屏幕空间叠层：每页关键读数 + 小图表
   ============================================================================ */
function txt(x,y,str,o={}){
  ctx.save();
  const lo=richLayout(ctx,parseRich(str),o.size||12,!!o.bold);
  richDraw(ctx,lo,x,y,o.align||'left',o.color||C.ink);
  ctx.restore();
}
function rrPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function crd(x,y,w,h){
  ctx.save();
  ctx.shadowColor='rgba(30,60,80,.10)'; ctx.shadowBlur=8; ctx.shadowOffsetY=2;
  rrPath(x,y,w,h,10); ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fill();
  ctx.restore(); ctx.save();
  rrPath(x,y,w,h,10); ctx.strokeStyle='#DCE6EB'; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}
const CARD_W=232, CARD_X=()=>W-CARD_W-16, CARD_Y=62;

/* ② 的 |E| ∝ 1/R² 双对数小图 */
function chartInvR2(){
  const x0=CARD_X(), y0=CARD_Y, w=CARD_W, h=142;
  crd(x0,y0,w,h);
  txt(x0+12,y0+14,'|@{E}| ∝ 1/R²　（双对数：距离翻倍 ⇒ 场强 1/4）',{size:11.5,bold:true,color:'#1F3D4C'});
  const px0=x0+34, py0=y0+40, pw=w-48, ph=h-58;
  const RX0=0.28, RX1=1.50, LGR=Math.log2(RX1/RX0);
  const YTOP=0.585, YBOT=-5, YSP=YTOP-YBOT;
  const fx=R=>px0+pw*Math.log2(R/RX0)/LGR;
  const fy=v=>py0+ph*(YTOP-Math.log2(v))/YSP;
  /* 网格 */
  ctx.save(); ctx.strokeStyle='#EEF3F6'; ctx.lineWidth=1;
  [1,0.25,0.0625].forEach(v=>{ const y=fy(v); ctx.beginPath(); ctx.moveTo(px0,y); ctx.lineTo(px0+pw,y); ctx.stroke(); });
  [0.3,0.6,1.2].forEach(R=>{ const x=fx(R); if(x>=px0-1&&x<=px0+pw+1){ ctx.beginPath(); ctx.moveTo(x,py0); ctx.lineTo(x,py0+ph); ctx.stroke(); } });
  ctx.restore();
  /* 曲线 */
  ctx.save(); ctx.strokeStyle='#0F9ED5'; ctx.lineWidth=2.2; ctx.beginPath();
  let first=true;
  for(let i=0;i<=120;i++){
    const R=RX0+(RX1-RX0)*i/120, v=(RX0/R)*(RX0/R);
    const X=fx(R), Y=fy(v);
    if(first){ctx.moveTo(X,Y);first=false;} else ctx.lineTo(X,Y);
  }
  ctx.stroke(); ctx.restore();
  /* 当前 P 的标记 */
  const d=pointModel();
  const Rc=Math.max(RX0,Math.min(RX1,d.Rn));
  const vc=(RX0/Rc)*(RX0/Rc);
  ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle='#B9CBD6'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(fx(Rc),py0); ctx.lineTo(fx(Rc),fy(vc)); ctx.lineTo(px0,fy(vc)); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(fx(Rc),fy(vc),4.4,0,7);
  ctx.fillStyle='#9B59B6'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
  /* 轴标 */
  txt(px0-26,py0+4,'1',{size:10.5,color:'#7A8F9B'});
  txt(px0-26,fy(0.25)+4,'1/4',{size:10.5,color:'#7A8F9B'});
  txt(px0-30,fy(0.0625)+4,'1/16',{size:10.5,color:'#7A8F9B'});
  [0.3,0.6,1.2].forEach(R=>txt(fx(R),py0+ph+13,R.toFixed(1),{size:10.5,color:'#7A8F9B',align:'center'}));
  txt(px0+pw/2,py0+ph+27,'R  (m)',{size:10.5,color:'#7A8F9B',align:'center'});
}

/* ③ 的密度色阶条 + 微元读数（y0 可指定，便于与其他小卡叠放） */
function chartDens(y0){
  const x0=CARD_X(); y0=y0!=null?y0:CARD_Y; const w=CARD_W, h=142;
  crd(x0,y0,w,h);
  const mi=microInfo();
  txt(x0+12,y0+14,'微元（橙色）内的平均密度　=　Δq / '+geoMeas(),{size:11.5,bold:true,color:'#1F3D4C'});
  /* 色阶条 */
  const bx=x0+14, by=y0+34, bw=w-28, bh=13;
  ctx.save();
  const g=ctx.createLinearGradient(bx,0,bx+bw,0);
  g.addColorStop(0,'rgba(46,127,166,0.18)'); g.addColorStop(1,'rgba(46,127,166,0.86)');
  ctx.beginPath(); ctx.rect(bx,by,bw,bh); ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='#C9DAE3'; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
  txt(bx,by+bh+12,'低（'+geoSym()+'₀）',{size:10.5,color:'#7A8F9B'});
  txt(bx+bw,by+bh+12,'高（'+(1+NL_K).toFixed(1)+geoSym()+'₀）',{size:10.5,color:'#7A8F9B',align:'right'});
  /* 数字三行 */
  const rows=[
    ['Δq　=　',mi.dq.toExponential(3)+' nC',C.ink],
    [geoMeas()+'　=　',mi.meas.toExponential(3)+' '+geoMeasUnit(),C.ink],
    ['Δq / '+geoMeas()+'　=　',mi.dens.toFixed(3)+' '+geoUnit(),'#156082'],
  ];
  rows.forEach((r,i)=>{
    txt(x0+14, y0+78+i*18, r[0], {size:11.5,color:'#5F7482'});
    txt(x0+w-14, y0+78+i*18, r[1], {size:11.5,bold:true,color:r[2],align:'right'});
  });
}

/* ③ 的收敛曲线（Σ 点电荷元 → 积分；y0 可指定，便于叠放）
   ★ 横轴恒是"点电荷元个数 N"，但两种几何怎么长 N 不一样：
     体电荷 N = 20k²（由剖分阶 k 定：20/80/180/320/500/720，只画出 k=1…4 那几档中的当前值），
     面/线电荷 N = 滑块值。所以横轴刻度与"当前点"都要按几何切换，不能写死。 */
function chartConv(y0){
  const x0=CARD_X(); y0=y0!=null?y0:CARD_Y; const w=CARD_W, h=142;
  const isVol=(state.geo==='vol');
  crd(x0,y0,w,h);
  txt(x0+12,y0+14,'Σ d@{E}（N 个点电荷元） 与 积分 的相对偏差',{size:11.5,bold:true,color:'#1F3D4C'});
  const px0=x0+34, py0=y0+40, pw=w-48, ph=h-58;
  const NX=isVol?800:420;
  const fx=n=>px0+pw*Math.log10(Math.max(1,n))/Math.log10(NX);
  const fy=r=>{ const l=(Math.log10(Math.max(1e-5,r))+4)/4; return py0+ph*(1-Math.max(0,Math.min(1,l))); };
  ctx.save(); ctx.strokeStyle='#EEF3F6'; ctx.lineWidth=1;
  [1,1e-2,1e-4].forEach(r=>{ const y=fy(r); ctx.beginPath(); ctx.moveTo(px0,y); ctx.lineTo(px0+pw,y); ctx.stroke(); });
  ctx.restore();
  const data=convSeries();
  ctx.save(); ctx.strokeStyle='#9B59B6'; ctx.lineWidth=1.8; ctx.beginPath();
  data.forEach((pt_,i)=>{ const X=fx(pt_.n), Y=fy(pt_.rel); if(i===0)ctx.moveTo(X,Y); else ctx.lineTo(X,Y); });
  ctx.stroke(); ctx.restore();
  data.forEach(pt_=>{
    const X=fx(pt_.n), Y=fy(pt_.rel);
    ctx.save(); ctx.beginPath(); ctx.arc(X,Y,3.0,0,7); ctx.fillStyle='#9B59B6'; ctx.fill(); ctx.restore();
  });
  /* 当前点：体电荷按"当前 k 对应的 N"找，面/线按 NS 找（N 是连续取值的，find 未必命中 ⇒
     退化成"最接近的一档"，保证橙点不会时有时无）。 */
  const cn=curN();
  let cur=data.find(v=>v.n===cn);
  if(!cur) cur=data.reduce((a,b)=>Math.abs(b.n-cn)<Math.abs(a.n-cn)?b:a, data[0]);
  const isCur=(isVol? (cur.k===tetK()) : (cur.n===cn));
  if(cur){
    const X=fx(cur.n), Y=fy(cur.rel);
    ctx.save(); ctx.beginPath(); ctx.arc(X,Y,5.2,0,7);
    ctx.fillStyle=isCur?'#E97132':'#C9B6DE'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
  }
  txt(px0-30,py0+4,'1',{size:10.5,color:'#7A8F9B'});
  txt(px0-32,fy(1e-2)+4,'1%',{size:10.5,color:'#7A8F9B'});
  txt(px0-36,fy(1e-4)+4,'0.01%',{size:10.5,color:'#7A8F9B'});
  (isVol?[20,50,100,200,800]:[1,10,100,400])
    .forEach(n=>txt(fx(n),py0+ph+13,String(n),{size:10.5,color:'#7A8F9B',align:'center'}));
  txt(px0+pw/2,py0+ph+27,'N　=　点电荷元个数'+(isVol?'（= 20k²）':''),{size:10.5,color:'#7A8F9B',align:'center'});
}

/* 左下角关键读数行 */
function readoutRows(){
  const rows=[];
  if(state.mode==='def'){
    const d=defModel();
    rows.push({s:'q_t = '+state.qt.toFixed(2)+' nC　|　R = '+d.Rn.toFixed(2)+' m', color:'#5F7482'});
    rows.push({s:'|@{F}| = '+d.F.toFixed(3)+' nN　　|@{F}| / q_t = '+d.Fq.toFixed(3)+' V/m', color:'#22414F'});
    const dev=(d.Fq-d.E)/d.E*100;
    rows.push({s:'真实 |@{E}| = '+d.E.toFixed(3)+' V/m　→　相对偏差 '+dev.toFixed(2)+'%',
      color: Math.abs(dev)<0.5?'#3E9B4F':'#B25D18', bold:true});
  } else if(state.mode==='point'){
    const d=pointModel();
    rows.push({s:'q = '+sgnTxt(state.qP,2)+' nC　|　P 的球坐标：(R, θ, φ) = ('+d.Rn.toFixed(2)+' m, '+
      Math.round(d.th)+'°, '+Math.round(d.ph)+'°)', color:'#5F7482'});
    rows.push({s:'|@{E}| = '+d.E.toFixed(3)+' V/m　（只由 R 决定：r₀ / 2r₀ / 3r₀ 之比 1 : 1/4 : 1/9）',
      color:'#22414F'});
    rows.push({s:'固定 R、只改 θ / φ：P 留在 R = '+d.Rn.toFixed(2)+' m 的等位面上 —— 方向变，大小不变',
      color:'#0F9ED5', bold:true});
  } else {
    /* ③ 电荷密度：密度定义 + 场的累加 两行都要。
       体电荷额外插一行「ΣΔq vs Q」—— 这就是用户要的那句话的数字版：
       "总电量 = 每个体积元所带电荷的叠加"。 */
    const mi=microInfo();
    const g=geomData(), pts=curSamples(), E=sumField(pts,g.P), rf=refField();
    const mag=vlen(E), ref=Math.max(vlen(rf.v),1e-12);
    const ang=(mag>1e-9)?(Math.acos(Math.max(-1,Math.min(1,vdot(vnorm(E),vnorm(rf.v)))))*R2D):0;
    const isVol=(state.geo==='vol');
    /* ⚠️ 位置一律用 g.posTxt（各几何自己拼）：线电荷的 P 是**两个**坐标 (x_P, ρ)，
       不能再拿单标量 g.d 当唯一位置（否则"拖轴向读数不动"，数值与图对不上）。 */
    rows.push({s:'几何 = '+geoWord()+'（'+(state.nonuni?'非均匀':'均匀')+'）　Q = '+g.Q.toFixed(3)+' nC　|　'+
      g.posTxt+'　|　N = '+curN()+' 个点电荷元'
        +(isVol?('（剖分阶 k = '+tetK()+'）'):''), color:'#5F7482'});
    if(isVol){
      const sq=volSumQ(), dqq=Math.abs(sq-g.Q)/g.Q;
      rows.push({s:'第 '+(mi.tet+1)+' 个体积元：Δq/'+geoMeas()+' = '+mi.dens.toFixed(3)+' '+geoUnit()+
        '　→　该点 '+geoSym()+'(ξ) = '+mi.pointDens.toFixed(3)+' '+geoUnit()+
        '　偏差 '+mi.dev.toFixed(4),
        color: Math.abs(mi.devRel)<0.02?'#3E9B4F':'#B25D18'});
      rows.push({s:'Σ Δq = '+sq.toFixed(3)+' nC（每个体积元各算一次）　vs　Q = '+g.Q.toFixed(3)+
        ' nC　→　ΣΔq/Q = '+(sq/g.Q).toFixed(4)+'　（差 '+(dqq*100).toFixed(2)+'% = 多面体少掉的体积）',
        color: dqq<0.02?'#3E9B4F':'#B25D18'});
    } else {
      rows.push({s:'微元 ξ = '+mi.xi.toFixed(2)+'：Δq/'+geoMeas()+' = '+mi.dens.toFixed(3)+' '+geoUnit()+
        '　→　该点 '+geoSym()+'(ξ) = '+mi.pointDens.toFixed(3)+' '+geoUnit()+
        '　偏差 '+mi.dev.toFixed(4),
        color: Math.abs(mi.devRel)<0.02?'#3E9B4F':'#B25D18'});
    }
    rows.push({s:'Σ d@{E}（'+curN()+' 个点电荷元叠加） = '+mag.toFixed(3)+' V/m　　'+rf.lab+' = '+ref.toFixed(3)+' V/m', color:'#22414F'});
    rows.push({s:'相对偏差 = '+(Math.abs(mag-ref)/ref*100).toFixed(3)+'%　方向偏差 = '+ang.toFixed(2)+'°　→　'
      +(isVol?'体积元越小（k 越大）总体越接近积分值':'N 越大总体越接近'),
      color:(Math.abs(mag-ref)/ref<0.01)?'#3E9B4F':'#B25D18', bold:true});
  }
  return rows;
}
function drawOverlays(){
  const rows=readoutRows();
  rows.forEach((r,i)=>txt(16, H-26-(rows.length-1-i)*18, r.s, {size:11.8,bold:r.bold,color:r.color}));
  if(state.mode==='point') chartInvR2();
  if(state.mode==='cont'){
    if(state.show.micro) chartDens(CARD_Y);
    if(state.show.conv) chartConv(state.show.micro?CARD_Y+152:CARD_Y);
  }
}
let needsRender=true;
function draw(){
  setupCamera(); ctx.clearRect(0,0,W,H);
  buildScene();
  prims.sort((a,b)=>a.z-b.z);
  for(const p of prims) p.draw(ctx);
  drawOverlays();
  const t=document.getElementById('panTag'); if(t)t.classList.toggle('show',Math.abs(cam.px)>2||Math.abs(cam.py)>2);
  needsRender=false;
}
let _lastT=performance.now();
function tick(){
  const now=performance.now(); const dt=Math.min(0.05,(now-_lastT)/1000); _lastT=now;
  try{
    if(state.autoRotate){ cam.az+=0.0045; needsRender=true; }
    if(state.mode==='def' && state.shrink){
      const nv=0.010+(state.qt-0.010)*Math.exp(-dt*1.7);
      state.qt = nv<=0.0105 ? 0.010 : nv;
      if(nv<=0.0105){ state.shrink=false; renderPanel(); }
      needsRender=true; syncSliders(); updateReadout(); updateModeTag();
    }
    /* ② 沿等位面扫掠：R 固定，只让 θ 或 φ 走 —— P 在球面上滑、E 转、|E| 不动。
       θ 在 [25°,155°] 内往复（避开极轴退化），φ 单调绕圈。 */
    if(state.mode==='point' && state.sweep){
      if(state.sweep==='th'){
        state.sth += 42*dt;
        if(state.sth>155) state.sth=155-(state.sth-155);
        if(state.sth<25)  state.sth=25+(25-state.sth);
      } else {
        state.sph = (state.sph+58*dt)%360;
      }
      needsRender=true; syncSliders(); updateReadout(); updateModeTag();
    }
    if(needsRender) draw();
  }catch(err){ needsRender=false; console.error('draw/tick error:',err); }
  requestAnimationFrame(tick);
}
function updateAll(){ needsRender=true; syncSliders(); updateReadout(); updateModeTag(); }

/* ③ 的主说明：按几何切换。★ 体电荷这段话就是用户要的落点，必须说透"叠加"。 */

      '<b>任意一个</b>当体积元；拖「剖分尺寸」滑块让体积元变小，整个剖分就跟着变细 —— '+
      '<b>体积元的大小就是剖分的尺度</b>。它内部那团<b>橙雾</b>就是它包住的电量。'+
      '于是"体 = 体积元的叠加"变成两件可读的事：<b>Σ Δq = Q</b>（总电量）与 '+
      '<b>Σ d@{E} → ∫ d@{E}</b>（总场强），两者共用同一份四面体表，图与数必然一致。';
  }
  if(state.geo==='line'){
    return '★ 场点 P 放在线的<b>侧面</b>（不是延长线上）：用<b>两个坐标</b>定位 —— '+
      '轴向 x_P（沿线的位置）与径向 ρ（到线的垂直距离），P = (x_P, ρ)。'+
      '因为线电荷关于 x 轴<b>轴对称</b>，绕线转一圈位置都等价 ⇒ |@{E}| 只由 ρ 与 x_P 决定，'+
      '不需要第三个坐标。<b>P 能任意拖</b>：把鼠标放到画布上的紫点 P 上（光标变成"可移动"），'+
      '按住左键可以在<b>整个 xy 平面内自由滑动</b>，两个滑块也会跟着动；反过来拖「轴向 x_P / 径向 ρ」'+
      '两个滑块可以把它精确打到某个数值。<br><br>'+
      '把它放在侧面有两个好处：① P 就在线的旁边，<b>即使画布上只画线的一小段</b>，P 也在画面里；'+
      '② 两个自由度都能拖，才叫"任意一点"。ρ 的下限取 0.18 m —— ρ → 0 时 P 落到线上，'+
      '线电荷的场在那<b>发散</b>（1/ρ），那是模型的奇点，不是可读的物理量。'+
      '把 x_P 拖到 0（<b>中垂面</b>上）可以看到 @{E} <b>严格垂直于线</b>；'+
      '离开中垂面就开始出现<b>轴向分量</b>，x_P 越大越明显 —— 这正是"只有延长线上的那种写法"看不到的东西。'+
      '<div class="frm" style="white-space:normal;margin-bottom:0">'+
      'E_x = KC·τ·( 1/R₂ − 1/R₁ )<br>E_ρ = KC·τ/ρ·( A/R₁ − B/R₂ )</div>'+
      '线电荷的场有这个<b>解析闭式</b>，且对任意 (x_P, ρ) 都成立（不只是延长线）：'+
      'A = x_P+L、B = x_P−L、R₁ = √(A²+ρ²)、R₂ = √(B²+ρ²)。裁判是<b>积分精确值</b>；'+
      '画布上 P 点处的蓝色箭头是 N 块小段叠加出的 Σ d@{E}，它与精确值差多少由下方读数给出。'+

  }
  const unit = state.geo==='surf' ? '扇形面片' : '小段';
  return '带电体被切成 <b>N 块</b>（'+unit+'，严丝合缝铺满），'+

    '尺寸缩到 0 时雾也跟着消失，Δq/测度 → 该点密度。';
}

function supNote(){

  const tail='，'+refField().lab+' '+ref.toFixed(3)+' V/m，偏差 '+(Math.abs(mag-ref)/ref*100).toFixed(3)+'%。';
  if(state.geo==='vol'){
    const sq=volSumQ(), Vp=volPolyV(), Vs=volSphereV();
    return curN()+' 个四面体叠加得 Σ d@{E} = '+mag.toFixed(3)+' V/m'+tail+
      '这些四面体的电量之和 Σ Δq = '+sq.toFixed(3)+' nC，球的总电量 Q = '+g.Q.toFixed(3)+
      ' nC ⇒ ΣΔq/Q = '+(sq/g.Q).toFixed(4)+' —— 差的 '+(Math.abs(sq-g.Q)/g.Q*100).toFixed(2)+
      '% 不是"加错了"，而是 '+curN()+' 个四面体拼出的多面体比球小了 '+

      '）；k 越大这两件事一起趋于 1。';
  }

}

/* ③ 线电荷：P 的两个坐标必须有数字可读（和 microNote 报 ξ 同一个道理）。

    '现在 @{E} 与线的夹角 = '+ang.toFixed(1)+'°：'+

  } else {

/* ⚠️ 读数一律走 FMT 表：早年版用 toFixed(2) 覆盖，会把 mkRange 里写好的单位
   （nC / m / °）全部吃掉 —— 滑块拖动一次单位就消失。
   mh 一项按几何切换：体电荷下它是"剖分阶 k"（显示 k 与 20k²），面/线电荷下是"微元尺寸"。
   ⇒ 用**函数**而不是常量，否则 syncSliders() 一跑就把 k 写成 2.00（单位/语义全错）。 */
const SLIDER_FMT={
  q:  v=>v.toFixed(1)+' nC',  qt: v=>v.toFixed(2)+' nC', qP: v=>v.toFixed(1)+' nC',
  sr: v=>v.toFixed(2)+' m',   sth:v=>Math.round(v)+'°',  sph:v=>Math.round(v)+'°',
  sd: v=>v.toFixed(2)+' m',   px: v=>v.toFixed(2)+' m',   NS: v=>String(Math.round(v)),
};
function sliderFmt(k,v){
  if(k==='mh') return (state.geo==='vol') ? 'k = '+Math.round(v)+'　('+(20*Math.round(v)*Math.round(v))+' 个)'
                                          : v.toFixed(2);
  return SLIDER_FMT[k] ? SLIDER_FMT[k](v) : String(v);
}
function syncSliders(){
  const set=(k,v)=>{const s=document.getElementById('s_'+k);
    if(s)s.value=(k==='sth'||k==='sph'||k==='NS'||(k==='mh'&&state.geo==='vol'))?Math.round(v):v;
    const e=document.getElementById('v_'+k); if(e) e.textContent=sliderFmt(k,v);};
  set('q',state.q); set('qt',state.qt); set('qP',state.qP);
  set('sr',state.sr); set('sth',state.sth); set('sph',state.sph);
  const sMh=document.getElementById('s_mh');
  if(sMh){                                  /* mh 的语义/量程随几何切换（k：1…4 整数） */
    const isV=(state.geo==='vol');
    sMh.min=isV?TET_KMIN:0.02; sMh.max=isV?TET_KMAX:0.90; sMh.step=isV?1:0.01;
  }
  set('mh',state.mh);
  const sSd=document.getElementById('s_sd');
  if(sSd){ const rr=SD_RANGE[state.geo]; sSd.min=rr[0]; sSd.max=rr[1]; }
  set('sd',state.sd); set('px',state.px); set('NS',state.NS);
  const mn=document.getElementById('microNote'); if(mn) mn.innerHTML=richHTML(microNote());
  const sn=document.getElementById('supNote'); if(sn) sn.innerHTML=richHTML(supNote());
  const pn=document.getElementById('pNote'); if(pn) pn.innerHTML=richHTML(pNote());
  const lp=document.getElementById('linePNote'); if(lp) lp.innerHTML=richHTML(linePNote());
}

let drag=null;
function localPos(ev){const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};}
/* 屏幕坐标 → z=z0 平面上的世界坐标（反解 pr） */
function screenToWorldZ(mx,my,z0){
  const ux=camU.x,uy=camU.y,vx=camV.x,vy=camV.y;
  const det=ux*vy-uy*vx;
  if(Math.abs(det)<1e-9) return null;
  const bx=(mx-CX2-cam.px)/camScale - z0*camU.z;
  const by=(CY+cam.py-my)/camScale - z0*camV.z;
  return pt((bx*vy-by*uy)/det, (ux*by-vx*bx)/det, z0);
}
function clampTo(p,c,minR,maxR){
  const d=vsub(p,c), L=vlen(d);
  if(L<1e-9) return vadd(c,pt(minR,0,0));
  const lc=Math.max(minR,Math.min(maxR,L));
  return vadd(c, vmul(vnorm(d),lc));
}
/* 拖动点被约束在 z=z0 平面内，而源点可能不在该平面上：
   按三维距离夹紧时要先把平面外的那一段 dz 折算掉，
   否则"拖到极限"后的读数不是恰好 maxR（曾踩：显示 1.553 而非 1.55）。 */
function clampToZ(p,c,z0,minR,maxR){
  const dz=z0-c.z, dz2=dz*dz;
  const hi=Math.sqrt(Math.max(1e-9,maxR*maxR-dz2));
  const lo=Math.sqrt(Math.max(0,minR*minR-dz2));
  const dx=p.x-c.x, dy=p.y-c.y, d=Math.hypot(dx,dy);
  if(d<1e-9) return pt(c.x+lo,c.y,z0);
  const k=Math.max(lo,Math.min(hi,d))/d;
  return pt(c.x+dx*k, c.y+dy*k, z0);
}
/* 屏幕点 → 微元所沿轴的归一化位置 ξ（面/线电荷用）。
   轴上世界坐标 s 的点投影后是**屏幕直线**且线性：屏幕 = P₀ + (s/GA)·(P₁−P₀)。
   于是 ξ = (鼠标−P₀)·(P₁−P₀)/|P₁−P₀|² —— 求的是**屏幕上距离最小**的那个轴点，
   比"先反投到 z=0 平面再取 x 坐标"更贴手感：斜视时后者会明显偏
   （鼠标拖到微元左边、ξ 却几乎不动）。 */
function screenToAxisXi(mx,my){
  const A=pr(pt(0,0,0)), B=pr(microAxis()?pt(0,GA,0):pt(GA,0,0));
  const ex=B.x-A.x, ey=B.y-A.y, L2=ex*ex+ey*ey;
  if(L2<1e-6) return null;
  return ((mx-A.x)*ex+(my-A.y)*ey)/L2;
}
/* 鼠标是否正落在橙色微元上（③ 的抓手判定，pointerdown 与悬停光标共用一处）。
   体电荷的微元是一个四面体：以它的**形心投影**为心、microHitR() 为半径的一个小圆
   （k 大时四面体在屏幕上只有十几像素，所以 hitR 有 30 px 的下限，保证抓得住）。 */
function overMicro(m){
  if(state.mode!=='cont' || !state.show.micro) return false;
  const wp=pr(microCenterW());
  return Math.hypot(m.x-wp.x,m.y-wp.y)<microHitR();
}
/* ── 线电荷的 P：两自由度拖动 ─────────────────────────────────────────────────
   P = (x_P, ρ, 0) 只有两个自由度，所以拖动 = 把鼠标位移反解成 (Δx_P, Δρ)。
   做法：两个世界基 x̂ / ŷ 在当前相机下的屏幕投影构成 2×2 矩阵 J，
         mouse Δ = J · (Δx_P, Δρ) ⇒ 解 2×2 线性方程组即可。
   ★ 为什么不用"反投到 z=0 平面"（screenToWorldZ）：那要除以 det = sin(el)，
     俯仰角 → 0（视线与 xy 平面平行）时整个平面在屏幕上退化成一条线、除零爆掉。
   ★ J 的行列式实测 det = −camScale²·sin(el) —— 同一个退化点，所以这里给 |det| 加下限：
     极端角度下把灵敏度钳在 1/0.30 倍，拖动变"钝"但绝不会飞出去（拖到边界还会被 clamp 住）。
   ⚠️ el → 0 时 J 退化成**秩 1**（xy 平面在屏幕上压成一条线）⇒ 两个自由度不再能各自跟随光标
      （实测 el=0、拖 (120,60) px：x_P −0.805 m、ρ 被夹到下限，数值有限、画面不炸）。
      这是几何本身的性质，不是 bug —— 从"正侧面"看那个平面，任何二维拖动都无法一一对应。 */
const P_HIT=26;                       /* P 的抓手半径（px）：比微元的 30 px 略小，
                                         两者贴身时靠"归一化距离"分派（见 grabTarget） */
function xyJac(){
  const ax=camScale*vdot(pt(1,0,0),camU), ay=-camScale*vdot(pt(1,0,0),camV);
  const bx=camScale*vdot(pt(0,1,0),camU), by=-camScale*vdot(pt(0,1,0),camV);
  const det0=ax*by-ay*bx;
  if(!isFinite(det0)||camScale<1e-6) return null;
  return {ax,ay,bx,by,det0,ref:camScale*camScale};
}
/* 线电荷下画布上有**两个**抓手（紫 P 与橙色微元），且 ρ 取小值时两者屏幕上会挨得很近。
   判据 = **归一化距离**（各自除以自己的命中半径），谁更"贴身"抓谁 ——
   比"先判 P 还是先判微元"稳定：写死优先级会在某些机位让另一个抓手永远抓不到。 */
function grabTarget(m){
  if(state.mode!=='cont' || state.geo!=='line') return null;
  const cand=[];
  if(state.show.micro){
    const w=pr(microCenterW());
    const d=Math.hypot(m.x-w.x,m.y-w.y)/microHitR();
    if(d<1) cand.push({k:'micro',d});
  }
  const wp=pr(pt(state.px,state.sd,0));
  const dp=Math.hypot(m.x-wp.x,m.y-wp.y)/P_HIT;
  if(dp<1) cand.push({k:'p',d:dp});
  if(!cand.length) return null;
  cand.sort((a,b)=>a.d-b.d);
  return cand[0].k;
}
canvas=document.getElementById('cv');
ctx=canvas.getContext('2d');
canvas.addEventListener('pointerdown',ev=>{
  canvas.setPointerCapture(ev.pointerId);
  const m=localPos(ev);
  if(ev.button===0){
    if(state.mode==='def'){
      const wp=pr(pt(state.tp.x,state.tp.y,state.tp.z));
      if(Math.hypot(m.x-wp.x,m.y-wp.y)<38){ drag={x:m.x,y:m.y,btn:0,mode:'tp'}; ev.preventDefault(); return; }
    }
    if(state.mode==='point'){
      const wp=pr(Ppos());
      if(Math.hypot(m.x-wp.x,m.y-wp.y)<38){ drag={x:m.x,y:m.y,btn:0,mode:'pp'}; ev.preventDefault(); return; }
    }
    /* ③ 的抓手：线电荷下 P（可自由拖）与橙色微元都在画布上，先按"归一化距离"决定抓谁；
       其它几何只有微元一个抓手。 */
    if(state.mode==='cont' && state.geo==='line'){
      const w=grabTarget(m);
      if(w){ drag={x:m.x,y:m.y,btn:0,mode:(w==='p'?'lp':'mid')}; ev.preventDefault(); return; }
    } else if(overMicro(m)){ drag={x:m.x,y:m.y,btn:0,mode:'mid'}; ev.preventDefault(); return; }
  }
  drag={x:m.x,y:m.y,btn:ev.button,mode:(ev.button===2||ev.ctrlKey)?'pan':'rot'};
  ev.preventDefault();
});
canvas.addEventListener('pointermove',ev=>{
  const m=localPos(ev);
  if(!drag){
    /* 悬在抓手（P / 橙色微元）上 → 换成"可移动"光标，让人看得出这里可以拖。 */
    const canGrab = (state.mode==='cont' && state.geo==='line') ? !!grabTarget(m) : overMicro(m);
    canvas.style.cursor = canGrab ? 'move' : '';
    return;
  }
  const dx=m.x-drag.x,dy=m.y-drag.y; drag.x=m.x; drag.y=m.y;
  if(drag.mode==='tp'){
    const w=screenToWorldZ(m.x,m.y,state.tp.z);
    if(w){ const p=clampToZ(w,SRC_P,state.tp.z,0.42,1.55);
      state.tp.x=p.x; state.tp.y=p.y; needsRender=true; updateReadout(); updateModeTag(); }
  }
  else if(drag.mode==='pp'){
    /* ★ P 只沿**等位面**滑动：把鼠标点投到「以源为心、半径 R 的球面」上，
       于是拖动只改 θ / φ，R 一动不动 —— 这正是本页要讲的那件事。 */
    const q=screenToSphere(m.x,m.y,P_SRC,state.sr);
    if(q){ setPFromVec(q); needsRender=true; updateReadout(); updateModeTag(); syncSliders(); }
  }
  else if(drag.mode==='lp'){
    /* ★ 线电荷的 P：在 xy 平面内**两自由度**自由拖动（不是沿一条线滑）。
       鼠标位移 (dx,dy) 反解成 (Δx_P, Δρ)：见 xyJac 的注释。 */
    const J=xyJac();
    if(J){
      const det=(Math.abs(J.det0) < 0.30*J.ref) ? ((J.det0>=0?1:-1)*0.30*J.ref) : J.det0;
      state.px += (J.by*dx - J.bx*dy)/det;
      state.sd += (J.ax*dy - J.ay*dx)/det;
      clampPx(); clampSd(); _conv.key=null;
      needsRender=true; updateReadout(); updateModeTag(); syncSliders();
    }
  }
  else if(drag.mode==='mid'){
    /* ★ 微元位置：这就是它**唯一**的位置来源（位置滑块早已撤掉，不存在"两处各写一半"）。
       · 体电荷：鼠标扫过球面 ⇒ 每一帧都取"离鼠标最近的四面体"，于是拖动 = 连续换选，
         "任意一个四面体都能当体积元"这句话在手上是能摸到的。
       · 面/线电荷：鼠标点投到几何轴 ⇒ 直接写 state.mu（夹紧后即得合法位置）。 */
    if(state.geo==='vol'){
      const i=pickTet(m.x,m.y);
      if(i!==state.mu){ state.mu=i; needsRender=true; updateReadout(); updateModeTag(); syncSliders(); }
    } else {
      const t=screenToAxisXi(m.x,m.y);
      if(t!=null){ state.mu=t; clampMicro(); needsRender=true; updateReadout(); updateModeTag(); syncSliders(); }
    }
  }
  else if(drag.mode==='pan'){ cam.px+=dx; cam.py+=dy; needsRender=true; }
  else { cam.az-=dx*0.0075; cam.el=Math.max(-1.45,Math.min(1.45,cam.el+dy*0.0062)); needsRender=true; }
});

  const nw=Math.max(60,Math.round(r.width)),nh=Math.max(60,Math.round(r.height));
  DPR=Math.min(2,window.devicePixelRatio||1);
